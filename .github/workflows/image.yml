name: Image

# The runtime image, FrankenPHP on the thread-safe engine. sharp.yml's IMAGE calls it in each staging run as a check of
# the tree that lands, with no version, so its images carry the tree's 0.0.0 and nothing tags them. release.yml's IMAGE
# calls it with the release's version, and its PUBLISH tags the images that call built, as it publishes the binaries
# the same run built. A staging run can't build a release's images: it reads the newest tag as it starts, while the
# release of an earlier landing can still take that version, so its images would name a version the release of its
# own tree doesn't take (#1023).
on:
  workflow_call:
    inputs:
      version:
        description: The release's version, <major>.<minor>.<patch>, which the images' engine names. None for a check.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Each platform builds on a runner of its own architecture with -O2 and --enable-werror, where GCC finds
  # -Wmaybe-uninitialized and libcurl's type checks, so a warning one architecture alone finds fails. Each pushes its
  # image by digest, with BuildKit's provenance and SBOM attestations, and a release's PUBLISH tags the two as one.
  # BuildKit, its SBOM scanner and the bases are base-images.yml's copies in ghcr.io at pinned digests, pulled after the
  # login, so no pull is an anonymous Docker Hub pull (#86). The engine changes PHP's internal structures, so an
  # extension can stop building or loading: the image builds every extension it ships, and the job calls into each one
  # from the pushed image, as an app runs them. A pull request's run never calls it: on pull request run 45702817618 its
  # two jobs took 30 of the push's 105 job-minutes, and every open pull request's held hosted runners the staging run
  # waited for (#899). The two platforms build at once, since a run ends with its slowest job: each took 12 to 13
  # minutes on the pushes of pull requests #351 and #352.
  IMAGE:
    name: IMAGE (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      # Every extension the image holds beside the ones PHP builds by default, as sharp/README.md lists them.
      EXTENSIONS: bcmath calendar exif ftp gd igbinary imagick intl pcntl pdo_mysql pdo_pgsql pgsql redis shmop sockets sysvmsg sysvsem sysvshm zip
      # The extensions the -dev image adds to those.
      DEV_EXTENSIONS: excimer
      # The builds' platform, BuildKit and SBOM scanner.
      PLATFORM: ${{ matrix.platform }}
      BUILDKIT: ghcr.io/heyjordanparker/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      # A release's images name its version, which the build passes to the Dockerfile as MAGO_RELEASE, and a check's
      # leave it unset, so they name the tree's 0.0.0.
      MAGO_RELEASE: ${{ inputs.version }}
      SBOM: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
    steps:
      # The builds' context, and .github/actions/boot-image and sharp/bin/php-extensions.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Buildx's docker-container driver pulls BuildKit's image again, and starts from the local one when that pull
      # fails, so this pull, which sharp/bin/network runs again when the network drops it, covers both.
      - name: Pull BuildKit's image
        run: sharp/bin/network docker pull --quiet "$BUILDKIT"
      # The job's runner is discarded with its builder, which the cleanup took 35 to 47 s to remove at each job's end.
      - name: Set up Buildx with BuildKit from ghcr.io
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT }}
          cleanup: false
      # The Dockerfile's tools stage, which gives the images PHP-Parser, Lean and the sources and scripts they build, is
      # the tools image base-images.yml pushes for both platforms under the blob hash of sharp/docker/tools/Dockerfile.
      # A Dockerfile with no pushed image yet, as on the pull request that changes it, builds here from the same base, as
      # sharp/docker/run builds it then.
      - name: Take the tools image for the tools stage
        run: |
          image="ghcr.io/heyjordanparker/php-sharp-tools:$(git hash-object sharp/docker/tools/Dockerfile)"
          if docker buildx imagetools inspect --format '{{json .Manifest}}' "$image" \
            | jq -e --arg architecture "${PLATFORM#linux/}" '.manifests[]? | select(.platform.architecture == $architecture)' > /dev/null; then
            echo "TOOLS=docker-image://$image" >> "$GITHUB_ENV"
          else
            echo "$image has no ${PLATFORM#linux/} image, so the job builds it."
            sharp/bin/network docker buildx build \
              --platform "$PLATFORM" \
              --build-arg BASE_IMAGE=ghcr.io/heyjordanparker/debian:trixie \
              --output "type=oci,dest=$RUNNER_TEMP/tools,tar=false,compression=zstd,force-compression=true" \
              sharp/docker/tools
            echo "TOOLS=oci-layout://$RUNNER_TEMP/tools" >> "$GITHUB_ENV"
          fi
      # The build's context is the job's checkout, which actions/checkout fetched at the commit's SHA, so a ref moved
      # after the push builds nothing else. BuildKit's own fetch of that commit from GitHub took 188 s on run
      # 45088111311's amd64 job, where the checkout took 8 s. Each build runs through sharp/bin/network, so a registry or
      # download request the network fails, as a base image's manifest, a git source or a package, runs the build again,
      # and BuildKit keeps the steps that ended in the job's builder. The flags are the ones docker/build-push-action
      # passed, its builder-id among them.
      - name: Build and push the image by digest
        id: build
        run: &build-image |
          sharp/bin/network docker buildx build \
            --file sharp/docker/runtime/frankenphp.Dockerfile \
            ${TARGET:+--target "$TARGET"} \
            --platform "$PLATFORM" \
            --build-arg REGISTRY=ghcr.io/heyjordanparker \
            ${MAGO_RELEASE:+--build-arg "MAGO_RELEASE=$MAGO_RELEASE"} \
            --build-context "tools=$TOOLS" \
            --provenance "mode=max,builder-id=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --sbom "$SBOM" \
            --output type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file "$RUNNER_TEMP/$GITHUB_ACTION.json" \
            .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$GITHUB_ACTION.json")" >> "$GITHUB_OUTPUT"
      # The -dev image, the runtime image with the law checker's Lean in Mago's cache folder, which PUBLISH tags
      # <version>-dev. The build reuses the runtime image's stages from the build before it, in the job's builder.
      - name: Build and push the -dev image by digest
        id: dev
        env:
          TARGET: dev
        run: *build-image
      # The steps below run both images, so they pull here, where a dropped connection runs the pull again.
      - name: Pull the pushed images
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          DEV: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
        run: |
          sharp/bin/network docker pull --quiet "$IMAGE"
          sharp/bin/network docker pull --quiet "$DEV"
      # A critical or high CVE that a fixed package resolves fails the job, so the digest is never uploaded and
      # PUBLISH tags none. aquasecurity/trivy-action's v0.35.0 and later are immutable releases, made after its tags
      # were rewritten to malware on 2026-03-19, and Trivy's v0.71.1 and later fix GHSA-mcj4-mphf-j9ff.
      - name: Scan the pushed image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the pushed image on its default command and request a page
        uses: ./.github/actions/boot-image
        with:
          image: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
      # No job runs the PHP# suite on arm64, so this platform's engine shows here that it starts and loads PHP#.
      - name: The image's php prints its version and lists the sharp extension
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" php -v
          if ! docker run --rm "$IMAGE" php -m | grep -qx sharp; then
            echo "::error::php -m in the $PLATFORM image lists no sharp extension."
            exit 1
          fi
      # mago reads the Lean of its compile from lean/lean-<version>-<platform>/ in Mago's cache folder, which XDG_CACHE_HOME
      # puts in /var/cache/mago, so a compile in the -dev image downloads nothing, run by any user.
      - name: A user other than root runs the -dev image's Lean and writes in Mago's cache folder
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
        run: |
          archive="lean-$(sed 's/.*:v//' sharp/mago/crates/sharp-lean/lean/lean-toolchain)-linux"
          if [[ $PLATFORM == linux/arm64 ]]; then
            archive+=_aarch64
          fi
          docker run --rm --user 1000:1000 --env ARCHIVE="$archive" "$IMAGE" \
            sh -c '"$XDG_CACHE_HOME/mago/lean/$ARCHIVE/bin/lake" --version && touch "$XDG_CACHE_HOME/mago/install.lock"'
      - name: Check that php -m lists each extension, and call into each one from FrankenPHP's php-cli
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS is a list of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src "$IMAGE" frankenphp php-cli sharp/bin/php-extensions $EXTENSIONS
      - name: Check that the -dev image's php -m lists each extension and the ones it adds, and call into each one
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS and DEV_EXTENSIONS are lists of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src "$IMAGE" frankenphp php-cli sharp/bin/php-extensions $EXTENSIONS $DEV_EXTENSIONS
      # Each file is named by its image's digest and holds the commit the image was built from. Only a release's
      # PUBLISH reads them.
      - name: Keep the digests for PUBLISH
        if: inputs.version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DEV: ${{ steps.dev.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests" "$RUNNER_TEMP/dev-digests"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/dev-digests/${DEV#sha256:}"
      # Kept as long as release.yml's assets, as the repository's artifact retention sets. The name keeps the frankenphp
      # of the runs that also built php-fpm's image, so a tag of their commits tags FrankenPHP's alone.
      - name: Upload the digest for PUBLISH
        if: inputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-frankenphp-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
      - name: Upload the -dev digest for PUBLISH
        if: inputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-dev-${{ strategy.job-index }}
          path: ${{ runner.temp }}/dev-digests/*
          if-no-files-found: error
      # A called workflow's job runs on its caller's event. A staging push's run can no longer land once this fails, so
      # it cancels, as sharp.yml's jobs do. A release run goes on, so its red_master_issue job opens the issue.
      - name: Cancel the run, which can no longer pass
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
