name: PHP#
on:
  push:
    paths-ignore: &ignore_paths
      - .circleci/**
      - .github/CODEOWNERS
      - .github/ISSUE_TEMPLATE/**
      - '**/*.md'
      - '**/*.rst'
      - docs/**
      - EXTENSIONS
      - LICENSE
      - NEWS
      - UPGRADING
      - UPGRADING.INTERNALS
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths-ignore: *ignore_paths
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true
jobs:
  LINUX:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            sharp/build/cargo
            sharp/build/rustup
          key: SHARP_LINUX_RUST-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock') }}
      - name: Pinned Mago commit
        id: mago
        run: sed -n 's/^mago-sharp-bridge = { git = ".*", rev = "\(.*\)" }$/rev=\1/p' ext/sharp/Cargo.toml >> "$GITHUB_OUTPUT"
      - name: Mago cache
        uses: actions/cache@v5
        with:
          path: sharp/build/*/mago
          key: SHARP_LINUX_MAGO-${{ steps.mago.outputs.rev }}
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP#
        run: sharp/bin/test --linux --opcache --repeat --differential
      - name: Test upstream
        run: sharp/bin/test --linux --upstream --opcache
      - name: Verify generated files are up to date
        run: |
          sharp/docker/run scripts/dev/credits
          sharp/docker/run scripts/dev/genfiles
          sharp/docker/run scripts/gdb/debug_gdb_scripts_gen.php
          sharp/docker/run Zend/zend_vm_gen.php
          sharp/docker/run ext/tokenizer/tokenizer_data_gen.php
          sharp/docker/run build/gen_stub.php -f --generate-optimizer-info --verify
          # Use the -a flag for a bug in git 2.46.0, which doesn't consider changed -diff files.
          git add . -N && git diff -a --exit-code
  MACOS:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: brew
        run: |
          brew install \
            autoconf \
            bison \
            re2c \
            pkgconf \
            icu4c \
            libiconv \
            libpq \
            libsodium \
            libzip \
            oniguruma
      - name: ccache
        uses: ./.github/actions/ccache
        with:
          name: SHARP_MACOS
      - name: Pinned Mago commit
        id: mago
        run: sed -n 's/^mago-sharp-bridge = { git = ".*", rev = "\(.*\)" }$/rev=\1/p' ext/sharp/Cargo.toml >> "$GITHUB_OUTPUT"
      - name: Mago cache
        uses: actions/cache@v5
        with:
          path: sharp/build/*/mago
          key: SHARP_MACOS_MAGO-${{ steps.mago.outputs.rev }}
      - name: Build
        run: sharp/bin/build
      - name: Test PHP#
        run: sharp/bin/test --opcache --repeat --differential
      - name: Test upstream
        run: sharp/bin/test --upstream --opcache
  COMPOSER:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    concurrency: composer-${{ github.ref }}
    steps:
      - name: git checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Split sharp/composer
        run: |
          curl -fsSL https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz -o "$RUNNER_TEMP/splitsh-lite.tar.gz"
          echo "2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc  $RUNNER_TEMP/splitsh-lite.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/splitsh-lite.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/splitsh-lite" --prefix=sharp/composer --target=refs/heads/composer
      - name: git checkout heyJordanParker/php-sharp-composer
        uses: actions/checkout@v6
        with:
          repository: heyJordanParker/php-sharp-composer
          ssh-key: ${{ secrets.PHP_SHARP_COMPOSER_DEPLOY_KEY }}
          path: sharp/build/php-sharp-composer
          fetch-depth: 0
      - name: Push the split
        working-directory: sharp/build/php-sharp-composer
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer
          git push origin "FETCH_HEAD:$GITHUB_REF"
  IMAGE:
    if: github.ref_type == 'tag'
    needs: [LINUX, MACOS]
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      file: sharp/docker/runtime/Dockerfile
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/heyjordanparker/php-sharp
      meta-tags: type=semver,pattern={{version}}
      meta-flavor: latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
