name: PHP#
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true
jobs:
  # CI_PASSED is this workflow's one required check, so the workflow always runs, and LINUX,
  # LINUX_ZTS, HOSTS, PHP_EXTENSIONS and MACOS skip a change to documentation alone. docs/spec.md, README.md and
  # sharp/spec-self-test.md count as code, because LINUX compiles and runs their examples. A tag runs none of them: it
  # publishes only a commit whose suites all ran and passed on master, as release.yml does with Mago CI, so its MACOS
  # never waits for the Mac runners behind the release's Apple builds. CI_PASSED alone isn't enough, because it also
  # passes a change to documentation alone, whose suites skipped.
  CHANGES:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: The tagged commit's suites ran and passed on master
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sharp.yml/runs?head_sha=$GITHUB_SHA&branch=master&event=push" --jq '.workflow_runs[0].id // empty')
          if [[ -z $run ]]; then
            echo "::error::PHP# CI never ran on master for commit $GITHUB_SHA. Tag a commit whose suites master's PHP# CI ran and passed."
            exit 1
          fi
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")
          suites='.jobs[] | select(.name == "LINUX" or .name == "LINUX_ZTS" or .name == "HOSTS" or .name == "MACOS" or (.name | startswith("PHP_EXTENSIONS")))'
          failed=$(jq -r "[$suites | select(.conclusion != \"success\") | \"\(.name): \(.conclusion // .status)\"] | join(\", \")" <<< "$jobs")
          # LINUX, LINUX_ZTS, HOSTS, MACOS, and PHP_EXTENSIONS for each of its two images on each of its two runners.
          if [[ $(jq "[$suites | select(.conclusion == \"success\")] | length" <<< "$jobs") != 8 ]]; then
            echo "::error::Commit $GITHUB_SHA has not run and passed every PHP# suite on master (${failed:-a suite is missing}): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            exit 1
          fi
          echo "Commit $GITHUB_SHA ran and passed every PHP# suite on master: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
      - name: git checkout
        if: github.ref_type != 'tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find changes outside documentation
        id: diff
        if: github.ref_type != 'tag'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --depth=1 origin "$BASE"
          git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"
          while read -r file; do
            case "$file" in
              docs/spec.md|README.md|sharp/spec-self-test.md) echo code=true >> "$GITHUB_OUTPUT"; break ;;
              .circleci/*|.github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|*.md|*.rst|docs/*) ;;
              EXTENSIONS|LICENSE|NEWS|UPGRADING|UPGRADING.INTERNALS) ;;
              *) echo code=true >> "$GITHUB_OUTPUT"; break ;;
            esac
          done < "$RUNNER_TEMP/changed"
  LINUX:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM these copies, which base-images.yml makes of the public
    # registry's images, so the pulls never meet an anonymous quota.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Keep local sources out of Cargo.lock
        run: |
          if git grep -nE '(path|git)\+file://' -- '*Cargo.lock'; then
            echo "::error::A committed Cargo.lock names a local source. Keep a [patch] in an untracked .cargo/config.toml."
            exit 1
          fi
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/cargo
            sharp/build/rustup
          # rustup's toolchains are binaries for the runner's architecture, so each architecture keeps its own.
          key: SHARP_LINUX_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.lock') }}
      # sharp/bin/test builds mago from sharp/mago into sharp/build/<os>-<arch>/mago, with the test-run profile
      # sharp/mago/Cargo.toml holds. The cache keeps the dependencies' build, and cargo rebuilds Mago's own crates.
      - name: Mago cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/*/mago
          key: SHARP_LINUX_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP#
        run: sharp/bin/test --linux --opcache --repeat --passes --census --spec --differential --phpunit
      - name: Check the standard library with the checker sharp/bin/test built
        run: |
          # shellcheck disable=SC2016 # The image's sh expands $(uname -m), to its own architecture.
          sharp/docker/run sh -c '"sharp/build/linux-$(uname -m)/mago/test-run/mago" --colors never --workspace sharp/composer analyze --minimum-fail-level note'
      - name: Test upstream
        run: sharp/bin/test --linux --upstream --opcache
      - name: Verify generated files are up to date
        run: |
          sharp/docker/run scripts/dev/credits
          sharp/docker/run scripts/dev/genfiles
          sharp/docker/run scripts/gdb/debug_gdb_scripts_gen.php
          sharp/docker/run Zend/zend_vm_gen.php
          sharp/docker/run ext/tokenizer/tokenizer_data_gen.php
          sharp/docker/run build/gen_stub.php -f --generate-optimizer-info --verify
          # Use the -a flag for a bug in git 2.46.0, which doesn't consider changed -diff files.
          git add . -N && git diff -a --exit-code
      - name: Verify the native interface is generated from the standard library's extern declarations
        run: |
          sharp/docker/run sharp/bin/native
          git diff --exit-code ext/sharp/sharp_native.h sharp/composer/native.php
      - name: Verify the built-in function declarations are generated from php-8-stubs by rules whose every row passes
        run: |
          sharp/docker/run sharp/bin/builtins --self-test
          sharp/docker/run sharp/bin/builtins
          git diff --exit-code sharp/composer/library/Sharp/Internal/Builtins.sharp
      - name: Verify ext/sharp/sharp_unit.h, with its sharp_kind, SHARP_T_ tokens and SHARP_UNIT_ABI, is the header sharp/mago generates from Zend/zend_ast.h and Zend/zend_language_parser.h
        run: |
          sharp/docker/run php sharp/mago/scripts/regen-sharp-kinds.php Zend/zend_ast.h Zend/zend_language_parser.h | diff -u sharp/mago/crates/sharp-bridge/src/kind.rs -
          # cargo builds nothing for the mago sharp/bin/test built, and names the out_dir of the bridge that mago links.
          # `-p mago-sharp-bridge` resolves other features, so it built a second bridge and its dependencies beside it.
          # shellcheck disable=SC2016 # The image's sh expands the cargo it finds there, and its own architecture.
          sharp/docker/run sh -c 'cargo="$(cd ext/sharp && rustup which cargo)" && PATH="$(dirname "$cargo"):$PATH" "$cargo" build --locked --profile test-run --manifest-path sharp/mago/Cargo.toml --target-dir "sharp/build/linux-$(uname -m)/mago" --bin mago --message-format=json' > "$RUNNER_TEMP/build.json"
          header="$(jq -r 'select(.reason == "build-script-executed" and (.package_id | contains("mago-sharp-bridge"))) | .out_dir | ltrimstr("/src/")' "$RUNNER_TEMP/build.json")/sharp_unit.h"
          diff -u ext/sharp/sharp_unit.h "$header"
      # HOSTS serves the fixture from this build's php-fpm, and compiles it with this build's mago. A tar keeps
      # their modes, which an artifact drops.
      - name: Keep php-fpm and mago for HOSTS
        run: tar -cf "$RUNNER_TEMP/hosts-nts.tar" "sharp/build/linux-$(uname -m)/sapi/fpm/php-fpm" "sharp/build/linux-$(uname -m)/mago/test-run/mago"
      - name: Upload php-fpm and mago for HOSTS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosts-nts
          path: ${{ runner.temp }}/hosts-nts.tar
          retention-days: 1
  # The thread-safe build, which FrankenPHP and Octane on Swoole run, in every mode LINUX runs. Linux has a
  # thread-safe JIT, so the JIT passes run too.
  LINUX_ZTS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM base-images.yml's copies, as LINUX does.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/cargo
            sharp/build/rustup
          key: SHARP_LINUX_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.lock') }}
      # sharp/bin/test --zts builds mago into the other build's folder, sharp/build/<os>-<arch>/mago, as LINUX does.
      - name: Mago cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/*/mago
          key: SHARP_LINUX_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
      - name: Build
        run: sharp/bin/build --linux --zts
      - name: Test PHP#
        run: sharp/bin/test --linux --zts --opcache --repeat --passes
      # HOSTS builds FrankenPHP against the libphp, headers and php-config that sharp/bin/build --zts installed.
      - name: Keep the installed engine for HOSTS
        run: |
          install="sharp/build/linux-$(uname -m)-zts/install"
          tar -cf "$RUNNER_TEMP/hosts-zts.tar" "$install/lib" "$install/include" "$install/bin/php-config"
      - name: Upload the installed engine for HOSTS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosts-zts
          path: ${{ runner.temp }}/hosts-zts.tar
          retention-days: 1
  # The fixture in sharp/hosts, served from php-fpm and from FrankenPHP's worker mode. FrankenPHP is built with Go
  # against the engine LINUX_ZTS built, and php-fpm is the one LINUX built.
  HOSTS:
    needs: [LINUX, LINUX_ZTS]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM base-images.yml's copies, as LINUX does.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/go/pkg/mod
          key: SHARP_HOSTS_GO-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile') }}
      - name: Download php-fpm and mago
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosts-nts
          path: ${{ runner.temp }}
      - name: Download the installed engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosts-zts
          path: ${{ runner.temp }}
      - name: Unpack them where they were built
        run: |
          tar -xf "$RUNNER_TEMP/hosts-nts.tar"
          tar -xf "$RUNNER_TEMP/hosts-zts.tar"
      - name: Serve the fixture from php-fpm and FrankenPHP
        run: sharp/bin/hosts --linux
  # Each runtime image, with the extensions a typical Laravel app installs on top, installed the way such an app's
  # Dockerfile does. The engine changes PHP's internal structures, so an extension can stop building or loading.
  # The images are the only -O2 builds, where GCC finds -Wmaybe-uninitialized and libcurl's type checks, and they build
  # with --enable-werror. So each builds on amd64 and on arm64, as IMAGE builds them for a tag, and a warning one
  # architecture alone finds fails the pull request instead of the release.
  PHP_EXTENSIONS:
    name: PHP_EXTENSIONS (${{ matrix.host.file }}, ${{ matrix.host.php }}, ${{ matrix.runner }})
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # One host's failure leaves the other's result in the log.
    strategy:
      fail-fast: false
      matrix:
        host:
          # php-fpm answers FastCGI on port 9000 for the app in /var/www/html.
          - file: sharp/docker/runtime/Dockerfile
            php: php
            docker-run: --publish 9000:9000 --volume "$RUNNER_TEMP/public:/var/www/html:ro"
            request: SCRIPT_FILENAME=/var/www/html/index.php REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000
            sapi: fpm-fcgi
          # FrankenPHP's default Caddyfile serves the app in /app/public on https://localhost, with its own certificate.
          - file: sharp/docker/runtime/frankenphp.Dockerfile
            php: frankenphp php-cli
            docker-run: --publish 8443:443 --volume "$RUNNER_TEMP/public:/app/public:ro"
            request: curl --silent --show-error --fail --insecure https://localhost:8443/
            sapi: frankenphp
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # The image builds FROM base-images.yml's copies at the digests the Dockerfiles pin, as IMAGE's does.
    env:
      REGISTRY: ghcr.io/heyjordanparker
      EXTENSIONS: bcmath exif gd imagick intl pcntl pdo_pgsql pgsql redis zip
      # The same extensions, with imagick and redis built from the release tags the image adds from GitHub, because
      # pecl.php.net outages failed this job.
      INSTALL: bcmath exif gd /usr/src/imagick intl pcntl pdo_pgsql pgsql /usr/src/phpredis zip
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/cargo
            sharp/build/rustup
          key: SHARP_LINUX_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.lock') }}
      - name: Mago cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/*/mago
          key: SHARP_LINUX_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
      - name: Build the image
        run: git archive HEAD | docker build --build-arg REGISTRY --file "${{ matrix.host.file }}" --tag php-sharp -
      # A critical or high CVE that a fixed package resolves fails the build, so it is fixed before a tag, which takes
      # only a commit whose PHP_EXTENSIONS passed on master, and IMAGE scans what it pushes again.
      # aquasecurity/trivy-action's v0.35.0 and later are immutable releases, made after its tags were rewritten to
      # malware on 2026-03-19, and Trivy's v0.71.1 and later fix GHSA-mcj4-mphf-j9ff.
      - name: Scan the image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: php-sharp
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Install cgi-fcgi
        if: matrix.host.sapi == 'fpm-fcgi'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfcgi-bin
      # The image starts on its own default command, as an app's container does, and serves the app's page. A wrong
      # entrypoint stops the container here, before IMAGE publishes it.
      - name: Start the image on its default command and request a page from ${{ matrix.host.sapi }}
        run: |
          mkdir "$RUNNER_TEMP/public"
          echo '<?php echo "Served by ", PHP_SAPI, PHP_EOL;' > "$RUNNER_TEMP/public/index.php"
          docker run --detach --name server ${{ matrix.host.docker-run }} php-sharp
          for ((second = 1; ; second++)); do
            if response="$(${{ matrix.host.request }} 2>&1)" && grep -qx 'Served by ${{ matrix.host.sapi }}' <<< "$response"; then
              echo "$response"
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' server)" != true || $second == 30 ]]; then
              docker logs server
              echo "::error::The image's default command stopped, or served no page in 30 seconds. Its log is above, and the last request printed: $response"
              exit 1
            fi
            sleep 1
          done
          docker rm --force server
      # rustup comes after the extensions, so they build as in the app's image, and lets sharp/bin/test build mago.
      - name: Install the extensions
        run: |
          docker build --build-arg INSTALL --tag php-sharp-extensions - <<'DOCKERFILE'
          FROM php-sharp
          COPY --from=ghcr.io/mlocati/php-extension-installer:2 /usr/bin/install-php-extensions /usr/local/bin/
          # A git source brings phpredis's liblzf submodule, which GitHub's tag archive leaves out.
          ADD https://github.com/Imagick/imagick.git#3.8.1 /usr/src/imagick
          ADD https://github.com/phpredis/phpredis.git#6.3.0 /usr/src/phpredis
          ARG INSTALL
          RUN install-php-extensions $INSTALL
          RUN apt-get update && apt-get install -y --no-install-recommends rustup && apt-get dist-clean
          DOCKERFILE
      - name: Check that php -m lists each extension, and call into each one from ${{ matrix.host.php }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS is a list of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src php-sharp-extensions ${{ matrix.host.php }} sharp/bin/php-extensions $EXTENSIONS
      # The container mounts the tree and its caches as sharp/docker/run does.
      - name: Test PHP# with the extensions loaded
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --ulimit stack=8388608:-1 \
            --env CARGO_HOME=/src/sharp/build/cargo \
            --env RUSTUP_HOME=/src/sharp/build/rustup \
            --env XDG_CACHE_HOME=/src/sharp/build/cache \
            --volume "$PWD:/src" \
            --workdir /src \
            php-sharp-extensions sharp/bin/test --installed --opcache --repeat --passes
  MACOS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    # The self-hosted Mac runners run it, except for a pull request from another repository: this one is public, and
    # head.repo.fork can't tell, because it is itself a fork of php/php-src. A job never installs on them, so they
    # check that Homebrew already has the build's formulae and build without ccache. Only the runner labelled
    # macos-arm64-suite takes it, so suites queue one at a time: the runners share one Mac, and three suites at once
    # each ran past the 60-minute limit. That Mac also builds the work the suite checks, so one suite alone takes 53
    # minutes at moderate load and ran past 60 under a build. The limit leaves room for that, as php-src's own macOS
    # jobs in test-suite.yml leave 180.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-suite' || 'macos-latest' }}
    timeout-minutes: 120
    env:
      FORMULAE: autoconf bison curl re2c pkgconf icu4c libiconv libpq libsodium libzip oniguruma
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: brew
        if: runner.environment == 'github-hosted'
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew install $FORMULAE
      - name: Homebrew has the build's formulae
        if: runner.environment == 'self-hosted'
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE
      - name: ccache
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/ccache
        with:
          name: SHARP_MACOS
      # ext/sharp/rust-toolchain.toml pins the toolchain the extension and mago build with.
      - name: show the Rust toolchain on PATH
        working-directory: ext/sharp
        run: |
          type -a rustup rustc cargo
          rustc --version
          cargo --version
      - name: Mago cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/*/mago
          key: SHARP_MACOS_MAGO-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
      - name: Build
        run: sharp/bin/build
      - name: Test PHP#
        run: sharp/bin/test --opcache --repeat --passes --census --differential
      - name: Test upstream
        run: sharp/bin/test --upstream --opcache
  # The checks that keep the release pipeline on pinned code. An action that is not ours runs only at a full commit
  # SHA, so a moved tag can't change what runs. No Dockerfile under sharp/docker names a `# syntax=` frontend, which
  # BuildKit pulls from Docker Hub with no login (#86). actionlint passes over every workflow, with the runner labels
  # and the rules .github/actionlint.yaml sets for php-src's own files.
  WORKFLOWS:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action that is not ours is pinned to a full commit SHA
        run: |
          if git grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' -- .github/workflows .github/actions \
            | grep -vE 'uses:[[:space:]]+(\./|[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)|docker://[^@[:space:]]+@sha256:[0-9a-f]{64}([[:space:]]|$))'; then
            echo "::error::Pin each action above to the full commit SHA its release tag names, with the release as a comment: uses: actions/checkout@<40-character SHA> # v7.0.1."
            exit 1
          fi
      - name: No Dockerfile under sharp/docker names a syntax frontend
        run: |
          if git grep -nE '^#[[:space:]]*syntax[[:space:]]*=' -- sharp/docker; then
            echo "::error::Remove each # syntax= line above. BuildKit pulls the frontend it names from Docker Hub with no login (#86), and builds with its own Dockerfile frontend without one."
            exit 1
          fi
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint"'
  # This workflow's one required check. A job skipped by its `if` reports one check under the job's
  # name, so CI_PASSED stands in for every job it needs. It fails when any of them failed or was
  # cancelled. mago.yml's ci-passed is the other required check, and its plain-php job runs mago
  # from Composer on plain PHP.
  CI_PASSED:
    if: always()
    needs: [CHANGES, LINUX, LINUX_ZTS, HOSTS, PHP_EXTENSIONS, MACOS, WORKFLOWS]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed, or skipped a change to documentation alone
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: LINUX, LINUX_ZTS, HOSTS, PHP_EXTENSIONS, MACOS
          jobs: ${{ toJSON(needs) }}
  COMPOSER:
    needs: [CHANGES, LINUX, MACOS]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency: composer-${{ github.ref }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install splitsh-lite
        uses: ./.github/actions/splitsh-lite
      - name: Split sharp/composer
        run: splitsh-lite --prefix=sharp/composer --target=refs/heads/composer
      - name: git checkout heyJordanParker/php-sharp-composer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/php-sharp-composer
          ssh-key: ${{ secrets.PHP_SHARP_COMPOSER_DEPLOY_KEY }}
          path: sharp/build/php-sharp-composer
          fetch-depth: 0
      - name: Push the split
        working-directory: sharp/build/php-sharp-composer
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer
          git push origin "FETCH_HEAD:$GITHUB_REF"
      # A tag's heyJordanParker/mago-sharp version pins the SHA-256 of every release asset, which exist only once
      # release.yml has built them, so release.yml's COMPOSER job pushes that tag.
      - name: Split sharp/mago
        if: github.ref_type == 'branch'
        run: splitsh-lite --prefix=sharp/mago --target=refs/heads/mago
      - name: git checkout heyJordanParker/mago-sharp
        if: github.ref_type == 'branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp
          fetch-depth: 0
      # The push never forces, so a mistake can't rewind the published package. splitsh-lite starts the split at
      # the commit that added sharp/mago, so a branch the mirror had before the move isn't in the split, and its
      # push is skipped until that branch is rewritten once. git subtree split would keep that history, but it
      # walks all of Mago's history in shell recursion and took more than 8 minutes without finishing.
      - name: Push the split
        if: github.ref_type == 'branch'
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          if git rev-parse -q --verify "origin/$GITHUB_REF_NAME" > /dev/null \
            && ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" FETCH_HEAD; then
            echo "::warning::The split of sharp/mago does not contain heyJordanParker/mago-sharp's $GITHUB_REF_NAME, so pushing it would rewrite that branch. The push is skipped."
            exit 0
          fi
          git push origin "FETCH_HEAD:$GITHUB_REF"
  # One image per host, under one name: php-fpm's as <version>, FrankenPHP's as <version>-frankenphp, as
  # docker-library names 8.5-fpm and 8.5-zts. Each platform builds on a runner of its own architecture and pushes
  # its image by digest, with BuildKit's provenance and SBOM attestations, and IMAGE_TAGS tags the two as one.
  # BuildKit, its SBOM scanner and the bases are base-images.yml's copies in ghcr.io at pinned digests, pulled after
  # the login, so no pull is an anonymous Docker Hub pull (#86).
  IMAGE:
    name: IMAGE (${{ matrix.host.file }}, ${{ matrix.platform }})
    if: github.ref_type == 'tag'
    needs: CHANGES
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        host:
          - { file: sharp/docker/runtime/Dockerfile, name: fpm }
          - { file: sharp/docker/runtime/frankenphp.Dockerfile, name: frankenphp }
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx with BuildKit from ghcr.io
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=ghcr.io/heyjordanparker/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      # The build's context is the tagged commit's tree, which BuildKit fetches from GitHub by the commit's SHA, so
      # a tag moved after the push builds nothing else, as docker/github-builder's checksum pinned it.
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: ${{ matrix.host.file }}
          platforms: ${{ matrix.platform }}
          build-args: REGISTRY=ghcr.io/heyjordanparker
          provenance: mode=max
          sbom: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          outputs: type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true
      # The tag builds the image again, with that day's packages, so the image IMAGE_TAGS publishes is scanned
      # itself, on its own platform, as PHP_EXTENSIONS scans the merge's. A digest that fails is never uploaded, so
      # IMAGE_TAGS tags none.
      - name: Scan the pushed image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Keep the digest for IMAGE_TAGS
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload the digest for IMAGE_TAGS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.host.name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  # Tags each host's two platform images as one image, and attests its provenance with the repository's identity,
  # which `gh attestation verify oci://ghcr.io/heyjordanparker/php-sharp:<tag> --repo heyJordanParker/php-sharp`
  # checks.
  IMAGE_TAGS:
    name: IMAGE_TAGS (${{ matrix.host.name }})
    needs: IMAGE
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        host:
          - { name: fpm, suffix: '' }
          - { name: frankenphp, suffix: -frankenphp }
    steps:
      - name: Download the platforms' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.host.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the platforms' images as one image
        id: tag
        working-directory: ${{ runner.temp }}/digests
        env:
          SUFFIX: ${{ matrix.host.suffix }}
        run: |
          image=ghcr.io/heyjordanparker/php-sharp
          tag="$image:${GITHUB_REF_NAME#v}$SUFFIX"
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done
          if [[ ${#sources[@]} != 2 ]]; then
            echo "::error::IMAGE pushed ${#sources[@]} platform images for $tag, not linux/amd64's and linux/arm64's."
            exit 1
          fi
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
