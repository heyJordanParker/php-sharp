name: PHP#
on:
  push:
    paths-ignore: &ignore_paths
      - .circleci/**
      - .github/CODEOWNERS
      - .github/ISSUE_TEMPLATE/**
      - '**/*.md'
      - '**/*.rst'
      - docs/**
      - EXTENSIONS
      - LICENSE
      - NEWS
      - UPGRADING
      - UPGRADING.INTERNALS
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths-ignore: *ignore_paths
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true
jobs:
  LINUX:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            sharp/build/cargo
            sharp/build/rustup
          key: SHARP_LINUX_RUST-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock') }}
      - name: Pinned Mago commit
        id: mago
        run: sed -n 's/^mago-sharp-bridge = { git = ".*", rev = "\(.*\)" }$/rev=\1/p' ext/sharp/Cargo.toml >> "$GITHUB_OUTPUT"
      - name: Mago cache
        uses: actions/cache@v5
        with:
          path: sharp/build/*/mago
          key: SHARP_LINUX_MAGO-${{ steps.mago.outputs.rev }}
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP#
        run: sharp/bin/test --linux --opcache --repeat --differential
      - name: Test upstream
        run: sharp/bin/test --linux --upstream --opcache
      - name: Verify generated files are up to date
        run: |
          sharp/docker/run scripts/dev/credits
          sharp/docker/run scripts/dev/genfiles
          sharp/docker/run scripts/gdb/debug_gdb_scripts_gen.php
          sharp/docker/run Zend/zend_vm_gen.php
          sharp/docker/run ext/tokenizer/tokenizer_data_gen.php
          sharp/docker/run build/gen_stub.php -f --generate-optimizer-info --verify
          # Use the -a flag for a bug in git 2.46.0, which doesn't consider changed -diff files.
          git add . -N && git diff -a --exit-code
      - name: Verify the bridge's sharp_kind is generated from Zend/zend_ast.h
        run: |
          sharp/docker/run sh -c 'cd ext/sharp && "$(rustup which cargo)" metadata --format-version 1 --locked' > "$RUNNER_TEMP/metadata.json"
          mago="$(jq -r '.packages[] | select(.name == "mago-sharp-bridge") | .manifest_path | ltrimstr("/src/") | rtrimstr("/crates/sharp-bridge/Cargo.toml")' "$RUNNER_TEMP/metadata.json")"
          sharp/docker/run php "$mago/scripts/regen-sharp-kinds.php" Zend/zend_ast.h | diff -u "$mago/crates/sharp-bridge/src/kind.rs" -
  MACOS:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: brew
        run: |
          brew install \
            autoconf \
            bison \
            re2c \
            pkgconf \
            icu4c \
            libiconv \
            libpq \
            libsodium \
            libzip \
            oniguruma
      - name: ccache
        uses: ./.github/actions/ccache
        with:
          name: SHARP_MACOS
      - name: Pinned Mago commit
        id: mago
        run: sed -n 's/^mago-sharp-bridge = { git = ".*", rev = "\(.*\)" }$/rev=\1/p' ext/sharp/Cargo.toml >> "$GITHUB_OUTPUT"
      - name: Mago cache
        uses: actions/cache@v5
        with:
          path: sharp/build/*/mago
          key: SHARP_MACOS_MAGO-${{ steps.mago.outputs.rev }}
      - name: Build
        run: sharp/bin/build
      - name: Test PHP#
        run: sharp/bin/test --opcache --repeat --differential
      - name: Test upstream
        run: sharp/bin/test --upstream --opcache
  IMAGE:
    if: github.ref_type == 'tag'
    needs: [LINUX, MACOS]
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      file: sharp/docker/runtime/Dockerfile
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/heyjordanparker/php-sharp
      meta-tags: type=semver,pattern={{version}}
      meta-flavor: latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
