name: PHP#
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - master
  # ASAN alone, nightly on master's tip.
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
# A pull request's new commit cancels its run in progress. Master runs one push at a time, and only the newest push
# waits, since its tree holds every merge before it, so the Mac never tests a tree master already moved past. A
# schedule and a tag each run in a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # CI_PASSED is this workflow's one required check, so the workflow always runs, and every suite skips a change to
  # documentation alone. docs/spec.md, README.md and sharp/spec-self-test.md count as code, because SPEC compiles and
  # runs their examples. UBUNTU_WERROR skips a change only to Mago, its coverage script sharp/bin/coverage, the Composer
  # plugin, the sharp/hosts, sharp/phpunit and sharp/bench fixtures, tests or documentation, none of which it compiles.
  #
  # A pull request runs the Linux suites, each on 4 cores and under 8 minutes, so its CI ends under 10. The push to
  # master runs what needs the Mac, the arm64 Linux suite, UBUNTU_WERROR, the runtime images and, for a release's bump,
  # the release assets, and saves the caches every pull request's run restores. A defect only those find lands on
  # master first, and a red push opens an issue, as CI_PASSED does, for a pull request that fixes it forward.
  #
  # A tree runs the Linux suites once, as bors's "not rocket science" rule tests the exact tree that lands once. A push
  # to master skips them when a pull request's run passed them all on its tree, as .github/actions/passed-tree explains,
  # and links that run. A push whose tree no pull request's run passed runs them, as the check of the merge. A tag runs
  # none of them: it publishes only a commit whose own push run passed, and the images and assets that run built.
  CHANGES:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      bump: ${{ steps.bump.outputs.bump }}
      code: ${{ steps.diff.outputs.code }}
      engine: ${{ steps.diff.outputs.engine }}
      images-run-id: ${{ steps.images.outputs.run-id }}
      linux-passed: ${{ steps.linux.outputs.run && 'true' || '' }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The 11 Linux suite jobs a pull request's run passes, the same as a push runs them.
      - name: Find the pull request run that passed every Linux suite on this tree
        id: linux
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request
          passed: >-
            [.jobs[] | select(.conclusion == "success" and (.name | test("^(LINUX|SPEC|LINUX_ZTS) \\(")
            or . == "UPSTREAM" or . == "HOSTS"))] | length == 11
      - name: The Linux suites don't run again
        if: steps.linux.outputs.run
        env:
          RUN: ${{ steps.linux.outputs.run }}
        run: echo "::notice::This tree ran and passed every Linux PHP# suite in $RUN, so they don't run again."
      # The tagged commit's own push run on master, whose CI_PASSED passed every suite and job the push runs.
      - name: Find the tagged commit's push run that passed
        id: tagged
        if: github.ref_type == 'tag'
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: push
          passed: any(.jobs[]; .name == "CI_PASSED" and .conclusion == "success")
          on-master: true
      - name: The tagged commit's push run passed
        if: github.ref_type == 'tag'
        env:
          RUN: ${{ steps.tagged.outputs.run }}
        run: |
          if [[ -z $RUN ]]; then
            echo "::error::No push run of PHP# CI passed on master's commit $GITHUB_SHA. Wait for it to pass, or rerun it, and once it passes, rerun this run with gh run rerun $GITHUB_RUN_ID."
            exit 1
          fi
          echo "Commit $GITHUB_SHA's push run $RUN passed."
      # The images that push run built and pushed by digest from the tagged commit. When its digests expired or were
      # never pushed, IMAGE builds them, and warns so.
      - name: The push run's images are kept
        id: images
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.tagged.outputs.run }}
        run: |
          id=${RUN##*/}
          kept=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("digest-")) and (.expired | not)) | .name' | wc -l)
          if [[ $kept != 4 ]]; then
            echo "::warning::Run $RUN keeps $kept of its 4 images' digests: the others expired, were deleted or were never pushed. So IMAGE builds both images from commit $GITHUB_SHA."
            exit 0
          fi
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice::IMAGE_TAGS tags the images run $RUN pushed from commit $GITHUB_SHA, and IMAGE builds none."
      # A push's changes start at the commit of master's newest push run that GitHub didn't cancel, so a merge whose
      # pending run a later push replaced still counts, and a red run's issue names every commit it tests. Pushes run
      # one at a time, so every earlier run has ended. Only an earlier run counts, so a rerun of an old run diffs from
      # the run before it, as its first attempt did. With none among the last 100 runs, every job runs.
      - name: Find the commit of master's last push run that ran
        id: base
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sharp.yml/runs?branch=master&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .id < (env.GITHUB_RUN_ID | tonumber))][0].head_sha // empty')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "This push's changes start at ${sha:-no commit, so every job runs}."
      - name: Find changes outside documentation, and changes to the engine
        id: diff
        if: github.ref_type != 'tag'
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
        run: |
          if [[ -z $BASE ]]; then
            echo code=true >> "$GITHUB_OUTPUT"
            echo engine=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"
          code=false
          engine=false
          while read -r file; do
            case "$file" in
              docs/spec.md|README.md|sharp/spec-self-test.md) code=true ;;
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|*.md|*.rst|docs/*) ;;
              EXTENSIONS|LICENSE|NEWS|UPGRADING|UPGRADING.INTERNALS) ;;
              *) code=true ;;
            esac
            case "$file" in
              sharp/mago/*|sharp/bin/coverage|sharp/composer/*|sharp/hosts/*|sharp/phpunit/*|sharp/bench/*|*/tests/*) ;;
              .github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|*.md|*.rst|docs/*) ;;
              EXTENSIONS|LICENSE|NEWS|UPGRADING|UPGRADING.INTERNALS) ;;
              *) engine=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
      # A push whose sharp/mago/Cargo.toml version differs from the last push run's is a release's bump: RELEASE_ASSETS
      # builds its assets, and the tag on its commit publishes them.
      - name: Find a release's bump
        id: bump
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          version() { git show "$1:sharp/mago/Cargo.toml" | sed -n '/^version = /{s/^version = "\(.*\)"$/\1/p;q}'; }
          base=${BASE:-HEAD^1}
          git fetch --depth=2 origin "${BASE:-$GITHUB_SHA}"
          old=$(version "$base")
          new=$(version HEAD)
          if [[ $old != "$new" ]]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "::notice::sharp/mago/Cargo.toml moves from $old to $new, so RELEASE_ASSETS builds the release's assets."
          fi
  # Every Linux suite job builds what it needs itself in the sharp/docker image, on 4 cores, from the caches CACHE saves
  # on master: the engine through ccache, and mago on master's target. A build job the suites waited on would add its
  # minutes to every one of them. sharp/docker/run builds the image FROM these copies, which base-images.yml makes of the
  # public registry's images, so the pulls never meet an anonymous quota.
  #
  # Each of those jobs compiles through ccache in the image, which sharp/docker/run passes CC and CXX into, with its
  # folder at sharp/build/cache/ccache, under the XDG_CACHE_HOME sharp/docker/run sets.
  #
  # LINUX runs the PHP# suite in three slices, each without opcache, in shared memory twice per process, and under the
  # tracing JIT production runs with the opcache. The first slice also runs mago convert's whole-project proof, the
  # second the census, the differential and PHPUnit, and the third the checks of generated files.
  LINUX:
    name: LINUX (${{ matrix.shard }}/3)
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.linux-passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Keep local sources out of Cargo.lock
        if: matrix.shard == 3
        run: |
          if git grep -nE '(path|git)\+file://' -- '*Cargo.lock'; then
            echo "::error::A committed Cargo.lock names a local source. Keep a [patch] in an untracked .cargo/config.toml."
            exit 1
          fi
      # sharp/bin/test builds mago with sharp/bin/build-mago, inside the image, where CARGO_HOME and RUSTUP_HOME are
      # sharp/build/cargo and sharp/build/rustup. Every Linux job that builds mago in the image shares these caches.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
      - name: ccache, saved by CACHE on master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/ccache
          key: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-
      - name: Build
        run: |
          sharp/docker/run ccache --zero-stats
          sharp/bin/build --linux
          sharp/docker/run ccache --show-stats
      - name: Test PHP#
        run: >-
          sharp/bin/test --linux --repeat --jit --shard ${{ matrix.shard }}/3
          ${{ matrix.shard == 2 && '--census --differential --phpunit' || '' }}
      - name: Verify generated files are up to date
        if: matrix.shard == 3
        run: |
          sharp/docker/run scripts/dev/credits
          sharp/docker/run scripts/dev/genfiles
          sharp/docker/run scripts/gdb/debug_gdb_scripts_gen.php
          sharp/docker/run Zend/zend_vm_gen.php
          sharp/docker/run ext/tokenizer/tokenizer_data_gen.php
          sharp/docker/run build/gen_stub.php -f --generate-optimizer-info --verify
          # Use the -a flag for a bug in git 2.46.0, which doesn't consider changed -diff files.
          git add . -N && git diff -a --exit-code
      - name: Verify the native interface is generated from the standard library's extern declarations
        if: matrix.shard == 3
        run: |
          sharp/docker/run sharp/bin/native
          git diff --exit-code ext/sharp/sharp_native.h sharp/composer/native.php
      - name: Verify the built-in function declarations are generated from php-8-stubs by rules whose every row passes
        if: matrix.shard == 3
        run: |
          sharp/docker/run sharp/bin/builtins --self-test
          sharp/docker/run sharp/bin/builtins
          git diff --exit-code sharp/composer/library/Sharp/Internal/Builtins.sharp
      - name: Verify ext/sharp/sharp_unit.h, with its sharp_kind, SHARP_T_ tokens and SHARP_UNIT_ABI, is the header sharp/mago generates from Zend/zend_ast.h and Zend/zend_language_parser.h
        if: matrix.shard == 3
        run: |
          sharp/docker/run php sharp/mago/scripts/regen-sharp-kinds.php Zend/zend_ast.h Zend/zend_language_parser.h | diff -u sharp/mago/crates/sharp-bridge/src/kind.rs -
          # cargo builds nothing for the mago sharp/bin/test built, and names the out_dir of the bridge it links.
          # `-p mago-sharp-bridge` resolves other features, so it built a second bridge and its dependencies beside it.
          sharp/docker/run sharp/bin/build-mago --message-format=json > "$RUNNER_TEMP/build.json"
          header="$(jq -r 'select(.reason == "build-script-executed" and (.package_id | contains("mago-sharp-bridge"))) | .out_dir | ltrimstr("/src/")' "$RUNNER_TEMP/build.json")/sharp_unit.h"
          diff -u ext/sharp/sharp_unit.h "$header"
  # The upstream tests without opcache, compared with sharp/baseline/linux, so plain PHP still behaves as before, and
  # sharp/bin/spec's rules on the examples of sharp/spec-self-test.md, on the same build.
  UPSTREAM:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.linux-passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
      - name: ccache, saved by CACHE on master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/ccache
          key: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-
      - name: Build
        run: sharp/bin/build --linux
      - name: Test upstream
        run: sharp/bin/test --linux --upstream
      # sharp/bin/test --spec runs the self-test with every example, which SPEC checks in slices, so this runs the
      # self-test alone, with the mago sharp/bin/test built, as sharp/bin/test passes it.
      - name: Check sharp/bin/spec's rules on sharp/spec-self-test.md
        run: |
          build="sharp/build/linux-$(uname -m)"
          sharp/docker/run env TEST_MAGO_EXECUTABLE="/src/$build/mago/debug/mago" "$build/sapi/cli/php" sharp/bin/spec --self-test
  # Every code example in docs/spec.md and README.md, compared with sharp/baseline/spec, in three slices of the examples.
  # Each slice runs sharp/bin/spec on the engine with the mago sharp/bin/build-mago builds, as sharp/bin/test --spec does.
  SPEC:
    name: SPEC (${{ matrix.shard }}/3)
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.linux-passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
      - name: ccache, saved by CACHE on master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/ccache
          key: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-
      - name: Build
        run: |
          sharp/bin/build --linux
          sharp/docker/run sharp/bin/build-mago --quiet
      - name: Check the examples of docs/spec.md and README.md
        run: |
          build="sharp/build/linux-$(uname -m)"
          sharp/docker/run env TEST_MAGO_EXECUTABLE="/src/$build/mago/debug/mago" "$build/sapi/cli/php" sharp/bin/spec --shard ${{ matrix.shard }}/3
  # The thread-safe build, which FrankenPHP and Octane on Swoole run, in three slices of the PHP# suite, without opcache,
  # in shared memory twice per process, and under the tracing JIT, since Linux has a thread-safe JIT.
  LINUX_ZTS:
    name: LINUX_ZTS (${{ matrix.shard }}/3)
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.linux-passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      # sharp/bin/test --zts builds mago into the other build's folder, sharp/build/<os>-<arch>/mago, as LINUX does.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
      - name: ccache, saved by CACHE on master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/ccache
          key: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-
      - name: Build
        run: sharp/bin/build --linux --zts
      - name: Test PHP#
        run: sharp/bin/test --linux --zts --repeat --jit --shard ${{ matrix.shard }}/3
  # The fixture in sharp/hosts, served from php-fpm and from FrankenPHP's worker mode. HOSTS builds php-fpm, the
  # thread-safe engine FrankenPHP is built against with Go, and mago itself, beside the suites, so it never waits for
  # their tests.
  HOSTS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.linux-passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      # sharp/bin/hosts builds mago before it compiles the fixture, as sharp/bin/test does in LINUX.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
      - name: ccache, saved by CACHE on master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/ccache
          key: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-
      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/go/pkg/mod
          key: SHARP_HOSTS_GO-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile') }}
      - name: Build php-fpm
        run: sharp/bin/build --linux
      - name: Build and install the thread-safe engine
        run: sharp/bin/build --linux --zts
      - name: Serve the fixture from php-fpm and FrankenPHP
        run: sharp/bin/hosts --linux
  # The push to master builds the engine and mago as the suites do and saves what they restore: the ccache of both
  # builds, and the Mago target with the Rust toolchain and crates, as .github/actions/mago-cache explains. A cache only
  # its own ref's runs would restore is no use to the next pull request, so only master saves. CI_PASSED, which runs
  # after it, deletes the targets and ccaches its new ones replaced.
  CACHE:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
          save: true
      - name: ccache, saved under this commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/ccache
          key: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-${{ github.sha }}
          restore-keys: SHARP_LINUX_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/Dockerfile') }}-
      - name: Build both engines and mago
        run: |
          sharp/docker/run ccache --zero-stats
          sharp/bin/build --linux
          sharp/bin/build --linux --zts
          sharp/docker/run ccache --show-stats
          sharp/docker/run sharp/bin/build-mago --quiet
  # The PHP# suite on arm64 Linux, the platform of the Linux VMs on the Mac, in the arm64 sharp/docker image on the
  # self-hosted Mac runners, whose Docker keeps the image and whose kept build folder holds sharp/build/linux-aarch64. It
  # runs on the push to master, so a pull request never waits for the Mac. A job never installs on those runners, and
  # never sets them up: the first step only checks that Docker answers there.
  LINUX_ARM64:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: macos-arm64-local
    timeout-minutes: 120
    steps:
      # actions/checkout's clean deletes sharp/build. Each job on the self-hosted Macs keeps it instead, as
      # .github/actions/clean-kept-build explains.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build
      - name: Docker answers on this runner
        run: docker info --format 'Docker {{.ServerVersion}}, {{.OSType}}/{{.Architecture}}, {{.NCPU}} CPUs'
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP#
        run: sharp/bin/test --linux --repeat --jit --census --differential --phpunit
  # The engine at -O2 with --enable-werror, on the runner itself, with Ubuntu 24.04's gcc 13, which warns where the
  # Debian trixie image's gcc 14 doesn't, as #255 found by hand (2d4ac5f6c7b). It builds sharp/bin/build --release,
  # then both images' configure lines, sharp/docker/runtime/configure-options's, so the extensions only the images
  # build, such as ext/readline, where #255's warning was, compile with gcc 13 too. They build out of the tree, as
  # sharp/bin/build does, with Ubuntu's own CFLAGS, as a source build that sharp/README.md describes runs them. The push
  # to master runs it for a change to the engine's own code, as CHANGES explains.
  UBUNTU_WERROR:
    needs: CHANGES
    if: needs.CHANGES.outputs.engine == 'true' && github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    # The build's packages, as sharp/docker/Dockerfile installs them, then those the images' options add, as
    # sharp/docker/runtime/Dockerfile installs them, with dpkg-dev for configure-options's dpkg-architecture.
    env:
      PACKAGES: >-
        autoconf bison pkg-config re2c libcurl4-openssl-dev libicu-dev libonig-dev libpq-dev libsodium-dev libsqlite3-dev
        libxml2-dev libzip-dev libargon2-dev libreadline-dev libssl-dev dpkg-dev
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: apt
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # PACKAGES is a list of packages.
          sudo apt-get install --yes --no-install-recommends $PACKAGES
      # Each build prints the CFLAGS its Makefile passes gcc, since make's output is hidden and configure adds -Werror
      # without a word, so the log shows -O2 and -Werror reach the compiler.
      - name: Build at -O2 with --enable-werror
        run: |
          sharp/bin/build --release
          grep -E '^CFLAGS(_CLEAN)? =' "sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)-release/Makefile"
      # sharp/bin/build wrote configure.
      - name: Build both images' configure lines at -O2 with --enable-werror
        run: |
          for image in fpm zts; do
            options="$(sharp/docker/runtime/configure-options "$image")"
            mkdir "$RUNNER_TEMP/$image"
            # shellcheck disable=SC2086 # configure-options prints one option per line.
            (cd "$RUNNER_TEMP/$image" && "$GITHUB_WORKSPACE/configure" $options && grep -E '^CFLAGS(_CLEAN)? =' Makefile && make -j"$(nproc)" >/dev/null)
          done
  # The engine built with AddressSanitizer, so a memory error of the engine fails a test, nightly on master's tip.
  # sharp/bin/build has no flag for php-src's --enable-address-sanitizer, so it builds as php-src's own CI does: a debug
  # build whose CFLAGS and LDFLAGS add -fsanitize=address and ZEND_TRACK_ARENA_ALLOC. sharp/docker/run passes no CFLAGS
  # into the image, so it builds on the runner, with Ubuntu's gcc 13. The tests run with what run-tests.php's --asan
  # sets, which sharp/bin/test doesn't take: the Zend allocator off, so ASan sees each allocation, and LeakSanitizer with
  # php-src's suppressions. The PHP# tests run without opcache, in shared memory twice per process, and under the
  # tracing JIT, the stores a PHP# mark passes through, and leave out the upstream tests, whose baseline lists a build
  # without ASan. A failed run opens the red-master issue, as CI_PASSED does for a push.
  ASAN:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    # The build's packages, as sharp/docker/Dockerfile installs them. sharp/bin/build alone needs no more, so it leaves
    # out those UBUNTU_WERROR adds for the images' options.
    env:
      PACKAGES: >-
        autoconf bison pkg-config re2c libcurl4-openssl-dev libicu-dev libonig-dev libpq-dev libsodium-dev libsqlite3-dev
        libxml2-dev libzip-dev
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: apt
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # PACKAGES is a list of packages.
          sudo apt-get install --yes --no-install-recommends $PACKAGES
      # sharp/bin/test builds mago on the runner, with the crates mago.yml's jobs fetch there. A nightly run saves no
      # target, so the caches keep room for the ones every pull request restores.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_ASAN
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
      # Only this step's CFLAGS, so mago builds without ASan.
      - name: Build with AddressSanitizer
        env:
          CFLAGS: -fsanitize=address -DZEND_TRACK_ARENA_ALLOC
          LDFLAGS: -fsanitize=address
        run: sharp/bin/build
      - name: Test PHP# with AddressSanitizer
        env:
          USE_ZEND_ALLOC: 0
          USE_TRACKED_ALLOC: 1
          SKIP_ASAN: 1
          SKIP_PERF_SENSITIVE: 1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
        run: sharp/bin/test --repeat --jit
      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed nightly run
        if: failure()
        uses: ./.github/actions/red-master-issue
        with:
          title: The nightly ASAN run failed
  # The checks only macOS can fail: the engine's build, mago compile and the plain run on a disk that ignores case, the
  # census and the differential. The push to master runs it, so a merge never waits for the Mac. A job never installs
  # on the self-hosted Mac runners, so they check that Homebrew already has the build's formulae and build without
  # ccache. Only the runner labelled macos-arm64-suite takes it, so suites queue one at a time: the runners share one
  # Mac, and three suites at once each ran past the 60-minute limit.
  MACOS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: macos-arm64-suite
    timeout-minutes: 120
    # The 12-core Mac runs this job beside the other runners' jobs and the work the suite checks, and two or three jobs
    # that each took every core held its load between 200 and 480 for hours. So every job on the self-hosted Macs caps
    # its parallelism: CARGO_BUILD_JOBS sets cargo's jobs, and sharp/bin/build's make and sharp/bin/test's run-tests.php
    # read it as their -j. RUST_TEST_THREADS sets libtest's threads, RAYON_NUM_THREADS a rayon pool that sets no size of
    # its own, MAGO_THREADS mago's pool, which sets its own size and so never reads RAYON_NUM_THREADS, and
    # LEAN_NUM_THREADS Lean's.
    env:
      FORMULAE: autoconf bison curl re2c pkgconf icu4c libiconv libpq libsodium libzip oniguruma
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      MAGO_THREADS: 4
      LEAN_NUM_THREADS: 2
    steps:
      # actions/checkout's clean deletes sharp/build. Each job on the self-hosted Macs keeps it instead, as
      # .github/actions/clean-kept-build explains, so the engine and mago rebuild only what changed, which takes
      # seconds, where a build from nothing took 19 minutes.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build
      - name: Homebrew has the build's formulae
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE
      # ext/sharp/rust-toolchain.toml pins the toolchain the extension and mago build with.
      - name: show the Rust toolchain on PATH
        working-directory: ext/sharp
        run: |
          type -a rustup rustc cargo
          rustc --version
          cargo --version
      - name: Build
        run: sharp/bin/build
      - name: Test PHP#
        run: sharp/bin/test --census --differential
  # The checks that keep the release pipeline on pinned code. An action that is not ours runs only at a full commit
  # SHA, so a moved tag can't change what runs. No Dockerfile under sharp/docker names a `# syntax=` frontend, which
  # BuildKit pulls from Docker Hub with no login (#86). actionlint passes over every workflow, with the runner labels
  # .github/actionlint.yaml sets.
  WORKFLOWS:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action that is not ours is pinned to a full commit SHA
        run: |
          if git grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' -- .github/workflows .github/actions \
            | grep -vE 'uses:[[:space:]]+(\./|[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)|docker://[^@[:space:]]+@sha256:[0-9a-f]{64}([[:space:]]|$))'; then
            echo "::error::Pin each action above to the full commit SHA its release tag names, with the release as a comment: uses: actions/checkout@<40-character SHA> # v7.0.1."
            exit 1
          fi
      - name: No Dockerfile under sharp/docker names a syntax frontend
        run: |
          if git grep -nE '^#[[:space:]]*syntax[[:space:]]*=' -- sharp/docker; then
            echo "::error::Remove each # syntax= line above. BuildKit pulls the frontend it names from Docker Hub with no login (#86), and builds with its own Dockerfile frontend without one."
            exit 1
          fi
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint"'
  # A release's pull request, whose title starts with "chore: release", changes only what the bump writes: what
  # sharp/mago/scripts/set-version.php writes for the new version, PHP_SHARP_VERSION in ext/sharp/php_sharp.h and the
  # version Zend/tests/sharp/ri_sharp.phpt expects, and the release's section of sharp/CHANGELOG.md. Its tree differs
  # from master's only by the bump, so it runs the suites any pull request runs. The push of its merge commit builds the
  # release's assets and images, and the tag on that commit publishes them. A pull request with another title skips it.
  RELEASE_BUMP:
    if: "github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: release')"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The bump, made again on the base, must give the pull request's tree.
      - name: The pull request changes only what the version bump writes, and the changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE"
          version() { git show "$1:sharp/mago/Cargo.toml" | sed -n '/^version = /{s/^version = "\(.*\)"$/\1/p;q}'; }
          old=$(version "$BASE")
          new=$(version "$GITHUB_SHA")
          if [[ $old == "$new" ]]; then
            echo "::error::sharp/mago/Cargo.toml's version is still $old. Run php sharp/mago/scripts/set-version.php <version>."
            exit 1
          fi
          git switch --quiet --detach "$BASE"
          php sharp/mago/scripts/set-version.php "$new"
          sed -i "s/^#define PHP_SHARP_VERSION \"${old//./\\.}\"\$/#define PHP_SHARP_VERSION \"$new\"/" ext/sharp/php_sharp.h
          sed -i "s/^Version => ${old//./\\.}\$/Version => $new/" Zend/tests/sharp/ri_sharp.phpt
          git checkout "$GITHUB_SHA" -- sharp/CHANGELOG.md
          git add --all
          if ! git diff --cached --quiet "$GITHUB_SHA"; then
            git diff --cached -R "$GITHUB_SHA"
            echo "::error::The pull request changes more than the bump from $old to $new and sharp/CHANGELOG.md: the diff above is what it changes beyond them. Move that change to a pull request of its own."
            exit 1
          fi
          echo "The pull request changes only the bump from $old to $new and sharp/CHANGELOG.md."
      # The release's section is new text, so the changelog loses only the old link of [Unreleased].
      - name: sharp/CHANGELOG.md gains the release's section and links, and loses nothing else
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          version() { git show "$1:sharp/mago/Cargo.toml" | sed -n '/^version = /{s/^version = "\(.*\)"$/\1/p;q}'; }
          old=$(version "$BASE")
          new=$(version "$GITHUB_SHA")
          compare="https://github.com/$GITHUB_REPOSITORY/compare"
          git diff --unified=0 "$BASE" "$GITHUB_SHA" -- sharp/CHANGELOG.md > "$RUNNER_TEMP/changelog.diff"
          sed -n '/^---/d; s/^-//p' "$RUNNER_TEMP/changelog.diff" > "$RUNNER_TEMP/removed"
          sed -n '/^+++/d; s/^+//p' "$RUNNER_TEMP/changelog.diff" > "$RUNNER_TEMP/added"
          failed=false
          if [[ $(cat "$RUNNER_TEMP/removed") != "[Unreleased]: $compare/v$old...HEAD" ]]; then
            echo "::error::sharp/CHANGELOG.md may remove only the line [Unreleased]: $compare/v$old...HEAD. It removes:"
            cat "$RUNNER_TEMP/removed"
            failed=true
          fi
          for line in "[Unreleased]: $compare/v$new...HEAD" "[$new]: $compare/v$old...v$new"; do
            if ! grep -qxF "$line" "$RUNNER_TEMP/added"; then
              echo "::error::sharp/CHANGELOG.md doesn't add the line $line."
              failed=true
            fi
          done
          if ! grep -qE "^## \[${new//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" "$RUNNER_TEMP/added"; then
            echo "::error::sharp/CHANGELOG.md doesn't add the heading ## [$new] - <YYYY-MM-DD>."
            failed=true
          fi
          if $failed; then
            exit 1
          fi
          echo "sharp/CHANGELOG.md adds the $new section and its links."
  # The bump's Mago binaries, their attestations, Mago's source archives and their SHA-256s, which release.yml builds on
  # the push of the bump's merge commit, and the tag on that commit publishes, as release.yml explains. A called
  # workflow's jobs may ask only for permissions its caller grants, and release.yml's release job, which runs only for a
  # tag or a dispatch, asks for contents: write.
  RELEASE_ASSETS:
    needs: CHANGES
    if: needs.CHANGES.outputs.bump == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
  # This workflow's one required check. A job skipped by its `if` reports one check under the job's
  # name, so CI_PASSED stands in for every job it needs. It fails when any of them failed or was
  # cancelled. mago.yml's ci-passed is the other required check, and its plain-php job runs mago
  # from Composer on plain PHP.
  CI_PASSED:
    if: always() && github.event_name != 'schedule'
    needs:
      [CHANGES, LINUX, UPSTREAM, SPEC, LINUX_ZTS, HOSTS, CACHE, LINUX_ARM64, UBUNTU_WERROR, MACOS, WORKFLOWS, RELEASE_BUMP,
      RELEASE_ASSETS, IMAGE]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      # Only for the actions below.
      - name: git checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Every job passed, or skipped a change that doesn't need it
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            LINUX, UPSTREAM, SPEC, LINUX_ZTS, HOSTS, CACHE, LINUX_ARM64, UBUNTU_WERROR, MACOS, RELEASE_BUMP, RELEASE_ASSETS,
            IMAGE
          jobs: ${{ toJSON(needs) }}
      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed run on master
        if: failure() && github.event_name == 'push' && github.ref_type == 'branch'
        uses: ./.github/actions/red-master-issue
        with:
          title: A push to master failed PHP# CI
          range: ${{ needs.CHANGES.outputs.base && format('{0}..{1}', needs.CHANGES.outputs.base, github.sha) || '' }}
      # CACHE saved its target and ccache when it ended, so this job, which needs it, deletes the ones they replaced.
      - name: Delete the caches this run replaced
        if: always() && needs.CACHE.result == 'success'
        uses: ./.github/actions/mago-cache-prune
  COMPOSER:
    needs: [CHANGES, LINUX, MACOS]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency: composer-${{ github.ref }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install splitsh-lite
        uses: ./.github/actions/splitsh-lite
      - name: Split sharp/composer
        run: splitsh-lite --prefix=sharp/composer --target=refs/heads/composer
      - name: git checkout heyJordanParker/php-sharp-composer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/php-sharp-composer
          ssh-key: ${{ secrets.PHP_SHARP_COMPOSER_DEPLOY_KEY }}
          path: sharp/build/php-sharp-composer
          fetch-depth: 0
      - name: Push the split
        working-directory: sharp/build/php-sharp-composer
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer
          git push origin "FETCH_HEAD:$GITHUB_REF"
      # A tag's heyJordanParker/mago-sharp version pins the SHA-256 of every release asset, which exist only once
      # release.yml has built them, so release.yml's COMPOSER job pushes that tag.
      - name: Split sharp/mago
        if: github.ref_type == 'branch'
        run: splitsh-lite --prefix=sharp/mago --target=refs/heads/mago
      - name: git checkout heyJordanParker/mago-sharp
        if: github.ref_type == 'branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp
          fetch-depth: 0
      # The push never forces, so a mistake can't rewind the published package. splitsh-lite starts the split at
      # the commit that added sharp/mago, so a branch the mirror had before the move isn't in the split, and its
      # push is skipped until that branch is rewritten once. git subtree split would keep that history, but it
      # walks all of Mago's history in shell recursion and took more than 8 minutes without finishing.
      - name: Push the split
        if: github.ref_type == 'branch'
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          if git rev-parse -q --verify "origin/$GITHUB_REF_NAME" > /dev/null \
            && ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" FETCH_HEAD; then
            echo "::warning::The split of sharp/mago does not contain heyJordanParker/mago-sharp's $GITHUB_REF_NAME, so pushing it would rewrite that branch. The push is skipped."
            exit 0
          fi
          git push origin "FETCH_HEAD:$GITHUB_REF"
  # One image per host, under one name: php-fpm's as <version>, FrankenPHP's as <version>-frankenphp, as docker-library
  # names 8.5-fpm and 8.5-zts. Each platform builds on a runner of its own architecture with -O2 and --enable-werror,
  # where GCC finds -Wmaybe-uninitialized and libcurl's type checks, so a warning one architecture alone finds fails.
  # Each pushes its image by digest, with BuildKit's provenance and SBOM attestations, and IMAGE_TAGS tags the two as one.
  # BuildKit, its SBOM scanner and the bases are base-images.yml's copies in ghcr.io at pinned digests, pulled after the
  # login, so no pull is an anonymous Docker Hub pull (#86). The engine changes PHP's internal structures, so an
  # extension can stop building or loading: each pushed image then installs the extensions a typical Laravel app
  # installs on top, the way such an app's Dockerfile does. It runs on the push to master, and on a tag only when CHANGES
  # found the tagged commit's push run kept none.
  IMAGE:
    name: IMAGE (${{ matrix.host.file }}, ${{ matrix.platform }})
    if: >-
      ${{ !failure() && !cancelled() && (github.ref_type == 'tag' && !needs.CHANGES.outputs.images-run-id
      || github.event_name == 'push' && github.ref_type == 'branch' && needs.CHANGES.outputs.code == 'true') }}
    needs: CHANGES
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        host:
          - { file: sharp/docker/runtime/Dockerfile, name: fpm, sapi: fpm-fcgi, php: php }
          - { file: sharp/docker/runtime/frankenphp.Dockerfile, name: frankenphp, sapi: frankenphp, php: frankenphp php-cli }
        platform: [linux/amd64, linux/arm64]
    env:
      EXTENSIONS: bcmath exif gd imagick intl pcntl pdo_pgsql pgsql redis zip
      # The same extensions but intl, which both images build, so sharp/bin/php-extensions checks the image's own.
      # imagick and redis build from the release tags the image adds from GitHub, because pecl.php.net outages failed
      # this job.
      INSTALL: bcmath exif gd /usr/src/imagick pcntl pdo_pgsql pgsql /usr/src/phpredis zip
    steps:
      # For .github/actions/boot-image and sharp/bin/php-extensions. The build fetches its own context.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx with BuildKit from ghcr.io
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=ghcr.io/heyjordanparker/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      # The build's context is the commit's tree, which BuildKit fetches from GitHub by the commit's SHA, so a ref
      # moved after the push builds nothing else, as docker/github-builder's checksum pinned it.
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: ${{ matrix.host.file }}
          platforms: ${{ matrix.platform }}
          build-args: REGISTRY=ghcr.io/heyjordanparker
          provenance: mode=max
          sbom: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          outputs: type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true
      # A critical or high CVE that a fixed package resolves fails the job, so the digest is never uploaded and
      # IMAGE_TAGS tags none. aquasecurity/trivy-action's v0.35.0 and later are immutable releases, made after its tags
      # were rewritten to malware on 2026-03-19, and Trivy's v0.71.1 and later fix GHSA-mcj4-mphf-j9ff.
      - name: Scan the pushed image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the pushed image on its default command and request a page
        uses: ./.github/actions/boot-image
        with:
          image: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          sapi: ${{ matrix.host.sapi }}
      # rustup comes after the extensions, so they build as in the app's image. The builder is Docker's own, which reads
      # the pulled image, where Buildx's would not.
      - name: Install the extensions
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" php-sharp
          docker buildx build --builder default --load --build-arg INSTALL --tag php-sharp-extensions - <<'DOCKERFILE'
          FROM php-sharp
          COPY --from=ghcr.io/mlocati/php-extension-installer:2 /usr/bin/install-php-extensions /usr/local/bin/
          # A git source brings phpredis's liblzf submodule, which GitHub's tag archive leaves out.
          ADD https://github.com/Imagick/imagick.git#3.8.1 /usr/src/imagick
          ADD https://github.com/phpredis/phpredis.git#6.3.0 /usr/src/phpredis
          ARG INSTALL
          RUN install-php-extensions $INSTALL
          DOCKERFILE
      - name: Check that php -m lists each extension, and call into each one from ${{ matrix.host.php }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS is a list of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src php-sharp-extensions ${{ matrix.host.php }} sharp/bin/php-extensions $EXTENSIONS
      # The file is named by the digest and holds the commit the image was built from.
      - name: Keep the digest for IMAGE_TAGS
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      # Kept as long as release.yml's assets, as the repository's artifact retention sets.
      - name: Upload the digest for IMAGE_TAGS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.host.name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
  # Tags each host's two platform images as one image, and attests its provenance with the repository's identity,
  # which `gh attestation verify oci://ghcr.io/heyjordanparker/php-sharp:<tag> --repo heyJordanParker/php-sharp`
  # checks. The images are the ones the tagged commit's push run pushed, or the ones IMAGE pushed in this run.
  IMAGE_TAGS:
    name: IMAGE_TAGS (${{ matrix.host.name }})
    needs: [CHANGES, IMAGE]
    if: ${{ !failure() && !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        host:
          - { name: fpm, suffix: '' }
          - { name: frankenphp, suffix: -frankenphp }
    steps:
      - name: Download the platforms' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.host.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
          run-id: ${{ needs.CHANGES.outputs.images-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the platforms' images as one image
        id: tag
        working-directory: ${{ runner.temp }}/digests
        env:
          SUFFIX: ${{ matrix.host.suffix }}
        run: |
          image=ghcr.io/heyjordanparker/php-sharp
          tag="$image:${GITHUB_REF_NAME#v}$SUFFIX"
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done
          if [[ ${#sources[@]} != 2 ]]; then
            echo "::error::IMAGE pushed ${#sources[@]} platform images for $tag, not linux/amd64's and linux/arm64's."
            exit 1
          fi
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
