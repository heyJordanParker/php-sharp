name: PHP#
on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - master
  # The full run: every job runs every mode, where a pull request runs each mode once, on the build it is about. It runs
  # nightly on master's tip, on a dispatch, and on a release's bump pull request, as RELEASE_BUMP explains.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true
# mago's test-run profile builds without incremental state from a cache, as sharp/mago/Cargo.toml explains.
# sharp/docker/run and PHP_EXTENSIONS's docker run pass it into the container. MACOS, whose runner keeps its build
# folder, builds with it.
env:
  CARGO_INCREMENTAL: 0
jobs:
  # CI_PASSED is this workflow's one required check, so the workflow always runs, and LINUX, LINUX_PASSES,
  # LINUX_ZTS, HOSTS, PHP_EXTENSIONS and MACOS skip a change to documentation alone. docs/spec.md, README.md and
  # sharp/spec-self-test.md count as code, because LINUX compiles and runs their examples. LINUX_PASSES skips a change
  # only to Mago, its coverage script sharp/bin/coverage, the Composer plugin, the sharp/hosts, sharp/phpunit and
  # sharp/bench fixtures, tests or documentation:
  # a pass that drops a PHP# mark is a bug of the engine, and every pass failure a PHP# test found failed every other
  # mode with it. Every other path counts as the engine, so an input of the engine's build that no one listed, such as
  # ext/sharp/src or sharp/bin/build, runs the passes. The full run, nightly, dispatched or a release's bump, runs every
  # job in every mode, and its `full` output tells each job so.
  #
  # A tree runs the suites once, as bors's "not rocket science" rule tests the exact tree that lands once. A push to
  # master skips them when a pull request run passed them on its tree, as .github/actions/passed-tree explains, and
  # links that run. The nightly run skips a tree a full run already passed. A tag runs none of them: it publishes only
  # a tree whose full run passed all 9 test jobs, as release.yml does with Mago CI, so its MACOS never waits for the
  # Mac runners behind the release's Apple builds. That run is the bump's own, whose RELEASE_BUMP passed, or a nightly
  # or dispatched one. Another pull request's run isn't enough, because it runs each mode once, and CI_PASSED isn't,
  # because it also passes a change to documentation alone, whose suites skipped. A tag publishes the images its bump's
  # pull request pushed, as IMAGE explains, and CHANGES finds them.
  CHANGES:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      FULL: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        && startsWith(github.event.pull_request.title, 'chore: release')) && 'true' || '' }}
    outputs:
      code: ${{ steps.diff.outputs.code }}
      engine: ${{ steps.diff.outputs.engine }}
      full: ${{ env.FULL }}
      images: ${{ steps.images.outputs.run-id }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # LINUX, LINUX_ZTS, HOSTS, MACOS, and PHP_EXTENSIONS for each of its two images on each of its two runners.
      # LINUX_PASSES runs only for a change to the engine, and a run's success means it passed when it ran.
      - name: Find the pull request run that passed every suite on this tree
        id: passed
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request push
          passed: >-
            [.jobs[] | select(.conclusion == "success" and (.name == "LINUX" or .name == "LINUX_ZTS" or .name == "HOSTS"
            or .name == "MACOS" or (.name | startswith("PHP_EXTENSIONS"))))] | length == 8
      # The 9 test jobs: those 8 and LINUX_PASSES, which a full run always runs, as .github/actions/passed-tree checks.
      - name: Find the full run that passed all 9 test jobs on this tree
        id: full
        if: github.ref_type == 'tag' || github.event_name == 'schedule'
        uses: ./.github/actions/passed-tree
        with:
          events: schedule workflow_dispatch
          full: true
          on-master: ${{ github.ref_type == 'tag' }}
      # The bump's pull request runs in full, since its title sets `full` as RELEASE_BUMP's does, and its passed
      # RELEASE_BUMP marks it apart from another pull request's run. Its merge commit, the tagged one, has its tree.
      - name: Find the bump's pull request run that passed all 9 test jobs on this tree
        id: full_bump
        if: github.ref_type == 'tag'
        uses: ./.github/actions/passed-tree
        with:
          events: pull_request
          full: true
          on-master: ${{ github.ref_type == 'tag' }}
      - name: The suites don't run again
        if: github.ref_type == 'branch' && (steps.passed.outputs.run || steps.full.outputs.run)
        env:
          RUN: ${{ steps.passed.outputs.run || steps.full.outputs.run }}
        run: echo "::notice::This tree ran and passed every PHP# suite in $RUN, so they don't run again."
      - name: The tagged commit's tree passed a full run
        if: github.ref_type == 'tag'
        env:
          RUN: ${{ steps.full_bump.outputs.run || steps.full.outputs.run }}
        run: |
          if [[ -z $RUN ]]; then
            echo "::error::No full PHP# CI run, the bump's pull request's, nightly or dispatched, passed all 9 test jobs on commit $GITHUB_SHA's tree. Dispatch one on the commit with gh workflow run sharp.yml --ref master, and tag the commit once it passes."
            exit 1
          fi
          echo "Commit $GITHUB_SHA's tree passed all 9 test jobs in $RUN."
      # The newest pull request run on this tree whose 4 IMAGE jobs pushed their images. Each digest's file holds the
      # commit IMAGE built it from, the pull request's merge commit, which must have this commit's tree. When no run
      # pushed them, or their digests expired, or they were built from another tree, IMAGE builds them, and says so.
      - name: Find the bump's pull request run that pushed the images of this tree
        id: bump
        if: github.ref_type == 'tag'
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request
          passed: '[.jobs[] | select(.conclusion == "success" and (.name | startswith("IMAGE (")))] | length == 4'
      - name: The bump's images were built from this tree
        id: images
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.bump.outputs.run }}
        run: |
          build() {
            echo "::notice::$1 So IMAGE builds both images from commit $GITHUB_SHA."
            exit 0
          }
          if [[ -z $RUN ]]; then
            build "No pull request run pushed the images of commit $GITHUB_SHA's tree."
          fi
          id=${RUN##*/}
          kept=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("digest-")) and (.expired | not)) | .name' | wc -l)
          if [[ $kept != 4 ]]; then
            build "Run $RUN keeps $kept of its 4 images' digests: the others expired or were deleted."
          fi
          gh run download "$id" --pattern 'digest-*' --dir "$RUNNER_TEMP/digests"
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          while IFS= read -r -d '' file; do
            commit=$(< "$file")
            built=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)
            if [[ $built != "$tree" ]]; then
              build "Run $RUN built image sha256:${file##*/} from commit $commit, whose tree $built isn't commit $GITHUB_SHA's tree $tree."
            fi
            echo "Image sha256:${file##*/} was built from commit $commit, whose tree is $tree."
          done < <(find "$RUNNER_TEMP/digests" -type f -print0)
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice::IMAGE_TAGS tags the images run $RUN pushed from commit $GITHUB_SHA's tree, and IMAGE builds none."
      - name: Find changes outside documentation, and changes to the engine
        id: diff
        if: github.ref_type != 'tag' && !steps.passed.outputs.run && !steps.full.outputs.run
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ $FULL ]]; then
            echo code=true >> "$GITHUB_OUTPUT"
            echo engine=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"
          code=false
          engine=false
          while read -r file; do
            case "$file" in
              docs/spec.md|README.md|sharp/spec-self-test.md) code=true ;;
              .circleci/*|.github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|*.md|*.rst|docs/*) ;;
              EXTENSIONS|LICENSE|NEWS|UPGRADING|UPGRADING.INTERNALS) ;;
              *) code=true ;;
            esac
            case "$file" in
              sharp/mago/*|sharp/bin/coverage|sharp/composer/*|sharp/hosts/*|sharp/phpunit/*|sharp/bench/*|*/tests/*) ;;
              .circleci/*|.github/CODEOWNERS|.github/ISSUE_TEMPLATE/*|*.md|*.rst|docs/*) ;;
              EXTENSIONS|LICENSE|NEWS|UPGRADING|UPGRADING.INTERNALS) ;;
              *) engine=true ;;
            esac
          done < "$RUNNER_TEMP/changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
  LINUX:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM these copies, which base-images.yml makes of the public
    # registry's images, so the pulls never meet an anonymous quota.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      - name: Keep local sources out of Cargo.lock
        run: |
          if git grep -nE '(path|git)\+file://' -- '*Cargo.lock'; then
            echo "::error::A committed Cargo.lock names a local source. Keep a [patch] in an untracked .cargo/config.toml."
            exit 1
          fi
      # sharp/bin/test builds mago with sharp/bin/build-mago, inside the image, where CARGO_HOME and RUSTUP_HOME are
      # sharp/build/cargo and sharp/build/rustup. Every Linux job that builds mago shares these caches.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
          save: ${{ needs.CHANGES.outputs.full }}
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP#
        run: sharp/bin/test --linux --opcache --repeat --jit --census --spec --differential --phpunit
      - name: Check the standard library with the checker sharp/bin/test built
        run: |
          # shellcheck disable=SC2016 # The image's sh expands $(uname -m), to its own architecture.
          sharp/docker/run sh -c '"sharp/build/linux-$(uname -m)/mago/test-run/mago" --colors never --workspace sharp/composer analyze --minimum-fail-level note'
      # The run without opcache shows that plain PHP still behaves as before. The full run adds the opcache modes.
      - name: Test upstream
        run: sharp/bin/test --linux --upstream ${{ needs.CHANGES.outputs.full == 'true' && '--opcache' || '' }}
      - name: Verify generated files are up to date
        run: |
          sharp/docker/run scripts/dev/credits
          sharp/docker/run scripts/dev/genfiles
          sharp/docker/run scripts/gdb/debug_gdb_scripts_gen.php
          sharp/docker/run Zend/zend_vm_gen.php
          sharp/docker/run ext/tokenizer/tokenizer_data_gen.php
          sharp/docker/run build/gen_stub.php -f --generate-optimizer-info --verify
          # Use the -a flag for a bug in git 2.46.0, which doesn't consider changed -diff files.
          git add . -N && git diff -a --exit-code
      - name: Verify the native interface is generated from the standard library's extern declarations
        run: |
          sharp/docker/run sharp/bin/native
          git diff --exit-code ext/sharp/sharp_native.h sharp/composer/native.php
      - name: Verify the built-in function declarations are generated from php-8-stubs by rules whose every row passes
        run: |
          sharp/docker/run sharp/bin/builtins --self-test
          sharp/docker/run sharp/bin/builtins
          git diff --exit-code sharp/composer/library/Sharp/Internal/Builtins.sharp
      - name: Verify ext/sharp/sharp_unit.h, with its sharp_kind, SHARP_T_ tokens and SHARP_UNIT_ABI, is the header sharp/mago generates from Zend/zend_ast.h and Zend/zend_language_parser.h
        run: |
          sharp/docker/run php sharp/mago/scripts/regen-sharp-kinds.php Zend/zend_ast.h Zend/zend_language_parser.h | diff -u sharp/mago/crates/sharp-bridge/src/kind.rs -
          # cargo builds nothing for the test-run mago sharp/bin/test built, and names the out_dir of the bridge it links.
          # `-p mago-sharp-bridge` resolves other features, so it built a second bridge and its dependencies beside it.
          sharp/docker/run sharp/bin/build-mago --message-format=json > "$RUNNER_TEMP/build.json"
          header="$(jq -r 'select(.reason == "build-script-executed" and (.package_id | contains("mago-sharp-bridge"))) | .out_dir | ltrimstr("/src/")' "$RUNNER_TEMP/build.json")/sharp_unit.h"
          diff -u ext/sharp/sharp_unit.h "$header"
  # Each of PHP's 16 optimizer passes alone, on the build LINUX tests, so a pass that drops a PHP# mark cannot hide
  # behind another pass. CHANGES runs it for a change to the engine's own code, and the full run runs it.
  LINUX_PASSES:
    needs: CHANGES
    if: needs.CHANGES.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM base-images.yml's copies, as LINUX does.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      # sharp/bin/test builds mago before it runs the passes, as LINUX does.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
          save: ${{ needs.CHANGES.outputs.full }}
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP# with each optimizer pass alone
        run: sharp/bin/test --linux --passes
  # The thread-safe build, which FrankenPHP and Octane on Swoole run, with the opcache and both JITs those hosts run,
  # since Linux has a thread-safe JIT. The full run adds the file cache and the passes alone.
  LINUX_ZTS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM base-images.yml's copies, as LINUX does.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      # sharp/bin/test --zts builds mago into the other build's folder, sharp/build/<os>-<arch>/mago, as LINUX does.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
          save: ${{ needs.CHANGES.outputs.full }}
      - name: Build
        run: sharp/bin/build --linux --zts
      - name: Test PHP#
        run: sharp/bin/test --linux --zts --repeat --jit ${{ needs.CHANGES.outputs.full == 'true' && '--opcache --passes' || '' }}
  # The fixture in sharp/hosts, served from php-fpm and from FrankenPHP's worker mode. HOSTS builds php-fpm, the
  # thread-safe engine FrankenPHP is built against with Go, and mago itself, beside LINUX and LINUX_ZTS, so it never
  # waits for their tests.
  HOSTS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    # sharp/docker/run builds the image FROM base-images.yml's copies, as LINUX does.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"
      # sharp/bin/hosts builds mago before it compiles the fixture, as sharp/bin/test does in LINUX.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
          save: ${{ needs.CHANGES.outputs.full }}
      - name: Go module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/go/pkg/mod
          key: SHARP_HOSTS_GO-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile') }}
      - name: Build php-fpm
        run: sharp/bin/build --linux
      - name: Build and install the thread-safe engine
        run: sharp/bin/build --linux --zts
      - name: Serve the fixture from php-fpm and FrankenPHP
        run: sharp/bin/hosts --linux
  # Each runtime image, with the extensions a typical Laravel app installs on top, installed the way such an app's
  # Dockerfile does. The engine changes PHP's internal structures, so an extension can stop building or loading.
  # The images are the only -O2 builds, where GCC finds -Wmaybe-uninitialized and libcurl's type checks, and they build
  # with --enable-werror. So each builds on amd64 and on arm64, as IMAGE builds them for a tag, and a warning one
  # architecture alone finds fails the pull request instead of the release.
  PHP_EXTENSIONS:
    name: PHP_EXTENSIONS (${{ matrix.host.file }}, ${{ matrix.host.php }}, ${{ matrix.runner }})
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    # One host's failure leaves the other's result in the log.
    strategy:
      fail-fast: false
      matrix:
        host:
          - { file: sharp/docker/runtime/Dockerfile, php: php, sapi: fpm-fcgi }
          - { file: sharp/docker/runtime/frankenphp.Dockerfile, php: frankenphp php-cli, sapi: frankenphp }
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    # The image builds FROM base-images.yml's copies at the digests the Dockerfiles pin, as IMAGE's does.
    env:
      REGISTRY: ghcr.io/heyjordanparker
      EXTENSIONS: bcmath exif gd imagick intl pcntl pdo_pgsql pgsql redis zip
      # The same extensions, with imagick and redis built from the release tags the image adds from GitHub, because
      # pecl.php.net outages failed this job.
      INSTALL: bcmath exif gd /usr/src/imagick intl pcntl pdo_pgsql pgsql /usr/src/phpredis zip
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build the image
        run: git archive HEAD | docker build --build-arg REGISTRY --file "${{ matrix.host.file }}" --tag php-sharp -
      # A critical or high CVE that a fixed package resolves fails the build, so it is fixed before a tag, which takes
      # only a commit whose PHP_EXTENSIONS passed on master, and IMAGE scans what it pushes again.
      # aquasecurity/trivy-action's v0.35.0 and later are immutable releases, made after its tags were rewritten to
      # malware on 2026-03-19, and Trivy's v0.71.1 and later fix GHSA-mcj4-mphf-j9ff.
      - name: Scan the image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: php-sharp
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the image on its default command and request a page
        uses: ./.github/actions/boot-image
        with:
          image: php-sharp
          sapi: ${{ matrix.host.sapi }}
      # rustup comes after the extensions, so they build as in the app's image, and lets sharp/bin/test build mago.
      - name: Install the extensions
        run: |
          docker build --build-arg INSTALL --tag php-sharp-extensions - <<'DOCKERFILE'
          FROM php-sharp
          COPY --from=ghcr.io/mlocati/php-extension-installer:2 /usr/bin/install-php-extensions /usr/local/bin/
          # A git source brings phpredis's liblzf submodule, which GitHub's tag archive leaves out.
          ADD https://github.com/Imagick/imagick.git#3.8.1 /usr/src/imagick
          ADD https://github.com/phpredis/phpredis.git#6.3.0 /usr/src/phpredis
          ARG INSTALL
          RUN install-php-extensions $INSTALL
          RUN apt-get update && apt-get install -y --no-install-recommends rustup && apt-get dist-clean
          DOCKERFILE
      - name: Check that php -m lists each extension, and call into each one from ${{ matrix.host.php }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS is a list of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src php-sharp-extensions ${{ matrix.host.php }} sharp/bin/php-extensions $EXTENSIONS
      # The full run tests PHP# with the extensions loaded, in every mode. A pull request runs those modes on LINUX's
      # build, and each time this run failed before it moved to the full run, LINUX failed with it.
      - name: Rust and Mago caches
        if: needs.CHANGES.outputs.full == 'true'
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
          save: ${{ needs.CHANGES.outputs.full }}
      # The container mounts the tree and its caches as sharp/docker/run does.
      - name: Test PHP# with the extensions loaded
        if: needs.CHANGES.outputs.full == 'true'
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --ulimit stack=8388608:-1 \
            --env CARGO_HOME=/src/sharp/build/cargo \
            --env RUSTUP_HOME=/src/sharp/build/rustup \
            --env CARGO_INCREMENTAL \
            --env XDG_CACHE_HOME=/src/sharp/build/cache \
            --volume "$PWD:/src" \
            --workdir /src \
            php-sharp-extensions sharp/bin/test --installed --opcache --repeat --passes --jit
  # On a pull request, the checks only macOS can fail: the engine's build, mago compile and the plain run on a disk that
  # ignores case, the census and the differential, and both JITs, because no other pull request job runs on arm64. Linux
  # runs every other mode on the same tests, and the full run runs them all here as well.
  MACOS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true'
    # The self-hosted Mac runners run it, except for a pull request from another repository: this one is public, and
    # head.repo.fork can't tell, because it is itself a fork of php/php-src. A job never installs on them, so they
    # check that Homebrew already has the build's formulae and build without ccache. Only the runner labelled
    # macos-arm64-suite takes it, so suites queue one at a time: the runners share one Mac, and three suites at once
    # each ran past the 60-minute limit. That Mac also builds the work the suite checks, so the full run's suite
    # alone takes 53 minutes at moderate load and ran past 60 under a build. The limit leaves room for that, as
    # php-src's own macOS jobs in test-suite.yml leave 180.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-suite' || 'macos-latest' }}
    timeout-minutes: 120
    env:
      FORMULAE: autoconf bison curl re2c pkgconf icu4c libiconv libpq libsodium libzip oniguruma
      # The runner keeps the build folder between jobs, so mago keeps the incremental state its test-run profile builds
      # with, which a restored cache would let age.
      CARGO_INCREMENTAL: 1
    steps:
      # actions/checkout's clean deletes sharp/build. Each job on the self-hosted Macs keeps it instead, as
      # .github/actions/clean-kept-build explains, so the engine and mago rebuild only what changed, which takes
      # seconds, where a build from nothing took 19 minutes.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build
      - name: brew
        if: runner.environment == 'github-hosted'
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew install $FORMULAE
      - name: Homebrew has the build's formulae
        if: runner.environment == 'self-hosted'
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE
      - name: ccache
        if: runner.environment == 'github-hosted'
        uses: ./.github/actions/ccache
        with:
          name: SHARP_MACOS
      # ext/sharp/rust-toolchain.toml pins the toolchain the extension and mago build with.
      - name: show the Rust toolchain on PATH
        working-directory: ext/sharp
        run: |
          type -a rustup rustc cargo
          rustc --version
          cargo --version
      - name: Build
        run: sharp/bin/build
      - name: Test PHP#
        run: sharp/bin/test --jit --census --differential ${{ needs.CHANGES.outputs.full == 'true' && '--opcache --repeat --passes' || '' }}
      - name: Test upstream
        if: needs.CHANGES.outputs.full == 'true'
        run: sharp/bin/test --upstream --opcache
  # The checks that keep the release pipeline on pinned code. An action that is not ours runs only at a full commit
  # SHA, so a moved tag can't change what runs. No Dockerfile under sharp/docker names a `# syntax=` frontend, which
  # BuildKit pulls from Docker Hub with no login (#86). actionlint passes over every workflow, with the runner labels
  # and the rules .github/actionlint.yaml sets for php-src's own files.
  WORKFLOWS:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action that is not ours is pinned to a full commit SHA
        run: |
          if git grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' -- .github/workflows .github/actions \
            | grep -vE 'uses:[[:space:]]+(\./|[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)|docker://[^@[:space:]]+@sha256:[0-9a-f]{64}([[:space:]]|$))'; then
            echo "::error::Pin each action above to the full commit SHA its release tag names, with the release as a comment: uses: actions/checkout@<40-character SHA> # v7.0.1."
            exit 1
          fi
      - name: No Dockerfile under sharp/docker names a syntax frontend
        run: |
          if git grep -nE '^#[[:space:]]*syntax[[:space:]]*=' -- sharp/docker; then
            echo "::error::Remove each # syntax= line above. BuildKit pulls the frontend it names from Docker Hub with no login (#86), and builds with its own Dockerfile frontend without one."
            exit 1
          fi
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint"'
  # A release's pull request, whose title starts with "chore: release", changes only what the bump writes: what
  # sharp/mago/scripts/set-version.php writes for the new version, PHP_SHARP_VERSION in ext/sharp/php_sharp.h and the
  # version Zend/tests/sharp/ri_sharp.phpt expects, and the release's section of sharp/CHANGELOG.md. Its title also
  # makes its run the full run, which CHANGES accepts for the tag on its merge commit, whose tree is the run's, when
  # this job passed in it. Once it passes, RELEASE_ASSETS and IMAGE build the release's assets beside the suites, and
  # the tag on the bump's merge commit publishes them. CI_PASSED needs all three, so a bump merges only once every
  # asset is built, and the tag never finds half of them. A pull request with another title skips them.
  RELEASE_BUMP:
    if: "github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore: release')"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The bump, made again on the base, must give the pull request's tree.
      - name: The pull request changes only what the version bump writes, and the changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE"
          version() { git show "$1:sharp/mago/Cargo.toml" | sed -n '/^version = /{s/^version = "\(.*\)"$/\1/p;q}'; }
          old=$(version "$BASE")
          new=$(version "$GITHUB_SHA")
          if [[ $old == "$new" ]]; then
            echo "::error::sharp/mago/Cargo.toml's version is still $old. Run php sharp/mago/scripts/set-version.php <version>."
            exit 1
          fi
          git switch --quiet --detach "$BASE"
          php sharp/mago/scripts/set-version.php "$new"
          sed -i "s/^#define PHP_SHARP_VERSION \"${old//./\\.}\"\$/#define PHP_SHARP_VERSION \"$new\"/" ext/sharp/php_sharp.h
          sed -i "s/^Version => ${old//./\\.}\$/Version => $new/" Zend/tests/sharp/ri_sharp.phpt
          git checkout "$GITHUB_SHA" -- sharp/CHANGELOG.md
          git add --all
          if ! git diff --cached --quiet "$GITHUB_SHA"; then
            git diff --cached -R "$GITHUB_SHA"
            echo "::error::The pull request changes more than the bump from $old to $new and sharp/CHANGELOG.md: the diff above is what it changes beyond them. Move that change to a pull request of its own."
            exit 1
          fi
          echo "The pull request changes only the bump from $old to $new and sharp/CHANGELOG.md."
      # The release's section is new text, so the changelog loses only the old link of [Unreleased].
      - name: sharp/CHANGELOG.md gains the release's section and links, and loses nothing else
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          version() { git show "$1:sharp/mago/Cargo.toml" | sed -n '/^version = /{s/^version = "\(.*\)"$/\1/p;q}'; }
          old=$(version "$BASE")
          new=$(version "$GITHUB_SHA")
          compare="https://github.com/$GITHUB_REPOSITORY/compare"
          git diff --unified=0 "$BASE" "$GITHUB_SHA" -- sharp/CHANGELOG.md > "$RUNNER_TEMP/changelog.diff"
          sed -n '/^---/d; s/^-//p' "$RUNNER_TEMP/changelog.diff" > "$RUNNER_TEMP/removed"
          sed -n '/^+++/d; s/^+//p' "$RUNNER_TEMP/changelog.diff" > "$RUNNER_TEMP/added"
          failed=false
          if [[ $(cat "$RUNNER_TEMP/removed") != "[Unreleased]: $compare/v$old...HEAD" ]]; then
            echo "::error::sharp/CHANGELOG.md may remove only the line [Unreleased]: $compare/v$old...HEAD. It removes:"
            cat "$RUNNER_TEMP/removed"
            failed=true
          fi
          for line in "[Unreleased]: $compare/v$new...HEAD" "[$new]: $compare/v$old...v$new"; do
            if ! grep -qxF "$line" "$RUNNER_TEMP/added"; then
              echo "::error::sharp/CHANGELOG.md doesn't add the line $line."
              failed=true
            fi
          done
          if ! grep -qE "^## \[${new//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" "$RUNNER_TEMP/added"; then
            echo "::error::sharp/CHANGELOG.md doesn't add the heading ## [$new] - <YYYY-MM-DD>."
            failed=true
          fi
          if $failed; then
            exit 1
          fi
          echo "sharp/CHANGELOG.md adds the $new section and its links."
  # The bump's Mago binaries, their attestations, Mago's source archives and their SHA-256s, which release.yml builds
  # and the tag on the bump's merge commit publishes, as release.yml explains. A called workflow's jobs may ask only
  # for permissions its caller grants, and release.yml's release job, which runs only for a tag or a dispatch, asks
  # for contents: write. A pull request from another repository gets a token that can't attest, and the Macs run only
  # this repository's code, so only a bump from this repository builds them.
  RELEASE_ASSETS:
    needs: RELEASE_BUMP
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/release.yml
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
  # This workflow's one required check. A job skipped by its `if` reports one check under the job's
  # name, so CI_PASSED stands in for every job it needs. It fails when any of them failed or was
  # cancelled. mago.yml's ci-passed is the other required check, and its plain-php job runs mago
  # from Composer on plain PHP.
  CI_PASSED:
    if: always()
    needs:
      [CHANGES, LINUX, LINUX_PASSES, LINUX_ZTS, HOSTS, PHP_EXTENSIONS, MACOS, WORKFLOWS, RELEASE_BUMP, RELEASE_ASSETS, IMAGE]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Every job passed, or skipped a change that doesn't need it
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: LINUX, LINUX_PASSES, LINUX_ZTS, HOSTS, PHP_EXTENSIONS, MACOS, RELEASE_BUMP, RELEASE_ASSETS, IMAGE
          jobs: ${{ toJSON(needs) }}
      # A red nightly run fails no pull request, so it opens one issue, or comments on the one still open, and the next
      # tag can't wait on a failure nobody saw.
      - name: Open an issue for the failed nightly run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly PHP# CI run failed"
          body="The nightly run on master's $GITHUB_SHA failed: $RUN"
          issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n $issue ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      # Master's full run's jobs saved their targets when they ended, so this job, which needs them all, deletes the
      # ones the new targets replaced. No other run saves one.
      - name: git checkout
        if: always() && needs.CHANGES.outputs.full == 'true' && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Delete the Mago target caches this run replaced
        if: always() && needs.CHANGES.outputs.full == 'true' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/mago-cache-prune
  COMPOSER:
    needs: [CHANGES, LINUX, MACOS]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency: composer-${{ github.ref }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install splitsh-lite
        uses: ./.github/actions/splitsh-lite
      - name: Split sharp/composer
        run: splitsh-lite --prefix=sharp/composer --target=refs/heads/composer
      - name: git checkout heyJordanParker/php-sharp-composer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/php-sharp-composer
          ssh-key: ${{ secrets.PHP_SHARP_COMPOSER_DEPLOY_KEY }}
          path: sharp/build/php-sharp-composer
          fetch-depth: 0
      - name: Push the split
        working-directory: sharp/build/php-sharp-composer
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer
          git push origin "FETCH_HEAD:$GITHUB_REF"
      # A tag's heyJordanParker/mago-sharp version pins the SHA-256 of every release asset, which exist only once
      # release.yml has built them, so release.yml's COMPOSER job pushes that tag.
      - name: Split sharp/mago
        if: github.ref_type == 'branch'
        run: splitsh-lite --prefix=sharp/mago --target=refs/heads/mago
      - name: git checkout heyJordanParker/mago-sharp
        if: github.ref_type == 'branch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp
          fetch-depth: 0
      # The push never forces, so a mistake can't rewind the published package. splitsh-lite starts the split at
      # the commit that added sharp/mago, so a branch the mirror had before the move isn't in the split, and its
      # push is skipped until that branch is rewritten once. git subtree split would keep that history, but it
      # walks all of Mago's history in shell recursion and took more than 8 minutes without finishing.
      - name: Push the split
        if: github.ref_type == 'branch'
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          if git rev-parse -q --verify "origin/$GITHUB_REF_NAME" > /dev/null \
            && ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" FETCH_HEAD; then
            echo "::warning::The split of sharp/mago does not contain heyJordanParker/mago-sharp's $GITHUB_REF_NAME, so pushing it would rewrite that branch. The push is skipped."
            exit 0
          fi
          git push origin "FETCH_HEAD:$GITHUB_REF"
  # One image per host, under one name: php-fpm's as <version>, FrankenPHP's as <version>-frankenphp, as
  # docker-library names 8.5-fpm and 8.5-zts. Each platform builds on a runner of its own architecture and pushes
  # its image by digest, with BuildKit's provenance and SBOM attestations, and IMAGE_TAGS tags the two as one.
  # BuildKit, its SBOM scanner and the bases are base-images.yml's copies in ghcr.io at pinned digests, pulled after
  # the login, so no pull is an anonymous Docker Hub pull (#86). It runs on the bump's pull request once RELEASE_BUMP
  # passed, for a pull request from this repository as RELEASE_ASSETS does, so the tag tags the images it pushed, and
  # on a tag only when CHANGES found none.
  IMAGE:
    name: IMAGE (${{ matrix.host.file }}, ${{ matrix.platform }})
    if: >-
      ${{ !failure() && !cancelled() && (github.ref_type == 'tag' && !needs.CHANGES.outputs.images
      || needs.RELEASE_BUMP.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [CHANGES, RELEASE_BUMP]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        host:
          - { file: sharp/docker/runtime/Dockerfile, name: fpm, sapi: fpm-fcgi }
          - { file: sharp/docker/runtime/frankenphp.Dockerfile, name: frankenphp, sapi: frankenphp }
        platform: [linux/amd64, linux/arm64]
    steps:
      # Only for .github/actions/boot-image. The build fetches its own context.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx with BuildKit from ghcr.io
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=ghcr.io/heyjordanparker/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      # The build's context is the commit's tree, which BuildKit fetches from GitHub by the commit's SHA, so a ref
      # moved after the push builds nothing else, as docker/github-builder's checksum pinned it. On the bump's pull
      # request, that commit is the merge commit, whose tree the tag checks.
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: ${{ matrix.host.file }}
          platforms: ${{ matrix.platform }}
          build-args: REGISTRY=ghcr.io/heyjordanparker
          provenance: mode=max
          sbom: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          outputs: type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true
      # The image IMAGE_TAGS publishes is scanned and started itself, on its own platform, as PHP_EXTENSIONS scans and
      # starts the one it builds. A digest that fails either is never uploaded, so IMAGE_TAGS tags none.
      - name: Scan the pushed image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the pushed image on its default command and request a page
        uses: ./.github/actions/boot-image
        with:
          image: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          sapi: ${{ matrix.host.sapi }}
      # The file is named by the digest and holds the commit the image was built from, whose tree the tag checks.
      - name: Keep the digest for IMAGE_TAGS
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      # As long as release.yml keeps the assets, so the bump's tag still finds them after a slow review.
      - name: Upload the digest for IMAGE_TAGS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.host.name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 90
  # Tags each host's two platform images as one image, and attests its provenance with the repository's identity,
  # which `gh attestation verify oci://ghcr.io/heyjordanparker/php-sharp:<tag> --repo heyJordanParker/php-sharp`
  # checks. The images are the ones the run CHANGES found pushed, or the ones IMAGE pushed in this run.
  IMAGE_TAGS:
    name: IMAGE_TAGS (${{ matrix.host.name }})
    needs: [CHANGES, IMAGE]
    if: ${{ !failure() && !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        host:
          - { name: fpm, suffix: '' }
          - { name: frankenphp, suffix: -frankenphp }
    steps:
      - name: Download the platforms' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.host.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
          run-id: ${{ needs.CHANGES.outputs.images || github.run_id }}
          github-token: ${{ github.token }}
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the platforms' images as one image
        id: tag
        working-directory: ${{ runner.temp }}/digests
        env:
          SUFFIX: ${{ matrix.host.suffix }}
        run: |
          image=ghcr.io/heyjordanparker/php-sharp
          tag="$image:${GITHUB_REF_NAME#v}$SUFFIX"
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done
          if [[ ${#sources[@]} != 2 ]]; then
            echo "::error::IMAGE pushed ${#sources[@]} platform images for $tag, not linux/amd64's and linux/arm64's."
            exit 1
          fi
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
