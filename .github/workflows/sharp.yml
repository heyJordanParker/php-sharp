name: PHP#
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # ASAN alone, nightly on master's tip.
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
# A pull request's new commit cancels its run in progress. Master runs one push at a time, and only the newest push
# waits, since its tree holds every merge before it, so the Mac never tests a tree master already moved past. A
# schedule runs in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # CI_PASSED is this workflow's one required check, so the workflow always runs, and every suite skips a change to
  # documentation alone. docs/spec.md, README.md and sharp/spec-self-test.md count as code, because SPEC compiles and
  # runs their examples. sharp/bin/check --changes holds these rules, so sharp/bin/check on a machine chooses its gates
  # as this job does.
  #
  # A pull request runs the Linux suites, each job on 4 cores. A release's pull request, whose sharp/mago/Cargo.toml
  # version has no tag yet, also runs what needs the Mac, the runtime image and the release assets, so every check that
  # guards a release runs before the merge, on the tree that merges. GitHub runs 20 of the account's hosted jobs at once,
  # across all its repositories, and a job past them waits: a pull request's runs hold 14 at most, and a release's 18.
  #
  # A tree runs the checks once, as bors's "not rocket science" rule tests the exact tree that lands once. A push to
  # master runs none of them when a pull request's run passed CI_PASSED on its tree, as .github/actions/passed-tree
  # explains, and links that run: it saves the caches every pull request's run restores and, for a release, publishes
  # what that run built. A push whose tree no pull request's run passed runs every check, the Mac's among them, as the
  # check of the merge, and a release publishes what that push builds. A red push opens an issue, as CI_PASSED does,
  # for a pull request that fixes it forward.
  CHANGES:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      bump: ${{ steps.diff.outputs.bump }}
      code: ${{ steps.diff.outputs.code }}
      passed: ${{ steps.passed.outputs.run }}
      version: ${{ steps.diff.outputs.version }}
      # A release's pull request, or a push whose tree no pull request's run passed, runs every check.
      full: >-
        ${{ (github.event_name == 'pull_request' && steps.diff.outputs.bump == 'true'
        || github.event_name == 'push' && !steps.passed.outputs.run) && 'true' || '' }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .github/actions/passed-tree finds the runs that passed a tree by this notice. A pull request's run checks out the
      # pull request merged into master, so the tree it tests is that merge's, not its head's.
      - name: Name the tree this run tests
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"
      - name: Find the pull request run that passed this tree
        id: passed
        if: github.event_name == 'push'
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request
          passed: any(.jobs[]; .name == "CI_PASSED" and .conclusion == "success")
      - name: The checks don't run again
        if: steps.passed.outputs.run
        env:
          RUN: ${{ steps.passed.outputs.run }}
        run: echo "::notice::This tree ran and passed every PHP# check in $RUN, so none runs again."
      # A push's changes start at the commit of master's newest push run that GitHub didn't cancel, so a merge whose
      # pending run a later push replaced still counts, and a red run's issue names every commit it tests. Pushes run
      # one at a time, so every earlier run has ended. Only an earlier run counts, so a rerun of an old run diffs from
      # the run before it, as its first attempt did. With none among the last 100 runs, every job runs.
      - name: Find the commit of master's last push run that ran
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API answered this list with HTTP 502 once and failed the push run (44132260911), so it retries, as
          # .github/actions/setup-lean retries Lean's install.
          for attempt in 1 2 3; do
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sharp.yml/runs?branch=master&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .id < (env.GITHUB_RUN_ID | tonumber))][0].head_sha // empty'); then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "::error::GitHub's API refused the list of master's push runs 3 times. The output above names the cause."
              exit 1
            fi
            echo "Retrying the list of master's push runs in $((attempt * 15)) seconds (retry $attempt of 2)" >&2
            sleep $((attempt * 15))
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "This push's changes start at ${sha:-no commit, so every job runs}."
      # A change is a release's bump while origin has no tag for sharp/mago/Cargo.toml's version, as sharp/bin/check
      # --changes prints it. So a release whose push failed is still a bump in the next pull request, and its merge
      # publishes it, with no second bump. With no base, the change starts at the empty tree, so every job runs.
      - name: Find changes outside documentation, and a release's bump
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
        run: |
          if [[ -n $BASE ]]; then
            git fetch --depth=1 origin "$BASE"
          else
            BASE=$(git hash-object -t tree /dev/null)
          fi
          sharp/bin/check --changes "$BASE" | tee -a "$GITHUB_OUTPUT"
  # The run's one Linux build, which every Linux suite runs on: the engine, its install and mago, which the suites run
  # with --no-build. Each of the 8 suite jobs built them itself for 2 to 5 minutes on release pull request #363's run,
  # where the bump rebuilt every Mago crate in each, so a run built the same code 8 times. The suites wait for it, so its
  # minutes are on every suite's path, and it keeps them few: .github/actions/linux-build builds the engine through
  # ccache in the sharp/docker image, which sharp/docker/run passes CC and CXX into, with its folder at
  # sharp/build/cache/ccache under the XDG_CACHE_HOME sharp/docker/run sets, while master's Mago target restores, and
  # sharp/bin/build-mago then builds only what changed since master's build, with every test binary, as mago.yml's build
  # job builds them on the same target. It also runs the checks of generated files, which took 18 seconds on release
  # pull request #379's run, since one of them reads the header the build generates: a job starts once every job it
  # needs has ended, so the suites wait for them too.
  #
  # On each push to master it saves the ccache, the Rust toolchain and crates, and the target, which every pull
  # request's run restores, as .github/actions/mago-cache explains. A cache only its own ref's runs would restore is no
  # use to the next pull request, so only master saves. So it runs on every push to master, even one whose tree a pull
  # request's run passed, but for the push that publishes a release, which builds nothing, so the next push saves them.
  # CI_PASSED, which runs after it, deletes the caches it replaced.
  BUILD_LINUX:
    needs: CHANGES
    if: >-
      needs.CHANGES.outputs.code == 'true'
      && !(needs.CHANGES.outputs.passed && needs.CHANGES.outputs.bump == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sharp/bin/build-mago builds inside the image, where CARGO_HOME and RUSTUP_HOME are sharp/build/cargo and
      # sharp/build/rustup, which the Rust cache holds.
      - name: Build and install the engine, and restore the Rust and Mago caches
        uses: ./.github/actions/linux-build
        with:
          save: ${{ github.event_name == 'push' }}
      - name: Build mago and its test binaries
        run: sharp/docker/run sharp/bin/build-mago --quiet
      # What the suites run: the CLI, phpdbg, which run-tests.php finds beside it for the tests that need it, the install
      # sharp/bin/hosts builds FrankenPHP against, and mago. An artifact keeps no file's mode, so the files travel in a
      # tar, compressed here, since Actions would compress them on one thread.
      - name: Pack the engine and mago for the suites
        run: |
          build="sharp/build/linux-$(uname -m)"
          tar --zstd -cf "$RUNNER_TEMP/build.tar.zst" "$build/sapi/cli/php" "$build/sapi/phpdbg/phpdbg" "$build/install" \
            "$build/mago/debug/mago"
      - name: Upload the engine and mago for the suites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Verify the generated files, and that no Cargo.lock names a local source
        run: sharp/bin/check generated

  # LINUX runs the PHP# suite on the thread-safe engine FrankenPHP runs, in two slices, each without opcache, in shared
  # memory twice per process, and under the tracing JIT production runs with the opcache. The slices balance by the
  # seconds sharp/baseline/seconds lists, and the one that weighs least runs mago convert's whole-project proof, as
  # sharp/bin/test explains. The second slice also runs the census, the differential and PHPUnit.
  LINUX:
    name: LINUX (${{ matrix.shard }}/2)
    needs: [CHANGES, BUILD_LINUX]
    if: needs.CHANGES.outputs.code == 'true' && !needs.CHANGES.outputs.passed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # sharp/docker/run pulls the image base-images.yml builds from ghcr.io.
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Download BUILD_LINUX's engine and mago
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Test PHP#
        run: >-
          sharp/bin/test --linux --no-build --shard ${{ matrix.shard }}/2
          ${{ matrix.shard == 2 && '--census --differential --phpunit' || '' }}
  # The upstream tests without opcache, compared with sharp/baseline/linux, so plain PHP still behaves as before, and
  # sharp/bin/spec's self-test. Each took 155 and 54 seconds on release pull request #379's run, where LINUX (1/2), which
  # ran the self-test after its slice, took 377 seconds, the longest suite job.
  UPSTREAM:
    needs: [CHANGES, BUILD_LINUX]
    if: needs.CHANGES.outputs.code == 'true' && !needs.CHANGES.outputs.passed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Download BUILD_LINUX's engine and mago
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Test upstream
        run: sharp/bin/test --linux --no-build --upstream
      # sharp/bin/test --spec runs the self-test with every example, which SPEC checks in slices, so this runs the
      # self-test alone, with BUILD_LINUX's mago, as sharp/bin/test passes it.
      - name: Check sharp/bin/spec's rules on sharp/spec-self-test.md
        run: |
          build="sharp/build/linux-$(uname -m)"
          sharp/docker/run env TEST_MAGO_EXECUTABLE="/src/$build/mago/debug/mago" "$build/sapi/cli/php" sharp/bin/spec --self-test
  # Every code example in docs/spec.md and README.md, compared with sharp/baseline/spec, in four slices of the examples.
  # Each slice runs sharp/bin/spec on BUILD_LINUX's engine and mago, as sharp/bin/test --spec does. Five slices checked
  # their examples in 123 to 161 seconds on release pull request #343's run.
  SPEC:
    name: SPEC (${{ matrix.shard }}/4)
    needs: [CHANGES, BUILD_LINUX]
    if: needs.CHANGES.outputs.code == 'true' && !needs.CHANGES.outputs.passed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Download BUILD_LINUX's engine and mago
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Check the examples of docs/spec.md and README.md
        run: |
          build="sharp/build/linux-$(uname -m)"
          sharp/docker/run env TEST_MAGO_EXECUTABLE="/src/$build/mago/debug/mago" "$build/sapi/cli/php" sharp/bin/spec --shard ${{ matrix.shard }}/4
  # The fixture in sharp/hosts, served from FrankenPHP's worker mode, with FrankenPHP built with Go against
  # BUILD_LINUX's installed engine, and BUILD_LINUX's mago. It runs on every push to master that BUILD_LINUX runs on,
  # even one whose tree a pull request's run passed, because that push's HOSTS saves the Go modules and Go's build cache
  # of FrankenPHP's packages, which every pull request's run restores, as BUILD_LINUX saves its caches.
  HOSTS:
    needs: [CHANGES, BUILD_LINUX]
    if: >-
      needs.CHANGES.outputs.code == 'true'
      && !(needs.CHANGES.outputs.passed && needs.CHANGES.outputs.bump == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Download BUILD_LINUX's engine and mago
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      # sharp/bin/hosts keeps Go's build cache in the build's folder, because the cache never reads the PHP headers
      # FrankenPHP's C files include, as it explains. So the key holds the hash of the headers the engine just installed,
      # and a change to them restores nothing, as a new build folder would hold nothing.
      - name: Go modules and build cache, saved by the push to master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/go/pkg/mod
            sharp/build/linux-x86_64/frankenphp/go-build
          key: SHARP_HOSTS_GO-${{ runner.arch }}-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile', 'sharp/build/linux-x86_64/install/include/**') }}-${{ github.sha }}
          restore-keys: SHARP_HOSTS_GO-${{ runner.arch }}-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile', 'sharp/build/linux-x86_64/install/include/**') }}-
      - name: Serve the fixture from FrankenPHP
        run: sharp/bin/hosts --linux --no-build
      - name: Save the Go modules and build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/go/pkg/mod
            sharp/build/linux-x86_64/frankenphp/go-build
          key: SHARP_HOSTS_GO-${{ runner.arch }}-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile', 'sharp/build/linux-x86_64/install/include/**') }}-${{ github.sha }}
  # The engine built with AddressSanitizer, so a memory error of the engine fails a test, nightly on master's tip.
  # sharp/bin/build has no flag for php-src's --enable-address-sanitizer, so it builds as php-src's own CI does: a debug
  # build whose CFLAGS and LDFLAGS add -fsanitize=address and ZEND_TRACK_ARENA_ALLOC. sharp/docker/run passes no CFLAGS
  # into the image, so it builds on the runner, with Ubuntu's gcc 13. The tests run with what run-tests.php's --asan
  # sets, which sharp/bin/test doesn't take: the Zend allocator off, so ASan sees each allocation, and LeakSanitizer with
  # php-src's suppressions. The PHP# tests run without opcache, in shared memory twice per process, and under the
  # tracing JIT, the stores a PHP# mark passes through, and leave out the upstream tests, whose baseline lists a build
  # without ASan. A failed run opens the red-master issue, as CI_PASSED does for a push.
  ASAN:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    # The build's packages, as sharp/docker/Dockerfile installs them.
    env:
      PACKAGES: >-
        autoconf bison pkg-config re2c libcurl4-openssl-dev libicu-dev libonig-dev libpq-dev libsodium-dev libsqlite3-dev
        libxml2-dev libzip-dev
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: apt
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # PACKAGES is a list of packages.
          sudo apt-get install --yes --no-install-recommends $PACKAGES
      # sharp/bin/test builds mago on the runner, with the crates mago.yml's jobs fetch there. A nightly run saves no
      # target, so the caches keep room for the ones every pull request restores.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_ASAN
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
      # Only this step's CFLAGS, so mago builds without ASan.
      - name: Build with AddressSanitizer
        env:
          CFLAGS: -fsanitize=address -DZEND_TRACK_ARENA_ALLOC
          LDFLAGS: -fsanitize=address
        run: sharp/bin/build
      - name: Test PHP# with AddressSanitizer
        env:
          USE_ZEND_ALLOC: 0
          USE_TRACKED_ALLOC: 1
          SKIP_ASAN: 1
          SKIP_PERF_SENSITIVE: 1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
        run: sharp/bin/test
      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed nightly run
        if: failure()
        uses: ./.github/actions/red-master-issue
        with:
          title: The nightly ASAN run failed
  # The run's one macOS build, which MACOS runs on: the engine and mago, as BUILD_LINUX builds Linux's. A release's pull
  # request runs it, and a push whose tree no pull request's run passed. A job never installs on the self-hosted Mac
  # runners, so it checks that Homebrew already has the build's formulae, and builds without ccache.
  #
  # The 12-core Mac runs this job beside the other runners' jobs and the work the suite checks, and two or three jobs
  # that each took every core held its load between 200 and 480 for hours. So every job on the self-hosted Macs caps its
  # parallelism: CARGO_BUILD_JOBS sets cargo's jobs, and sharp/bin/build's make and sharp/bin/test's run-tests.php read
  # it as their -j. RUST_TEST_THREADS sets libtest's threads, RAYON_NUM_THREADS a rayon pool that sets no size of its
  # own, MAGO_THREADS mago's pool, which sets its own size and so never reads RAYON_NUM_THREADS, and LEAN_NUM_THREADS
  # Lean's.
  BUILD_MACOS:
    needs: CHANGES
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.full == 'true'
    runs-on: macos-arm64-local
    timeout-minutes: 120
    env:
      FORMULAE: autoconf bison curl re2c pkgconf icu4c libiconv libpq libsodium libzip oniguruma
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      MAGO_THREADS: 4
      LEAN_NUM_THREADS: 2
    steps:
      # actions/checkout's clean deletes sharp/build. The build keeps it instead, as .github/actions/clean-kept-build
      # explains, so the engine and mago rebuild only what changed since that runner's last build, where a build from
      # nothing took 19 minutes.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build
      - name: Homebrew has the build's formulae
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE
      # ext/sharp/rust-toolchain.toml pins the toolchain the extension and mago build with.
      - name: show the Rust toolchain on PATH
        working-directory: ext/sharp
        run: |
          type -a rustup rustc cargo
          rustc --version
          cargo --version
      - name: Build the engine
        run: sharp/bin/build
      - name: Build mago and its test binaries
        run: sharp/bin/build-mago --quiet
      # The CLI, phpdbg and mago. An artifact keeps no file's mode, so the files travel in a tar, as BUILD_LINUX's do.
      - name: Pack the engine and mago for MACOS
        run: |
          build="sharp/build/darwin-$(uname -m)"
          tar --zstd -cf "$RUNNER_TEMP/build.tar.zst" "$build/sapi/cli/php" "$build/sapi/phpdbg/phpdbg" "$build/mago/debug/mago"
      - name: Upload the engine and mago for MACOS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-macos
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  # The checks only macOS can fail: mago compile and the suite on a disk that ignores case, without opcache and in shared
  # memory, since Apple silicon has no thread-safe JIT, the census and the differential, on BUILD_MACOS's engine and
  # mago. Whole, its tests took 11 to 12 minutes on the pushes of pull requests #351 and #352, so it runs in three
  # slices, one per Mac runner, and the third runs the census and the differential: three whole suites at once each ran
  # past the 60-minute limit, as the runners share one Mac, and three slices are one suite. Each slice checks out into a
  # folder of its own, shard, because the runner's kept build is for BUILD_MACOS: a copy of another runner's engine and
  # mago in it would leave cargo and make holding outputs they didn't build, which they take for current.
  MACOS:
    name: MACOS (${{ matrix.shard }}/3)
    needs: [CHANGES, BUILD_MACOS]
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.full == 'true'
    runs-on: macos-arm64-local
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The self-hosted Macs cap each job's parallelism, as BUILD_MACOS explains.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      MAGO_THREADS: 4
      LEAN_NUM_THREADS: 2
    defaults:
      run:
        working-directory: shard
    steps:
      - name: git checkout, into a folder of its own
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shard
      - name: Download BUILD_MACOS's engine and mago
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-macos
          path: ${{ runner.temp }}
      - name: Unpack BUILD_MACOS's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Test PHP#
        run: >-
          sharp/bin/test --no-build --shard ${{ matrix.shard }}/3
          ${{ matrix.shard == 3 && '--census --differential' || '' }}
  # The checks that keep the release pipeline on pinned code, which sharp/bin/check workflows runs: an action that is not
  # ours runs only at a full commit SHA, so a moved tag can't change what runs, no Dockerfile under sharp/docker names a
  # `# syntax=` frontend, which BuildKit pulls from Docker Hub with no login (#86), and actionlint, at the version this
  # job installs, passes over every workflow, with the runner labels .github/actionlint.yaml sets.
  WORKFLOWS:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: The actions are pinned, no Dockerfile names a syntax frontend, and actionlint passes
        run: sharp/bin/check workflows
  # The release's Mago binaries, their attestations, Mago's source archives, their SHA-256s and its notes, which
  # release.yml builds beside the suites in a release's pull request run, and in a release's push whose tree no pull
  # request's run passed. RELEASE publishes them. A called workflow's jobs may ask only for permissions its caller grants.
  RELEASE_ASSETS:
    needs: CHANGES
    if: needs.CHANGES.outputs.bump == 'true' && needs.CHANGES.outputs.full == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
  # This workflow's one required check. A job skipped by its `if` reports one check under the job's
  # name, so CI_PASSED stands in for every job it needs. It fails when any of them failed or was
  # cancelled, a release that failed to publish among them. mago.yml's ci-passed is the other
  # required check, and its plain-php job runs mago from Composer on plain PHP.
  CI_PASSED:
    if: always() && github.event_name != 'schedule'
    needs:
      - CHANGES
      - BUILD_LINUX
      - LINUX
      - UPSTREAM
      - SPEC
      - HOSTS
      - BUILD_MACOS
      - MACOS
      - WORKFLOWS
      - RELEASE_ASSETS
      - IMAGE
      - RELEASE
      - COMPOSER
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      # Only for the actions below.
      - name: git checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Every job passed, or skipped a change that doesn't need it
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            BUILD_LINUX, LINUX, UPSTREAM, SPEC, HOSTS, BUILD_MACOS, MACOS, RELEASE_ASSETS, IMAGE, RELEASE, COMPOSER
          jobs: ${{ toJSON(needs) }}
      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed run on master
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/red-master-issue
        with:
          title: A push to master failed PHP# CI
          range: ${{ needs.CHANGES.outputs.base && format('{0}..{1}', needs.CHANGES.outputs.base, github.sha) || '' }}
      # BUILD_LINUX saved its target and ccache on master when it ended, and HOSTS its Go caches, so this job, which
      # needs both, deletes the ones they replaced.
      - name: Delete the caches this run replaced
        if: always() && github.event_name == 'push' && needs.BUILD_LINUX.result == 'success'
        uses: ./.github/actions/mago-cache-prune
  # Splits sharp/composer and sharp/mago and pushes them to master of heyJordanParker/php-sharp-composer and
  # heyJordanParker/mago-sharp, whose webhooks tell Packagist, once every check of the push passed: it needs RELEASE,
  # and a job's failure() counts every job before it. For a release, it then pushes tag v<version> to both, once RELEASE
  # made the GitHub release public. The pushes never force, so a mistake can't rewind a published package.
  COMPOSER:
    needs: [CHANGES, RELEASE]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency: composer-${{ github.ref }}
    permissions:
      actions: read
      contents: read
    env:
      RUN_ID: ${{ needs.RELEASE.outputs.run-id }}
      VERSION: ${{ needs.RELEASE.outputs.version }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install splitsh-lite
        uses: ./.github/actions/splitsh-lite
      - name: Split sharp/composer
        run: splitsh-lite --prefix=sharp/composer --target=refs/heads/composer
      - name: git checkout heyJordanParker/php-sharp-composer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/php-sharp-composer
          ssh-key: ${{ secrets.PHP_SHARP_COMPOSER_DEPLOY_KEY }}
          path: sharp/build/php-sharp-composer
          fetch-depth: 0
      # A release's tag here becomes the plugin release of the same version: the split plus a commit that adds this
      # commit's docs/spec.md as spec.md, so a project reads the spec its version follows at
      # vendor/heyjordanparker/php-sharp-composer/spec.md. A rerun finds the tag an earlier attempt pushed, and leaves it.
      - name: Push the split, and a release's tag with its spec
        working-directory: sharp/build/php-sharp-composer
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer
          git push origin "FETCH_HEAD:$GITHUB_REF"
          if [[ -z $VERSION ]]; then
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "heyJordanParker/php-sharp-composer already has tag v$VERSION."
            exit 0
          fi
          git switch --detach FETCH_HEAD
          cp "$GITHUB_WORKSPACE/docs/spec.md" spec.md
          git add spec.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "The spec PHP# $VERSION follows"
          git push origin "HEAD:refs/tags/v$VERSION"
      - name: Split sharp/mago
        run: splitsh-lite --prefix=sharp/mago --target=refs/heads/mago
      - name: git checkout heyJordanParker/mago-sharp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp
          fetch-depth: 0
      # splitsh-lite starts the split at the commit that added sharp/mago, so a branch the mirror had before the move
      # isn't in the split, and its push is skipped until that branch is rewritten once. git subtree split would keep
      # that history, but it walks all of Mago's history in shell recursion and took more than 8 minutes without
      # finishing.
      - name: Push the split
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          if git rev-parse -q --verify "origin/$GITHUB_REF_NAME" > /dev/null \
            && ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" FETCH_HEAD; then
            echo "::warning::The split of sharp/mago does not contain heyJordanParker/mago-sharp's $GITHUB_REF_NAME, so pushing it would rewrite that branch. The push is skipped."
            exit 0
          fi
          git push origin "FETCH_HEAD:$GITHUB_REF"
      # A release's heyjordanparker/mago-sharp version is the split plus a commit that adds the release's SHA-256s as
      # composer/sha256sums.txt. The Composer wrapper refuses an archive whose SHA-256 differs, so the package version
      # pins the exact binary, as esbuild's and Biome's npm packages do.
      - name: Download the release's SHA-256s
        if: env.VERSION
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: ${{ runner.temp }}
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      # The tag pins these SHA-256s for good, so the assets a user downloads from the published release must match
      # them, and so must the sums file install.sh checks a download against.
      - name: The published assets match the SHA-256s the tag pins
        if: env.VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sums="$RUNNER_TEMP/mago-$VERSION-sha256sums.txt"
          published="$RUNNER_TEMP/published"
          gh release download "v$VERSION" --dir "$published"
          if ! cmp "$sums" "$published/mago-$VERSION-sha256sums.txt"; then
            echo "::error::Release v$VERSION publishes a mago-$VERSION-sha256sums.txt that differs from the one run $RUN_ID wrote, so no heyjordanparker/mago-sharp tag is pushed."
            exit 1
          fi
          if ! (cd "$published" && sha256sum --check --strict "$sums"); then
            echo "::error::An asset of release v$VERSION has a SHA-256 other than the one run $RUN_ID wrote, so no heyjordanparker/mago-sharp tag is pushed."
            exit 1
          fi
      # A rerun finds the tag an earlier attempt pushed, and leaves it.
      - name: Push the release's tag, with the SHA-256 of every release asset
        if: env.VERSION
        working-directory: sharp/build/mago-sharp
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "heyJordanParker/mago-sharp already has tag v$VERSION."
            exit 0
          fi
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/mago-$VERSION-sha256sums.txt" composer/sha256sums.txt
          git add composer/sha256sums.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "The SHA-256 of every mago $VERSION release asset"
          git push origin "HEAD:refs/tags/v$VERSION"
  # The runtime image, FrankenPHP on the thread-safe engine, as <version>. Each platform builds on a runner of its own
  # architecture with -O2 and --enable-werror, where GCC finds -Wmaybe-uninitialized and libcurl's type checks, so a
  # warning one architecture alone finds fails. Each pushes its image by digest, with BuildKit's provenance and SBOM
  # attestations, and RELEASE tags the two as one.
  # BuildKit, its SBOM scanner and the bases are base-images.yml's copies in ghcr.io at pinned digests, pulled after the
  # login, so no pull is an anonymous Docker Hub pull (#86). The engine changes PHP's internal structures, so an
  # extension can stop building or loading: each pushed image then installs the extensions a typical Laravel app
  # installs on top, the way such an app's Dockerfile does. A release's pull request runs it, and a push whose tree no
  # pull request's run passed. The two platforms build at once, since a release's run ends with its slowest job: each
  # took 12 to 13 minutes on the pushes of pull requests #351 and #352.
  IMAGE:
    name: IMAGE (${{ matrix.platform }})
    if: needs.CHANGES.outputs.code == 'true' && needs.CHANGES.outputs.full == 'true'
    needs: CHANGES
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      EXTENSIONS: bcmath exif gd imagick intl pcntl pdo_pgsql pgsql redis zip
      # The same extensions but bcmath, intl and zip, which the image builds, so sharp/bin/php-extensions checks the
      # image's own. imagick and redis build from the release tags the image adds from GitHub, because pecl.php.net
      # outages failed this job.
      INSTALL: exif gd /usr/src/imagick pcntl pdo_pgsql pgsql /usr/src/phpredis
    steps:
      # For .github/actions/boot-image and sharp/bin/php-extensions. The build fetches its own context.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx with BuildKit from ghcr.io
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=ghcr.io/heyjordanparker/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      # The build's context is the commit's tree, which BuildKit fetches from GitHub by the commit's SHA, so a ref
      # moved after the push builds nothing else, as docker/github-builder's checksum pinned it.
      - name: Build and push the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: sharp/docker/runtime/frankenphp.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: REGISTRY=ghcr.io/heyjordanparker
          provenance: mode=max
          sbom: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          outputs: type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true
      # The -dev image, the runtime image with the law checker's Lean in Mago's cache folder, which RELEASE tags
      # <version>-dev. The build reuses the runtime image's stages from the build before it.
      - name: Build and push the -dev image by digest
        id: dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ github.sha }}
          file: sharp/docker/runtime/frankenphp.Dockerfile
          target: dev
          platforms: ${{ matrix.platform }}
          build-args: REGISTRY=ghcr.io/heyjordanparker
          provenance: mode=max
          sbom: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          outputs: type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true
      # A critical or high CVE that a fixed package resolves fails the job, so the digest is never uploaded and
      # RELEASE tags none. aquasecurity/trivy-action's v0.35.0 and later are immutable releases, made after its tags
      # were rewritten to malware on 2026-03-19, and Trivy's v0.71.1 and later fix GHSA-mcj4-mphf-j9ff.
      - name: Scan the pushed image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the pushed image on its default command and request a page
        uses: ./.github/actions/boot-image
        with:
          image: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
      # No job runs the PHP# suite on arm64, so this platform's engine shows here that it starts and loads PHP#.
      - name: The image's php prints its version and lists the sharp extension
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm "$IMAGE" php -v
          if ! docker run --rm "$IMAGE" php -m | grep -qx sharp; then
            echo "::error::php -m in the $PLATFORM image lists no sharp extension."
            exit 1
          fi
      # mago reads the Lean of its compile from lean/lean-<version>-<platform>/ in Mago's cache folder, which XDG_CACHE_HOME
      # puts in /var/cache/mago, so a compile in the -dev image downloads nothing, run by any user.
      - name: A user other than root runs the -dev image's Lean and writes in Mago's cache folder
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="lean-$(sed 's/.*:v//' sharp/mago/crates/sharp-lean/lean/lean-toolchain)-linux"
          if [[ $PLATFORM == linux/arm64 ]]; then
            archive+=_aarch64
          fi
          docker run --rm --user 1000:1000 --env ARCHIVE="$archive" "$IMAGE" \
            sh -c '"$XDG_CACHE_HOME/mago/lean/$ARCHIVE/bin/lake" --version && touch "$XDG_CACHE_HOME/mago/install.lock"'
      # rustup comes after the extensions, so they build as in the app's image. The builder is Docker's own, which reads
      # the pulled image, where Buildx's would not.
      - name: Install the extensions
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" php-sharp
          docker buildx build --builder default --load --build-arg INSTALL --tag php-sharp-extensions - <<'DOCKERFILE'
          FROM php-sharp
          COPY --from=ghcr.io/mlocati/php-extension-installer:2 /usr/bin/install-php-extensions /usr/local/bin/
          # A git source brings phpredis's liblzf submodule, which GitHub's tag archive leaves out.
          ADD https://github.com/Imagick/imagick.git#3.8.1 /usr/src/imagick
          ADD https://github.com/phpredis/phpredis.git#6.3.0 /usr/src/phpredis
          ARG INSTALL
          RUN install-php-extensions $INSTALL
          DOCKERFILE
      - name: Check that php -m lists each extension, and call into each one from FrankenPHP's php-cli
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS is a list of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src php-sharp-extensions frankenphp php-cli sharp/bin/php-extensions $EXTENSIONS
      # Each file is named by its image's digest and holds the commit the image was built from.
      - name: Keep the digests for RELEASE
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DEV: ${{ steps.dev.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests" "$RUNNER_TEMP/dev-digests"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/dev-digests/${DEV#sha256:}"
      # Kept as long as release.yml's assets, as the repository's artifact retention sets. The name keeps the frankenphp
      # of the runs that also built php-fpm's image, so a tag of their commits tags FrankenPHP's alone.
      - name: Upload the digest for RELEASE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-frankenphp-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
      - name: Upload the -dev digest for RELEASE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-dev-${{ strategy.job-index }}
          path: ${{ runner.temp }}/dev-digests/*
          if-no-files-found: error
  # Publishes a release from the push of its merge to master, once every job before it passed, and mago.yml's run of
  # the same push: the GitHub release of the files RELEASE_ASSETS built, whose publication creates tag v<version> on the
  # merge commit, and the runtime image as ghcr.io/heyjordanparker/php-sharp:<version>, never as latest, with its -dev
  # image as <version>-dev. The files and
  # images are the ones the pull request's run built on this commit's tree, or the ones this run built when no pull
  # request's run passed that tree, so a release builds them once and the merge builds nothing. A tag GITHUB_TOKEN makes
  # starts no workflow, so this run publishes, and COMPOSER then publishes the Composer packages. A rerun of a failed
  # RELEASE finds what an earlier attempt published, and leaves it.
  RELEASE:
    needs: [CHANGES, BUILD_LINUX, LINUX, UPSTREAM, SPEC, HOSTS, BUILD_MACOS, MACOS, WORKFLOWS, RELEASE_ASSETS, IMAGE]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && needs.CHANGES.outputs.bump == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      run-id: ${{ steps.run.outputs.id }}
      version: ${{ needs.CHANGES.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.CHANGES.outputs.version }}
    steps:
      - name: Find the run that built the release
        id: run
        env:
          PASSED: ${{ needs.CHANGES.outputs.passed }}
        run: |
          id=${PASSED##*/}
          echo "id=${id:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION publishes what run ${id:-$GITHUB_RUN_ID} built."
      # Its pull request's run passed both workflows on this tree, or this push's run of mago.yml runs every Mago check.
      - name: Mago CI passed on this push
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mago.yml/runs?head_sha=$GITHUB_SHA&event=push" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z $run ]]; then
            echo "::error::Mago CI has no push run on commit $GITHUB_SHA, so release $VERSION isn't published."
            exit 1
          fi
          gh run watch "$run" --compact --exit-status --interval 15
      - name: Download the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ env.VERSION }}-*
          path: assets
          merge-multiple: true
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Download the SHA-256s
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: assets
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      # An asset changed after its build fails its SHA-256 or its attestation, and one built from another tree fails the
      # tree, so nothing is published.
      - name: The assets are the ones the SHA-256s name, signed by release.yml and built from this commit's tree
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
          TREE: ${{ steps.run.outputs.tree }}
        run: |
          sums="mago-$VERSION-sha256sums.txt"
          { cut -d ' ' -f 3- "assets/$sums"; echo "$sums"; } | sort > expected-assets.txt
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::Run $RUN_ID kept other assets than the ones $sums names, so nothing is published."
            exit 1
          }
          (cd assets && sha256sum --check --strict "$sums")
          mapfile -t assets < <(cut -d ' ' -f 3- "assets/$sums")
          for asset in "${assets[@]}"; do
            commits=$(gh attestation verify "assets/$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --format json \
              --jq '.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[].digest.gitCommit // empty')
            if [[ -z $commits ]]; then
              echo "::error::$asset's attestation from run $RUN_ID names no commit it was built from, so nothing is published."
              exit 1
            fi
            for commit in $commits; do
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)
              if [[ $built != "$TREE" ]]; then
                echo "::error::Run $RUN_ID built $asset from commit $commit, whose tree $built isn't commit $GITHUB_SHA's tree $TREE, so nothing is published."
                exit 1
              fi
            done
          done
          echo "Every asset of run $RUN_ID matches its SHA-256 and its attestation, and was built from tree $TREE."
      # Publishing the draft creates tag v<version> on this commit.
      - name: Upload every asset to the draft release, check it, then publish it
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          tag="v$VERSION"
          if ! is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> view-error.txt); then
            grep -q "release not found" view-error.txt || { cat view-error.txt >&2; exit 1; }
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$NOTES"
            is_draft=true
          fi
          if [[ $is_draft != true ]]; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            if [[ $tagged != "$GITHUB_SHA" ]]; then
              echo "::error::Release $tag is already published on commit $tagged, not $GITHUB_SHA. Release a new version."
              exit 1
            fi
            echo "Release $tag is already published on this commit."
            exit 0
          fi
          gh release upload "$tag" assets/* --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > released-assets.txt
          diff -u expected-assets.txt released-assets.txt || {
            echo "::error::Draft release $tag holds different assets than expected, so it stays a draft."
            exit 1
          }
          gh release edit "$tag" --notes-file "$NOTES" --draft=false
      - name: Download the platforms' digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-frankenphp-*
          path: ${{ runner.temp }}/digests/runtime
          merge-multiple: true
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Download the platforms' -dev digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-dev-*
          path: ${{ runner.temp }}/digests/dev
          merge-multiple: true
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each digest's file holds the commit IMAGE built it from: the runtime image's in runtime/, tagged <version>, and the
      # -dev image's in dev/, tagged <version>-dev.
      - name: Tag the platforms' images as one image each
        id: tag
        working-directory: ${{ runner.temp }}/digests
        env:
          TREE: ${{ steps.run.outputs.tree }}
        run: |
          image=ghcr.io/heyjordanparker/php-sharp
          for kind in runtime dev; do
            tag="$image:$VERSION"
            if [[ $kind == dev ]]; then
              tag+=-dev
            fi
            sources=()
            for file in "$kind"/*; do
              digest=${file#"$kind"/}
              commit=$(< "$file")
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)
              if [[ $built != "$TREE" ]]; then
                echo "::error::IMAGE built $image@sha256:$digest from commit $commit, whose tree $built isn't commit $GITHUB_SHA's tree $TREE."
                exit 1
              fi
              sources+=("$image@sha256:$digest")
            done
            if [[ ${#sources[@]} != 2 ]]; then
              echo "::error::IMAGE pushed ${#sources[@]} platform images for $tag, not linux/amd64's and linux/arm64's."
              exit 1
            fi
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
            docker buildx imagetools inspect "$tag"
            echo "$kind=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          done
      # `gh attestation verify oci://ghcr.io/heyjordanparker/php-sharp:<version> --repo heyJordanParker/php-sharp` checks it,
      # and the same command with <version>-dev the -dev image's.
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.runtime }}
          push-to-registry: true
      - name: Attest the -dev image's provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.dev }}
          push-to-registry: true
