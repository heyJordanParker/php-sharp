name: PHP#
on:
  push:
    paths-ignore: &ignore_paths
      - .circleci/**
      - .github/CODEOWNERS
      - .github/ISSUE_TEMPLATE/**
      - '**/*.md'
      - '**/*.rst'
      - docs/**
      - EXTENSIONS
      - LICENSE
      - NEWS
      - UPGRADING
      - UPGRADING.INTERNALS
    branches:
      - sharp
  pull_request:
    paths-ignore: *ignore_paths
    branches:
      - sharp
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true
jobs:
  LINUX:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: Build
        run: sharp/bin/build --linux
      - name: Test PHP#
        run: sharp/bin/test --linux --opcache
      - name: Test upstream
        run: sharp/bin/test --linux --upstream --opcache
      - name: Verify generated files are up to date
        run: |
          sharp/docker/run scripts/dev/credits
          sharp/docker/run scripts/dev/genfiles
          sharp/docker/run scripts/gdb/debug_gdb_scripts_gen.php
          sharp/docker/run Zend/zend_vm_gen.php
          sharp/docker/run ext/tokenizer/tokenizer_data_gen.php
          sharp/docker/run build/gen_stub.php -f --generate-optimizer-info --verify
          # Use the -a flag for a bug in git 2.46.0, which doesn't consider changed -diff files.
          git add . -N && git diff -a --exit-code
  MACOS:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: brew
        run: |
          brew install \
            autoconf \
            bison \
            re2c \
            pkgconf \
            icu4c \
            libiconv \
            libpq \
            libsodium \
            libzip \
            oniguruma
      - name: ccache
        uses: ./.github/actions/ccache
        with:
          name: SHARP_MACOS
      - name: Build
        run: sharp/bin/build
      - name: Test PHP#
        run: sharp/bin/test --opcache
      - name: Test upstream
        run: sharp/bin/test --upstream --opcache
