name: PHP#
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # ASAN alone, nightly on master's tip, or dispatched, as a fix of a red nightly run shows it green.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
# A pull request, and master, runs one push at a time, and only the newest push waits, since its tree holds every
# commit before it. next's own pull request runs each push at once, in a group of its own, beside the runs before it,
# since sharp/bin/land lands the newest commit of next whose runs passed, and next takes pushes faster than a run ends:
# when each push cancelled the run before it, 69 of the last 150 runs were cancelled, and when each waited for the run
# before it, run 45080049483 waited 859 s. Its MACOS job waits for the one Mac runner, which takes one job at a time.
# Any other pull request merges only its newest commit, so a push cancels its run
# in progress, where release #675's run on 75c9837da5a waited 38 minutes behind the run on a commit it replaced. A push
# to master lets its run finish, since the run publishes. A failed job cancels any other pull request's run, which can
# no longer pass, and next's run ends failed, as .github/actions/cancel-failed-run explains. A schedule or a dispatch
# runs in a group of its own.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref == 'next' && github.run_id || github.event.pull_request.url
    || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'next' }}
jobs:
  # CI_PASSED is this workflow's one required check. Every push runs every check, whatever it changed: the Linux suites,
  # each job on 4 cores, the Mac's and the runtime image, so every check that guards a release runs before the merge, on
  # the tree that merges. GitHub runs 20 of the account's hosted jobs at once, across all its repositories, and a job
  # past them waits.
  #
  # A tree runs the checks once, as bors's "not rocket science" rule tests the exact tree that lands once. A run runs
  # none of them when a pull request's run passed CI_PASSED on its tree, as .github/actions/passed-tree explains, and
  # links that run. So the pull request that lands a commit of next passes in a minute, and a push to master saves the
  # caches every pull request's run restores. A push whose tree no pull request's run passed runs every check, the
  # Mac's among them, as the check of the merge. Only a push to master whose version has no tag builds the release, and
  # publishes it once every check passed. A red push opens an issue, as CI_PASSED does, for a pull request that fixes
  # it forward.
  CHANGES:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      bump: ${{ steps.version.outputs.bump }}
      images: ${{ steps.images.outputs.run }}
      missing: ${{ steps.version.outputs.missing }}
      passed: ${{ steps.passed.outputs.run }}
      tagged: ${{ steps.version.outputs.tagged }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      # .github/actions/passed-tree finds the runs that passed a tree by this notice. A pull request's run checks out the
      # pull request merged into master, so the tree it tests is that merge's, not its head's.
      - name: Name the tree this run tests
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"
      # sharp/bin/check --release prints sharp/mago/Cargo.toml's version, the commit its tag names, which
      # sharp/bin/land creates, and each part of its release not published yet. A push to master publishes what is
      # missing, from the tagged commit, so a part an earlier push failed to publish publishes at the next push. Pushes
      # to master run one at a time, so the next push looks once this one has published.
      - name: Find the version, and what of its release is missing
        id: version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sharp/bin/check --release | tee -a "$GITHUB_OUTPUT"
      - name: Find the pull request run that passed this tree
        id: passed
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request
          passed: any(.jobs[]; .name == "CI_PASSED" and .conclusion == "success")
      # RELEASE tags the images IMAGE built on the release's tree, in the run that ran it: a pull request's run that ran
      # every check, or a push's. A landing pull request's run links next's run and builds none, so run 45033462105,
      # which took them from landing run 45033130198, found none and left 0.6.50 without its images. When no run built
      # them, the push of the tagged commit builds them itself.
      - name: Find the run that built the images of the release's tree
        id: images
        if: contains(steps.version.outputs.missing, 'images')
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request push
          commit: ${{ steps.version.outputs.tagged || github.sha }}
          passed: any(.jobs[]; (.name | startswith("IMAGE (")) and .conclusion == "success")
      - name: The checks don't run again
        if: steps.passed.outputs.run
        env:
          RUN: ${{ steps.passed.outputs.run }}
        run: echo "::notice::This tree ran and passed every PHP# check in $RUN, so none runs again."
      # A push's changes start at the commit of master's newest push run that GitHub didn't cancel, so a merge whose
      # pending run a later push replaced still counts, and a red run's issue names every commit it tests. Pushes run
      # one at a time, so every earlier run has ended. Only an earlier run counts, so a rerun of an old run diffs from
      # the run before it, as its first attempt did. With none among the last 100 runs, every job runs.
      - name: Find the commit of master's last push run that ran
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API answered this list with HTTP 502 once and failed the push run (44132260911), so it retries, as
          # .github/actions/setup-lean retries Lean's install.
          for attempt in 1 2 3; do
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sharp.yml/runs?branch=master&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .id < (env.GITHUB_RUN_ID | tonumber))][0].head_sha // empty'); then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "::error::GitHub's API refused the list of master's push runs 3 times. The output above names the cause."
              exit 1
            fi
            echo "Retrying the list of master's push runs in $((attempt * 15)) seconds (retry $attempt of 2)" >&2
            sleep $((attempt * 15))
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "This push's changes start at ${sha:-no commit, so every job runs}."
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The run's one Linux build, which every Linux suite runs on: the engine, its install and mago, which the suites run
  # with --no-build. Each of the 8 suite jobs built them itself for 2 to 5 minutes on release pull request #363's run,
  # where the bump rebuilt every Mago crate in each, so a run built the same code 8 times. The suites wait for it, so its
  # minutes are on every suite's path, and it keeps them few: .github/actions/linux-build builds the engine through
  # ccache in the sharp/docker image, which sharp/docker/run passes CC and CXX into, with its folder at
  # sharp/build/cache/ccache under the XDG_CACHE_HOME sharp/docker/run sets, while master's Mago target restores, and
  # sharp/bin/build-mago then builds only what changed since master's build, with every test binary, which MAGO's slices
  # run, so Linux builds Mago's dev target once per run, where mago.yml's build job built it a second time for 122
  # seconds on dfa6e7e2941's run. It also runs the checks of generated files, since one of them reads the header the
  # build generates, and the doc tests and the property tests, which cargo builds, so they need this target: a job
  # starts once every job it needs has ended, so the suites wait for them too. MAGO's slices run every test binary.
  #
  # On each push to master it saves the ccache, the Rust toolchain and crates, and the target, which every pull
  # request's run restores, as .github/actions/mago-cache explains. A cache only its own ref's runs would restore is no
  # use to the next pull request, so only master saves. So it runs on every push to master, even one whose tree a pull
  # request's run passed. A pull request's run of a tree that passed saves nothing, so it doesn't run. CI_PASSED, which
  # runs after it, deletes the caches it replaced.
  BUILD_LINUX:
    needs: CHANGES
    if: ${{ !needs.CHANGES.outputs.passed || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    # A build of the engine takes up to 20 more minutes, which the engine's cache spares a run whose engine
    # inputs an earlier run built.
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      # sharp/bin/build-mago builds inside the image, where CARGO_HOME and RUSTUP_HOME are sharp/build/cargo and
      # sharp/build/rustup, which the Rust cache holds.
      - name: Build and install the engine, and restore the Rust and Mago caches
        uses: ./.github/actions/linux-build
        with:
          save: ${{ github.event_name == 'push' }}
      # The PHP# engine mago links, from the cache a run saved for the same inputs, or else built in the image by
      # sharp/bin/build-mago --engine. A build that links mago then takes it through MAGO_ENGINE, as it is.
      - name: Restore the engine mago links
        id: mago-engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/linux-x86_64-engine/install
          key: MAGO_ENGINE-debian-${{ runner.arch }}-${{ hashFiles('configure.ac', 'build/**', 'main/**', 'Zend/**', 'TSRM/**', 'sapi/**', 'ext/**', 'scripts/**', '!**/tests/**', 'sharp/bin/build-mago', 'sharp/docker/runtime/configure-options', 'sharp/docker/Dockerfile') }}
      - name: Build the engine mago links
        if: steps.mago-engine.outputs.cache-hit != 'true'
        run: sharp/docker/run sharp/bin/build-mago --engine
      - name: Save the engine mago links
        if: steps.mago-engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/linux-x86_64-engine/install
          key: ${{ steps.mago-engine.outputs.cache-primary-key }}
      - name: Build mago and its test binaries
        run: sharp/docker/run env MAGO_ENGINE=/src/sharp/build/linux-x86_64-engine/install sharp/bin/build-mago --quiet
      # What the suites run: the CLI, phpdbg, which run-tests.php finds beside it for the tests that need it, the install
      # sharp/bin/hosts builds FrankenPHP against, and mago. An artifact keeps no file's mode, so the files travel in a
      # tar, compressed here, since Actions would compress them on one thread.
      - name: Pack the engine and mago for the suites
        run: |
          build="sharp/build/linux-$(uname -m)"
          tar --zstd -cf "$RUNNER_TEMP/build.tar.zst" "$build/sapi/cli/php" "$build/sapi/phpdbg/phpdbg" "$build/install" \
            "$build/mago/debug/mago"
      - name: Upload the engine and mago for the suites
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}/build.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # What MAGO's slices run: the test binaries build.json names, mago, which the tests run, and build.json.
      - name: Pack Mago's test binaries
        if: ${{ !needs.CHANGES.outputs.passed }}
        run: |
          build="sharp/build/linux-$(uname -m)/mago"
          jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable) | .executable | ltrimstr("/src/")' \
            "$build/build.json" | sort -u > "$RUNNER_TEMP/test-binaries"
          tar --zstd -cf "$RUNNER_TEMP/tests.tar.zst" "$build/build.json" "$build/debug/mago" --files-from "$RUNNER_TEMP/test-binaries"
      - name: Upload Mago's test binaries
        if: ${{ !needs.CHANGES.outputs.passed }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-linux
          path: ${{ runner.temp }}/tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      # With the engine the build of mago linked, so the check's build of mago builds nothing: without it, the check
      # built the engine from nothing, which held the suites for 280 of this job's 624 seconds on dfa6e7e2941's run.
      - name: Verify the generated files, and that no Cargo.lock names a local source
        env:
          MAGO_ENGINE: /src/sharp/build/linux-x86_64-engine/install
        run: sharp/bin/check generated
      # With the engine the build of mago linked, as the check of the generated files takes it, so cargo's build of the
      # tests rebuilds no crate that links it: mago.yml's build job ran these with no MAGO_ENGINE, and built the engine
      # from nothing first, for 4.5 of its 8.7 minutes on dfa6e7e2941's run. They run after the uploads, which the
      # suites download, and the job ends about a minute after them.
      - name: Test the doc tests and the property tests
        if: ${{ !needs.CHANGES.outputs.passed }}
        run: sharp/docker/run env MAGO_ENGINE=/src/sharp/build/linux-x86_64-engine/install sharp/bin/test --mago --cargo-built
      # As .github/actions/cancel-failed-run explains.
      - &cancel-failed-run
        name: Cancel the run, which can no longer pass
        if: failure() && github.event_name == 'pull_request' && github.head_ref != 'next'
        uses: ./.github/actions/cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # LINUX runs the PHP# suite on the thread-safe engine FrankenPHP runs, in three slices, each without opcache, in shared
  # memory twice per process, and under the tracing JIT production runs with the opcache. The slices balance by the
  # seconds sharp/baseline/seconds lists, and the one that weighs least runs mago convert's whole-project proof, as
  # sharp/bin/test explains. The last slice also runs the census, the differential and PHPUnit. A hosted runner can be
  # 1.9 times slower than another on the same slice, so a slice's share sets how long a slow draw holds the run: with
  # two slices, LINUX (2/2) on an AMD EPYC 7763 ran its 246 s of modes in 474 s on run 45038360121.
  LINUX:
    name: LINUX (${{ matrix.shard }}/3)
    needs: [CHANGES, BUILD_LINUX]
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      # sharp/docker/run pulls the image base-images.yml builds from ghcr.io.
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      # A download that stalls holds its job until the job's timeout: MAGO (2/5) of run 44989865954 waited 28 minutes on
      # one, where a download takes 1 to 38 s. So each download stops after 5 minutes, and one that failed or stopped
      # runs once more. UPSTREAM, SPEC and HOSTS repeat these two steps by their anchors.
      - &download-build-linux
        name: Download BUILD_LINUX's engine and mago
        id: download
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}
      - &download-build-linux-again
        name: Download BUILD_LINUX's engine and mago, the second try
        if: steps.download.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-linux
          path: ${{ runner.temp }}
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Test PHP#
        run: >-
          sharp/bin/test --linux --no-build --shard ${{ matrix.shard }}/3
          ${{ matrix.shard == 3 && '--census --differential --phpunit' || '' }}
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # sharp/mago's workspace tests on Linux, a fifth of the tests each, which sharp/bin/test --mago --shard balances by
  # the seconds sharp/baseline/seconds lists, by exact name, on BUILD_LINUX's test binaries. BUILD_LINUX runs the doc
  # tests and the property tests, which need its target. When BUILD_LINUX ran the fifth slice itself, the suites
  # started 376 s after its last upload, on run 45016081891.
  MAGO:
    name: MAGO (${{ matrix.shard }}/5)
    needs: [CHANGES, BUILD_LINUX]
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      # Each download stops after 5 minutes and runs once more, as LINUX's explain.
      - name: Download BUILD_LINUX's test binaries
        id: download
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-linux
          path: ${{ runner.temp }}
      - name: Download BUILD_LINUX's test binaries, the second try
        if: steps.download.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tests-linux
          path: ${{ runner.temp }}
      - name: Unpack BUILD_LINUX's test binaries
        run: tar --zstd -xf "$RUNNER_TEMP/tests.tar.zst"
      - name: Test a fifth of the workspace's tests
        run: sharp/bin/test --linux --mago --no-build --shard ${{ matrix.shard }}/5
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The upstream tests without opcache, compared with sharp/baseline/linux, so plain PHP still behaves as before, and
  # sharp/bin/spec's self-test. The upstream tests leave out Zend/tests/sharp, which the LINUX slices run in every mode:
  # with it, its fixtures' compile and the tests took 281 s of this job's 361 on run 45051337556, the slowest Linux job.
  UPSTREAM:
    needs: [CHANGES, BUILD_LINUX]
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - *download-build-linux
      - *download-build-linux-again
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Test upstream
        run: sharp/bin/test --linux --no-build --upstream
      # sharp/bin/test --spec runs the self-test with every example, which SPEC checks in slices, so this runs the
      # self-test alone, with BUILD_LINUX's mago, as sharp/bin/test passes it.
      - name: Check sharp/bin/spec's rules on sharp/spec-self-test.md
        run: |
          build="sharp/build/linux-$(uname -m)"
          sharp/docker/run env TEST_MAGO_EXECUTABLE="/src/$build/mago/debug/mago" "$build/sapi/cli/php" sharp/bin/spec --self-test
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # Every code example in docs/spec.md and README.md, compared with sharp/baseline/spec, in four slices of the examples.
  # Each slice runs sharp/bin/spec on BUILD_LINUX's engine and mago, as sharp/bin/test --spec does. Five slices checked
  # their examples in 123 to 161 seconds on release pull request #343's run.
  SPEC:
    name: SPEC (${{ matrix.shard }}/4)
    needs: [CHANGES, BUILD_LINUX]
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - *download-build-linux
      - *download-build-linux-again
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      - name: Set up BuildKit with the job's Actions cache
        uses: ./.github/actions/buildkit
      # The -dev image's Lean layer, which IMAGE keeps in BuildKit's GitHub Actions cache, holds the Lean mago installs
      # in lean/ of its cache folder, so the examples' laws run on it with no download from GitHub, where the install
      # #696 reports failed. A run whose ref cannot read IMAGE's cache builds the layer, which downloads Lean once.
      - name: Put the -dev image's Lean in mago's cache folder
        run: |
          sharp/bin/network docker buildx build \
            --file sharp/docker/runtime/frankenphp.Dockerfile \
            --target lean-layer \
            --platform linux/amd64 \
            --build-arg REGISTRY=ghcr.io/heyjordanparker \
            --cache-from type=gha,scope=lean-linux-amd64 \
            --output "type=local,dest=$RUNNER_TEMP/lean-layer" \
            .
          mkdir -p sharp/build/cache
          mv "$RUNNER_TEMP/lean-layer/var/cache/mago" sharp/build/cache/mago
      - name: Check the examples of docs/spec.md and README.md
        run: |
          build="sharp/build/linux-$(uname -m)"
          sharp/docker/run env TEST_MAGO_EXECUTABLE="/src/$build/mago/debug/mago" "$build/sapi/cli/php" sharp/bin/spec --shard ${{ matrix.shard }}/4
      # mago downloads Lean into lean/lean-<version>-<platform> of its cache folder only when it finds no pinned Lean,
      # beside the law checker's builds, which lean/ holds under their hashes.
      - name: mago downloaded no Lean
        run: |
          if compgen -G 'sharp/build/cache/mago/lean/lean-*' > /dev/null; then
            echo "::error::mago downloaded Lean into sharp/build/cache/mago/lean, so the restored Lean was missing."
            exit 1
          fi
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The fixture in sharp/hosts, served from FrankenPHP's worker mode, with FrankenPHP built with Go against
  # BUILD_LINUX's installed engine, and BUILD_LINUX's mago. It runs on every push to master that BUILD_LINUX runs on,
  # even one whose tree a pull request's run passed, because that push's HOSTS saves the Go modules and Go's build cache
  # of FrankenPHP's packages, which every pull request's run restores, as BUILD_LINUX saves its caches.
  HOSTS:
    needs: [CHANGES, BUILD_LINUX]
    if: ${{ !needs.CHANGES.outputs.passed || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - *download-build-linux
      - *download-build-linux-again
      - name: Unpack BUILD_LINUX's engine and mago
        run: tar --zstd -xf "$RUNNER_TEMP/build.tar.zst"
      # sharp/bin/hosts keeps Go's build cache in the build's folder, because the cache never reads the PHP headers
      # FrankenPHP's C files include, as it explains. So the key holds the hash of the headers the engine just installed,
      # and a change to them restores nothing, as a new build folder would hold nothing.
      - name: Go modules and build cache, saved by the push to master
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/go/pkg/mod
            sharp/build/linux-x86_64/frankenphp/go-build
          key: SHARP_HOSTS_GO-${{ runner.arch }}-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile', 'sharp/build/linux-x86_64/install/include/**') }}-${{ github.sha }}
          restore-keys: SHARP_HOSTS_GO-${{ runner.arch }}-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile', 'sharp/build/linux-x86_64/install/include/**') }}-
      - name: Serve the fixture from FrankenPHP
        run: sharp/bin/hosts --linux --no-build
      - name: Save the Go modules and build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sharp/build/go/pkg/mod
            sharp/build/linux-x86_64/frankenphp/go-build
          key: SHARP_HOSTS_GO-${{ runner.arch }}-${{ hashFiles('sharp/bin/hosts', 'sharp/docker/Dockerfile', 'sharp/build/linux-x86_64/install/include/**') }}-${{ github.sha }}
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # What proving and compiling cost, against sharp/baseline/speed.json, the last release's, in counts no load changes, as
  # benchmark/speed.php explains: each law's Lean heartbeats, and the instructions mago's own process retires for a
  # one-file edit on one thread, under valgrind's cachegrind, since a hosted runner exposes no hardware counter to perf.
  # It counts the test-run mago, which behaves as the release users run, as sharp/bin/check speed explains, beside the
  # test jobs and off their path. It builds it as mago.yml's checks does, on the same runner image, from the caches
  # that job saves on master: the engine mago links, its ccache, and the MAGO_CHECKS target, which already holds the
  # test-run build, so the build compiles only what the push changed. It saves none of them, so each keeps one owner.
  # sharp/bin/land lands only a commit whose run passed, so a commit that proves or compiles slower never reaches
  # master. What it counted is the run's speed artifact, which the release bump commits as the next baseline.
  SPEED:
    needs: CHANGES
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: write
      contents: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      # The toolchain sharp/mago/Cargo.toml's rust-version names, which sharp/bin/check builds mago with.
      - name: Install the Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' sharp/mago/Cargo.toml)" --profile minimal
      - name: Rust and Mago caches, as mago.yml's checks saves them
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_CHECKS
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          target-dir-env: true
      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"
      - name: Install what the PHP# engine builds with, and valgrind
        uses: ./.github/actions/engine-packages
        with:
          extra: ccache valgrind
      - name: Restore the engine mago links
        id: mago-engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/linux-*-engine/install
          key: MAGO_ENGINE-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('configure.ac', 'build/**', 'main/**', 'Zend/**', 'TSRM/**', 'sapi/**', 'ext/**', 'scripts/**', '!**/tests/**', 'sharp/bin/build-mago', 'sharp/docker/runtime/configure-options') }}
      - name: The engine's ccache, saved by mago.yml's push to master
        if: steps.mago-engine.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/cache/engine-ccache
          key: MAGO_ENGINE_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/runtime/configure-options') }}-${{ github.sha }}
          restore-keys: MAGO_ENGINE_CCACHE-${{ runner.arch }}-
      - name: Build the engine mago links
        if: steps.mago-engine.outputs.cache-hit != 'true'
        env:
          CC: ccache gcc
          CXX: ccache g++
          CCACHE_DIR: ${{ github.workspace }}/sharp/build/cache/engine-ccache
        run: sharp/bin/build-mago --engine
      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean
      - name: Count what proving and compiling cost, against the last release's
        env:
          SPEED_WRITE: ${{ runner.temp }}/speed.json
        run: sharp/bin/check speed
      - name: Upload what the run counted, the next release's baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed
          path: ${{ runner.temp }}/speed.json
          if-no-files-found: ignore
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The engine built with AddressSanitizer, so a memory error of the engine fails a test, nightly on master's tip.
  # sharp/bin/build has no flag for php-src's --enable-address-sanitizer, so it builds as php-src's own CI does: a debug
  # build whose CFLAGS and LDFLAGS add -fsanitize=address and ZEND_TRACK_ARENA_ALLOC. It builds and tests in the
  # sharp/docker image, as every Linux suite does, with each variable passed through `env`, as BUILD_LINUX passes
  # MAGO_ENGINE. On the runner it built on Ubuntu 24.04's packages instead, which failed it three ways in turn: without
  # liblzma-dev every link check of the engine mago links failed, Composer's PHP 8.3 refused the tests' lock, and libzip
  # 1.7.3 left ext/zip without ZipArchive::AFL_CREATE_OR_KEEP_FILE_FOR_EMPTY_ARCHIVE, which Sharp\IO\ZipArchive uses
  # (runs 44891890723, 44951324811 and 44952997943). The tests run with what run-tests.php's --asan sets, which
  # sharp/bin/test doesn't take: the Zend allocator off, so ASan sees each allocation, and LeakSanitizer with php-src's
  # suppressions. The PHP# tests run without opcache, in shared memory twice per process, and under the tracing JIT,
  # the stores a PHP# mark passes through, and leave out the upstream tests, whose baseline lists a build without ASan.
  # It restores BUILD_LINUX's Rust and Mago caches and saves none, so the caches keep room for the ones every pull
  # request restores.
  # A failed run opens the red-master issue, as CI_PASSED does for a push.
  ASAN:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      packages: read
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie
      CC: ccache gcc
      CXX: ccache g++
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Rust and Mago caches, saved by BUILD_LINUX on master
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup
      # Only this step's CFLAGS, so mago builds without ASan.
      - name: Build with AddressSanitizer
        run: sharp/docker/run env CFLAGS="-fsanitize=address -DZEND_TRACK_ARENA_ALLOC" LDFLAGS=-fsanitize=address sharp/bin/build
      # sharp/bin/test builds mago, and sharp/bin/build-mago the engine it links first.
      - name: Test PHP# with AddressSanitizer
        run: |
          sharp/docker/run env USE_ZEND_ALLOC=0 USE_TRACKED_ALLOC=1 SKIP_ASAN=1 SKIP_PERF_SENSITIVE=1 \
            LSAN_OPTIONS=suppressions=/src/.github/lsan-suppressions.txt sharp/bin/test
      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed nightly run
        if: failure()
        uses: ./.github/actions/red-master-issue
        with:
          title: The nightly ASAN run failed
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The checks that keep the release pipeline on pinned code, which sharp/bin/check workflows runs: an action that is not
  # ours runs only at a full commit SHA, so a moved tag can't change what runs, no Dockerfile under sharp/docker names a
  # `# syntax=` frontend, which BuildKit pulls from Docker Hub with no login (#86), and actionlint, at the version this
  # job installs, passes over every workflow, with the runner labels .github/actionlint.yaml sets. It also checks that
  # each released version in sharp/CHANGELOG.md keeps the lines its release published, so a commit of next that edits
  # them fails before it lands.
  WORKFLOWS:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Install actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: The actions are pinned, no Dockerfile names a syntax frontend, and actionlint passes
        run: sharp/bin/check workflows
      # sharp/bin/check changelog reads master's sharp/CHANGELOG.md and an open release pull request's through the API.
      - name: Every released version in sharp/CHANGELOG.md keeps the lines its release published
        env:
          GH_TOKEN: ${{ github.token }}
        run: sharp/bin/check changelog
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The run's one Mac job, which runs only what macOS can fail, on the Mac's one build of the engine mago links:
  # mago compile and the PHP# suite without opcache on the debug engine, the one arm64 build of it, on a disk that
  # ignores case, the workspace's test binaries whose code differs on macOS, on the dev build, and plain-php.
  # As four jobs, MACOS, tests (macOS), release-build and the release's macOS build, they queued one after another on
  # the Mac, and three of them ran the engine step: 700, 1,443 and 940 s on 0.6.40's green run 44740612180.
  # Linux runs the rest on the same debug engine and dev build: opcache's shared memory and the census and the
  # differential, in LINUX's slices, and every other test binary, in MAGO's, since none reads anything that differs by
  # platform. Shared memory took 255 of the suite's 370 s and the workspace's tests 370 s of the step's 420 s on run
  # 45095302755. The binaries that stay are the ones whose code differs on macOS: the database's FSEvents watcher, the
  # extension hosts' process groups, the Lean library's archive, processor time and cache folder, the compile's file
  # systems in mago's own, and tests/main.rs, with Lean's install, the runner, its process handling and its paths.
  MACOS:
    needs: CHANGES
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: macos-arm64-local
    # next's own pull request runs each push at once, so each push queued a Mac job on the one runner, behind every
    # older one: at 03:10 UTC on 2026-11-23 run 45098228544's held the runner and three more waited, the newest 30
    # minutes. So next's Mac jobs share a group: one runs, the newest waits, and a newer push replaces the one waiting,
    # whose tree the newer one holds. Any other run's Mac job is a group of its own.
    concurrency:
      group: ${{ github.workflow }}-MACOS-${{ github.head_ref == 'next' && 'next' || github.run_id }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
    steps:
      # actions/checkout's clean deletes sharp/build. The Mac's runner keeps it instead, as
      # .github/actions/clean-kept-build explains, so the engines and mago rebuild only what changed since the runner's
      # last build.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build
      # A job never installs on the self-hosted Mac, so it checks that Homebrew already has the build's formulae, ccache
      # among them.
      - name: Homebrew has the build's formulae
        env:
          FORMULAE: autoconf bison ccache curl re2c pkgconf icu4c libiconv libpq libsodium libzip oniguruma
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE
      # Through ccache, as release.yml's macOS build builds the same engine, so a file that differs between the trees of
      # the two jobs, master's for a release and next's, compiles from the cache when it changes back: the run after a
      # release spent 314 s rebuilding it on run 45025617782, where it took 31 s on run 45016081891.
      - name: Build the engine mago links
        env:
          CC: ccache cc
          CXX: ccache c++
        run: sharp/bin/build-mago --engine
      # The engine the PHP# suite runs on, with --enable-debug, since only a debug engine runs ZEND_ASSERT and reports
      # a leak. It builds through ccache, as BUILD_LINUX's does, so a file that changes back, as a run of another branch
      # makes it, compiles from the cache, and sharp/bin/build configures again only when what configure reads changed.
      # On macOS sharp/bin/build builds only sapi/cli/php and sapi/phpdbg/phpdbg, so a commit relinks no libphp and
      # installs nothing, which took 376 of this step's 392 s on run 45051337556. Only this step's CC and CXX, so mago's crates that compile C build as the job's other builds build them in the
      # same target, where another CC rebuilds them and every crate above them.
      - name: Build the engine the PHP# suite runs on
        env:
          CC: ccache cc
          CXX: ccache c++
        run: sharp/bin/build
      # mago and the test binaries of the packages the test step runs, mago's, the database's, the extension hosts' and
      # the Lean library's, in the dev profile, which keeps the debug assertions and overflow checks the tests need,
      # linked with the engine the step before last built. The whole workspace's took 58 s on run 45101524191. Its dependencies compile at opt-level 3, so the tests
      # run on optimized dependencies, while a commit rebuilds the workspace crates it changed at opt-level 0: the whole
      # workspace optimized halved the tests, but its rebuild of 566 to 923 s per commit took the time back.
      - name: Build mago and its test binaries
        run: |
          MAGO_ENGINE="$GITHUB_WORKSPACE/sharp/build/darwin-arm64-engine/install" sharp/bin/build-mago --quiet \
            --config 'profile.dev.package."*".opt-level=3' \
            -p mago -p mago-database -p mago-extension -p mago-sharp-lean
      # The workspace's tests on macOS arm64, which cover the few lines of Mago that differ there, such as the watch
      # mode's FSEvents. They run lake and the SDK's Composer packages.
      - name: Install composer dependencies
        working-directory: sharp/mago
        run: composer install --no-interaction --no-progress
      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean
      # The suite and the workspace's tests share no output, and each sharp/bin/test keeps its files in a temporary
      # folder of its own, so they run at once, where one after the other they took 410 and 654 s of job 137009338505.
      # The suite's output prints once it ends, so the logs don't mix. The suite runs by its folder, so sharp/bin/test
      # runs no proof of mago convert, which only a run of the whole suite or of its slice runs, and the workspace runs
      # the binaries the job's comment names. The step took 707 s on run 45051101012 and 420 s on run 45095302755.
      - name: Test PHP# and mago's workspace
        run: |
          suite_log="$RUNNER_TEMP/php-sharp-suite.log"
          (
            status=0
            sharp/bin/test --no-build Zend/tests/sharp || status=$?
            echo "The PHP# suite took $SECONDS s."
            exit "$status"
          ) > "$suite_log" 2>&1 &
          suite=$!
          workspace=0
          # tests/main.rs's tests that read macOS: Lean's processes, its library build and cache folder, the file
          # watcher, the locks of concurrent compiles, renames, modes, change times, links, a disk that ignores case, and
          # the extension hosts' processes. Its other tests check what a compile computes, which MAGO runs.
          main=(
            compile::a_watch_
            compile::a_signal_that_ends_a_compile_ends_the_lean_it_waits_on
            compile::a_runner_that_computes_past_its_deadline_without_writing_finishes
            compile::lean_work_that_never_ends_stops_once_at_its_limit_or_deadline
            compile::a_law_never_runs_on_the_lake_on_the_path
            compile::compile_rebuilds_a_library_build_that_lost_its_lakefile_or_its_runner_and_proves_its_law
            compile::compile_deletes_the_staging_folder_a_dead_build_left_and_proves_its_law
            compile::compile_deletes_the_generated_code_and_the_lake_package_an_earlier_mago_left_and_proves_its_law
            compile::compile_deletes_the_lean_package_once_no_law_remains
            compile::compile_proves_the_laws_of_two_stale_files_with_one_runner
            compile::compile_names_the_cache_folder_the_law_checker_cannot_create
            compile::compile_reports_an_unavailable_law_checker_on_each_file_that_needs_it
            compile::a_second_compile_leaves_the_compiled_file_byte_identical_and_starts_no_lean_process
            compile::an_edit_to_a_file_no_law_reaches_starts_no_lean_process
            compile::compiles_that_start_together_
            compile::compiles_with_different_threads_share_one_compile
            compile::a_compile_takes_its_turn_after_the_run_that_holds_the_write_lock
            compile::compile_keeps_the_engine_s_compile_lock
            compile::compile_replaces_a_compiled_file_by_rename_so_no_reader_sees_a_partial_file
            compile::compile_writes_files_with_the_mode_of_a_new_file
            compile::compile_reads_a_source_rewritten_at_the_same_size_with_its_modification_time_set_back
            compile::compile_writes_the_compiled_file_at_the_new_target_of_a_link_to_an_identical_copy
            compile::compile_reports_a_link_to_a_file_outside_the_project_and_writes_no_compiled_file_for_it
            compile::compile_skips_a_dangling_link_beside_a_file_that_reaches_an_extension
            compile::a_source_deleted_while_the_compile_runs_fails_nothing_and_the_next_compile_leaves_it_out
            compile::compile_refuses_a_class_beside_a_folder_of_its_name_with_or_without_a_law
            external_analyzer_lifecycle::
            external_analyzer_invocation::
          )
          binaries=(
            sharp/mago/crates/database/src/lib.rs
            sharp/mago/crates/extension/src/lib.rs
            sharp/mago/crates/extension/tests/process_group.rs
            sharp/mago/crates/sharp-lean/src/lib.rs
            sharp/mago/src/main.rs
            "${main[@]/#/sharp/mago/tests/main.rs::}"
          )
          chosen=()
          for binary in "${binaries[@]}"; do
            chosen+=(--binary "$binary")
          done
          sharp/bin/test --mago --no-build "${chosen[@]}" || workspace=$?
          echo "mago's workspace tests took $SECONDS s."
          suite_status=0
          wait "$suite" || suite_status=$?
          echo "::group::The PHP# suite, which ran beside mago's workspace tests"
          cat "$suite_log"
          echo "::endgroup::"
          echo "The PHP# suite and mago's workspace tests took $SECONDS s."
          if ((suite_status != 0 || workspace != 0)); then
            echo "::error::The PHP# suite exited $suite_status and mago's workspace tests $workspace."
            exit 1
          fi
      # sharp/bin/check plain-php on the Mac's Homebrew PHP, with the dev build the suites ran, in the folder that check
      # reads the test-run mago from.
      - name: Run mago from Composer on plain PHP, and stop sharp/phpunit's tests on it
        run: |
          mkdir -p "$RUNNER_TEMP/target/test-run"
          cp sharp/build/darwin-arm64/mago/debug/mago "$RUNNER_TEMP/target/test-run/mago"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" sharp/bin/check plain-php
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
      - name: Remove what the next Mac job doesn't reuse
        if: always()
        uses: ./.github/actions/clean-kept-build
  # release.yml builds Mago's binaries, the macOS one with profile-guided optimization, their attestations, Mago's source
  # archives, their SHA-256s and the release's notes, in the push of the release's commit while its GitHub release isn't
  # published, and RELEASE publishes them as they are once every check of the push passed. Only that commit's own run
  # builds them, since each attestation names the run's commit as the one it was built from. A pull request's run never
  # builds them, so the Mac job's checks set its length. A called workflow's jobs may ask only for permissions its
  # caller grants.
  RELEASE_ASSETS:
    needs: CHANGES
    if: contains(needs.CHANGES.outputs.missing, 'assets') && (needs.CHANGES.outputs.tagged || github.sha) == github.sha
    uses: ./.github/workflows/release.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
  # This workflow's one required check. A job skipped by its `if` reports one check under the job's
  # name, so CI_PASSED stands in for every job it needs. It fails when any of them failed or was
  # cancelled, a release that failed to publish among them. mago.yml's ci-passed is the other
  # required check, and its plain-php job runs mago from Composer on plain PHP.
  CI_PASSED:
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    needs:
      - CHANGES
      - BUILD_LINUX
      - LINUX
      - MAGO
      - UPSTREAM
      - SPEC
      - HOSTS
      - SPEED
      - WORKFLOWS
      - MACOS
      - RELEASE_ASSETS
      - IMAGE
      - RELEASE
      - COMPOSER
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      # Only for the actions below.
      - name: git checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Every job passed, or skipped a tree that a pull request's run passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: >-
            BUILD_LINUX, LINUX, MAGO, UPSTREAM, SPEC, HOSTS, SPEED, MACOS, RELEASE_ASSETS, IMAGE, RELEASE, COMPOSER
          jobs: ${{ toJSON(needs) }}
      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed run on master
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/red-master-issue
        with:
          title: A push to master failed PHP# CI
          range: ${{ needs.CHANGES.outputs.base && format('{0}..{1}', needs.CHANGES.outputs.base, github.sha) || '' }}
      # BUILD_LINUX saved its target and ccache on master when it ended, and HOSTS its Go caches, so this job, which
      # needs both, deletes the ones they replaced. IMAGE saved the engine ccache on master and on next's own pull
      # request.
      - name: Delete the caches this run replaced
        if: >-
          ${{ always() && (github.event_name == 'push' && needs.BUILD_LINUX.result == 'success'
          || github.head_ref == 'next' && needs.IMAGE.result == 'success') }}
        uses: ./.github/actions/mago-cache-prune
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # Splits sharp/composer and sharp/mago and pushes them to master of heyJordanParker/php-sharp-composer and
  # heyJordanParker/mago-sharp, whose webhooks tell Packagist, once every check of the push passed: it needs RELEASE,
  # and a job's failure() counts every job before it. For a release, it then pushes tag v<version> to each mirror that
  # lacks it, once RELEASE made the GitHub release public: the split of the release's commit, which tag v<version>
  # names, so a later push that finishes a release tags what the release holds. The pushes never force, so a mistake
  # can't rewind a published package.
  COMPOSER:
    needs: [CHANGES, RELEASE]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    concurrency: composer-${{ github.ref }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.RELEASE.outputs.version }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Install splitsh-lite
        uses: ./.github/actions/splitsh-lite
      - name: Split sharp/composer
        run: splitsh-lite --prefix=sharp/composer --target=refs/heads/composer
      - name: Split sharp/composer and sharp/mago at the release's tag
        if: env.VERSION
        run: |
          splitsh-lite --prefix=sharp/composer --origin="tags/v$VERSION" --target=refs/heads/composer-release
          splitsh-lite --prefix=sharp/mago --origin="tags/v$VERSION" --target=refs/heads/mago-release
      - name: git checkout heyJordanParker/php-sharp-composer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/php-sharp-composer
          ssh-key: ${{ secrets.PHP_SHARP_COMPOSER_DEPLOY_KEY }}
          path: sharp/build/php-sharp-composer
          fetch-depth: 0
      # A release's tag here becomes the plugin release of the same version: the split plus a commit that adds the
      # release's docs/spec.md as spec.md, so a project reads the spec its version follows at
      # vendor/heyjordanparker/php-sharp-composer/spec.md. A rerun finds the tag an earlier attempt pushed, and leaves it.
      - name: Push the split, and a release's tag with its spec
        working-directory: sharp/build/php-sharp-composer
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer
          git push origin "FETCH_HEAD:$GITHUB_REF"
          if [[ -z $VERSION ]]; then
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "heyJordanParker/php-sharp-composer already has tag v$VERSION."
            exit 0
          fi
          git fetch "$GITHUB_WORKSPACE" refs/heads/composer-release
          git switch --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" show "v$VERSION:docs/spec.md" > spec.md
          git add spec.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "The spec PHP# $VERSION follows"
          git push origin "HEAD:refs/tags/v$VERSION"
      - name: Split sharp/mago
        run: splitsh-lite --prefix=sharp/mago --target=refs/heads/mago
      - name: git checkout heyJordanParker/mago-sharp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp
          fetch-depth: 0
      # splitsh-lite starts the split at the commit that added sharp/mago, so a branch the mirror had before the move
      # isn't in the split, and its push is skipped until that branch is rewritten once. git subtree split would keep
      # that history, but it walks all of Mago's history in shell recursion and took more than 8 minutes without
      # finishing.
      - name: Push the split
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          if git rev-parse -q --verify "origin/$GITHUB_REF_NAME" > /dev/null \
            && ! git merge-base --is-ancestor "origin/$GITHUB_REF_NAME" FETCH_HEAD; then
            echo "::warning::The split of sharp/mago does not contain heyJordanParker/mago-sharp's $GITHUB_REF_NAME, so pushing it would rewrite that branch. The push is skipped."
            exit 0
          fi
          git push origin "FETCH_HEAD:$GITHUB_REF"
      # A release's heyjordanparker/mago-sharp version is the split plus a commit that adds the release's SHA-256s as
      # composer/sha256sums.txt. The Composer wrapper refuses an archive whose SHA-256 differs, so the package version
      # pins the exact binary, as esbuild's and Biome's npm packages do. The tag pins them for good, so they are the
      # published release's sums file, which install.sh checks a download against, and every asset a user downloads from
      # the release must match them.
      - name: The published assets match the release's SHA-256s
        if: env.VERSION
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published="$RUNNER_TEMP/published"
          gh release download "v$VERSION" --dir "$published"
          if ! (cd "$published" && sha256sum --check --strict "mago-$VERSION-sha256sums.txt"); then
            echo "::error::An asset of release v$VERSION has a SHA-256 other than its sums file names, so no heyjordanparker/mago-sharp tag is pushed."
            exit 1
          fi
      # A rerun finds the tag an earlier attempt pushed, and leaves it.
      - name: Push the release's tag, with the SHA-256 of every release asset
        if: env.VERSION
        working-directory: sharp/build/mago-sharp
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "heyJordanParker/mago-sharp already has tag v$VERSION."
            exit 0
          fi
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago-release
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/published/mago-$VERSION-sha256sums.txt" composer/sha256sums.txt
          git add composer/sha256sums.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "The SHA-256 of every mago $VERSION release asset"
          git push origin "HEAD:refs/tags/v$VERSION"
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # The runtime image, FrankenPHP on the thread-safe engine, as <version>. Each platform builds on a runner of its own
  # architecture with -O2 and --enable-werror, where GCC finds -Wmaybe-uninitialized and libcurl's type checks, so a
  # warning one architecture alone finds fails. Each pushes its image by digest, with BuildKit's provenance and SBOM
  # attestations, and RELEASE tags the two as one.
  # BuildKit, its SBOM scanner and the bases are base-images.yml's copies in ghcr.io at pinned digests, pulled after the
  # login, so no pull is an anonymous Docker Hub pull (#86). The engine changes PHP's internal structures, so an
  # extension can stop building or loading: the image builds every extension it ships, and the job calls into each one
  # from the pushed image, as an app runs them. Every pull request's push runs it, a push to master whose tree no pull
  # request's run passed, and the push of a release's commit whose images no run built. The two platforms build at
  # once, since a run ends with its slowest job: each took 12 to 13 minutes on the pushes of pull requests #351 and #352.
  IMAGE:
    name: IMAGE (${{ matrix.platform }})
    if: >-
      ${{ !needs.CHANGES.outputs.passed || (contains(needs.CHANGES.outputs.missing, 'images')
      && !needs.CHANGES.outputs.images && (needs.CHANGES.outputs.tagged || github.sha) == github.sha) }}
    needs: CHANGES
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      # Every extension the image holds beside the ones PHP builds by default, as sharp/README.md lists them.
      EXTENSIONS: bcmath calendar exif ftp gd igbinary imagick intl pcntl pdo_mysql pdo_pgsql pgsql redis shmop sockets sysvmsg sysvsem sysvshm zip
      # The extensions the -dev image adds to those.
      DEV_EXTENSIONS: excimer
      # The builds' platform and SBOM scanner.
      PLATFORM: ${{ matrix.platform }}
      SBOM: generator=ghcr.io/heyjordanparker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
    steps:
      # The builds' context, and .github/actions/boot-image and sharp/bin/php-extensions.
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up BuildKit with the job's Actions cache
        uses: ./.github/actions/buildkit
      # The engine's ccache, the cache mount the Dockerfile's php-base stage compiles through, as .github/actions/mago-cache
      # keeps a target: next's own pull request and a push to master save it under the commit, since their own later
      # runs restore it, and CI_PASSED deletes the one it replaced. Every other run restores the newest and saves nothing.
      - name: Engine ccache, saved by next's own pull request and master
        if: github.head_ref == 'next' || github.ref == 'refs/heads/master'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/engine-ccache
          key: IMAGE_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/runtime/frankenphp.Dockerfile') }}-${{ github.sha }}
          restore-keys: IMAGE_CCACHE-${{ runner.arch }}-
      - name: Engine ccache, restored only
        if: github.head_ref != 'next' && github.ref != 'refs/heads/master'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/engine-ccache
          key: IMAGE_CCACHE-${{ runner.arch }}-${{ hashFiles('sharp/docker/runtime/frankenphp.Dockerfile') }}-${{ github.sha }}
          restore-keys: IMAGE_CCACHE-${{ runner.arch }}-
      # BuildKit's cache mount lives in its builder, which each job starts anew, so this copies the folder into the
      # mount before the builds and back out after them, as Docker's documentation for cache mounts in GitHub Actions
      # does. Its post step runs before the cache's save, which is declared before it.
      - name: Put the engine ccache in BuildKit's cache mount, and take it back after the builds
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {"${{ runner.temp }}/engine-ccache": {"target": "/root/.cache/ccache", "id": "sharp-engine-ccache"}}
          utility-image: ghcr.io/containerd/busybox:1.36@sha256:7b3ccabffc97de872a30dfd234fd972a66d247c8cfc69b0550f276481852627c
          # Outside the checkout, which is the builds' context.
          scratch-dir: ${{ runner.temp }}/buildkit-cache-dance
          skip-extraction: ${{ github.head_ref != 'next' && github.ref != 'refs/heads/master' }}
      # The build's context is the job's checkout, which actions/checkout fetched at the commit's SHA, so a ref moved
      # after the push builds nothing else. BuildKit's own fetch of that commit from GitHub took 188 s on run
      # 45088111311's amd64 job, where the checkout took 8 s.
      # The -dev image's Lean layer, the Dockerfile's lean-layer stage, kept in BuildKit's GitHub Actions cache under the
      # platform's scope, which next's own pull request and a push to master write, as the engine ccache, and every run
      # reads, SPEC's among them. It changes only with the Lean version, so the -dev build below finds its compressed
      # blob there.
      - name: Build the -dev image's Lean layer through BuildKit's Actions cache
        env:
          WRITE: ${{ github.head_ref == 'next' || github.ref == 'refs/heads/master' }}
        run: |
          scope="lean-${PLATFORM//\//-}"
          write=()
          if [[ $WRITE == true ]]; then
            write=(--cache-to "type=gha,scope=$scope,mode=min")
          fi
          sharp/bin/network docker buildx build \
            --file sharp/docker/runtime/frankenphp.Dockerfile \
            --target lean-layer \
            --platform "$PLATFORM" \
            --build-arg REGISTRY=ghcr.io/heyjordanparker \
            --cache-from "type=gha,scope=$scope" \
            "${write[@]}" \
            --output type=cacheonly \
            .
          echo "LEAN_CACHE=type=gha,scope=$scope" >> "$GITHUB_ENV"
      # Each build runs through sharp/bin/network, so a registry or download request the network fails, as a base image's
      # manifest, a git source or a package, runs the build again from BuildKit's cache of the steps that ended. The
      # flags are the ones docker/build-push-action passed, its builder-id among them.
      - name: Build and push the image by digest
        id: build
        run: &build-image |
          sharp/bin/network docker buildx build \
            --file sharp/docker/runtime/frankenphp.Dockerfile \
            ${TARGET:+--target "$TARGET"} \
            ${CACHE_FROM:+--cache-from "$CACHE_FROM"} \
            --platform "$PLATFORM" \
            --build-arg REGISTRY=ghcr.io/heyjordanparker \
            --provenance "mode=max,builder-id=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --sbom "$SBOM" \
            --output type=image,name=ghcr.io/heyjordanparker/php-sharp,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file "$RUNNER_TEMP/$GITHUB_ACTION.json" \
            .
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/$GITHUB_ACTION.json")" >> "$GITHUB_OUTPUT"
      # The -dev image, the runtime image with the law checker's Lean in Mago's cache folder, which RELEASE tags
      # <version>-dev. The build reuses the runtime image's stages from the build before it.
      - name: Build and push the -dev image by digest
        id: dev
        env:
          TARGET: dev
          CACHE_FROM: ${{ env.LEAN_CACHE }}
        run: *build-image
      # The steps below run both images, so they pull here, where a dropped connection runs the pull again.
      - name: Pull the pushed images
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          DEV: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
        run: |
          sharp/bin/network docker pull --quiet "$IMAGE"
          sharp/bin/network docker pull --quiet "$DEV"
      # A critical or high CVE that a fixed package resolves fails the job, so the digest is never uploaded and
      # RELEASE tags none. aquasecurity/trivy-action's v0.35.0 and later are immutable releases, made after its tags
      # were rewritten to malware on 2026-03-19, and Trivy's v0.71.1 and later fix GHSA-mcj4-mphf-j9ff.
      - name: Scan the pushed image for fixable critical and high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
          version: v0.76.1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Start the pushed image on its default command and request a page
        uses: ./.github/actions/boot-image
        with:
          image: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
      # No job runs the PHP# suite on arm64, so this platform's engine shows here that it starts and loads PHP#.
      - name: The image's php prints its version and lists the sharp extension
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" php -v
          if ! docker run --rm "$IMAGE" php -m | grep -qx sharp; then
            echo "::error::php -m in the $PLATFORM image lists no sharp extension."
            exit 1
          fi
      # mago reads the Lean of its compile from lean/lean-<version>-<platform>/ in Mago's cache folder, which XDG_CACHE_HOME
      # puts in /var/cache/mago, so a compile in the -dev image downloads nothing, run by any user.
      - name: A user other than root runs the -dev image's Lean and writes in Mago's cache folder
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
        run: |
          archive="lean-$(sed 's/.*:v//' sharp/mago/crates/sharp-lean/lean/lean-toolchain)-linux"
          if [[ $PLATFORM == linux/arm64 ]]; then
            archive+=_aarch64
          fi
          docker run --rm --user 1000:1000 --env ARCHIVE="$archive" "$IMAGE" \
            sh -c '"$XDG_CACHE_HOME/mago/lean/$ARCHIVE/bin/lake" --version && touch "$XDG_CACHE_HOME/mago/install.lock"'
      - name: Check that php -m lists each extension, and call into each one from FrankenPHP's php-cli
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.build.outputs.digest }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS is a list of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src "$IMAGE" frankenphp php-cli sharp/bin/php-extensions $EXTENSIONS
      - name: Check that the -dev image's php -m lists each extension and the ones it adds, and call into each one
        env:
          IMAGE: ghcr.io/heyjordanparker/php-sharp@${{ steps.dev.outputs.digest }}
        run: |
          # shellcheck disable=SC2086 # EXTENSIONS and DEV_EXTENSIONS are lists of extensions.
          docker run --rm --volume "$PWD:/src" --workdir /src "$IMAGE" frankenphp php-cli sharp/bin/php-extensions $EXTENSIONS $DEV_EXTENSIONS
      # Each file is named by its image's digest and holds the commit the image was built from.
      - name: Keep the digests for RELEASE
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DEV: ${{ steps.dev.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/digests" "$RUNNER_TEMP/dev-digests"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/dev-digests/${DEV#sha256:}"
      # Kept as long as release.yml's assets, as the repository's artifact retention sets. The name keeps the frankenphp
      # of the runs that also built php-fpm's image, so a tag of their commits tags FrankenPHP's alone.
      - name: Upload the digest for RELEASE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-frankenphp-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
      - name: Upload the -dev digest for RELEASE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-dev-${{ strategy.job-index }}
          path: ${{ runner.temp }}/dev-digests/*
          if-no-files-found: error
      - *cancel-failed-run
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
  # Publishes what sharp/bin/check --release finds missing of the release of sharp/mago/Cargo.toml's version, once
  # every job before it passed, and mago.yml's run of the same push: the GitHub release of the files RELEASE_ASSETS
  # built, and the runtime image as ghcr.io/heyjordanparker/php-sharp:<version>, never as latest, with its -dev image as
  # <version>-dev, from the run that built them on the release's tree. COMPOSER then pushes the Composer packages' tags.
  # The release is the commit tag v<version> names, which sharp/bin/land creates with the language owner's login on the
  # merge commit that first holds the version: GitHub refuses GITHUB_TOKEN a tag on a commit whose workflows differ from
  # master's, and runs 45025602373 and 45027728255 failed to create v0.6.50 so. Each part publishes once, so a later
  # push finishes a release an earlier one left half published, and a rerun leaves what an earlier attempt published.
  RELEASE:
    needs: [CHANGES, BUILD_LINUX, LINUX, MAGO, UPSTREAM, SPEC, HOSTS, SPEED, WORKFLOWS, MACOS, RELEASE_ASSETS, IMAGE]
    if: ${{ !failure() && !cancelled() && needs.CHANGES.outputs.bump == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    outputs:
      commit: ${{ steps.run.outputs.commit }}
      version: ${{ needs.CHANGES.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.CHANGES.outputs.version }}
      MISSING: ${{ needs.CHANGES.outputs.missing }}
    steps:
      # The tag is read again, since CHANGES can run before sharp/bin/land created it, and then took this commit for
      # the release's. RELEASE_ASSETS ran only in the release commit's own push, since each attestation names the run's
      # commit as the one it was built from, and IMAGE built the images there when no other run did.
      - name: Find the release's commit, and the run that built its images
        id: run
        env:
          IMAGES: ${{ needs.CHANGES.outputs.images }}
        run: |
          if ! commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha 2> /dev/null); then
            echo "::error::Tag v$VERSION doesn't exist yet, so nothing of release $VERSION is published. sharp/bin/land creates it on the merge commit that first holds the version, and the next push to master publishes what is missing."
            exit 1
          fi
          built="the push run of $commit"
          if [[ $MISSING == *assets* && $commit != "$GITHUB_SHA" ]]; then
            echo "::error::Release v$VERSION isn't published, and only $built builds its files, since each attestation names its run's commit. Rerun the failed jobs of $built."
            exit 1
          fi
          images=
          if [[ $MISSING == *images* ]]; then
            images=${IMAGES##*/}
            if [[ -z $images && $commit == "$GITHUB_SHA" ]]; then
              images=$GITHUB_RUN_ID
            elif [[ -z $images ]]; then
              echo "::error::No run built the images of commit $commit's tree, and only $built builds them. Rerun the failed jobs of $built."
              exit 1
            fi
            echo "Release $VERSION tags the images run $images built."
          fi
          {
            echo "commit=$commit"
            echo "tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"
          echo "Release $VERSION is commit $commit, and publishes:${MISSING:+ $MISSING}."
      # Its pull request's run passed both workflows on this tree, or this push's run of mago.yml runs every Mago check.
      - name: Mago CI passed on this push
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mago.yml/runs?head_sha=$GITHUB_SHA&event=push" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z $run ]]; then
            echo "::error::Mago CI has no push run on commit $GITHUB_SHA, so release $VERSION isn't published."
            exit 1
          fi
          gh run watch "$run" --compact --exit-status --interval 15
      # Each download stops after 5 minutes and runs once more, as LINUX's explain.
      - name: Download the assets
        id: assets
        if: contains(env.MISSING, 'assets')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ env.VERSION }}-*
          path: assets
          merge-multiple: true
      - name: Download the assets, the second try
        if: steps.assets.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ env.VERSION }}-*
          path: assets
          merge-multiple: true
      - name: Download the SHA-256s
        id: sha256sums
        if: contains(env.MISSING, 'assets')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: assets
      - name: Download the SHA-256s, the second try
        if: steps.sha256sums.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: assets
      - name: Download the release notes
        id: notes
        if: contains(env.MISSING, 'assets')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Download the release notes, the second try
        if: steps.notes.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}
      # An asset changed after its build fails its SHA-256 or its attestation, and one built from another tree fails the
      # tree, so nothing is published.
      - name: The assets are the ones the SHA-256s name, signed by release.yml and built from the release's tree
        if: contains(env.MISSING, 'assets')
        env:
          TREE: ${{ steps.run.outputs.tree }}
        run: |
          sums="mago-$VERSION-sha256sums.txt"
          { cut -d ' ' -f 3- "assets/$sums"; echo "$sums"; } | sort > expected-assets.txt
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::This run kept other assets than the ones $sums names, so nothing is published."
            exit 1
          }
          (cd assets && sha256sum --check --strict "$sums")
          mapfile -t assets < <(cut -d ' ' -f 3- "assets/$sums")
          for asset in "${assets[@]}"; do
            commits=$(gh attestation verify "assets/$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --format json \
              --jq '.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[].digest.gitCommit // empty')
            if [[ -z $commits ]]; then
              echo "::error::$asset's attestation names no commit it was built from, so nothing is published."
              exit 1
            fi
            for commit in $commits; do
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)
              if [[ $built != "$TREE" ]]; then
                echo "::error::$asset was built from commit $commit, whose tree $built isn't the release's tree $TREE, so nothing is published."
                exit 1
              fi
            done
          done
          echo "Every asset matches its SHA-256 and its attestation, and was built from tree $TREE."
      # The release takes the tag sharp/bin/land created, as it is, and creates no ref.
      - name: Upload every asset to the draft release, check it, then publish it
        if: contains(env.MISSING, 'assets')
        env:
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          tag="v$VERSION"
          if ! is_draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2> view-error.txt); then
            grep -q "release not found" view-error.txt || { cat view-error.txt >&2; exit 1; }
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes-file "$NOTES"
            is_draft=true
          fi
          if [[ $is_draft != true ]]; then
            echo "Release $tag is already published."
            exit 0
          fi
          gh release upload "$tag" assets/* --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' | sort > released-assets.txt
          diff -u expected-assets.txt released-assets.txt || {
            echo "::error::Draft release $tag holds different assets than expected, so it stays a draft."
            exit 1
          }
          gh release edit "$tag" --notes-file "$NOTES" --draft=false
      - name: Download the platforms' digests
        id: digests
        if: contains(env.MISSING, 'images')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-frankenphp-*
          path: ${{ runner.temp }}/digests/runtime
          merge-multiple: true
          run-id: ${{ steps.run.outputs.images }}
          github-token: ${{ github.token }}
      - name: Download the platforms' digests, the second try
        if: steps.digests.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-frankenphp-*
          path: ${{ runner.temp }}/digests/runtime
          merge-multiple: true
          run-id: ${{ steps.run.outputs.images }}
          github-token: ${{ github.token }}
      - name: Download the platforms' -dev digests
        id: dev-digests
        if: contains(env.MISSING, 'images')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-dev-*
          path: ${{ runner.temp }}/digests/dev
          merge-multiple: true
          run-id: ${{ steps.run.outputs.images }}
          github-token: ${{ github.token }}
      - name: Download the platforms' -dev digests, the second try
        if: steps.dev-digests.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-dev-*
          path: ${{ runner.temp }}/digests/dev
          merge-multiple: true
          run-id: ${{ steps.run.outputs.images }}
          github-token: ${{ github.token }}
      - name: Log in to ghcr.io
        if: contains(env.MISSING, 'images')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Each digest's file holds the commit IMAGE built it from: the runtime image's in runtime/, tagged <version>, and the
      # -dev image's in dev/, tagged <version>-dev. A download that found no digest leaves its folder out.
      - name: Tag the platforms' images as one image each
        id: tag
        if: contains(env.MISSING, 'images')
        env:
          TREE: ${{ steps.run.outputs.tree }}
          IMAGES: ${{ steps.run.outputs.images }}
        run: |
          image=ghcr.io/heyjordanparker/php-sharp
          for kind in runtime dev; do
            tag="$image:$VERSION"
            if [[ $kind == dev ]]; then
              tag+=-dev
            fi
            sources=()
            for file in "$RUNNER_TEMP/digests/$kind"/*; do
              if [[ ! -f $file ]]; then
                echo "::error::Run $IMAGES kept no digest for $tag, so the images aren't tagged."
                exit 1
              fi
              digest=${file##*/}
              commit=$(< "$file")
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)
              if [[ $built != "$TREE" ]]; then
                echo "::error::IMAGE built $image@sha256:$digest from commit $commit, whose tree $built isn't the release's tree $TREE."
                exit 1
              fi
              sources+=("$image@sha256:$digest")
            done
            if [[ ${#sources[@]} != 2 ]]; then
              echo "::error::IMAGE pushed ${#sources[@]} platform images for $tag, not linux/amd64's and linux/arm64's."
              exit 1
            fi
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
            docker buildx imagetools inspect "$tag"
            echo "$kind=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          done
      # `gh attestation verify oci://ghcr.io/heyjordanparker/php-sharp:<version> --repo heyJordanParker/php-sharp` checks it,
      # and the same command with <version>-dev the -dev image's.
      - name: Attest the image's provenance
        if: contains(env.MISSING, 'images')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.runtime }}
          push-to-registry: true
      - name: Attest the -dev image's provenance
        if: contains(env.MISSING, 'images')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/heyjordanparker/php-sharp
          subject-digest: ${{ steps.tag.outputs.dev }}
          push-to-registry: true
