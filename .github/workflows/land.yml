name: Land next

# next's pull request into master merges only when its newest push passed, and pushes to next come faster than a run, so
# it never merged: #536 held 43 commits of next on 2026-11-20 while each run tested a newer push. The "master merge gate"
# ruleset reads CI_PASSED and ci-passed from a pull request's own runs. So once both of next's runs of a commit passed,
# this opens a pull request from branch land/<sha> at that commit, which merges itself once its own runs pass. Those runs
# skip every check, the Mac's among them, as .github/actions/passed-tree explains, because next's run passed the same
# tree, so a commit lands in about a minute.
#
# GITHUB_TOKEN can't open a pull request here, and a pull request it opened would start no workflow, as sharp/README.md
# says. So the pull request comes from the landing App's token, whose merge is a push that starts master's push runs,
# which save the caches every run restores. Its key needs Contents, Pull requests and Workflows to read and write: a
# landing branch and its merge carry changes under .github/workflows.
on:
  workflow_run:
    workflows: [PHP#, Mago]
    types: [completed]
    branches: [next]

permissions: {}

# PHP# and Mago end at different times, and each end starts this, so two runs for one commit go one after the other, and
# the second finds the first's pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  LAND:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Both of next's runs passed this commit of next, and master doesn't hold it
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
          next=$(api "compare/$SHA...next" .status)
          if [[ $next != ahead && $next != identical ]]; then
            echo "next doesn't hold $SHA, as its comparison with next is \"$next\", so nothing lands."
            exit 0
          fi
          master=$(api "compare/master...$SHA" .status)
          if [[ $master == behind || $master == identical ]]; then
            echo "master already holds $SHA."
            exit 0
          fi
          for workflow in sharp.yml mago.yml; do
            run=$(api "actions/workflows/$workflow/runs?head_sha=$SHA&event=pull_request" \
              '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "next" and .head_repository.full_name == env.GITHUB_REPOSITORY)][0].html_url // empty')
            if [[ -z $run ]]; then
              echo "$workflow has passed no run of $SHA yet, so the commit lands when one does."
              exit 0
            fi
            echo "$workflow passed $SHA in $run."
            echo "${workflow%.yml}=$run" >> "$GITHUB_OUTPUT"
          done
          echo "land=true" >> "$GITHUB_OUTPUT"
      - name: The landing App's client ID and key are set
        if: steps.ready.outputs.land
        env:
          CLIENT_ID: ${{ vars.LAND_APP_CLIENT_ID }}
          KEY: ${{ secrets.LAND_APP_KEY != '' }}
        run: |
          if [[ -z $CLIENT_ID || $KEY != true ]]; then
            echo "::error::The Actions variable LAND_APP_CLIENT_ID or the secret LAND_APP_KEY is not set, so $SHA can't land."
            exit 1
          fi
      - name: The landing App's token
        id: app
        if: steps.ready.outputs.land
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LAND_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAND_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # The repository deletes a pull request's branch when it merges.
      - name: Open the pull request that lands the commit, which merges once its own runs pass
        if: steps.ready.outputs.land
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PHP_SHARP: ${{ steps.ready.outputs.sharp }}
          MAGO: ${{ steps.ready.outputs.mago }}
        run: |
          branch=land/$SHA
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$branch&state=all" --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            echo "Pull request #$number already lands $SHA."
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --silent; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" --silent
          fi
          number=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" -f base=master -f head="$branch" \
            -f title="Land next at ${SHA:0:11}" \
            -f body="Lands $SHA of next, whose PHP# run $PHP_SHARP and Mago run $MAGO passed." --jq .number)
          gh pr merge "$number" --auto --merge --match-head-commit "$SHA"
          echo "Pull request #$number lands $SHA once its runs pass."
