name: Clean up a closed pull request

# Once a pull request closes, merged or not, its runs check a tree nothing lands any more, and its caches serve nothing.
# A run in progress always finishes, since sharp.yml and mago.yml never cancel one, so a closed pull request's run kept
# the one Mac runner: pull request #534 closed at 15:43 UTC on 2026-11-20, and its run 44765885047 started MACOS at
# 16:20 with its macOS release build still waiting, while next's Mac jobs waited behind them. So this cancels each of
# its runs that hasn't ended. Its runs saved their caches under its merge ref, refs/pull/<number>/merge, which only its
# own runs restore, and they stayed until GitHub evicted them, so this deletes them too, as GitHub's "Force deleting
# cache entries" example does. A pull request from another repository gets a token that can do neither, so its runs
# end and its caches wait for eviction.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  CLEAN_UP:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A run's pull requests empty once it merges, so its runs are the pull_request runs of its head branch.
      - name: Cancel every run of the pull request that hasn't ended
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for status in requested waiting pending queued in_progress; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=$BRANCH&status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY) | "\(.id)\t\(.name)"'
          done | sort -u > "$RUNNER_TEMP/runs"
          echo "$(wc -l < "$RUNNER_TEMP/runs") runs of $BRANCH haven't ended."
          while IFS=$'\t' read -r id name; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" --silent
            echo "Cancelled $name run $id."
          done < "$RUNNER_TEMP/runs"
      - name: Delete every cache the pull request's runs saved
        env:
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$REF&per_page=100" \
            --jq '.actions_caches[] | "\(.id)\t\(.key)"' > "$RUNNER_TEMP/caches"
          echo "$(wc -l < "$RUNNER_TEMP/caches") caches on $REF."
          while IFS=$'\t' read -r id key; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
            echo "Deleted $key."
          done < "$RUNNER_TEMP/caches"
