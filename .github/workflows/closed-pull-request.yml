name: Clean up a closed pull request

# Once a pull request closes, merged or not, its runs check a tree nothing lands any more.
# A run in progress finishes, since sharp.yml and mago.yml cancel one only when a job of it failed or a newer push
# arrived, so a closed pull request's run kept the one Mac runner: pull request #534 closed at 15:43 UTC on 2026-11-20, and its run 44765885047
# started MACOS at 16:20 with its macOS release build still waiting, while next's Mac jobs waited behind them. So this
# cancels each of its runs that hasn't ended. A pull request from another repository gets a token that can't, so its
# runs end.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  CLEAN_UP:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A run's pull requests empty once it merges, so its runs are the pull_request runs of its head branch.
      - name: Cancel every run of the pull request that hasn't ended
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for status in requested waiting pending queued in_progress; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=$BRANCH&status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == env.GITHUB_REPOSITORY) | "\(.id)\t\(.name)"'
          done | sort -u > "$RUNNER_TEMP/runs"
          echo "$(wc -l < "$RUNNER_TEMP/runs") runs of $BRANCH haven't ended."
          while IFS=$'\t' read -r id name; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" --silent
            echo "Cancelled $name run $id."
          done < "$RUNNER_TEMP/runs"
