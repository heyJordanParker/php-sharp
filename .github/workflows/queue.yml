name: Queue
# GitHub's merge queue is offered only to repositories an organization owns, and this one is a user's, so this is the
# queue in its shape (#843). It merges the pull requests ready to land onto master's tip and pushes the result to
# staging, whose run runs every check, the Mac's among them, on that tree. That run's LAND moves master to its commit,
# so each landed tree crosses the Mac's tests once: #828 crossed them twice, in pull request run 45570037780 for 55
# minutes, then in push run 45600915642 for 87. It then starts release.yml's release of master's tip when no pull
# request waits to land, or once 3 landings are unreleased, as continuous deployment ships the newest commit: the one
# Mac ran each landing's tests and its 33-minute release build in series, so batches landed 47 to 50 minutes apart
# where their checks take about 26, and the queue's wait grew with each batch (#1023). A pull request is ready once its
# auto-merge is on and its head passed every check master merge gate requires, which are the Linux checks of its own
# run. The gate also requires QUEUE, a check no run reports, so GitHub never merges a pull request itself, and LAND,
# pushing with the deploy key the gate lets past, is the only way onto master.
on:
  # pull_request_target runs this file as master has it, with the deploy key, and runs no file of the pull request: the
  # job only merges its commits.
  pull_request_target:
    types: [auto_merge_enabled]
    branches:
      - master
  # A pull request's own runs ending can make it ready, and a staging run ending frees staging.
  workflow_run:
    workflows: [PHP#, Spec guard]
    types: [completed]
  # A staging run's LAND frees staging before its run ends, so LAND starts the queue: a workflow_dispatch is the one event
  # a job's GITHUB_TOKEN can start a run with.
  workflow_dispatch:
permissions:
  contents: read
# One batch at a time, and a newer event waits for the one in progress, which may have pushed staging meanwhile.
concurrency:
  group: queue
  cancel-in-progress: false
jobs:
  BATCH:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The deploy key pushes staging, since a push with GITHUB_TOKEN starts no workflow, and GitHub refuses that token a
      # commit whose workflows differ from master's. The checkout keeps it for the fetches and the push.
      - name: git checkout, with the deploy key that pushes staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.PHP_SHARP_DEPLOY_KEY }}
          ref: master
      # staging holds master's tip and the last batch merged onto it. While a staging run of it hasn't landed, the batch
      # waits. A run has landed once its LAND job ended, which moved master, or was skipped, as the run failed: the next
      # batch's run then starts, as GitHub's merge queue starts the next group once a group's required checks pass
      # (#1023). A batch whose run passed and whose LAND left master where it was held a pull request that got a push
      # while the batch was on staging, as sharp.yml's LAND explains, so it failed nothing, and the next batch takes
      # every ready pull request at its head, as GitHub's merge queue rebuilds a group without a pushed pull request
      # (#1116). Any other batch master doesn't hold failed: one that held one pull request leaves that pull request
      # out, with a comment, until its head moves, and one that held more takes its oldest pull request alone, so one
      # broken change never holds the others, unless that pull request is no longer ready, as a draft or with auto-merge
      # off, which stopped every batch while staging held the failed one (#875). A batch whose run failed only because
      # a runner stopped answering, as sharp/bin/queue-lost-runner decides, tested no change that failed, so it goes to
      # staging once more, with the same pull requests at the same heads merged onto the same master, as Zuul's
      # `attempts` rerun a job whose node failed. A batch that already went once more fails as any batch does (#915).
      # Every other batch takes every ready pull request, oldest first, as bors-ng's and GitHub's merge queue go on
      # without a pull request that left the queue.
      - name: Merge the ready pull requests onto master and push them to staging
        shell: bash
        run: |
          master=$(git ls-remote origin refs/heads/master | cut -f 1)
          staging=$(git ls-remote origin refs/heads/staging | cut -f 1)
          # Whether the run's LAND job ended. A request that fails counts as not landed, so the batch waits.
          landed() {
            local ended
            ended=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" \
              | jq '[.[].jobs[] | select(.name == "LAND" and .status == "completed")] | length')
            ((ended > 0))
          }
          # Starts release.yml's run of master's tip once $1 landings since the newest public release are unreleased.
          # A tip a tag names is released, and a run of it that hasn't ended releases it. Each staging run's commit that
          # master holds past the newest public release's tag is one landing, since only LAND moves master, to its
          # staging run's commit. A tag whose release stayed a draft shipped nothing: counted from the newest tag,
          # v0.8.55's, whose PUBLISH failed (#1111), master held 2 landings where 3 were unreleased, and no release
          # started. The release group keeps the run in progress, and the newest run waiting replaces an older one.
          release() {
            local tags newest commit landings
            tags=$(git ls-remote --tags origin 'refs/tags/v*')
            if grep -q "^$master" <<< "$tags"; then
              echo "A tag names master's tip $master, so it is released."
              return
            fi
            if (($(gh run list --workflow release.yml --commit "$master" --limit 5 --json status \
              --jq '[.[] | select(.status != "completed")] | length') > 0)); then
              echo "release.yml's run of master's tip $master hasn't ended, so it releases it."
              return
            fi
            newest=$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' \
              | sed -n 's#^v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -t . -k 1,1n -k 2,2n -k 3,3n | tail -n 1)
            commit=$(awk -v tag="refs/tags/v$newest" '$2 == tag || $2 == tag "^{}" { commit = $1 } END { print commit }' \
              <<< "$tags")
            landings=$(comm -12 \
              <(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$commit...$master" --jq '.commits[].sha' | sort -u) \
              <(gh run list --workflow sharp.yml --branch staging --event push --limit 100 --json headSha \
                --jq '.[].headSha' | sort -u) | wc -l)
            if ((landings < $1)); then
              echo "master holds $landings landings since v$newest, fewer than $1, so its release waits."
              return
            fi
            echo "master holds $landings landings since v$newest, so release.yml releases its tip $master."
            gh workflow run release.yml --ref master
          }
          for run in $(gh run list --workflow sharp.yml --branch staging --event push --limit 20 --json databaseId,status \
            --jq '.[] | select(.status != "completed") | .databaseId'); do
            if ! landed "$run"; then
              echo "Staging run $run hasn't landed, so the next batch waits for it."
              exit 0
            fi
          done
          only=
          retry=false
          if [[ -n $staging ]]; then
            compare=$(gh api "repos/$GITHUB_REPOSITORY/compare/$master...$staging")
            if [[ $(jq -r .status <<< "$compare") == ahead || $(jq -r .status <<< "$compare") == diverged ]]; then
              # GitHub creates a push's run seconds after the push, so a staging commit with no ended run yet waits.
              read -r status run < <(gh run list --workflow sharp.yml --branch staging --event push --commit "$staging" \
                --limit 1 --json status,url --jq '.[0] | "\(.status) \(.url)"')
              if [[ $status != completed ]] && ! landed "${run##*/}"; then
                echo "staging's run of $staging hasn't landed, so the next batch waits for it."
                exit 0
              fi
              jq -r '.commits[] | select((.parents | length) == 2 and (.commit.message | startswith("Merge pull request #")))
                | [(.commit.message | capture("^Merge pull request #(?<n>[0-9]+)").n), .parents[1].sha] | @tsv' \
                <<< "$compare" | sort -n > failed-batch.tsv
              gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/${run##*/}/jobs?per_page=100" > jobs.json
              mkdir -p annotations
              for job in $(jq -r '.[].jobs[] | select(.conclusion == "failure") | .id' jobs.json); do
                gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" > "annotations/$job.json"
              done
              retried=false
              while read -r number head; do
                if gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --paginate --jq '.[].body' \
                  | grep -qF "<!-- queue: retried at $head -->"; then
                  retried=true
                fi
              done < failed-batch.tsv
              if (($(jq '[.[].jobs[] | select(.name == "LAND" and .conclusion == "success")] | length' jobs.json) > 0)); then
                echo "$run passed, and its LAND left master where it was, since a pull request of its batch got a push, so this batch takes every ready pull request."
              elif [[ $(sharp/bin/queue-lost-runner jobs.json annotations) == lost ]] && ! $retried; then
                while read -r number head; do
                  gh pr comment "$number" --body "$run failed only because a runner stopped answering, so the queue sends this pull request's batch to staging once more, at $head.
          <!-- queue: retried at $head -->"
                done < failed-batch.tsv
                retry=true
                only=$(cut -f 1 failed-batch.tsv | paste -sd ' ' -)
                echo "$run failed only because a runner stopped answering, so this batch takes pull requests $only again, at the same heads."
              elif (($(wc -l < failed-batch.tsv) == 1)); then
                read -r number head < failed-batch.tsv
                marker="<!-- queue: failed alone at $head -->"
                if ! gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
                  gh pr comment "$number" --body "$run failed with only this pull request in its batch, at $head, so master stays where it was. The queue leaves this pull request out until its head moves: push the fix to its branch.
          $marker"
                fi
              else
                only=$(head -n 1 failed-batch.tsv | cut -f 1)
                echo "$run failed with pull requests $(cut -f 1 failed-batch.tsv | paste -sd ' ' -), so this batch takes #$only alone."
              fi
            fi
          fi
          mapfile -t required < <(gh api "repos/$GITHUB_REPOSITORY/rules/branches/master" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context | select(. != "QUEUE")')
          gh pr list --base master --state open --limit 200 \
            --json number,headRefOid,headRefName,headRepositoryOwner,title,isDraft,autoMergeRequest,statusCheckRollup \
            | jq -r --args '.[] | select(.autoMergeRequest != null and (.isDraft | not))
                | .statusCheckRollup as $checks
                | select(all($ARGS.positional[]; . as $name
                    | [$checks[] | select((.name // .context) == $name) | (.conclusion // .state)] | length > 0 and all(. == "SUCCESS")))
                | [.number, .headRefOid, .headRepositoryOwner.login, .headRefName, .title] | @tsv' "${required[@]}" \
            | sort -n > ready.tsv
          if $retry; then
            only=$(awk -F '\t' 'NR == FNR { held[$1] = $2; next } held[$1] == $2 { print $1 }' failed-batch.tsv ready.tsv \
              | paste -sd ' ' -)
            if [[ -z $only ]]; then
              echo "No pull request of the batch that lost its runner is ready at the head it held, so this batch takes every ready pull request."
            fi
          elif [[ -n $only ]] && ! cut -f 1 ready.tsv | grep -qx "$only"; then
            echo "#$only, the failed batch's oldest pull request, is no longer ready, so this batch takes every ready pull request."
            only=
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          batch=()
          while IFS=$'\t' read -r number head owner branch title; do
            if [[ -n $only && " $only " != *" $number "* ]]; then
              continue
            fi
            if gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --paginate --jq '.[].body' \
              | grep -qF "<!-- queue: failed alone at $head -->"; then
              echo "#$number failed alone at $head, so it waits for a new head."
              continue
            fi
            # The merge runs against the merge base GitHub computes on its servers, with git merge-tree, the merge
            # GitHub built --write-tree (git 2.38) and --merge-base (git 2.40) for, so it needs master, the head and
            # that base at depth 1 and no history. git merge found the base itself in a shallow history, where history
            # a pull request merged ahead of it brought in hid that one base was an ancestor of the other: #1008's
            # merge in the 03:27 batch found 8255a3ea51f and 59d1d960acb, where full history has 8255a3ea51f alone,
            # and it conflicted in files no other pull request of the batch changed (#1002).
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$master...$head" --jq .merge_base_commit.sha)
            git fetch --quiet --no-tags --depth=1 origin "+$master:refs/remotes/origin/master" \
              "+refs/pull/$number/head:refs/queue/$number" "$base"
            if [[ $(git rev-parse "refs/queue/$number") != "$head" ]]; then
              echo "#$number's head moved past $head, the commit its checks passed on, so it waits for its new checks."
              continue
            fi
            if ((${#batch[@]} == 0)); then
              git checkout --quiet --detach "$master"
            fi
            # merge-tree exits 0 with the merged tree and 1 with a conflict, and any other exit is git's own failure.
            status=0
            tree=$(git merge-tree --write-tree --merge-base="$base" HEAD "$head") || status=$?
            if ((status == 0)); then
              merged=$(git commit-tree "$tree" -p HEAD -p "$head" \
                -m "Merge pull request #$number from $owner/$branch" -m "$title")
              git checkout --quiet --detach "$merged"
              batch+=("$number")
              continue
            fi
            if ((status != 1)); then
              echo "git merge-tree failed on #$number with exit $status." >&2
              exit "$status"
            fi
            marker="<!-- queue: conflicts at $head -->"
            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --paginate --jq '.[].body' | grep -qF "$marker"; then
              gh pr comment "$number" --body "This pull request conflicts with master or with a pull request merged ahead of it in the queue's batch, so the queue left it out. Make it again on master.
          $marker"
            fi
          done < ready.tsv
          if ((${#batch[@]} == 0)); then
            echo "No pull request is ready to land."
            release 1
            exit 0
          fi
          git push --force origin HEAD:refs/heads/staging
          echo "staging is $(git rev-parse HEAD): master $master with pull requests ${batch[*]/#/#} merged onto it."
          release 3
