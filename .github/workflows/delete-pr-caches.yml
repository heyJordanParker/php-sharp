name: Delete a closed pull request's caches

# A pull request's runs save their caches under its merge ref, refs/pull/<number>/merge, which only its own runs restore.
# Once it closes, merged or not, nothing restores them, and they stayed until GitHub evicted them, so this deletes them,
# as GitHub's "Force deleting cache entries" example does. pull_request_target gives a pull request from another
# repository a token that can delete them too, and is safe here because the job checks out and runs nothing the pull
# request wrote.
on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete every cache the pull request's runs saved
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$REF&per_page=100" \
            --jq '.actions_caches[] | "\(.id)\t\(.key)"' > "$RUNNER_TEMP/caches"
          echo "$(wc -l < "$RUNNER_TEMP/caches") caches on $REF."
          while IFS=$'\t' read -r id key; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
            echo "Deleted $key."
          done < "$RUNNER_TEMP/caches"
