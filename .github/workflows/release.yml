name: Release

# Runs the checks only macOS can fail in every run, and builds a release's assets in its bump's run: the mago binary per
# platform with its attestation, Mago's source archives, the SHA-256 of every asset and the release's notes. PHP# and
# Mago release at one version, the version of sharp/mago/Cargo.toml's root package, mago, which the engine builds into
# ext/sharp's sharp_version.h, and sharp/CHANGELOG.md must have that version's section.
#
# A release builds its binaries once, as Humble and Farley's Continuous Delivery asks. sharp.yml's RELEASE_ASSETS calls
# this workflow in every pull request's run, beside the suites, and sharp.yml's RELEASE publishes exactly the files a
# bump's run built when the merge's tree is the one that run passed. Its attestations name this workflow as their signer, which
# install.sh and mago self-update verify, so the binaries build here and nowhere else.
on:
  workflow_call:
    inputs:
      # Set in a release's bump, whose files RELEASE publishes. Only that run builds the binaries, aarch64-apple-darwin's
      # with profile-guided optimization, the source archives and the SHA-256s. Every other run is a commit's, which
      # only has to prove it compiles and passes its checks, as its test builds do, so it runs the Mac's checks alone:
      # next's run of 8a08e3b85fb built release binaries nobody published, 34.8 of its Mac job's 59 minutes and 22 and
      # 24 minutes on Linux.
      publish:
        type: boolean
        required: true

# Every artifact is kept as long as the repository's artifact retention sets, 90 days, GitHub's longest.
env:
  CICD_INTERMEDIATES_DIR: ${{ github.workspace }}/_cd-intermediates

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  crate_metadata:
    name: extract crate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: extract crate information
        id: crate_metadata
        run: |
          rustup update stable
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[] | select(.name == "mago") |
            [
              "version=" + .version,
              "maintainer=" + (.authors[0] // ""),
              "homepage=" + (.homepage // ""),
              "msrv=" + (.rust_version // "")
            ] |
            join("\n")
          ' | tee -a "$GITHUB_OUTPUT"
      # The build matrix, one row per target, with these keys besides the target and its runner:
      # - `smoke: true`: Smoke-checks the built binary. Only targets the job's runner can execute set it.
      # - `checks: true`: Also runs every check only macOS can fail, so the one Mac runs one job per run, on its one
      #   build of the engine mago links: the PHP# suite on the debug engine, mago's workspace tests on the dev build,
      #   which keeps the debug assertions and overflow checks the release profile turns off, and plain-php. Only
      #   aarch64-apple-darwin sets it. As four jobs, MACOS, tests (macOS), release-build and this build, they queued
      #   one after another on the Mac, and three of them ran the engine step: 700, 1,443 and 940 s on 0.6.40's green
      #   run 44740612180.
      # - `pgo: true`: Builds with profile-guided optimization, profiled on corpus/. Only aarch64-apple-darwin sets
      #   it, and only in a release's bump. On the M2 Max, fat LTO with one codegen unit and this profile analyzed and
      #   compiled a 14,860-file vendor tree in 15% fewer instructions and 15 to 19% fewer CPU-seconds than a thin-LTO
      #   build of the same source with 16 units, and a 1,536-file PHP# project in 1.6 to 2.4% fewer instructions. So
      #   the release's 37-minute build on the self-hosted Mac stays.
      #
      # The targets PHP# runs on: macOS on Apple silicon, on the self-hosted Apple silicon runners, since GitHub's
      # macos-latest never started on throwaway bump #248: twice its jobs ended "not acquired by Runner of type hosted
      # even after multiple attempts", for macOS arm64's capacity, so a release that waits on it can't publish. And glibc
      # Linux on arm64 and x86_64, each built on a runner of its own architecture, which builds the PHP# engine mago
      # links from its Ubuntu's static archives: 24.04's on arm64, so that binary runs on glibc 2.39 and later, and
      # 22.04's on x86_64, so that one runs on glibc 2.35 and later. Only a release's bump builds the binaries, so a
      # commit's run has the Mac row alone, which runs its checks on its test builds: next's run of 8a08e3b85fb took
      # 131 minutes, its Mac job 59, 34.8 of them the release build, and its Linux release builds 22 and 24.
      - name: The targets this run builds
        id: targets
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          jq -rcn --argjson publish "$PUBLISH" '[
            {target: "aarch64-apple-darwin", os: "macos-arm64-local", smoke: true, pgo: $publish, checks: true},
            if $publish then
              {target: "aarch64-unknown-linux-gnu", os: "ubuntu-24.04-arm", smoke: true},
              {target: "x86_64-unknown-linux-gnu", os: "ubuntu-22.04", smoke: true}
            else empty end
          ] | "jobs=\(.)"' | tee -a "$GITHUB_OUTPUT"
      # The section runs from its "## [<version>]" heading, which may carry a date, to the next version's heading or
      # the link definitions that end the file.
      - name: The release notes are sharp/CHANGELOG.md's section of the version
        env:
          VERSION: ${{ steps.crate_metadata.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$VERSION]" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[.*\]: /) { exit }
            found { print }
          ' ../CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::sharp/CHANGELOG.md has no \"## [$VERSION]\" section, so release $VERSION has no notes. Add the section."
            exit 1
          fi
          cat "$notes"
      # sharp.yml's RELEASE publishes them with the assets.
      - name: "Artifact upload: release notes"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
    outputs:
      name: "mago"
      bin-name: "mago"
      version: ${{ steps.crate_metadata.outputs.version }}
      maintainer: ${{ steps.crate_metadata.outputs.maintainer }}
      homepage: ${{ steps.crate_metadata.outputs.homepage }}
      msrv: ${{ steps.crate_metadata.outputs.msrv }}
      jobs: ${{ steps.targets.outputs.jobs }}

  # sharp/mago/.gitattributes leaves Mago's build script, tests and docs out of git archive, so Mago's source archives
  # copy the checkout.
  source_archive:
    name: Create source code archives
    if: inputs.publish
    runs-on: ubuntu-latest
    needs: crate_metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Create source archives
        id: source_package
        run: |
          VERSION="${{ needs.crate_metadata.outputs.version }}"

          STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/source"
          mkdir -p "${STAGING}"
          rsync -a . "${STAGING}/mago-${VERSION}/"
          TAR_NAME="mago-${VERSION}-source.tar.gz"
          tar -czf "${STAGING}/${TAR_NAME}" -C "${STAGING}" "mago-${VERSION}"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "TAR_PATH=${STAGING}/${TAR_NAME}" >> "$GITHUB_OUTPUT"
          ZIP_NAME="mago-${VERSION}-source.zip"
          cd "${STAGING}"
          zip -r "${ZIP_NAME}" "mago-${VERSION}"
          cd -
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "ZIP_PATH=${STAGING}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (source tar.gz)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.TAR_PATH }}

      - name: Generate artifact attestation (source zip)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.ZIP_PATH }}

      - name: "Artifact upload: source tar.gz"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source_package.outputs.TAR_NAME }}
          path: ${{ steps.source_package.outputs.TAR_PATH }}
          if-no-files-found: error

      - name: "Artifact upload: source zip"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source_package.outputs.ZIP_NAME }}
          path: ${{ steps.source_package.outputs.ZIP_PATH }}
          if-no-files-found: error

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: crate_metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    # The rows crate_metadata's "The targets this run builds" explains.
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.crate_metadata.outputs.jobs) }}

    steps:
      # actions/checkout's clean deletes sharp/build. The Mac's one runner keeps it instead, as
      # .github/actions/clean-kept-build explains, so the engines and mago rebuild only what changed since the runner's
      # last build, where a build from nothing took 19 minutes.
      - name: checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      # A job never installs on the self-hosted Mac, so it checks that Homebrew already has the build's formulae, ccache
      # among them.
      - name: Homebrew has the build's formulae
        if: matrix.job.checks
        shell: bash
        env:
          FORMULAE: autoconf bison ccache curl re2c pkgconf icu4c libiconv libpq libsodium libzip oniguruma
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE

      # The build goes to a target folder of its own beside the dev builds sharp/.cargo's config names, which the Mac's
      # runner keeps between jobs, as clean-kept-build explains, so a build compiles only the crates that changed and
      # links. In sharp/mago/target, which clean-kept-build removes, the profile-guided build compiled every crate twice
      # from nothing: on run 44571273633 the instrumented build took 22.9 minutes, the profiling run 0.8 and the
      # optimized build 12.9. cargo keeps a copy of a crate for each set of RUSTFLAGS, so the instrumented and the
      # optimized builds each keep their own. A GitHub-hosted runner starts empty, so it builds from nothing there too.
      - name: Point CARGO_TARGET_DIR at the release target
        shell: bash
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago-release" >> "$GITHUB_ENV"

      - name: set version env variable
        id: version
        shell: bash
        run: echo "VERSION=${{ needs.crate_metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install what the PHP# engine builds with
        if: contains(matrix.job.os, 'ubuntu')
        uses: ./.github/actions/engine-packages

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.crate_metadata.outputs.msrv }}
          targets: ${{ matrix.job.target }}

      # cargo install puts cargo-pgo in the runner's CARGO_HOME, which the Mac's runner keeps, so it installs it once.
      - name: install PGO tools
        if: matrix.job.pgo
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-pgo &>/dev/null; then
            cargo install cargo-pgo
          fi

      - name: show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          set -x
          gcc --version || true
          ldd --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      # setup-php brew-installs PHP on macOS, so the self-hosted runners use their Homebrew PHP and Composer instead.
      - name: setup PHP for PGO profiling
        if: matrix.job.pgo && runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer

      # The corpus's packages, as its committed lock names them. The self-hosted Mac keeps them in sharp/build, which
      # clean-kept-build keeps, under the lock's hash, so a release downloads them only when the lock changes, and with
      # the job's token, so GitHub's rate limit for anonymous downloads never stops a release.
      - name: setup PHP corpus for PGO profiling
        if: matrix.job.pgo
        shell: bash
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          kept="${{ github.workspace }}/sharp/build/corpus"
          installed="$kept/$(shasum -a 256 corpus/composer.lock | cut -c1-16)"
          if [[ ! -d $installed/vendor ]]; then
            rm -rf "$kept"
            (cd corpus && composer install --ignore-platform-reqs --no-interaction --no-progress)
            mkdir -p "$installed"
            cp -R corpus/vendor "$installed/vendor"
          else
            cp -R "$installed/vendor" corpus/vendor
          fi

      # The PHP# engine mago links, which sharp/bin/build-mago --engine builds for the runner's own platform, each
      # release from nothing but on the self-hosted Mac runner, which keeps sharp/build.
      - name: Build the engine mago links
        shell: bash
        working-directory: ${{ github.workspace }}
        run: sharp/bin/build-mago --engine

      # The engine the PHP# suite runs on, with --enable-debug, since only a debug engine runs ZEND_ASSERT and reports
      # a leak. It builds through ccache, as BUILD_LINUX's does, so a file that changes back, as a run of another branch
      # makes it, compiles from the cache, and sharp/bin/build configures again only when what configure reads changed.
      # Only this step's CC and CXX, so mago's crates that compile C build as the job's other builds build them in the
      # same target, where another CC rebuilds them and every crate above them.
      - name: Build the engine the PHP# suite runs on
        if: matrix.job.checks
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CC: ccache cc
          CXX: ccache c++
        run: sharp/bin/build

      # mago and every test binary in the dev profile, which keeps the debug assertions and overflow checks the tests
      # need, linked with the engine the step before last built. Its dependencies compile at opt-level 3, so the tests
      # run on optimized dependencies, while a commit rebuilds the workspace crates it changed at opt-level 0: the whole
      # workspace optimized halved the tests, but its rebuild of 566 to 923 s per commit took the time back.
      - name: Build mago and its test binaries
        if: matrix.job.checks
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          MAGO_ENGINE="$GITHUB_WORKSPACE/sharp/build/darwin-arm64-engine/install" sharp/bin/build-mago --quiet \
            --config 'profile.dev.package."*".opt-level=3'

      # The workspace's tests on macOS arm64, which cover the few lines of Mago that differ there, such as the watch
      # mode's FSEvents. They run lake and the SDK's Composer packages.
      - name: Install composer dependencies
        if: matrix.job.checks
        shell: bash
        run: composer install --no-interaction --no-progress

      - name: Install elan and Lean
        if: matrix.job.checks
        uses: ./.github/actions/setup-lean

      # The law checker's build for the job's platform, which mago embeds and unpacks on the first compile that
      # proves a law, so no machine builds the checker with lake and a binary runs only its own checker.
      - name: Build the law checker mago embeds
        if: inputs.publish
        shell: bash
        run: |
          cargo run --locked --release --target=${{ matrix.job.target }} -p mago-sharp-lean --example checker -- "$RUNNER_TEMP/checker.tar.zst"
          echo "MAGO_CHECKER_ARCHIVE=$RUNNER_TEMP/checker.tar.zst" >> "$GITHUB_ENV"

      # A commit's run builds no release binary, so the Mac runs its checks alone: mago compile and the PHP# suite on a
      # disk that ignores case, without opcache and in shared memory, since Apple silicon has no thread-safe JIT, with
      # the census and the differential, then the workspace's tests.
      - name: Test PHP# and mago's workspace
        if: matrix.job.checks && !inputs.publish
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          sharp/bin/test --no-build --census --differential
          echo "The PHP# suite took $SECONDS s."
          sharp/bin/test --mago --no-build
          echo "The PHP# suite and mago's workspace tests took $SECONDS s."

      # The release build compiles the crates on every core for about a minute, then links mago with fat LTO and one
      # codegen unit on one core: 12 min 45 s of its 13 min 34 s on run 44866980687. So on the Mac it runs beside the
      # checks the step before runs alone in a commit's run, which take the other cores.
      - name: build
        if: inputs.publish
        shell: bash
        run: |
          build() {
            if [[ "${{ matrix.job.pgo }}" == "true" ]]; then
              rm -rf "$CARGO_TARGET_DIR/pgo-profiles"
              cargo pgo build -- --target=${{ matrix.job.target }}
              # mago exits 1 when the analysis finds issues, which the corpus holds, and any other exit, a crash, a
              # kill or a tool error, fails the build, so no binary ships built from a broken profile.
              local status=0
              LLVM_PROFILE_FILE="$CARGO_TARGET_DIR/pgo-profiles/mago_%m_%p.profraw" \
                "$CARGO_TARGET_DIR/${{ matrix.job.target }}/release/mago" --workspace corpus/ analyze --reporting-format count || status=$?
              if ((status != 1)); then
                echo "::error::The instrumented mago analyzed corpus/ with exit code $status, where an analysis that finds the corpus's issues exits 1."
                return 1
              fi
              cargo pgo optimize build -- --target=${{ matrix.job.target }}
            else
              cargo build --locked --release --target=${{ matrix.job.target }}
            fi
          }
          if [[ "${{ matrix.job.checks }}" != "true" ]]; then
            build
            exit
          fi
          log="$RUNNER_TEMP/release-build.log"
          # A process group of its own, so a failed check stops cargo with it.
          set -m
          (set -e; build; echo "The release build took $SECONDS s.") > "$log" 2>&1 &
          builder=$!
          set +m
          checked=0
          (cd "$GITHUB_WORKSPACE" && sharp/bin/test --no-build --census --differential) || checked=$?
          echo "The PHP# suite took $SECONDS s."
          if ((checked == 0)); then
            (cd "$GITHUB_WORKSPACE" && sharp/bin/test --mago --no-build) || checked=$?
            echo "The PHP# suite and mago's workspace tests took $SECONDS s."
          fi
          # A failed check fails the job either way, so the build stops there. A process cargo starts as the signal
          # reaches the group can miss it, and the runner ends it with the job's other orphan processes.
          if ((checked != 0)); then
            kill -- "-$builder"
            echo "::error::A check failed, so the job stopped the release build."
            exit "$checked"
          fi
          built=0
          wait "$builder" || built=$?
          echo "::group::The release build, which ran beside the checks"
          cat "$log"
          echo "::endgroup::"
          exit "$built"

      - name: set binary name
        if: inputs.publish
        id: bin
        shell: bash
        run: |
          BIN_NAME="${{ needs.crate_metadata.outputs.bin-name }}"
          BIN_PATH="$CARGO_TARGET_DIR/${{ matrix.job.target }}/release/${BIN_NAME}"

          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "BIN_NAME=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: check GLIBC version requirements
        if: contains(matrix.job.target, 'linux-gnu')
        shell: bash
        run: |
          echo "binary for target '${{ matrix.job.target }}' requires the following GLIBC versions:"
          strings "${{ steps.bin.outputs.BIN_PATH }}" | grep GLIBC_ || echo "No GLIBC version strings found."

      # The calling run's suites check the tree, so this checks only the binary this job builds, as mago.yml's
      # plain-php job checks the one CI built.
      - name: The binary prints the release's version, and analyzes and compiles a one-class PHP# project
        if: matrix.job.smoke && inputs.publish
        shell: bash
        env:
          VERSION: ${{ needs.crate_metadata.outputs.version }}
        run: |
          mago="${{ steps.bin.outputs.BIN_PATH }}"
          output=$("$mago" --version)
          if [[ "$output" != "mago $VERSION" ]]; then
            echo "::error::The built mago prints \"$output\", not \"mago $VERSION\"."
            exit 1
          fi
          project="$RUNNER_TEMP/project"
          mkdir -p "$project/src/App"
          cd "$project"
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          # A folder without a composer.json is a project, whose strict rules refuse a class nothing uses, so the one
          # class here compiles as a library's.
          echo '{"type": "library"}' > composer.json
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          "$mago" analyze
          "$mago" compile

      # sharp/bin/check plain-php on the runner's own PHP, with the release binary itself in a bump's run, and the dev
      # build the suites ran in a commit's run, in the folder that check reads the test-run mago from.
      - name: Run mago from Composer on plain PHP, and stop sharp/phpunit's tests on it
        if: matrix.job.checks
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MAGO: ${{ inputs.publish && steps.bin.outputs.BIN_PATH || format('{0}/sharp/build/darwin-arm64/mago/debug/mago', github.workspace) }}
        run: |
          mkdir -p "$RUNNER_TEMP/target/test-run"
          cp "$MAGO" "$RUNNER_TEMP/target/test-run/mago"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" sharp/bin/check plain-php

      - name: create tarball (main binary)
        if: inputs.publish
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARGET="${{ matrix.job.target }}"
          PKG_NAME="mago-${VERSION}-${TARGET}.tar.gz"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_OUTPUT"

          PKG_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/package"
          ARCHIVE_DIR="${PKG_STAGING}/mago-${VERSION}-${TARGET}/"
          mkdir -p "${ARCHIVE_DIR}"

          # Binary
          cp "${{ steps.bin.outputs.BIN_PATH }}" "$ARCHIVE_DIR"

          # Docs and licenses
          cp "README.md" "LICENSE-MIT" "LICENSE-APACHE" "$ARCHIVE_DIR" || true

          pushd "${PKG_STAGING}/" >/dev/null
          tar czf "${PKG_NAME}" "mago-${VERSION}-${TARGET}"/*
          popd >/dev/null

          echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (binary)
        if: inputs.publish
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.PKG_PATH }}

      - name: "Artifact upload: tarball"
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          path: ${{ steps.package.outputs.PKG_PATH }}
          if-no-files-found: error

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # install.sh checks a download against these SHA-256s when gh is missing, and sharp.yml's COMPOSER pins them in the
  # release's heyjordanparker/mago-sharp version. They are written where the assets were built, so the release
  # publishes the SHA-256s of exactly these assets.
  sums:
    name: Write the SHA-256 of every asset
    if: inputs.publish
    runs-on: ubuntu-latest
    needs: [crate_metadata, source_archive, build]
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      - name: Download every asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ needs.crate_metadata.outputs.version }}-*
          path: assets
          merge-multiple: true

      - name: Check the downloaded assets are exactly the release's assets
        shell: bash
        run: |
          sort > expected-assets.txt <<EOF
          mago-${VERSION}-source.tar.gz
          mago-${VERSION}-source.zip
          mago-${VERSION}-aarch64-apple-darwin.tar.gz
          mago-${VERSION}-aarch64-unknown-linux-gnu.tar.gz
          mago-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          EOF
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::The downloaded assets differ from the expected release assets."
            exit 1
          }

      - name: Write the SHA-256 of every asset
        shell: bash
        run: |
          sums="$RUNNER_TEMP/mago-${VERSION}-sha256sums.txt"
          (cd assets && sha256sum -- *) > "$sums"
          cat "$sums"

      - name: "Artifact upload: SHA-256s"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: ${{ runner.temp }}/mago-${{ env.VERSION }}-sha256sums.txt
          if-no-files-found: error
