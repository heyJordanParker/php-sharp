name: Release

# A tag such as v0.4.0 releases PHP# and Mago at one version: ext/sharp/php_sharp.h's PHP_SHARP_VERSION and
# sharp/mago/Cargo.toml's version must both be 0.4.0, and sharp/CHANGELOG.md must have a "## [0.4.0]" section. This
# workflow publishes php-sharp's GitHub release, with the mago binary per platform, that section as its notes and the
# SHA-256 of every asset, and publishes the tag's heyjordanparker/mago-sharp version with those SHA-256s. sharp.yml's
# IMAGE_TAGS job publishes the engine's images from the same tag, and its COMPOSER job publishes
# heyjordanparker/php-sharp-composer.
#
# A release builds its binaries once, as Humble and Farley's Continuous Delivery asks. The bump's pull request builds
# every asset beside its CI: sharp.yml's RELEASE_ASSETS calls this workflow once RELEASE_BUMP passed. The tag then
# publishes exactly those assets, as bump_assets explains, and builds them itself only when they expired or were built
# from another tree. A dispatch checks what a tag would publish, and publishes nothing.
on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CICD_INTERMEDIATES_DIR: ${{ github.workspace }}/_cd-intermediates
  # GitHub's longest, so the assets a bump's pull request built are still there for its tag after a slow review.
  RETENTION_DAYS: 90

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # Every other job needs crate_metadata, which needs ci, so a release publishes only a tree whose every Mago CI job
  # already ran and passed, on master, on the pull request that merged it or in a full run, and whose full PHP# run
  # passed all 9 test jobs, through the same check as sharp.yml's CHANGES, so the two workflows publish a tag or
  # neither does. The suites do not run again here. On the bump's pull request, CI runs beside this workflow, so ci
  # skips there, and the tag checks it.
  ci:
    name: Mago CI and the full PHP# run passed on the tree
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # patch-coverage runs only on a pull request.
      - name: Find the Mago CI run that passed every job on the commit's tree
        id: passed
        uses: ./.github/actions/passed-tree
        with:
          workflow: mago.yml
          events: push pull_request schedule workflow_dispatch
          passed: all(.jobs[]; .conclusion == "success" or .name == "patch-coverage")

      - name: Every Mago CI job ran and passed on the commit's tree
        env:
          RUN: ${{ steps.passed.outputs.run }}
        run: |
          if [[ -z $RUN ]]; then
            echo "::error::No Mago CI run passed every job on commit $GITHUB_SHA's tree, on master, on a pull request into master that names it or in a full run. Release a commit whose tree passed them."
            exit 1
          fi
          echo "Every Mago CI job ran and passed on this tree in $RUN."

      - name: Find the full PHP# run that passed all 9 test jobs on the commit's tree
        id: full
        uses: ./.github/actions/passed-tree
        with:
          events: pull_request schedule workflow_dispatch
          full: true
          on-master: ${{ github.ref_type == 'tag' }}

      - name: The full PHP# run passed on the commit's tree
        env:
          RUN: ${{ steps.full.outputs.run }}
        run: |
          if [[ -z $RUN ]]; then
            echo "::error::No full PHP# CI run, the bump's pull request's, nightly or dispatched, passed all 9 test jobs on commit $GITHUB_SHA's tree, so sharp.yml's gate would refuse this tag too. Release a commit whose tree passed one."
            exit 1
          fi
          echo "All 9 PHP# test jobs ran and passed on this tree in $RUN."

  # ci skips on the bump's pull request, and a job that needs a skipped job runs only by a condition of its own.
  crate_metadata:
    name: extract crate metadata
    runs-on: ubuntu-latest
    needs: ci
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: extract crate information
        id: crate_metadata
        run: |
          rustup update stable
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[0] |
            [
              "version=" + .version,
              "maintainer=" + (.authors[0] // ""),
              "homepage=" + (.homepage // ""),
              "msrv=" + (.rust_version // "")
            ] |
            join("\n")
          ' | tee -a "$GITHUB_OUTPUT"
      - name: The tag, PHP# and Mago share one version
        env:
          VERSION: ${{ steps.crate_metadata.outputs.version }}
        run: |
          engine=$(sed -n 's/^#define PHP_SHARP_VERSION "\(.*\)"$/\1/p' ../../ext/sharp/php_sharp.h)
          if [[ "$engine" != "$VERSION" ]]; then
            echo "::error::ext/sharp/php_sharp.h is PHP# $engine, and sharp/mago/Cargo.toml is Mago $VERSION. Release both at one version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME releases version $VERSION. Tag it v$VERSION."
            exit 1
          fi
      # The section runs from its "## [<version>]" heading, which may carry a date, to the next version's heading or
      # the link definitions that end the file.
      - name: The release notes are sharp/CHANGELOG.md's section of the version
        env:
          VERSION: ${{ steps.crate_metadata.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## [$VERSION]" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[.*\]: /) { exit }
            found { print }
          ' ../CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::sharp/CHANGELOG.md has no \"## [$VERSION]\" section, so release $VERSION has no notes. Add the section."
            exit 1
          fi
          cat "$notes"
      - name: "Artifact upload: release notes"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
    outputs:
      name: "mago"
      bin-name: "mago"
      version: ${{ steps.crate_metadata.outputs.version }}
      maintainer: ${{ steps.crate_metadata.outputs.maintainer }}
      homepage: ${{ steps.crate_metadata.outputs.homepage }}
      msrv: ${{ steps.crate_metadata.outputs.msrv }}

  # The run of the bump's pull request that built this tree's assets: the newest sharp.yml run whose RELEASE_ASSETS
  # wrote their SHA-256s, on this commit's tree, as .github/actions/passed-tree finds it. The tag publishes its assets
  # only when each one is still kept, matches its SHA-256 and its attestation, and the commit the attestation names,
  # the pull request's merge commit, has this commit's tree. When no run holds them, or they expired, or they were built
  # from another tree, this run builds them, and says so. An asset that fails its SHA-256 or its attestation fails the
  # release instead, because it was changed after the build.
  bump_assets:
    name: Find the assets the bump's pull request built
    runs-on: ubuntu-latest
    needs: crate_metadata
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    outputs:
      run-id: ${{ steps.check.outputs.run-id }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Find the bump's pull request run that built the assets of the commit's tree
        id: bump
        uses: ./.github/actions/passed-tree
        with:
          workflow: sharp.yml
          events: pull_request
          passed: any(.jobs[]; .name == "RELEASE_ASSETS / Write the SHA-256 of every asset" and .conclusion == "success")

      - name: Download the bump's assets, and check their SHA-256s, their attestations and the tree they were built from
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.bump.outputs.run }}
        run: |
          build() {
            echo "::notice::$1 So this run builds every asset from commit $GITHUB_SHA."
            exit 0
          }
          if [[ -z $RUN ]]; then
            build "No pull request run built the assets of commit $GITHUB_SHA's tree."
          fi
          id=${RUN##*/}
          sums="mago-$VERSION-sha256sums.txt"
          kept="$RUNNER_TEMP/kept"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | .name' > "$kept"
          if ! grep -qxF sha256sums "$kept"; then
            build "Run $RUN no longer keeps $sums: it expired or was deleted."
          fi
          gh run download "$id" --name sha256sums --dir assets
          mapfile -t assets < <(cut -d ' ' -f 3- "assets/$sums")
          for asset in "${assets[@]}"; do
            if ! grep -qxF -- "$asset" "$kept"; then
              build "Run $RUN no longer keeps $asset: it expired or was deleted."
            fi
          done
          for asset in "${assets[@]}"; do
            gh run download "$id" --name "$asset" --dir assets
          done
          if ! (cd assets && sha256sum --check --strict "$sums"); then
            echo "::error::An asset run $RUN built has a SHA-256 other than the one its $sums names, so nothing is published. Delete that run's artifacts, and this run builds every asset."
            exit 1
          fi
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          for asset in "${assets[@]}"; do
            if ! commits=$(gh attestation verify "assets/$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --format json \
              --jq '.[].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[].digest.gitCommit // empty'); then
              echo "::error::$asset from run $RUN has no build attestation signed by $GITHUB_REPOSITORY/.github/workflows/release.yml, so nothing is published. Delete that run's artifacts, and this run builds every asset."
              exit 1
            fi
            if [[ -z $commits ]]; then
              echo "::error::$asset's attestation from run $RUN names no commit it was built from, so its tree can't be checked and nothing is published. Delete that run's artifacts, and this run builds every asset."
              exit 1
            fi
            for commit in $commits; do
              built=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$commit" --jq .tree.sha)
              if [[ $built != "$tree" ]]; then
                build "Run $RUN built $asset from commit $commit, whose tree $built isn't commit $GITHUB_SHA's tree $tree."
              fi
              echo "$asset: its SHA-256 and its attestation match, and it was built from commit $commit, whose tree is $tree."
            done
          done
          echo "run-id=$id" >> "$GITHUB_OUTPUT"
          echo "::notice::This run publishes the assets run $RUN built from commit $GITHUB_SHA's tree, and builds none."

  # sharp/mago/.gitattributes leaves Mago's sources out of git archive, and so out of php-sharp's own tag archives.
  # It and build run on the bump's pull request, and on a tag only when bump_assets found no assets to publish.
  source_archive:
    name: Create source code archives
    runs-on: ubuntu-latest
    needs: [crate_metadata, bump_assets]
    if: ${{ !failure() && !cancelled() && !needs.bump_assets.outputs.run-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create source archives
        id: source_package
        run: |
          VERSION="${{ needs.crate_metadata.outputs.version }}"

          STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/source"
          mkdir -p "${STAGING}"
          rsync -a . "${STAGING}/mago-${VERSION}/"
          TAR_NAME="mago-${VERSION}-source.tar.gz"
          tar -czf "${STAGING}/${TAR_NAME}" -C "${STAGING}" "mago-${VERSION}"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "TAR_PATH=${STAGING}/${TAR_NAME}" >> "$GITHUB_OUTPUT"
          ZIP_NAME="mago-${VERSION}-source.zip"
          cd "${STAGING}"
          zip -r "${ZIP_NAME}" "mago-${VERSION}"
          cd -
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "ZIP_PATH=${STAGING}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (source tar.gz)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.TAR_PATH }}

      - name: Generate artifact attestation (source zip)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.ZIP_PATH }}

      - name: "Artifact upload: source tar.gz"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source_package.outputs.TAR_NAME }}
          path: ${{ steps.source_package.outputs.TAR_PATH }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

      - name: "Artifact upload: source zip"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source_package.outputs.ZIP_NAME }}
          path: ${{ steps.source_package.outputs.ZIP_PATH }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: [crate_metadata, bump_assets]
    if: ${{ !failure() && !cancelled() && !needs.bump_assets.outputs.run-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        job:
          # Each job in this matrix defines a build target. The following custom keys control the pipeline steps:
          # - `smoke: true`: Smoke-checks the built binary. Only targets the job's runner can execute set it.
          # - `pgo: true`: Builds with profile-guided optimization, profiled on corpus/. Only aarch64-apple-darwin
          #   sets it. x86_64 macOS's PGO job, which profiled under Rosetta, took up to 59 minutes, and nothing here
          #   measures what PGO gains, so it and x86_64 musl build without it, as rust-lang/rust's Apple dist jobs do.

          ## macOS: aarch64, x86_64, on the self-hosted Apple silicon runners. The x86_64 binary cross-compiles there,
          ## and its smoke check runs it under Rosetta.
          - {
              target: aarch64-apple-darwin,
              os: macos-arm64-local,
              smoke: true,
              pgo: true,
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-arm64-local,
              smoke: true,
            }
          ## Linux: aarch64, x86_64
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, smoke: false }
          - {
              target: aarch64-unknown-linux-musl,
              os: ubuntu-latest,
              smoke: false,
            }
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              smoke: true,
            }
          - {
              target: x86_64-unknown-linux-musl,
              os: ubuntu-latest,
              smoke: true,
            }

    env:
      BUILD_CMD: cargo

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: set version env variable
        id: version
        shell: bash
        run: echo "VERSION=${{ needs.crate_metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install Prerequisites
        if: contains(matrix.job.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get -y update
          sudo apt-get remove -y libssl-dev
          case ${{ matrix.job.target }} in
            aarch64-unknown-linux-gnu) sudo apt-get -y install gcc-aarch64-linux-gnu ;;
          esac

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.crate_metadata.outputs.msrv }}
          targets: ${{ matrix.job.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sharp/mago
          key: ${{ matrix.job.target }}
          cache-on-failure: true

      - name: Cache cargo-pgo
        if: matrix.job.pgo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-pgo
          key: cargo-pgo-${{ runner.os }}

      - name: install PGO tools
        if: matrix.job.pgo
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-pgo &>/dev/null; then
            cargo install cargo-pgo
          fi

      - name: install cross
        if: startsWith(matrix.job.os, 'ubuntu') && !matrix.job.pgo
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross

      - name: overwrite build command env variable (for cross)
        if: startsWith(matrix.job.os, 'ubuntu') && !matrix.job.pgo
        shell: bash
        run: echo "BUILD_CMD=cross" >> "$GITHUB_ENV"

      - name: Configure cross-rs container image for glibc 2.17
        if: contains(matrix.job.target, 'linux-gnu') && !matrix.job.pgo
        shell: bash
        run: |
          IMAGE=""
          case ${{ matrix.job.target }} in
            x86_64-unknown-linux-gnu) IMAGE="quay.io/pypa/manylinux2014_x86_64" ;;
            aarch64-unknown-linux-gnu) IMAGE="quay.io/pypa/manylinux2014_aarch64" ;;
          esac
          if [[ -n "$IMAGE" ]]; then
            echo "Using custom image for glibc 2.17: $IMAGE"
            echo "CROSS_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "::warning:: No manylinux2014 image found for target ${{ matrix.job.target }}. Build will use default cross image, which may have a newer glibc."
          fi

      - name: show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          set -x
          gcc --version || true
          ldd --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      # setup-php brew-installs PHP on macOS, so the self-hosted runners use their Homebrew PHP and Composer instead.
      - name: setup PHP for PGO profiling
        if: matrix.job.pgo && runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer

      - name: Cache composer dependencies for PGO corpus
        if: matrix.job.pgo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/mago/corpus/vendor
          key: composer-corpus-${{ hashFiles('sharp/mago/corpus/composer.lock') }}

      - name: setup PHP corpus for PGO profiling
        if: matrix.job.pgo
        shell: bash
        run: |
          cd corpus
          composer update --ignore-platform-reqs
          cd ..

      - name: build
        shell: bash
        run: |
          if [[ "${{ matrix.job.pgo }}" == "true" ]]; then
            cargo pgo build -- --target=${{ matrix.job.target }}
            cargo pgo run -- -- --workspace corpus/ analyze --reporting-format count || true
            cargo pgo optimize build -- --target=${{ matrix.job.target }}
          else
            $BUILD_CMD build --locked --release --target=${{ matrix.job.target }}
          fi

      - name: set binary name
        id: bin
        shell: bash
        run: |
          BIN_NAME="${{ needs.crate_metadata.outputs.bin-name }}"
          BIN_PATH="target/${{ matrix.job.target }}/release/${BIN_NAME}"

          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "BIN_NAME=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: check GLIBC version requirements
        if: contains(matrix.job.target, 'linux-gnu')
        shell: bash
        run: |
          echo "binary for target '${{ matrix.job.target }}' requires the following GLIBC versions:"
          strings "${{ steps.bin.outputs.BIN_PATH }}" | grep GLIBC_ || echo "No GLIBC version strings found."

      # A tag publishes only a tree the ci job finds passed the full suite, so this checks only the binary this job
      # builds, as mago.yml's plain-php job checks the one CI built.
      - name: The binary prints the release's version, and analyzes and compiles a one-class PHP# project
        if: matrix.job.smoke
        shell: bash
        env:
          VERSION: ${{ needs.crate_metadata.outputs.version }}
        run: |
          mago="$PWD/${{ steps.bin.outputs.BIN_PATH }}"
          output=$("$mago" --version)
          if [[ "$output" != "mago $VERSION" ]]; then
            echo "::error::The built mago prints \"$output\", not \"mago $VERSION\"."
            exit 1
          fi
          project="$RUNNER_TEMP/project"
          mkdir -p "$project/src/App"
          cd "$project"
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          "$mago" analyze
          "$mago" compile

      - name: create tarball (main binary)
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARGET="${{ matrix.job.target }}"
          PKG_NAME="mago-${VERSION}-${TARGET}.tar.gz"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_OUTPUT"

          PKG_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/package"
          ARCHIVE_DIR="${PKG_STAGING}/mago-${VERSION}-${TARGET}/"
          mkdir -p "${ARCHIVE_DIR}"

          # Binary
          cp "${{ steps.bin.outputs.BIN_PATH }}" "$ARCHIVE_DIR"

          # Docs and licenses
          cp "README.md" "LICENSE-MIT" "LICENSE-APACHE" "$ARCHIVE_DIR" || true

          pushd "${PKG_STAGING}/" >/dev/null
          tar czf "${PKG_NAME}" "mago-${VERSION}-${TARGET}"/*
          popd >/dev/null

          echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (binary)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.PKG_PATH }}

      - name: "Artifact upload: tarball"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          path: ${{ steps.package.outputs.PKG_PATH }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  # install.sh checks a download against these SHA-256s when gh is missing, and the composer job pins them in the tag's
  # heyjordanparker/mago-sharp version. They are written where the assets were built, so a tag that publishes the
  # bump's assets publishes the bump's SHA-256s too. A job whose condition names no status function runs only when
  # every job before it passed, and ci and bump_assets skip on the bump's pull request, so each job after them names
  # its own.
  sums:
    name: Write the SHA-256 of every asset
    runs-on: ubuntu-latest
    needs: [crate_metadata, bump_assets, source_archive, build]
    if: ${{ !failure() && !cancelled() && !needs.bump_assets.outputs.run-id }}
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      - name: Download every asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ needs.crate_metadata.outputs.version }}-*
          path: assets
          merge-multiple: true

      - name: Check the downloaded assets are exactly the release's assets
        shell: bash
        run: |
          sort > expected-assets.txt <<EOF
          mago-${VERSION}-source.tar.gz
          mago-${VERSION}-source.zip
          mago-${VERSION}-aarch64-apple-darwin.tar.gz
          mago-${VERSION}-x86_64-apple-darwin.tar.gz
          mago-${VERSION}-aarch64-unknown-linux-gnu.tar.gz
          mago-${VERSION}-aarch64-unknown-linux-musl.tar.gz
          mago-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          mago-${VERSION}-x86_64-unknown-linux-musl.tar.gz
          EOF
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::The downloaded assets differ from the expected release assets."
            exit 1
          }

      - name: Write the SHA-256 of every asset
        shell: bash
        run: |
          sums="$RUNNER_TEMP/mago-${VERSION}-sha256sums.txt"
          (cd assets && sha256sum -- *) > "$sums"
          cat "$sums"

      - name: "Artifact upload: SHA-256s"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: ${{ runner.temp }}/mago-${{ env.VERSION }}-sha256sums.txt
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}

  # Publishes the assets of the run bump_assets found, or of this run when it found none, once they are exactly the
  # ones their SHA-256s name.
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [crate_metadata, bump_assets, sums]
    if: ${{ !failure() && !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      - name: Download every asset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ needs.crate_metadata.outputs.version }}-*
          path: assets
          merge-multiple: true
          run-id: ${{ needs.bump_assets.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download the SHA-256s
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: assets
          run-id: ${{ needs.bump_assets.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: The downloaded assets are exactly the ones the SHA-256s name, and match them
        shell: bash
        run: |
          sums="mago-${VERSION}-sha256sums.txt"
          { cut -d ' ' -f 3- "assets/$sums"; echo "$sums"; } | sort > expected-assets.txt
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::The downloaded assets differ from the ones $sums names."
            exit 1
          }
          (cd assets && sha256sum --check --strict "$sums")

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}

      # A draft an earlier run made takes this run's notes when it is published.
      - name: Upload every asset to the draft release, check it, then publish it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ runner.temp }}/release-notes.md
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "$GITHUB_REF is not a release tag, so nothing is published."
            exit 0
          fi
          if ! is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> view-error.txt); then
            grep -q "release not found" view-error.txt || { cat view-error.txt >&2; exit 1; }
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$NOTES"
            is_draft=true
          fi
          if [[ $is_draft != true ]]; then
            echo "::error::Release $TAG is already published, so this run changes nothing. Release a new tag."
            exit 1
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > released-assets.txt
          diff -u expected-assets.txt released-assets.txt || {
            echo "::error::Draft release $TAG holds different assets than expected, so it stays a draft."
            exit 1
          }
          gh release edit "$TAG" --notes-file "$NOTES" --draft=false

  # The tag's heyjordanparker/mago-sharp version is sharp/mago's split, as sharp.yml's COMPOSER job pushes a branch,
  # plus a commit that adds the release's SHA-256s as composer/sha256sums.txt. The Composer wrapper refuses an
  # archive whose SHA-256 differs, so the package version pins the exact binary, as esbuild's and Biome's npm
  # packages do. The tag is pushed once the release is public, so every asset it names can be downloaded, and the
  # push never forces, so a published version never changes.
  composer:
    name: Publish heyjordanparker/mago-sharp
    runs-on: ubuntu-latest
    needs: [crate_metadata, bump_assets, release]
    if: ${{ !failure() && !cancelled() && github.ref_type == 'tag' }}
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install splitsh-lite
        uses: ./.github/actions/splitsh-lite

      - name: Split sharp/mago
        run: splitsh-lite --prefix=sharp/mago --target=refs/heads/mago

      - name: Download the SHA-256s
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: ${{ runner.temp }}
          run-id: ${{ needs.bump_assets.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      # The tag pins these SHA-256s for good, so the assets a user downloads from the published release must match
      # them before the tag exists, and so must the sums file install.sh checks a download against.
      - name: The published assets match the SHA-256s the tag pins
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published="$RUNNER_TEMP/published"
          gh release download "$GITHUB_REF_NAME" --dir "$published"
          if ! cmp "$RUNNER_TEMP/mago-$VERSION-sha256sums.txt" "$published/mago-$VERSION-sha256sums.txt"; then
            echo "::error::Release $GITHUB_REF_NAME publishes a mago-$VERSION-sha256sums.txt that differs from the one this run wrote, so no heyjordanparker/mago-sharp tag is pushed."
            exit 1
          fi
          if ! (cd "$published" && sha256sum --check --strict "$RUNNER_TEMP/mago-$VERSION-sha256sums.txt"); then
            echo "::error::An asset of release $GITHUB_REF_NAME has a SHA-256 other than the one this run wrote, so no heyjordanparker/mago-sharp tag is pushed."
            exit 1
          fi

      - name: git checkout heyJordanParker/mago-sharp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp

      - name: Push the tag, with the SHA-256 of every release asset
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/mago-$VERSION-sha256sums.txt" composer/sha256sums.txt
          git add composer/sha256sums.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "The SHA-256 of every mago $VERSION release asset"
          git push origin "HEAD:refs/tags/$GITHUB_REF_NAME"
