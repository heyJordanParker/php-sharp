name: Release

# Builds a release's assets: the mago binary per platform with its attestation, Mago's source archives, the SHA-256 of
# every asset and the release's notes. PHP# and Mago release at one version, which sharp.yml's CHANGES finds from the
# tags and passes in, and each job that builds writes it into its checkout's sharp/mago/Cargo.toml first, where mago
# reads it and the engine builds it into ext/sharp's sharp_version.h. The notes are the ## Changelog sections of the
# pull requests the release merges, so the list of releases on GitHub is the changelog.
#
# sharp.yml's MACOS calls this workflow in a staging run whose version's GitHub release isn't published, once the Mac's
# checks in MAC_TESTS passed. A release builds its binaries once, as Humble and Farley's Continuous Delivery asks, and
# sharp.yml's RELEASE publishes exactly the files it built in that run. A pull request's run never builds them: once the
# version moved to the start of each cycle, every run on next built the profile-guided release, and run 44997846679 took
# 45 minutes, 16.5 of them the release build alone after every check had ended. LAND doesn't wait for this workflow, as
# a merge queue gates on the tests and a release pipeline builds the artifacts after the merge (#952), so a failed
# release job opens the red-master issue from red_master_issue and is fixed forward. Its attestations name this
# workflow as their signer, which install.sh and mago self-update verify, so the binaries build here and nowhere else.
on:
  workflow_call:
    inputs:
      version:
        description: The release's version, <major>.<minor>.<patch>, which tag v<version> names once it is published.
        type: string
        required: true
      pulls:
        description: The numbers of the pull requests merged since the last release, separated by spaces.
        type: string
        required: false
        default: ''
      range:
        description: The commits the staging run tests, as <base>..<sha>, which the red-master issue names.
        type: string
        required: false
        default: ''

# Every artifact is kept as long as the repository's artifact retention sets, 90 days, GitHub's longest.
env:
  CICD_INTERMEDIATES_DIR: ${{ github.workspace }}/_cd-intermediates

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  crate_metadata:
    name: extract crate metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage
      - name: extract crate information
        id: crate_metadata
        run: |
          rustup update stable
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[] | select(.name == "mago") | "msrv=" + (.rust_version // "")
          ' | tee -a "$GITHUB_OUTPUT"
      # Each pull request's ## Changelog section runs to its body's next ## heading, without the HTML comment in which
      # .github/pull_request_template.md explains it. The notes hold every section's
      # lines under its ### headings, one heading for all the pull requests, Upgrading first, since users act on it,
      # and each item names its pull request.
      - name: The release notes are the ## Changelog sections of the pull requests it merges
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULLS: ${{ inputs.pulls }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          for pull in $PULLS; do
            gh pr view "$pull" --json body --jq .body | tr -d '\r' | awk -v pull="$pull" '
              /<!--/ { comment = 1 }
              comment { if (/-->/) { comment = 0 }; next }
              /^## / { on = $0 == "## Changelog"; next }
              on && /^- / { $0 = $0 " (#" pull ")" }
              on { print }
            '
          done | awk '
            /^### / { heading = $0; if (!(heading in seen)) { seen[heading] = 1; order[++headings] = heading }; next }
            /[^[:space:]]/ { lines[heading] = lines[heading] $0 "\n" }
            function section(heading) {
              if (lines[heading] != "") {
                printf "%s%s\n\n%s", printed ? "\n" : "", heading, lines[heading]
                printed = 1
              }
            }
            END {
              printf "%s", lines[""]
              printed = lines[""] != ""
              section("### Upgrading")
              for (i = 1; i <= headings; i++) {
                if (order[i] != "### Upgrading") {
                  section(order[i])
                }
              }
            }
          ' > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "This release changes nothing users see." > "$notes"
          fi
          cat "$notes"
      # sharp.yml's RELEASE publishes them with the assets.
      - name: "Artifact upload: release notes"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
    outputs:
      bin-name: "mago"
      version: ${{ inputs.version }}
      msrv: ${{ steps.crate_metadata.outputs.msrv }}

  # sharp/mago/.gitattributes leaves Mago's build script, tests and docs out of git archive, so Mago's source archives
  # copy the checkout.
  source_archive:
    name: Create source code archives
    runs-on: ubuntu-latest
    needs: crate_metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Write the release's version into the checkout
        env:
          VERSION: ${{ inputs.version }}
        run: ../bin/set-version "$VERSION"

      - name: Create source archives
        id: source_package
        run: |
          VERSION="${{ needs.crate_metadata.outputs.version }}"

          STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/source"
          mkdir -p "${STAGING}"
          rsync -a . "${STAGING}/mago-${VERSION}/"
          TAR_NAME="mago-${VERSION}-source.tar.gz"
          tar -czf "${STAGING}/${TAR_NAME}" -C "${STAGING}" "mago-${VERSION}"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "TAR_PATH=${STAGING}/${TAR_NAME}" >> "$GITHUB_OUTPUT"
          ZIP_NAME="mago-${VERSION}-source.zip"
          cd "${STAGING}"
          zip -r "${ZIP_NAME}" "mago-${VERSION}"
          cd -
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "ZIP_PATH=${STAGING}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (source tar.gz)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.TAR_PATH }}

      - name: Generate artifact attestation (source zip)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.ZIP_PATH }}

      - name: "Artifact upload: source tar.gz"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source_package.outputs.TAR_NAME }}
          path: ${{ steps.source_package.outputs.TAR_PATH }}
          if-no-files-found: error

      - name: "Artifact upload: source zip"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.source_package.outputs.ZIP_NAME }}
          path: ${{ steps.source_package.outputs.ZIP_PATH }}
          if-no-files-found: error

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # Each platform's binary. The binaries' targets are the ones PHP# runs on: macOS on Apple silicon, on the self-hosted
  # Apple silicon runners, since GitHub's macos-latest never started on throwaway bump #248: twice its jobs ended "not
  # acquired by Runner of type hosted even after multiple attempts", for macOS arm64's capacity, so a release that waits
  # on it can't publish. And glibc Linux on arm64 and x86_64, each built on a runner of its own architecture, which
  # builds the PHP# engine mago links from its Ubuntu's static archives: 24.04's on arm64, so that binary runs on glibc
  # 2.39 and later, and 22.04's on x86_64, so that one runs on glibc 2.35 and later.
  #
  # `pgo: true` builds with profile-guided optimization, profiled on corpus/. Only aarch64-apple-darwin sets it. On the
  # M2 Max, fat LTO with one codegen unit and this profile analyzed and compiled a 14,860-file vendor tree in 15% fewer
  # instructions and 15 to 19% fewer CPU-seconds than a thin-LTO build of the same source with 16 units, and a
  # 1,536-file PHP# project in 1.6 to 2.4% fewer instructions.
  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: crate_metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        job:
          - { target: aarch64-apple-darwin, os: macos-arm64-local, pgo: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }

    steps:
      # actions/checkout's clean removes every file an earlier job of the Mac runner's one work folder left, sharp/build
      # among them, so the job builds everything from its tree.
      - name: checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      # mago's cache folder, where the law checker builds its Lean library, in the checkout's build folder, as
      # sharp/docker/run puts it on Linux, so no job reads a build an earlier job left in the runner's home.
      - name: Keep mago's cache folder in the checkout
        if: runner.os == 'macOS'
        run: echo "XDG_CACHE_HOME=$GITHUB_WORKSPACE/sharp/build/cache" >> "$GITHUB_ENV"

      # A job never installs on the self-hosted Mac, so it checks that Homebrew already has the build's formulae.
      - name: Homebrew has the build's formulae
        if: runner.os == 'macOS'
        env:
          FORMULAE: autoconf bison re2c pkgconf icu4c libsodium oniguruma
        run: |
          # shellcheck disable=SC2086 # FORMULAE is a list of formulae.
          brew list --versions $FORMULAE

      # The release build's target folder, beside the dev builds sharp/.cargo's config names, which the steps below read.
      - name: Point CARGO_TARGET_DIR at the release target
        shell: bash
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago-release" >> "$GITHUB_ENV"

      - name: set version env variable
        id: version
        shell: bash
        run: echo "VERSION=${{ needs.crate_metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      # Before the engine's build, which reads it into sharp_version.h, and mago's.
      - name: Write the release's version into the checkout
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: ../bin/set-version "$VERSION"

      - name: Install what the PHP# engine builds with
        if: contains(matrix.job.os, 'ubuntu')
        uses: ./.github/actions/engine-packages

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.crate_metadata.outputs.msrv }}
          targets: ${{ matrix.job.target }}

      # cargo install puts cargo-pgo in the runner's CARGO_HOME, which the Mac's runner keeps, so it installs it once.
      - name: install PGO tools
        if: matrix.job.pgo
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-pgo &>/dev/null; then
            cargo install cargo-pgo
          fi

      - name: show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          set -x
          gcc --version || true
          ldd --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      # The corpus's packages, as its committed lock names them, with the self-hosted Mac's Homebrew Composer and the
      # job's token, so GitHub's rate limit for anonymous downloads never stops a release. The token goes as a bearer
      # token: Composer 2.9.3 refuses a github-oauth token holding "-", "/", "+" or "=", and refused the job's token
      # so on run 45016534123, while it sends a bearer token as it is.
      - name: setup PHP corpus for PGO profiling
        if: matrix.job.pgo
        shell: bash
        working-directory: sharp/mago/corpus
        env:
          COMPOSER_AUTH: '{"bearer": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --ignore-platform-reqs --no-interaction --no-progress

      # The PHP# engine mago links, which sharp/bin/build-mago --engine builds for the runner's own platform.
      - name: Build the engine mago links
        shell: bash
        working-directory: ${{ github.workspace }}
        run: sharp/bin/build-mago --engine

      # The Mac keeps the pinned Lean, which the law checker builds with, so the step below downloads none.
      - name: Install elan and Lean
        if: runner.os == 'macOS'
        uses: ./.github/actions/setup-lean

      # The law checker's build for the job's platform, which mago embeds and unpacks on the first compile that
      # proves a law, so no machine builds the checker with lake and a binary runs only its own checker. Only the
      # archive ships, and the example writes the same one in any profile, so it runs in the dev profile, where the
      # release profile compiled 175 crates in 2m33s of release run 45544095366's 3m59s step.
      - name: Build the law checker mago embeds
        shell: bash
        run: |
          cargo run --locked -p mago-sharp-lean --example checker -- "$RUNNER_TEMP/checker.tar.zst"
          echo "MAGO_CHECKER_ARCHIVE=$RUNNER_TEMP/checker.tar.zst" >> "$GITHUB_ENV"

      - name: build
        if: ${{ !matrix.job.pgo }}
        shell: bash
        run: cargo build --locked --release --target=${{ matrix.job.target }}

      # A profile-guided build runs as three steps, so the run's timeline times each (#860). The instrumented build and
      # the optimized build both compile with [profile.release], as cargo-pgo's flow does: cargo hashes the profile into
      # each crate's module names, and LLVM finds a local function's profile by its module's name, so an instrumented
      # build without fat LTO in 16 codegen units left 31,616 functions with no profile on the 0.8.9 release (#897).
      - name: Build the instrumented mago
        if: matrix.job.pgo
        shell: bash
        run: |
          rm -rf "$CARGO_TARGET_DIR/pgo-profiles"
          cargo pgo build -- --target=${{ matrix.job.target }}

      # mago exits 1 when the analysis finds issues, which the corpus holds, and any other exit, a crash, a kill or a
      # tool error, fails the step, so no binary ships built from a broken profile.
      - name: Profile the instrumented mago on corpus/
        if: matrix.job.pgo
        shell: bash
        run: |
          status=0
          LLVM_PROFILE_FILE="$CARGO_TARGET_DIR/pgo-profiles/mago_%m_%p.profraw" \
            "$CARGO_TARGET_DIR/${{ matrix.job.target }}/release/mago" --workspace corpus/ analyze --reporting-format count || status=$?
          if ((status != 1)); then
            echo "::error::The instrumented mago analyzed corpus/ with exit code $status, where an analysis that finds the corpus's issues exits 1."
            exit 1
          fi

      # cargo-pgo logs each function the profile lacks, with its module, only at debug level, so the log names the crates
      # its "PGO profile data was not found" count belongs to (#897).
      - name: Build the release mago with the profile
        if: matrix.job.pgo
        shell: bash
        env:
          RUST_LOG: cargo_pgo=debug
        run: cargo pgo optimize build -- --target=${{ matrix.job.target }}

      - name: set binary name
        id: bin
        shell: bash
        run: |
          BIN_NAME="${{ needs.crate_metadata.outputs.bin-name }}"
          BIN_PATH="$CARGO_TARGET_DIR/${{ matrix.job.target }}/release/${BIN_NAME}"

          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "BIN_NAME=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: check GLIBC version requirements
        if: contains(matrix.job.target, 'linux-gnu')
        shell: bash
        run: |
          echo "binary for target '${{ matrix.job.target }}' requires the following GLIBC versions:"
          strings "${{ steps.bin.outputs.BIN_PATH }}" | grep GLIBC_ || echo "No GLIBC version strings found."

      # The calling run's suites check the tree, so this checks only the binary this job builds, as sharp.yml's
      # PLAIN_PHP checks the one CI built.
      - name: The binary prints the release's version, and analyzes and compiles a one-class PHP# project
        shell: bash
        env:
          VERSION: ${{ needs.crate_metadata.outputs.version }}
        run: |
          mago="${{ steps.bin.outputs.BIN_PATH }}"
          output=$("$mago" --version)
          if [[ "$output" != "mago $VERSION" ]]; then
            echo "::error::The built mago prints \"$output\", not \"mago $VERSION\"."
            exit 1
          fi
          project="$RUNNER_TEMP/project"
          mkdir -p "$project/src/App"
          cd "$project"
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          # A folder without a composer.json is a project, whose strict rules refuse a class nothing uses, so the one
          # class here compiles as a library's.
          echo '{"type": "library"}' > composer.json
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          "$mago" analyze
          "$mago" compile

      # sharp/bin/check plain-php on the Mac's Homebrew PHP, with the release binary, in the folder that check reads the
      # test-run mago from, as sharp.yml's MAC_TESTS runs it with the dev build and PLAIN_PHP with Linux's test-run build.
      - name: Run mago from Composer on plain PHP with the release binary
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          MAGO: ${{ steps.bin.outputs.BIN_PATH }}
        run: |
          mkdir -p "$RUNNER_TEMP/target/test-run"
          cp "$MAGO" "$RUNNER_TEMP/target/test-run/mago"
          CARGO_TARGET_DIR="$RUNNER_TEMP/target" sharp/bin/check plain-php

      - name: create tarball (main binary)
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARGET="${{ matrix.job.target }}"
          PKG_NAME="mago-${VERSION}-${TARGET}.tar.gz"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_OUTPUT"

          PKG_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/package"
          ARCHIVE_DIR="${PKG_STAGING}/mago-${VERSION}-${TARGET}/"
          mkdir -p "${ARCHIVE_DIR}"

          # Binary
          cp "${{ steps.bin.outputs.BIN_PATH }}" "$ARCHIVE_DIR"

          # Docs and licenses
          cp "README.md" "LICENSE-MIT" "LICENSE-APACHE" "$ARCHIVE_DIR" || true

          pushd "${PKG_STAGING}/" >/dev/null
          tar czf "${PKG_NAME}" "mago-${VERSION}-${TARGET}"/*
          popd >/dev/null

          echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (binary)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.PKG_PATH }}

      - name: "Artifact upload: tarball"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          path: ${{ steps.package.outputs.PKG_PATH }}
          if-no-files-found: error

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

      # Every process the job started ends with it, however the job ended, the way systemd's KillMode=control-group
      # ends every process of a unit when it stops. The Mac runner keeps its machine between jobs, and on 11-25 it held
      # two sapi/cli/php -t servers and a debug mago analyze --watch of finished jobs, the oldest 5 days old: a killed
      # test binary never runs Watch's drop guard. A process of the job is one whose command line names the job's
      # workspace, which awk reads from its environment, so its own command line never names it.
      - name: End every process the job started
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          ps -axwwo pid=,command= | awk -v self=$$ '$1 != self && index($0, ENVIRON["GITHUB_WORKSPACE"])' > "$RUNNER_TEMP/left"
          while read -r pid command; do
            echo "::notice title=Ended a process the job left::$pid ${command//%/%25}"
            if ! kill -KILL "$pid" 2> /dev/null; then
              echo "$pid had already ended."
            fi
          done < "$RUNNER_TEMP/left"

  # install.sh checks a download against these SHA-256s when gh is missing, and sharp.yml's COMPOSER pins them in the
  # release's heyjordanparker/mago-sharp version. They are written where the assets were built, so the release
  # publishes the SHA-256s of exactly these assets.
  sums:
    name: Write the SHA-256 of every asset
    runs-on: ubuntu-latest
    needs: [crate_metadata, source_archive, build]
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      # A download that stalls holds its job until the job's timeout, as one in sharp.yml held run 44989865954 for 28
      # minutes, where a download takes 1 to 38 s. So it stops after 5 minutes, and one that failed or stopped runs once
      # more.
      - name: Download every asset
        id: download
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ needs.crate_metadata.outputs.version }}-*
          path: assets
          merge-multiple: true
      - name: Download every asset, the second try
        if: steps.download.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mago-${{ needs.crate_metadata.outputs.version }}-*
          path: assets
          merge-multiple: true

      - name: Check the downloaded assets are exactly the release's assets
        shell: bash
        run: |
          sort > expected-assets.txt <<EOF
          mago-${VERSION}-source.tar.gz
          mago-${VERSION}-source.zip
          mago-${VERSION}-aarch64-apple-darwin.tar.gz
          mago-${VERSION}-aarch64-unknown-linux-gnu.tar.gz
          mago-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          EOF
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::The downloaded assets differ from the expected release assets."
            exit 1
          }

      - name: Write the SHA-256 of every asset
        shell: bash
        run: |
          sums="$RUNNER_TEMP/mago-${VERSION}-sha256sums.txt"
          (cd assets && sha256sum -- *) > "$sums"
          cat "$sums"

      - name: "Artifact upload: SHA-256s"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: ${{ runner.temp }}/mago-${{ env.VERSION }}-sha256sums.txt
          if-no-files-found: error

  # A failed release job cancels no run, since its batch lands on the checks alone, and opens the issue of a red staging
  # run from this one job, as .github/actions/red-master-issue explains, under the title sharp.yml's jobs open it with.
  # failure() is true here when any job it needs failed, so a failed crate_metadata, source_archive, build or sums opens
  # it the same way.
  red_master_issue:
    name: Open an issue for the failed release
    runs-on: ubuntu-latest
    needs: [crate_metadata, source_archive, build, sums]
    if: failure() && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - name: checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open an issue for the failed staging run
        uses: ./.github/actions/red-master-issue
        with:
          title: A staging run failed PHP# CI
          range: ${{ inputs.range }}
