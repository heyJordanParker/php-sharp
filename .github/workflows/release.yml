name: Release

# A tag such as v0.4.0 releases PHP# and Mago at one version: ext/sharp/php_sharp.h's PHP_SHARP_VERSION and
# sharp/mago/Cargo.toml's version must both be 0.4.0. This workflow builds the mago binary per platform,
# publishes php-sharp's GitHub release with the SHA-256 of every asset, and publishes the tag's
# heyjordanparker/mago-sharp version with those SHA-256s. sharp.yml's IMAGE job publishes the engine's image from
# the same tag, and its COMPOSER job publishes heyjordanparker/php-sharp-composer.
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  CICD_INTERMEDIATES_DIR: ${{ github.workspace }}/_cd-intermediates

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # Every other job needs crate_metadata, which needs ci, so a release builds only a commit whose Mago CI already
  # passed on master. The suite does not run again here.
  ci:
    name: Mago CI passed on master
    runs-on: ubuntu-latest
    permissions:
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: The commit's ci-passed check passed on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mago.yml/runs?head_sha=$GITHUB_SHA&branch=master&event=push" --jq '.workflow_runs[0].id // empty')
          if [[ -z $run ]]; then
            echo "::error::Mago CI never ran on master for commit $GITHUB_SHA, so its ci-passed check is missing. Release a commit that master's Mago CI passed."
            exit 1
          fi
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")
          if [[ $(jq -r '.jobs[] | select(.name == "ci-passed") | .conclusion' <<< "$jobs") != success ]]; then
            failed=$(jq -r '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name): \(.conclusion // .status)"] | join(", ")' <<< "$jobs")
            echo "::error::Commit $GITHUB_SHA has not passed Mago CI's ci-passed check on master ($failed): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"
            exit 1
          fi
          echo "Commit $GITHUB_SHA passed Mago CI's ci-passed check on master: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"

  crate_metadata:
    name: extract crate metadata
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: extract crate information
        id: crate_metadata
        run: |
          rustup update stable
          cargo metadata --no-deps --format-version 1 | jq -r '
            .packages[0] |
            [
              "version=" + .version,
              "maintainer=" + (.authors[0] // ""),
              "homepage=" + (.homepage // ""),
              "msrv=" + (.rust_version // "")
            ] |
            join("\n")
          ' | tee -a "$GITHUB_OUTPUT"
      - name: The tag, PHP# and Mago share one version
        env:
          VERSION: ${{ steps.crate_metadata.outputs.version }}
        run: |
          engine=$(sed -n 's/^#define PHP_SHARP_VERSION "\(.*\)"$/\1/p' ../../ext/sharp/php_sharp.h)
          if [[ "$engine" != "$VERSION" ]]; then
            echo "::error::ext/sharp/php_sharp.h is PHP# $engine, and sharp/mago/Cargo.toml is Mago $VERSION. Release both at one version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME releases version $VERSION. Tag it v$VERSION."
            exit 1
          fi
    outputs:
      name: "mago"
      bin-name: "mago"
      version: ${{ steps.crate_metadata.outputs.version }}
      maintainer: ${{ steps.crate_metadata.outputs.maintainer }}
      homepage: ${{ steps.crate_metadata.outputs.homepage }}
      msrv: ${{ steps.crate_metadata.outputs.msrv }}

  min_version:
    name: Minimum supported rust version
    runs-on: ubuntu-latest
    needs: crate_metadata
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install rust toolchain (v${{ needs.crate_metadata.outputs.msrv }})
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.crate_metadata.outputs.msrv }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sharp/mago
          key: msrv-${{ needs.crate_metadata.outputs.msrv }}
          cache-on-failure: true

      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean

      - name: Run tests
        run: cargo test --workspace --locked --all-targets

  # sharp/mago/.gitattributes leaves Mago's sources out of git archive, and so out of php-sharp's own tag archives.
  source_archive:
    name: Create source code archives
    runs-on: ubuntu-latest
    needs: crate_metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create source archives
        id: source_package
        run: |
          VERSION="${{ needs.crate_metadata.outputs.version }}"

          STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/source"
          mkdir -p "${STAGING}"
          rsync -a . "${STAGING}/mago-${VERSION}/"
          TAR_NAME="mago-${VERSION}-source.tar.gz"
          tar -czf "${STAGING}/${TAR_NAME}" -C "${STAGING}" "mago-${VERSION}"
          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          echo "TAR_PATH=${STAGING}/${TAR_NAME}" >> "$GITHUB_OUTPUT"
          ZIP_NAME="mago-${VERSION}-source.zip"
          cd "${STAGING}"
          zip -r "${ZIP_NAME}" "mago-${VERSION}"
          cd -
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "ZIP_PATH=${STAGING}/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (source tar.gz)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.TAR_PATH }}

      - name: Generate artifact attestation (source zip)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.source_package.outputs.ZIP_PATH }}

      - name: "Artifact upload: source tar.gz"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.source_package.outputs.TAR_NAME }}
          path: ${{ steps.source_package.outputs.TAR_PATH }}
          if-no-files-found: error

      - name: "Artifact upload: source zip"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.source_package.outputs.ZIP_NAME }}
          path: ${{ steps.source_package.outputs.ZIP_PATH }}
          if-no-files-found: error

  build:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    needs: crate_metadata
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        job:
          # Each job in this matrix defines a build target. The following custom keys control the pipeline steps:
          # - `smoke: true`: Smoke-checks the built binary. Only targets the job's runner can execute set it.
          # - `wasm: true`: Triggers an additional WebAssembly build and packaging for this release.

          ## macOS: aarch64, x86_64, on the self-hosted Apple silicon runners. The x86_64 binary runs under Rosetta.
          - {
              target: aarch64-apple-darwin,
              os: macos-arm64-local,
              smoke: true,
              pgo: true,
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-arm64-local,
              smoke: true,
              pgo: true,
            }
          ## Linux: aarch64, x86_64
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, smoke: false }
          - {
              target: aarch64-unknown-linux-musl,
              os: ubuntu-latest,
              smoke: false,
            }
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-latest,
              smoke: true,
              wasm: true,
            }
          - {
              target: x86_64-unknown-linux-musl,
              os: ubuntu-latest,
              smoke: true,
              pgo: true,
            }

    env:
      BUILD_CMD: cargo

    steps:
      - name: checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: set version env variable
        id: version
        shell: bash
        run: echo "VERSION=${{ needs.crate_metadata.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install Prerequisites
        if: contains(matrix.job.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get -y update
          sudo apt-get remove -y libssl-dev
          case ${{ matrix.job.target }} in
            aarch64-unknown-linux-gnu) sudo apt-get -y install gcc-aarch64-linux-gnu ;;
            x86_64-unknown-linux-musl) sudo apt-get -y install musl-tools ;;
          esac

      - name: install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.crate_metadata.outputs.msrv }}
          targets: ${{ matrix.job.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sharp/mago
          key: ${{ matrix.job.target }}
          cache-on-failure: true

      - name: Cache cargo-pgo
        if: matrix.job.pgo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.CARGO_HOME }}/bin/cargo-pgo
          key: cargo-pgo-${{ runner.os }}

      - name: install PGO tools
        if: matrix.job.pgo
        shell: bash
        run: |
          rustup component add llvm-tools-preview
          if ! command -v cargo-pgo &>/dev/null; then
            cargo install cargo-pgo
          fi

      - name: install cross
        if: startsWith(matrix.job.os, 'ubuntu') && !matrix.job.pgo
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross

      - name: overwrite build command env variable (for cross)
        if: startsWith(matrix.job.os, 'ubuntu') && !matrix.job.pgo
        shell: bash
        run: echo "BUILD_CMD=cross" >> "$GITHUB_ENV"

      - name: Configure cross-rs container image for glibc 2.17
        if: contains(matrix.job.target, 'linux-gnu') && !matrix.job.pgo
        shell: bash
        run: |
          IMAGE=""
          case ${{ matrix.job.target }} in
            x86_64-unknown-linux-gnu) IMAGE="quay.io/pypa/manylinux2014_x86_64" ;;
            aarch64-unknown-linux-gnu) IMAGE="quay.io/pypa/manylinux2014_aarch64" ;;
          esac
          if [[ -n "$IMAGE" ]]; then
            echo "Using custom image for glibc 2.17: $IMAGE"
            echo "CROSS_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "::warning:: No manylinux2014 image found for target ${{ matrix.job.target }}. Build will use default cross image, which may have a newer glibc."
          fi

      - name: show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          set -x
          gcc --version || true
          ldd --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      # setup-php brew-installs PHP on macOS, so the self-hosted runners use their Homebrew PHP and Composer instead.
      - name: setup PHP for PGO profiling
        if: matrix.job.pgo && runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer

      - name: Cache composer dependencies for PGO corpus
        if: matrix.job.pgo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: sharp/mago/corpus/vendor
          key: composer-corpus-${{ hashFiles('sharp/mago/corpus/composer.lock') }}

      - name: setup PHP corpus for PGO profiling
        if: matrix.job.pgo
        shell: bash
        run: |
          cd corpus
          composer update --ignore-platform-reqs
          cd ..

      - name: build
        shell: bash
        run: |
          if [[ "${{ matrix.job.pgo }}" == "true" ]]; then
            cargo pgo build -- --target=${{ matrix.job.target }}
            cargo pgo run -- -- --workspace corpus/ analyze --reporting-format count || true
            cargo pgo optimize build -- --target=${{ matrix.job.target }}
          else
            $BUILD_CMD build --locked --release --target=${{ matrix.job.target }}
          fi

      - name: set binary name
        id: bin
        shell: bash
        run: |
          BIN_NAME="${{ needs.crate_metadata.outputs.bin-name }}"
          BIN_PATH="target/${{ matrix.job.target }}/release/${BIN_NAME}"

          echo "BIN_PATH=${BIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "BIN_NAME=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: check GLIBC version requirements
        if: contains(matrix.job.target, 'linux-gnu')
        shell: bash
        run: |
          echo "binary for target '${{ matrix.job.target }}' requires the following GLIBC versions:"
          strings "${{ steps.bin.outputs.BIN_PATH }}" | grep GLIBC_ || echo "No GLIBC version strings found."

      # The ci job already required the full suite to pass, so this checks only the binary this job publishes, as
      # mago.yml's plain-php job checks the one CI built.
      - name: The binary prints the release's version, and analyzes and compiles a one-class PHP# project
        if: matrix.job.smoke
        shell: bash
        env:
          VERSION: ${{ needs.crate_metadata.outputs.version }}
        run: |
          mago="$PWD/${{ steps.bin.outputs.BIN_PATH }}"
          output=$("$mago" --version)
          if [[ "$output" != "mago $VERSION" ]]; then
            echo "::error::The built mago prints \"$output\", not \"mago $VERSION\"."
            exit 1
          fi
          project="$RUNNER_TEMP/project"
          mkdir -p "$project/src/App"
          cd "$project"
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          "$mago" analyze
          "$mago" compile

      - name: Cache wasm-pack
        if: matrix.job.wasm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.13.1-${{ runner.os }}

      - name: Install wasm-pack and build WASM
        if: matrix.job.wasm
        run: |
          if ! command -v wasm-pack &>/dev/null; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi
          cd crates/wasm
          wasm-pack build -d pkg --release
          cd ../..
          WASM_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/wasm"
          mkdir -p "${WASM_STAGING}"
          cp -r crates/wasm/pkg/* "${WASM_STAGING}/"

      - name: create tarball (main binary)
        id: package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TARGET="${{ matrix.job.target }}"
          PKG_NAME="mago-${VERSION}-${TARGET}.tar.gz"
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_OUTPUT"

          PKG_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/package"
          ARCHIVE_DIR="${PKG_STAGING}/mago-${VERSION}-${TARGET}/"
          mkdir -p "${ARCHIVE_DIR}"

          # Binary
          cp "${{ steps.bin.outputs.BIN_PATH }}" "$ARCHIVE_DIR"

          # Docs and licenses
          cp "README.md" "LICENSE-MIT" "LICENSE-APACHE" "$ARCHIVE_DIR" || true

          pushd "${PKG_STAGING}/" >/dev/null
          tar czf "${PKG_NAME}" "mago-${VERSION}-${TARGET}"/*
          popd >/dev/null

          echo "PKG_PATH=${PKG_STAGING}/${PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: create WASM tarball
        id: wasm_package
        if: matrix.job.wasm
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Since WASM is universal, just name it 'mago-{VERSION}-wasm.tar.gz'
          WASM_PKG_NAME="mago-${VERSION}-wasm.tar.gz"
          echo "WASM_PKG_NAME=${WASM_PKG_NAME}" >> "$GITHUB_OUTPUT"

          WASM_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/wasm"
          pushd "${WASM_STAGING}" >/dev/null
          tar czf "${WASM_PKG_NAME}" mago_wasm.d.ts mago_wasm.js mago_wasm_bg.js mago_wasm_bg.wasm package.json
          popd >/dev/null

          echo "WASM_PKG_PATH=${WASM_STAGING}/${WASM_PKG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation (binary)
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.PKG_PATH }}

      - name: Generate artifact attestation (WASM)
        if: matrix.job.wasm
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.wasm_package.outputs.WASM_PKG_PATH }}

      - name: "Artifact upload: tarball"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          path: ${{ steps.package.outputs.PKG_PATH }}
          if-no-files-found: error

      - name: "Artifact upload: WASM"
        if: matrix.job.wasm
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.wasm_package.outputs.WASM_PKG_NAME }}
          path: ${{ steps.wasm_package.outputs.WASM_PKG_PATH }}
          if-no-files-found: error

  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [crate_metadata, min_version, source_archive, build]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      - name: Download every asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mago-${{ needs.crate_metadata.outputs.version }}-*
          path: assets
          merge-multiple: true

      - name: Check the downloaded assets are exactly the release's assets
        shell: bash
        run: |
          sort > expected-assets.txt <<EOF
          mago-${VERSION}-source.tar.gz
          mago-${VERSION}-source.zip
          mago-${VERSION}-wasm.tar.gz
          mago-${VERSION}-aarch64-apple-darwin.tar.gz
          mago-${VERSION}-x86_64-apple-darwin.tar.gz
          mago-${VERSION}-aarch64-unknown-linux-gnu.tar.gz
          mago-${VERSION}-aarch64-unknown-linux-musl.tar.gz
          mago-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          mago-${VERSION}-x86_64-unknown-linux-musl.tar.gz
          EOF
          find assets -type f -printf '%f\n' | sort > downloaded-assets.txt
          diff -u expected-assets.txt downloaded-assets.txt || {
            echo "::error::The downloaded assets differ from the expected release assets."
            exit 1
          }

      # install.sh checks a download against this file when gh is missing, and the composer job pins these
      # SHA-256s in the tag's heyjordanparker/mago-sharp version.
      - name: Write the SHA-256 of every asset
        shell: bash
        run: |
          sums="mago-${VERSION}-sha256sums.txt"
          (cd assets && sha256sum -- *) > "$sums"
          cat "$sums"
          mv "$sums" assets/
          echo "$sums" >> expected-assets.txt
          sort -o expected-assets.txt expected-assets.txt

      - name: "Artifact upload: SHA-256s"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sha256sums
          path: assets/mago-${{ env.VERSION }}-sha256sums.txt
          if-no-files-found: error

      - name: Upload every asset to the draft release, check it, then publish it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "$GITHUB_REF is not a release tag, so nothing is published."
            exit 0
          fi
          if ! is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> view-error.txt); then
            grep -q "release not found" view-error.txt || { cat view-error.txt >&2; exit 1; }
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
            is_draft=true
          fi
          if [[ $is_draft != true ]]; then
            echo "::error::Release $TAG is already published, so this run changes nothing. Release a new tag."
            exit 1
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > released-assets.txt
          diff -u expected-assets.txt released-assets.txt || {
            echo "::error::Draft release $TAG holds different assets than expected, so it stays a draft."
            exit 1
          }
          gh release edit "$TAG" --draft=false

  # The tag's heyjordanparker/mago-sharp version is sharp/mago's split, as sharp.yml's COMPOSER job pushes a branch,
  # plus a commit that adds the release's SHA-256s as composer/sha256sums.txt. The Composer wrapper refuses an
  # archive whose SHA-256 differs, so the package version pins the exact binary, as esbuild's and Biome's npm
  # packages do. The tag is pushed once the release is public, so every asset it names can be downloaded, and the
  # push never forces, so a published version never changes.
  composer:
    name: Publish heyjordanparker/mago-sharp
    runs-on: ubuntu-latest
    needs: [crate_metadata, release]
    if: github.ref_type == 'tag'
    defaults:
      run:
        working-directory: .
    env:
      VERSION: ${{ needs.crate_metadata.outputs.version }}
    steps:
      - name: git checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Split sharp/mago
        run: |
          curl -fsSL https://github.com/splitsh/lite/releases/download/v1.0.1/lite_linux_amd64.tar.gz -o "$RUNNER_TEMP/splitsh-lite.tar.gz"
          echo "2539301ce5e21d0ca44b689d0dd2c1b20d9f9e996c1fe6c462afb8af4e7141cc  $RUNNER_TEMP/splitsh-lite.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/splitsh-lite.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/splitsh-lite" --prefix=sharp/mago --target=refs/heads/mago

      - name: Download the SHA-256s
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sha256sums
          path: ${{ runner.temp }}

      - name: git checkout heyJordanParker/mago-sharp
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: heyJordanParker/mago-sharp
          ssh-key: ${{ secrets.MAGO_SHARP_DEPLOY_KEY }}
          path: sharp/build/mago-sharp

      - name: Push the tag, with the SHA-256 of every release asset
        working-directory: sharp/build/mago-sharp
        run: |
          git fetch "$GITHUB_WORKSPACE" refs/heads/mago
          git switch --detach FETCH_HEAD
          cp "$RUNNER_TEMP/mago-$VERSION-sha256sums.txt" composer/sha256sums.txt
          git add composer/sha256sums.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --message "The SHA-256 of every mago $VERSION release asset"
          git push origin "HEAD:refs/tags/$GITHUB_REF_NAME"
