name: Spec guard
# pull_request_target runs this file as the base branch has it, so a pull request can't change or skip these jobs.
# Each job checks the pull request's merge commit out as data and runs only the base commit's sharp/bin/spec on it,
# with a read-only token and no secrets. No file of the pull request runs, which is what makes pull_request_target safe.
# The merge queue's run checks the commit the queue merged, the pull request onto master and the changes ahead of it,
# the same way, so both checks report on it, as the queue requires.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master
  merge_group:
permissions:
  contents: read
jobs:
  # Compares sharp/baseline/spec and the examples with the base: sharp/bin/spec --base. It runs on `edited` too, where
  # it finds what it found before.
  SPEC_GUARD:
    runs-on: ubuntu-24.04
    steps:
      # The guard judges each commit of base..HEAD, so the checkout fetches the history with no tree or blob, and git
      # fetches the trees and blobs of the commits the guard reads as it reads them.
      - &checkout
        name: git checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.merge_group.head_sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          persist-credentials: false
          fetch-depth: 0
          filter: tree:0
      - name: The base branch's checker compares sharp/baseline/spec with the base
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "$BASE:sharp/bin/spec"; then
            echo "sharp/bin/spec does not exist at $BASE, so there is nothing to compare."
            exit 0
          fi
          git show "$BASE:sharp/bin/spec" > "$RUNNER_TEMP/spec"
          php "$RUNNER_TEMP/spec" --base "$BASE"
  # A commit message line such as `Completes: §6.1, §9` claims those sections are done, so the pull request that lands
  # the commit checks the claim, whichever commits it lands with. sharp/bin/spec --completes, which reads the claims on
  # its standard input, fails on a malformed claim, on a section with no checked example and on a section
  # sharp/baseline/spec still lists. The messages are those of the commits the head holds and the base lacks, from the
  # API's compare, as data, which a pull request's run and the merge queue's read the same way. They go to php through
  # a pipe, since Linux takes no single argument or environment variable over 128 KiB: pull request #576, 109 commits,
  # stopped with "/usr/bin/php: Argument list too long" when they went in BODY. The step runs in bash with pipefail, so
  # a failed API call fails it.
  COMPLETES:
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - name: Every section a commit message completes has its examples passing
        shell: bash
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git cat-file -e "$BASE:sharp/bin/spec"; then
            echo "sharp/bin/spec does not exist at $BASE, so there is no Completes: check."
            exit 0
          fi
          git show "$BASE:sharp/bin/spec" > "$RUNNER_TEMP/spec"
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD?per_page=100" --jq '.commits[].commit.message' \
            | php "$RUNNER_TEMP/spec" --completes
