name: Completes
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - master
permissions:
  contents: read
jobs:
  # A pull request body line such as `Completes: §6.1, §9` claims those sections are done. sharp/bin/spec --completes
  # reads it on the merge commit LINUX tests, and fails on a malformed claim, on a section with no checked example and
  # on a section sharp/baseline/spec still lists. It runs on `edited` too, which the main workflow never does.
  COMPLETES:
    runs-on: ubuntu-24.04
    steps:
      - name: git checkout
        uses: actions/checkout@v6
      - name: Every section the body completes has its examples passing
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: php sharp/bin/spec --completes
