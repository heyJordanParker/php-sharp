name: Mago

on:
  push:
    branches: [master]
  # Only a pull request into master, as sharp.yml runs, so the run CHANGES reuses passed against master.
  pull_request:
    branches: [master]
  # The weekly run: every job on master's tip, and the workspace's tests on nightly Rust as well.
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # ci-passed is this workflow's one required check, so the workflow always runs, and every other job skips a change
  # that leaves Mago alone: one outside sharp/mago/, sharp/composer/, this workflow, sharp/bin/build-mago and the
  # actions it runs, as sharp.yml's CHANGES skips a change to documentation alone. The weekly run runs every job. A
  # tree runs them once: a push to master skips them when a pull request run passed every job on its tree, and links
  # that run, as .github/actions/passed-tree explains.
  CHANGES:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      mago: ${{ steps.diff.outputs.mago }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The root package's rust-version, which release.yml builds the binaries with, so every job tests that toolchain.
      - name: Read the toolchain sharp/mago/Cargo.toml's rust-version names
        id: rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' sharp/mago/Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error::sharp/mago/Cargo.toml's [package] names no rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find the pull request run that passed every job on this tree
        id: passed
        if: github.event_name == 'push'
        uses: ./.github/actions/passed-tree
        with:
          workflow: mago.yml
          events: pull_request
          passed: all(.jobs[]; .conclusion == "success")

      - name: The jobs don't run again
        if: steps.passed.outputs.run
        env:
          RUN: ${{ steps.passed.outputs.run }}
        run: echo "::notice::This tree ran and passed every Mago CI job in $RUN, so they don't run again."

      - name: Find changes to Mago
        id: diff
        if: ${{ !steps.passed.outputs.run }}
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ $GITHUB_EVENT_NAME == schedule ]]; then
            echo mago=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- sharp/mago sharp/composer .github/workflows/mago.yml sharp/bin/build-mago \
            .github/actions/setup-lean .github/actions/clean-kept-build .github/actions/passed-tree .github/actions/mago-cache \
            .github/actions/mago-cache-prune; then
            echo mago=false >> "$GITHUB_OUTPUT"
          else
            echo mago=true >> "$GITHUB_OUTPUT"
          fi

  # The gates on Linux with CHANGES's rust toolchain, the one sharp/mago/Cargo.toml's rust-version names and
  # release.yml builds the binaries with, and the Linux binary plain-php runs. They run beside tests, which takes as
  # long. The weekly run adds clippy on nightly Rust.
  checks:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    strategy:
      fail-fast: false
      matrix:
        rust: ${{ fromJSON(github.event_name == 'schedule' && format('["{0}", "nightly"]', needs.CHANGES.outputs.rust) || format('["{0}"]', needs.CHANGES.outputs.rust)) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: show the Rust toolchain on PATH
        run: |
          type -a rustc cargo
          rustc --version
          cargo --version

      # Next week's nightly is another compiler, which rebuilds every crate, so only the pinned toolchain saves.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_CHECKS_${{ matrix.rust }}
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ github.event_name == 'schedule' && matrix.rust != 'nightly' }}
          target-dir-env: true

      - name: Install PHP
        if: matrix.rust != 'nightly'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        if: matrix.rust != 'nightly'
        run: composer install

      - name: Install just
        if: matrix.rust != 'nightly'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Test PHP SDK
        if: matrix.rust != 'nightly'
        run: just test-sdk

      - name: cargo check
        if: matrix.rust != 'nightly'
        run: cargo check --workspace --locked

      # Workspace builds merge features, so only a build of the bridge alone shows what php links.
      - name: cargo check the PHP# bridge alone
        if: matrix.rust != 'nightly'
        run: cargo check -p mago-sharp-bridge --locked

      # The fuzz crate is a workspace of its own, which fuzz.yml builds only when it changes, so a version bump that
      # leaves its lock behind fails here, on the pull request that makes it.
      - name: The fuzz crate's Cargo.lock is current
        if: matrix.rust != 'nightly'
        run: cargo metadata --locked --format-version 1 --manifest-path crates/syntax/fuzz/Cargo.toml > /dev/null

      - name: keep the file watcher out of the PHP# bridge
        if: matrix.rust != 'nightly'
        run: |
          if output=$(cargo tree -p mago-sharp-bridge -e normal -i notify --locked 2>&1); then
            echo "$output"
            echo "::error::mago-sharp-bridge depends on notify, so php would link a file watcher"
            exit 1
          fi
          echo "$output" | grep -q "did not match any packages"

      - name: Verify the PHP SDK's NodeKind is generated from the syntax tree
        if: matrix.rust != 'nightly'
        run: |
          php scripts/regen-sdk-node-kinds.php
          git diff --exit-code composer/src/Sdk/Syntax/NodeKind.php

      - name: cargo fmt
        if: matrix.rust != 'nightly'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The test-run binary, which behaves as release's without its fat LTO, as release-build builds macOS's.
      - name: Build mago with sharp/bin/build-mago
        id: build
        if: matrix.rust != 'nightly'
        working-directory: .
        run: |
          sharp/bin/build-mago
          echo "binary=$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago/test-run/mago" >> "$GITHUB_OUTPUT"

      - name: Upload the binary for plain-php
        if: matrix.rust != 'nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

      - name: Validate composer code format
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" format --dry-run'

      - name: Lint composer code
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" lint --reporting-format=github'

      - name: Analyze composer code
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" analyze --reporting-format=github'

  # The workspace's tests, on Linux and on macOS, which covers the few lines of Mago that differ there, such as the
  # watch mode's FSEvents. The weekly run adds them on nightly Rust on Linux.
  tests:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: ${{ fromJSON(github.event_name == 'schedule' && format('["{0}", "nightly"]', needs.CHANGES.outputs.rust) || format('["{0}"]', needs.CHANGES.outputs.rust)) }}
        exclude:
          - { os: macos-latest, rust: nightly }

    # The macOS leg runs on the self-hosted Mac runners, except for a pull request from another repository: this one is
    # public. head.repo.fork can't tell, because this repository is itself a fork of php/php-src.
    runs-on: ${{ matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-local' || matrix.os }}

    permissions:
      contents: read

    # Without incremental state, which dtolnay/rust-toolchain turns off: on the Macs, the dev profile's took 6 GB of the
    # folder they keep, and the leg's time is the tests' own.
    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}

      # Only the pinned toolchain saves, as in checks.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_TESTS_${{ matrix.rust }}
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ github.event_name == 'schedule' && matrix.rust != 'nightly' }}
          target-dir-env: true

      # setup-php brew-installs PHP on macOS, so the self-hosted runners use their Homebrew PHP and Composer instead.
      - name: Install PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        run: composer install

      # The workspace's tests run lake.
      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo test (property)
        if: matrix.os == 'ubuntu-latest' && matrix.rust != 'nightly'
        run: cargo test -p mago-codex --features property-tests --locked

  # The macOS binary plain-php runs, in the test-run profile sharp/mago/Cargo.toml explains, since plain-php needs a
  # binary that behaves as release's, not release's fat LTO. It builds where sharp/bin/test builds it, in the build
  # folder the self-hosted Macs keep, so it rebuilds only what changed since that runner's last build.
  release-build:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-local' || 'macos-latest' }}

    permissions:
      contents: read

    # With incremental state, as sharp.yml's MACOS builds the same mago in the same folder. dtolnay/rust-toolchain
    # turns it off only when CARGO_INCREMENTAL is unset.
    env:
      CARGO_INCREMENTAL: 1

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      - name: Build mago with sharp/bin/build-mago
        id: build
        working-directory: .
        run: |
          sharp/bin/build-mago
          echo "binary=$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago/test-run/mago" >> "$GITHUB_OUTPUT"

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  # Installs heyjordanparker/mago-sharp from what git archive ships, the way Packagist ships it, and
  # heyjordanparker/php-sharp-composer from sharp/composer, on the runner's own PHP. A package that requires
  # upstream's carthage-software/mago at the release this checker left from, as an extension host does,
  # installs no second checker, and one that requires a later release installs nothing. Then runs mago on
  # a one-class .sharp project with the binary the job before built.
  plain-php:
    needs: [CHANGES, checks, release-build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-local' || matrix.os }}

    permissions:
      contents: read

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      # The self-hosted runners already have Homebrew's PHP and Composer, and a job never installs on them.
      - name: brew
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: brew install php composer

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      - name: Download the binary the job before built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ runner.temp }}/mago

      - name: Run mago from Composer on plain PHP
        run: |
          php -v
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mago") | .version')
          package="$RUNNER_TEMP/mago-sharp-package"
          project="$RUNNER_TEMP/project"
          mkdir -p "$package" "$project/src/App"
          git archive HEAD | tar -x -C "$package"
          cd "$project"
          cat > composer.json <<JSON
          {
              "repositories": [
                  { "type": "path", "url": "$GITHUB_WORKSPACE/sharp/composer" },
                  {
                      "type": "path",
                      "url": "$package",
                      "options": {"symlink": false, "versions": {"heyjordanparker/mago-sharp": "$version"}}
                  }
              ],
              "autoload": { "psr-4": { "App\\\\": "src/App/" } },
              "config": { "allow-plugins": { "heyjordanparker/php-sharp-composer": true } }
          }
          JSON
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          composer require --no-interaction heyjordanparker/php-sharp-composer:@dev
          composer require --no-interaction --dev "heyjordanparker/mago-sharp:$version"
          mkdir -p "$RUNNER_TEMP/upstream-host"
          cat > "$RUNNER_TEMP/upstream-host/composer.json" <<'JSON'
          {
              "name": "probe/upstream-host",
              "version": "0.1.0",
              "require": { "carthage-software/mago": "^1.50" }
          }
          JSON
          composer config repositories.upstream-host path "$RUNNER_TEMP/upstream-host"
          composer require --no-interaction --dev probe/upstream-host:0.1.0
          test ! -e vendor/carthage-software/mago
          # A host that needs a later upstream release than the one this checker left from gets no install.
          mkdir -p "$RUNNER_TEMP/later-host"
          cat > "$RUNNER_TEMP/later-host/composer.json" <<'JSON'
          {
              "name": "probe/later-host",
              "version": "0.1.0",
              "require": { "carthage-software/mago": "^1.57" }
          }
          JSON
          composer config repositories.later-host path "$RUNNER_TEMP/later-host"
          if composer require --no-interaction --dev probe/later-host:0.1.0; then
            echo "A host that requires carthage-software/mago ^1.57 installed beside mago-sharp." >&2
            exit 1
          fi
          binary_dir="vendor/heyjordanparker/mago-sharp/composer/bin/$version/mago-$version-$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "$binary_dir"
          install -m 755 "$RUNNER_TEMP/mago/mago" "$binary_dir/mago"
          output=$(vendor/bin/mago --version 2>&1)
          echo "$output"
          test "$output" = "mago $version"
          vendor/bin/mago analyze
          vendor/bin/mago compile

  typos-check:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install typos
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos

      - name: Search for misspellings
        run: typos

  # Nightly, because only nightly honours #[coverage(off)], cargo-llvm-cov's way to exclude code that cannot run by design.
  patch-coverage:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # The pull request's merge commit and its first parent, the base it merges into.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
          components: llvm-tools-preview

      # cargo-llvm-cov builds in CARGO_TARGET_DIR's llvm-cov-target.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_COVERAGE
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          target-dir-env: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      # The root crate's external analyzer tests run a PHP SDK worker, which needs PHP and the vendor directory.
      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        run: composer install

      # Every test of the three packages, because their code is shared with plain PHP and the PHP tests cover that part.
      # Then the root crate's tests that analyze through a PHP SDK worker, the only tests of the analyzer's external
      # providers: PluginRegistry takes an external analyzer only over a WorkerPool, a real worker process. The report
      # names the three packages, because without them it reports only the root crate's own files.
      - name: Measure the tests' coverage
        env:
          MAGO_REQUIRE_PHP_SDK_TESTS: "1"
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked -p mago-analyzer -p mago-semantics -p mago-sharp-bridge
          cargo llvm-cov --no-report --locked -p mago \
            --test external_analyzer_entry_points \
            --test external_analyzer_invocation \
            --test external_analyzer_lifecycle \
            --test external_analyzer_refinement \
            --test external_analyzer_scan \
            --test server_engine
          cargo llvm-cov report -p mago-analyzer -p mago-semantics -p mago-sharp-bridge --lcov --output-path lcov.info
          awk '/^DA:/ { split(substr($0, 4), r, ","); total++; if (r[2] == 0) missed++ } END { print "throwaway: " total " lines, " missed " not run" }' lcov.info
          awk '/^SF:/ { f = substr($0, 4) } /^DA:/ { split(substr($0, 4), r, ","); print f ":" r[1] ":" (r[2] > 0) }' lcov.info | sort | sha256sum | sed 's/^/throwaway: per-line results /'

      # As coverage.py's exclude_lines leaves out `raise NotImplementedError`: an impossible arm is an unreachable!(…)
      # call, which no test can run. Unlike coverage.py, a line is left out only when nothing before the call runs:
      # nothing, a match arm's pattern without an `if` guard, `{`, `else {`, `||` or `.unwrap_or_else(||`. So
      # `let kind = self.kind_of(call).unwrap_or_else(|| unreachable!(…));` still needs a test of `kind_of`.
      # cargo-llvm-cov has no line exclusion, so its lcov loses the line's records: DA, and FN, which diff-cover reads
      # as the line of a closure such as `|| unreachable!(…)`.
      - name: Leave out the lines that only call unreachable!
        run: |
          awk '
            function impossible(line,   prefix, pattern) {
              prefix = substr(line, 1, index(line, "unreachable!(") - 1)
              gsub(/^[ \t]+|[ \t]+$/, "", prefix)
              if (prefix == "" || prefix ~ /^(\{|(\} )?else \{|\|\||\.unwrap_or_else\(\|\|)$/) return 1
              if (prefix !~ /=>$/) return 0
              pattern = substr(prefix, 1, length(prefix) - 2)
              gsub(/\.\.=/, "", pattern)
              return pattern !~ /[={;]/ && pattern !~ /(^|[^A-Za-z0-9_])if([^A-Za-z0-9_]|$)/
            }
            /^SF:/ { delete unreachable; file = substr($0, 4); for (n = 1; (getline line < file) > 0; n++) if (index(line, "unreachable!(") && impossible(line)) unreachable[n]; close(file) }
            /^(DA|FN):/ { split(substr($0, 4), record, ","); if (record[1] in unreachable) next }
            { print }
          ' lcov.info > reachable.info

      # From the repository root, where diff-cover's git paths and the lcov's source paths meet.
      - name: Every line the pull request adds is covered
        working-directory: .
        run: |
          if ! git cat-file -e HEAD^1:sharp/mago; then
            echo "sharp/mago does not exist at the base, so no Mago line is new to it."
            exit 0
          fi
          pipx run --spec diff-cover==10.6.0 diff-cover sharp/mago/reachable.info \
            --compare-branch HEAD^1 \
            --include 'sharp/mago/crates/analyzer/src/**' 'sharp/mago/crates/semantics/src/**' 'sharp/mago/crates/sharp-bridge/src/**' \
            --format github-annotations:error \
            --fail-under 100 || {
            echo "::error::A test must run every line above. Mark a function that cannot run by design with #[cfg_attr(coverage_nightly, coverage(off))], and write an impossible arm as unreachable!(…) with its reason, on a line where nothing else runs."
            exit 1
          }

  # The one required check of this workflow: it passes only when every job above passed, or skipped a change that
  # leaves Mago alone, so a job added later blocks merges without a change to the repository's rules. It runs always,
  # so it reports on every pull request, even one whose every other job skipped.
  ci-passed:
    if: always()
    needs: [CHANGES, checks, tests, release-build, plain-php, typos-check, patch-coverage]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed, or skipped a change that leaves Mago alone
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, tests, release-build, plain-php, typos-check, patch-coverage
          jobs: ${{ toJSON(needs) }}

      # The weekly run's jobs saved their targets when they ended, so this job, which needs them all, deletes the ones
      # the new targets replaced.
      - name: checkout
        if: always() && github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Delete the Mago target caches this run replaced
        if: always() && github.event_name == 'schedule'
        uses: ./.github/actions/mago-cache-prune
