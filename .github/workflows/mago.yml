name: Mago

on:
  push:
    branches: [master]
  # Only a pull request into master, as sharp.yml runs.
  pull_request:
    branches: [master]

# A pull request, and master, runs one push at a time, and only the newest push waits, next's own pull request runs
# each push at once, and a push cancels the run in progress of any other pull request, as sharp.yml's concurrency
# explains.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.head_ref == 'next' && github.run_id || github.event.pull_request.url
    || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'next' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # ci-passed is this workflow's one required check. Every push runs every job, whatever it changed, and builds
  # everything from source, as sharp.yml's CHANGES explains. A red push opens an issue, as ci-passed does, for a pull
  # request that fixes it forward. The workspace's tests run in sharp.yml, which CI_PASSED covers: on Linux in MAGO, on BUILD_LINUX's build, so
  # Linux builds Mago's dev target once, and on macOS in MACOS, the run's one Mac job, so a defect only macOS finds, such
  # as one in the watch mode's FSEvents code, fails before the merge.
  CHANGES:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      base: ${{ steps.base.outputs.sha }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      # The root package's rust-version, which release.yml builds the binaries with, so every job tests that toolchain.
      - name: Read the toolchain sharp/mago/Cargo.toml's rust-version names
        id: rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' sharp/mago/Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error::sharp/mago/Cargo.toml's [package] names no rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A push's changes start at the commit of master's newest push run that GitHub didn't cancel, as sharp.yml's
      # CHANGES explains.
      - name: Find the commit of master's last push run that ran
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API answered this list with HTTP 502 once and failed the push run (44132260911), so it retries, as
          # .github/actions/setup-lean retries Lean's install.
          for attempt in 1 2 3; do
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mago.yml/runs?branch=master&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .id < (env.GITHUB_RUN_ID | tonumber))][0].head_sha // empty'); then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "::error::GitHub's API refused the list of master's push runs 3 times. The output above names the cause."
              exit 1
            fi
            echo "Retrying the list of master's push runs in $((attempt * 15)) seconds (retry $attempt of 2)" >&2
            sleep $((attempt * 15))
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "This push's changes start at ${sha:-no commit}."

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # The gates on Linux with CHANGES's rust toolchain, the one sharp/mago/Cargo.toml's rust-version names and
  # release.yml builds the binaries with, and the Linux binary plain-php and SPEED run. Ubuntu 24.04's glibc 2.39 is older than the 2.41 of the sharp/docker image's Debian, so the mago it builds runs in
  # that image, where SPEED counts it, and on plain-php's runner. On ubuntu-latest, Ubuntu 26.04 since November 2026, it
  # needed glibc 2.43, and SPEED failed on run 45139352435 with "version `GLIBC_2.43' not found".
  checks:
    needs: CHANGES
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      actions: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}
          components: rustfmt, clippy

      - name: show the Rust toolchain on PATH
        run: |
          type -a rustc cargo
          rustc --version
          cargo --version

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install typos
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos

      # The PHP# engine mago links, built by sharp/bin/build-mago --engine from the static archives of these packages,
      # which it links into libphp.a.
      - name: Install what the PHP# engine builds with
        uses: ./.github/actions/engine-packages
      - name: Build the engine mago links
        working-directory: ${{ github.workspace }}
        run: sharp/bin/build-mago --engine

      # sharp/bin/check mago-checks runs them, as it does on a machine: typos, the PHP SDK's tests, cargo check of
      # the workspace and of the PHP# bridge alone, the fuzz crate's Cargo.lock, no file watcher in the bridge, the PHP
      # SDK's generated NodeKind, rustfmt and clippy, then the test-run mago, which analyzes the standard library and
      # formats, lints and analyzes the Composer code, with the issues as annotations.
      - name: Mago's checks, and the test-run mago
        working-directory: .
        env:
          MAGO_REPORTING_FORMAT: github
        run: sharp/bin/check mago-checks

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: sharp/build/linux-x86_64/mago/test-run/mago
          if-no-files-found: error

      # As .github/actions/cancel-failed-run explains.
      - &cancel-failed-run
        name: Cancel the run, which can no longer pass
        if: failure() && github.event_name == 'pull_request' && github.head_ref != 'next'
        uses: ./.github/actions/cancel-failed-run

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # Installs heyjordanparker/mago-sharp from what git archive ships, the way Packagist ships it, and
  # heyjordanparker/php-sharp-composer from sharp/composer, on the runner's own PHP. A package that requires
  # upstream's carthage-software/mago at the release this checker left from, as an extension host does,
  # installs no second checker, and one that requires a later release installs nothing. Then runs mago on
  # a one-class .sharp project with the binary checks built, and sharp/phpunit's tests, which stop. On macOS,
  # sharp.yml's MACOS runs the same check on its dev build, and release.yml's macOS build on the release binary.
  plain-php:
    needs: [CHANGES, checks]
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      # Into the target folder sharp/bin/check plain-php reads the test-run mago from. A download that stalls holds its
      # job until the job's timeout, as one in sharp.yml held run 44989865954 for 28 minutes, where a download takes 1 to
      # 38 s. So it stops after 5 minutes, and one that failed or stopped runs once more.
      - name: Download the binary the job before built
        id: download
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ runner.temp }}/target/test-run
      - name: Download the binary the job before built, the second try
        if: steps.download.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ runner.temp }}/target/test-run

      # sharp/bin/check plain-php runs mago from Composer on plain PHP, then stops sharp/phpunit's tests on plain PHP
      # before a .sharp test file's source prints, as it does on a machine.
      - name: Run mago from Composer on plain PHP, and stop sharp/phpunit's tests on it
        working-directory: .
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: sharp/bin/check plain-php

      - *cancel-failed-run

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # What proving and compiling cost, against sharp/baseline/speed.json, the last release's, in counts no load changes, as
  # benchmark/speed.php explains: each law's Lean heartbeats, and the instructions mago's own process retires for a
  # one-file edit on one thread, under valgrind's cachegrind, since a hosted runner exposes no hardware counter to perf.
  # It counts the test-run mago checks built, which behaves as the release users run, as plain-php runs it, so it builds
  # nothing: in sharp.yml it built that mago again, for 272 of its 408 s on run 45122643706. sharp/bin/land lands only a
  # commit whose runs passed, so a commit that proves or compiles slower never reaches master. What it counted is the
  # run's speed artifact, which the release bump commits as the next baseline. It runs in the sharp/docker image, which
  # carries valgrind, Composer and the pinned Lean, so it downloads none of them. checks builds the binary against a
  # glibc older than the image's, as its comment explains.
  SPEED:
    needs: [CHANGES, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: write
      contents: read
      packages: read

    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie

    defaults:
      run:
        working-directory: .

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      # sharp/docker/run pulls the sharp/docker image from ghcr.io.
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # As plain-php downloads it, into the checkout, which the image's container mounts.
      - name: Download the binary checks built
        id: download
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: sharp/build/speed/test-run
      - name: Download the binary checks built, the second try
        if: steps.download.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: sharp/build/speed/test-run
      # The artifact keeps no file mode.
      - name: Make the binary executable
        run: chmod +x sharp/build/speed/test-run/mago

      - name: Count what proving and compiling cost, against the last release's
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          sharp/docker/run env CARGO_TARGET_DIR=/src/sharp/build/speed SPEED_WRITE=/src/sharp/build/speed/speed.json \
            SPEED_COMMIT="$COMMIT" sharp/bin/check speed

      - name: Upload what the run counted, the next release's baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speed
          path: sharp/build/speed/speed.json
          if-no-files-found: ignore

      - *cancel-failed-run

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # The one required check of this workflow: it passes only when every job above passed, so a job added later blocks
  # merges without a change to the repository's rules. It runs always, so it reports on every run, even one whose
  # other jobs failed before they started.
  ci-passed:
    if: always()
    needs: [CHANGES, checks, plain-php, SPEED]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      # Only for the actions below.
      - name: checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Every job passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed run on master
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/red-master-issue
        with:
          title: A push to master failed Mago CI
          range: ${{ needs.CHANGES.outputs.base && format('{0}..{1}', needs.CHANGES.outputs.base, github.sha) || '' }}

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
