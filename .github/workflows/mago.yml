name: Mago

on:
  push:
    branches: [master]
  # Only a pull request into master, as sharp.yml runs, so a run .github/actions/passed-tree finds passed against master.
  pull_request:
    branches: [master]

# Master runs one push at a time, and only the newest push waits, as sharp.yml's concurrency explains.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # ci-passed is this workflow's one required check. Every push runs every job, whatever it changed, the macOS ones
  # among them, so a defect only macOS finds, such as one in the watch mode's FSEvents code, fails before the merge. A
  # push to master runs none of the tests when a pull request's run passed ci-passed on its
  # tree. It runs checks again, which saves the target every pull request's run restores, but for a release's push,
  # which builds nothing. A push whose tree no pull request's run passed runs every job, the macOS ones among them, and
  # its red push opens an issue, as ci-passed does, for a pull request that fixes it forward. The workspace's tests on
  # Linux run in sharp.yml's MAGO, on BUILD_LINUX's build, so Linux builds Mago's dev target once, and CI_PASSED
  # covers them.
  CHANGES:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      base: ${{ steps.base.outputs.sha }}
      bump: ${{ steps.version.outputs.bump }}
      passed: ${{ steps.passed.outputs.run }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      # The notice .github/actions/passed-tree finds a run's tree by, as sharp.yml's CHANGES names it.
      - name: Name the tree this run tests
        run: echo "::notice title=Tested tree::$(git rev-parse 'HEAD^{tree}')"

      # The root package's rust-version, which release.yml builds the binaries with, so every job tests that toolchain.
      - name: Read the toolchain sharp/mago/Cargo.toml's rust-version names
        id: rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' sharp/mago/Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error::sharp/mago/Cargo.toml's [package] names no rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A push's changes start at the commit of master's newest push run that GitHub didn't cancel, as sharp.yml's
      # CHANGES explains.
      - name: Find the commit of master's last push run that ran
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API answered this list with HTTP 502 once and failed the push run (44132260911), so it retries, as
          # .github/actions/setup-lean retries Lean's install.
          for attempt in 1 2 3; do
            if sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mago.yml/runs?branch=master&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .id < (env.GITHUB_RUN_ID | tonumber))][0].head_sha // empty'); then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "::error::GitHub's API refused the list of master's push runs 3 times. The output above names the cause."
              exit 1
            fi
            echo "Retrying the list of master's push runs in $((attempt * 15)) seconds (retry $attempt of 2)" >&2
            sleep $((attempt * 15))
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "This push's changes start at ${sha:-no commit, so every job runs}."

      # A release's bump, as sharp.yml's CHANGES explains.
      - name: Find whether it is a release's bump
        id: version
        run: sharp/bin/check --release | tee -a "$GITHUB_OUTPUT"

      - name: Find the pull request run that passed this tree
        id: passed
        if: github.event_name == 'push'
        uses: ./.github/actions/passed-tree
        with:
          workflow: mago.yml
          events: pull_request
          passed: any(.jobs[]; .name == "ci-passed" and .conclusion == "success")

      - name: The tests don't run again
        if: steps.passed.outputs.run
        env:
          RUN: ${{ steps.passed.outputs.run }}
        run: echo "::notice::This tree ran and passed every Mago job in $RUN, so no test runs again."

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # The gates on Linux with CHANGES's rust toolchain, the one sharp/mago/Cargo.toml's rust-version names and
  # release.yml builds the binaries with, and the Linux binary plain-php runs. On the push to master it saves its
  # target, which every pull request's run restores.
  checks:
    needs: CHANGES
    if: ${{ !(needs.CHANGES.outputs.passed && needs.CHANGES.outputs.bump == 'true') }}
    runs-on: ubuntu-latest
    # A build of the engine takes up to 20 more minutes, which the engine's cache spares a run whose engine
    # inputs an earlier run built.
    timeout-minutes: 50

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}
          components: rustfmt, clippy

      - name: show the Rust toolchain on PATH
        run: |
          type -a rustc cargo
          rustc --version
          cargo --version

      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_CHECKS
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ github.event_name == 'push' }}
          target-dir-env: true

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install typos
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos

      # The PHP# engine mago links, from the cache a run saved for the same inputs, or else built by
      # sharp/bin/build-mago --engine from the static archives of these packages, which it links into libphp.a.
      - name: Restore the engine mago links
        id: mago-engine
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/linux-*-engine/install
          key: MAGO_ENGINE-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('configure.ac', 'build/**', 'main/**', 'Zend/**', 'TSRM/**', 'sapi/**', 'ext/**', 'scripts/**', '!**/tests/**', 'sharp/bin/build-mago', 'sharp/docker/runtime/configure-options') }}
      - name: Build the engine mago links
        if: steps.mago-engine.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends autoconf bison cmake pkg-config re2c libedit-dev libicu-dev liblzma-dev libsodium-dev libsqlite3-dev libssl-dev libxml2-dev zlib1g-dev
          sharp/bin/build-mago --engine
      - name: Save the engine mago links
        if: steps.mago-engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/build/linux-*-engine/install
          key: ${{ steps.mago-engine.outputs.cache-primary-key }}

      # sharp/bin/check mago-checks runs them, as it does on a machine: typos, the PHP SDK's tests, cargo check of
      # the workspace and of the PHP# bridge alone, the fuzz crate's Cargo.lock, no file watcher in the bridge, the PHP
      # SDK's generated NodeKind, rustfmt and clippy, then the test-run mago, which analyzes the standard library and
      # formats, lints and analyzes the Composer code, with the issues as annotations. Every check runs when one before it
      # fails, and the step's log ends with a line for each check that failed.
      - name: Mago's checks, and the test-run mago
        working-directory: .
        env:
          MAGO_REPORTING_FORMAT: github
        run: sharp/bin/check mago-checks

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ env.CARGO_TARGET_DIR }}/test-run/mago
          if-no-files-found: error

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # The workspace's tests on macOS arm64, which covers the few lines of Mago that differ there, such as the watch mode's
  # FSEvents, on the self-hosted Mac runner, for every pull request's push and a push to master whose tree no pull
  # request's run passed. cargo builds in the folder sharp/.cargo's config names, which the runner keeps and sharp.yml's MACOS builds
  # mago in, so it rebuilds only what changed: in sharp/mago/target, which clean-kept-build removes, it built every
  # crate and took 23 minutes on the pushes of pull requests #351 and #352.
  tests-macos:
    name: tests (macOS)
    needs: CHANGES
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: macos-arm64-local
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      # The self-hosted Mac runner keeps sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      # The self-hosted runners use their Homebrew PHP and Composer.
      - name: Install composer dependencies
        run: composer install

      # The workspace's tests run lake.
      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean

      # The PHP# engine mago links, which sharp/bin/build-mago --engine builds in the sharp/build folder the runner
      # keeps, so it builds only what changed since the runner's last build.
      - name: Build the engine mago links
        working-directory: ${{ github.workspace }}
        run: sharp/bin/build-mago --engine

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # The macOS binary plain-php runs, in the test-run profile sharp/mago/Cargo.toml explains, since plain-php needs a
  # binary that behaves as release's, not release's fat LTO. It builds in the target folder the Mac's runner keeps,
  # beside the dev build sharp/bin/test makes there, so it rebuilds only what changed since the runner's last build.
  # It runs when tests (macOS) does.
  release-build:
    needs: CHANGES
    if: ${{ !needs.CHANGES.outputs.passed }}
    runs-on: macos-arm64-local
    timeout-minutes: 60

    permissions:
      contents: read

    # With incremental state, which the test-run profile builds with in the folder the runner keeps.
    # dtolnay/rust-toolchain turns it off only when CARGO_INCREMENTAL is unset.
    env:
      CARGO_INCREMENTAL: 1

    steps:
      # The self-hosted Mac runner keeps sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      # The PHP# engine mago links, which sharp/bin/build-mago --engine builds in the sharp/build folder the runner
      # keeps, so it builds only what changed since the runner's last build.
      - name: Build the engine mago links
        working-directory: ${{ github.workspace }}
        run: sharp/bin/build-mago --engine

      - name: Build mago in the test-run profile
        id: build
        run: |
          target="$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago"
          cargo build --locked --profile test-run --target-dir "$target" --bin mago
          echo "binary=$target/test-run/mago" >> "$GITHUB_OUTPUT"

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # Installs heyjordanparker/mago-sharp from what git archive ships, the way Packagist ships it, and
  # heyjordanparker/php-sharp-composer from sharp/composer, on the runner's own PHP. A package that requires
  # upstream's carthage-software/mago at the release this checker left from, as an extension host does,
  # installs no second checker, and one that requires a later release installs nothing. Then runs mago on
  # a one-class .sharp project with the binary the job before built, and sharp/phpunit's tests, which stop.
  # Its macOS leg runs on the self-hosted Mac runner, with the binary release-build made there. A push to master whose
  # tree a pull request's run passed runs neither leg.
  plain-php:
    needs: [CHANGES, checks, release-build]
    if: >-
      ${{ !cancelled() && !needs.CHANGES.outputs.passed && needs.checks.result == 'success'
      && needs.release-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-arm64-local]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      # The self-hosted Mac runner keeps sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      # Into the target folder sharp/bin/check plain-php reads the test-run mago from.
      - name: Download the binary the job before built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ runner.temp }}/target/test-run

      # sharp/bin/check plain-php runs mago from Composer on plain PHP, then stops sharp/phpunit's tests on plain PHP
      # before a .sharp test file's source prints, as it does on a machine.
      - name: Run mago from Composer on plain PHP, and stop sharp/phpunit's tests on it
        working-directory: .
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: sharp/bin/check plain-php

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true

  # The one required check of this workflow: it passes only when every job above passed, or skipped a push to master
  # whose tree a pull request's run passed, so a job added later blocks merges without a change to the repository's
  # rules. It runs always, so it reports on every run, even one whose every other job skipped.
  ci-passed:
    if: always()
    needs: [CHANGES, checks, tests-macos, release-build, plain-php]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      # Only for the actions below.
      - name: checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Measure the job's CPU-seconds and peak memory
        uses: ./.github/actions/usage

      - name: Every job passed, or skipped a tree that a pull request's run passed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, tests-macos, release-build, plain-php
          jobs: ${{ toJSON(needs) }}

      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed run on master
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/red-master-issue
        with:
          title: A push to master failed Mago CI
          range: ${{ needs.CHANGES.outputs.base && format('{0}..{1}', needs.CHANGES.outputs.base, github.sha) || '' }}

      # checks saved its target when it ended, so this job, which needs it, deletes the ones the new target replaced.
      - name: Delete the Mago target caches this run replaced
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/mago-cache-prune

      - name: Write the job's CPU-seconds and peak memory
        if: always()
        uses: ./.github/actions/usage
        with:
          end: true
