name: Mago

on:
  push:
    branches: [master]
  # Only a pull request into master, as sharp.yml runs, so a run .github/actions/passed-tree finds passed against master.
  pull_request:
    branches: [master]

# Master runs one push at a time, and only the newest push waits, as sharp.yml's concurrency explains.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # ci-passed is this workflow's one required check, so the workflow always runs, and every other job skips a change
  # that leaves Mago alone: one outside sharp/mago/, sharp/composer/, the sharp/harness/Psr/ interfaces sharp/composer's
  # mago.toml includes, sharp/phpunit/, this workflow, sharp/bin/coverage, sharp/bin/build-mago and the sharp/docker
  # image the Linux tests run in, and the actions it runs, as sharp.yml's CHANGES skips a change to documentation alone.
  # A pull request's run has no macOS job, so a merge never waits for the Mac, and the push to master runs them after
  # the merge. So a defect only macOS finds, such as one in the watch mode's FSEvents code, lands on master first, and
  # its red push opens an issue, as ci-passed does, for a pull request that fixes it forward. The push skips the Linux
  # tests when a pull request's run passed them on its tree, as sharp.yml's CHANGES explains. It runs checks and
  # patch-coverage again, which save the targets every pull request's run restores.
  CHANGES:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      base: ${{ steps.base.outputs.sha }}
      linux-passed: ${{ steps.linux.outputs.run && 'true' || '' }}
      mago: ${{ steps.diff.outputs.mago }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The root package's rust-version, which release.yml builds the binaries with, so every job tests that toolchain.
      - name: Read the toolchain sharp/mago/Cargo.toml's rust-version names
        id: rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' sharp/mago/Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error::sharp/mago/Cargo.toml's [package] names no rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A push's changes start at the commit of master's newest push run that GitHub didn't cancel, as sharp.yml's
      # CHANGES explains.
      - name: Find the commit of master's last push run that ran
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mago.yml/runs?branch=master&event=push&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .id < (env.GITHUB_RUN_ID | tonumber))][0].head_sha // empty')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "This push's changes start at ${sha:-no commit, so every job runs}."

      - name: Find changes to Mago
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || steps.base.outputs.sha }}
        run: |
          if [[ -z $BASE ]]; then
            echo mago=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- sharp/mago sharp/composer sharp/harness/Psr sharp/phpunit .github/workflows/mago.yml \
            sharp/bin/coverage sharp/bin/build-mago sharp/docker .github/actions/setup-lean .github/actions/clean-kept-build \
            .github/actions/mago-cache .github/actions/mago-cache-prune .github/actions/red-master-issue; then
            echo mago=false >> "$GITHUB_OUTPUT"
          else
            echo mago=true >> "$GITHUB_OUTPUT"
          fi

      # The 5 Linux test jobs, which a pull request's run runs as a push's do, so their pass holds for the push.
      - name: Find the pull request run that passed every Linux test job on this tree
        id: linux
        if: github.event_name == 'push'
        uses: ./.github/actions/passed-tree
        with:
          workflow: mago.yml
          events: pull_request
          passed: '[.jobs[] | select(.conclusion == "success" and (.name | startswith("tests (") and . != "tests (macOS)"))] | length == 5'

      - name: The Linux tests don't run again
        if: steps.linux.outputs.run
        env:
          RUN: ${{ steps.linux.outputs.run }}
        run: echo "::notice::This tree ran and passed every Linux Mago test job in $RUN, so only the macOS tests run."

  # The gates on Linux with CHANGES's rust toolchain, the one sharp/mago/Cargo.toml's rust-version names and
  # release.yml builds the binaries with, and the Linux binary plain-php runs. On the push to master it saves its
  # target, which every pull request's run restores.
  checks:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}
          components: rustfmt, clippy

      - name: show the Rust toolchain on PATH
        run: |
          type -a rustc cargo
          rustc --version
          cargo --version

      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_CHECKS
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ github.event_name == 'push' }}
          target-dir-env: true

      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        run: composer install

      - name: Install just and typos
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,typos

      - name: Search for misspellings
        run: typos

      - name: Test PHP SDK
        run: just test-sdk

      - name: cargo check
        run: cargo check --workspace --locked

      # Workspace builds merge features, so only a build of the bridge alone shows what php links.
      - name: cargo check the PHP# bridge alone
        run: cargo check -p mago-sharp-bridge --locked

      # The fuzz crate is a workspace of its own, which fuzz.yml builds only when it changes, so a version bump that
      # leaves its lock behind fails here, on the pull request that makes it.
      - name: The fuzz crate's Cargo.lock is current
        run: cargo metadata --locked --format-version 1 --manifest-path crates/syntax/fuzz/Cargo.toml > /dev/null

      - name: keep the file watcher out of the PHP# bridge
        run: |
          if output=$(cargo tree -p mago-sharp-bridge -e normal -i notify --locked 2>&1); then
            echo "$output"
            echo "::error::mago-sharp-bridge depends on notify, so php would link a file watcher"
            exit 1
          fi
          echo "$output" | grep -q "did not match any packages"

      - name: Verify the PHP SDK's NodeKind is generated from the syntax tree
        run: |
          php scripts/regen-sdk-node-kinds.php
          git diff --exit-code composer/src/Sdk/Syntax/NodeKind.php

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The test-run binary, which behaves as release's without its fat LTO, as release-build builds macOS's.
      # sharp/bin/build-mago builds the dev mago, which logs at DEBUG and reports a missing code that release never
      # prints, so this builds the profile itself, as sharp/mago/Cargo.toml explains.
      - name: Build mago in the test-run profile
        id: build
        run: |
          cargo build --locked --profile test-run --bin mago
          echo "binary=$CARGO_TARGET_DIR/test-run/mago" >> "$GITHUB_OUTPUT"

      # The PHP# standard library, with the sharp/harness interfaces its mago.toml includes, analyzes with no note.
      - name: Check the standard library
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" --colors never --workspace "$GITHUB_WORKSPACE/sharp/composer" analyze --minimum-fail-level note'

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

      - name: Validate composer code format
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" format --dry-run'

      - name: Lint composer code
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" lint --reporting-format=github'

      - name: Analyze composer code
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" analyze --reporting-format=github'

  # The workspace's tests on Linux, in 5 jobs, in the sharp/docker image on the target sharp/bin/build-mago builds there,
  # which sharp.yml's CACHE saves on master and its suites restore, so Linux keeps one dev build of Mago and one cache.
  # Each job selects cargo test's targets, and libtest names within them, so no job compiles the workspace another way:
  # its tests/main.rs targets' compile:: tests, their sharp:: tests and the rest, the converter's cases, and every other
  # target with the doc tests and the property tests. A test target no job names fails the job that lists them.
  tests:
    name: tests (${{ matrix.shard }}/5)
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true' && needs.CHANGES.outputs.linux-passed != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, select: '--test main -- compile::' }
          - { shard: 2, select: '--test main -- sharp::' }
          - { shard: 3, select: '--test main -- --skip compile:: --skip sharp::' }
          - { shard: 4, select: '--test cases' }
          - { shard: 5, select: '--lib --bins --test suite --test pragma --test process_group --test mod --test binder' }

    defaults:
      run:
        working-directory: .

    # sharp/docker/run builds the image FROM these copies, as sharp.yml's suites do.
    env:
      BASE_IMAGE: ghcr.io/heyjordanparker/debian:trixie
      GOLANG_IMAGE: ghcr.io/heyjordanparker/golang:1.27-trixie

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull the base images from ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker pull "$BASE_IMAGE"
          docker pull "$GOLANG_IMAGE"

      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: SHARP_LINUX
          rust: SHARP_LINUX
          rust-paths: |
            sharp/build/cargo
            sharp/build/rustup

      # The targets cargo test --workspace builds, each of which one of the 5 jobs selects.
      - name: Build mago and every test binary, and check that a job selects each test target
        run: |
          sharp/docker/run sharp/bin/build-mago --message-format=json > "$RUNNER_TEMP/build.json"
          unknown=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and (.target.kind | any(. == "test")))
            | .target.name | select(IN("main", "cases", "suite", "pragma", "process_group", "mod", "binder") | not)' "$RUNNER_TEMP/build.json" | sort -u)
          if [[ -n $unknown ]]; then
            echo "::error::No tests job selects these test targets, so they never run: $unknown. Add each to a job's select in mago.yml."
            exit 1
          fi

      # The workspace's tests run a PHP SDK worker from sharp/mago's vendor folder, and lake, which mago compile proves
      # laws with: installing the pinned Lean up front keeps the tests that run lake in parallel from each installing it.
      - name: Install composer dependencies and Lean
        run: |
          sharp/docker/run composer install --no-interaction --no-progress --working-dir=sharp/mago
          sharp/docker/run elan toolchain install "$(cat sharp/mago/crates/sharp-lean/lean/lean-toolchain)"

      - name: cargo test ${{ matrix.select }}
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' ext/sharp/rust-toolchain.toml)
          # shellcheck disable=SC2086 # select is cargo's arguments.
          sharp/docker/run rustup run "$toolchain" cargo test --workspace --locked --manifest-path sharp/mago/Cargo.toml \
            --target-dir "sharp/build/linux-$(uname -m)/mago" ${{ matrix.select }}

      - name: cargo test --doc, and the property tests
        if: matrix.shard == 5
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' ext/sharp/rust-toolchain.toml)
          target="sharp/build/linux-$(uname -m)/mago"
          sharp/docker/run rustup run "$toolchain" cargo test --workspace --locked --manifest-path sharp/mago/Cargo.toml --target-dir "$target" --doc
          sharp/docker/run rustup run "$toolchain" cargo test -p mago-codex --features property-tests --locked --manifest-path sharp/mago/Cargo.toml --target-dir "$target"

  # The workspace's tests on macOS arm64, which covers the few lines of Mago that differ there, such as the watch mode's
  # FSEvents, on the self-hosted Mac runners, on the push to master.
  tests-macos:
    name: tests (macOS)
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true' && github.event_name == 'push'
    runs-on: macos-arm64-local
    timeout-minutes: 90

    permissions:
      contents: read

    # The self-hosted Macs cap each job's parallelism, as sharp.yml's MACOS explains. Lean reads an empty
    # LEAN_NUM_THREADS as 0 threads and panics on its first promise, and mago refuses to start on an empty MAGO_THREADS,
    # so both name a number.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      MAGO_THREADS: 4
      LEAN_NUM_THREADS: 2

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      # The self-hosted runners use their Homebrew PHP and Composer.
      - name: Install composer dependencies
        run: composer install

      # The workspace's tests run lake.
      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean

      - name: cargo test
        run: cargo test --workspace --locked

  # The macOS binary plain-php runs, in the test-run profile sharp/mago/Cargo.toml explains, since plain-php needs a
  # binary that behaves as release's, not release's fat LTO. It builds in the target folder the self-hosted Macs keep,
  # beside the dev build sharp/bin/test makes there, so it rebuilds only what changed since that runner's last build.
  # The push to master runs it.
  release-build:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true' && github.event_name == 'push'
    runs-on: macos-arm64-local
    timeout-minutes: 60

    permissions:
      contents: read

    # With incremental state, which the test-run profile builds with in the folder the runner keeps.
    # dtolnay/rust-toolchain turns it off only when CARGO_INCREMENTAL is unset. The self-hosted Macs cap each job's
    # parallelism, as sharp.yml's MACOS explains.
    env:
      CARGO_INCREMENTAL: 1
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      MAGO_THREADS: 4
      LEAN_NUM_THREADS: 2

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      - name: Build mago in the test-run profile
        id: build
        run: |
          target="$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago"
          cargo build --locked --profile test-run --target-dir "$target" --bin mago
          echo "binary=$target/test-run/mago" >> "$GITHUB_OUTPUT"

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  # Installs heyjordanparker/mago-sharp from what git archive ships, the way Packagist ships it, and
  # heyjordanparker/php-sharp-composer from sharp/composer, on the runner's own PHP. A package that requires
  # upstream's carthage-software/mago at the release this checker left from, as an extension host does,
  # installs no second checker, and one that requires a later release installs nothing. Then runs mago on
  # a one-class .sharp project with the binary the job before built, and sharp/phpunit's tests, which stop.
  # A pull request's run has no macOS leg, so it needs only checks' binary.
  plain-php:
    needs: [CHANGES, checks, release-build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name == 'pull_request' || needs.release-build.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}

    # The macOS leg runs where release-build's does.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-arm64-local' || matrix.os }}

    permissions:
      contents: read

    # The self-hosted Macs cap each job's parallelism, as sharp.yml's MACOS explains.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      MAGO_THREADS: 4
      LEAN_NUM_THREADS: 2

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      - name: Download the binary the job before built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ runner.temp }}/mago

      - name: Run mago from Composer on plain PHP
        run: |
          php -v
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mago") | .version')
          package="$RUNNER_TEMP/mago-sharp-package"
          project="$RUNNER_TEMP/project"
          mkdir -p "$package" "$project/src/App"
          git archive HEAD | tar -x -C "$package"
          cd "$project"
          cat > composer.json <<JSON
          {
              "repositories": [
                  { "type": "path", "url": "$GITHUB_WORKSPACE/sharp/composer" },
                  {
                      "type": "path",
                      "url": "$package",
                      "options": {"symlink": false, "versions": {"heyjordanparker/mago-sharp": "$version"}}
                  }
              ],
              "autoload": { "psr-4": { "App\\\\": "src/App/" } },
              "config": { "allow-plugins": { "heyjordanparker/php-sharp-composer": true } }
          }
          JSON
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          composer require --no-interaction heyjordanparker/php-sharp-composer:@dev
          composer require --no-interaction --dev "heyjordanparker/mago-sharp:$version"
          mkdir -p "$RUNNER_TEMP/upstream-host"
          cat > "$RUNNER_TEMP/upstream-host/composer.json" <<'JSON'
          {
              "name": "probe/upstream-host",
              "version": "0.1.0",
              "require": { "carthage-software/mago": "^1.50" }
          }
          JSON
          composer config repositories.upstream-host path "$RUNNER_TEMP/upstream-host"
          composer require --no-interaction --dev probe/upstream-host:0.1.0
          test ! -e vendor/carthage-software/mago
          # A host that needs a later upstream release than the one this checker left from gets no install.
          mkdir -p "$RUNNER_TEMP/later-host"
          cat > "$RUNNER_TEMP/later-host/composer.json" <<'JSON'
          {
              "name": "probe/later-host",
              "version": "0.1.0",
              "require": { "carthage-software/mago": "^1.57" }
          }
          JSON
          composer config repositories.later-host path "$RUNNER_TEMP/later-host"
          if composer require --no-interaction --dev probe/later-host:0.1.0; then
            echo "A host that requires carthage-software/mago ^1.57 installed beside mago-sharp." >&2
            exit 1
          fi
          binary_dir="vendor/heyjordanparker/mago-sharp/composer/bin/$version/mago-$version-$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "$binary_dir"
          install -m 755 "$RUNNER_TEMP/mago/mago" "$binary_dir/mago"
          output=$(vendor/bin/mago --version 2>&1)
          echo "$output"
          test "$output" = "mago $version"
          vendor/bin/mago analyze
          vendor/bin/mago compile

      # Plain PHP prints a .sharp file's source, and PHPUnit includes the fixture's .sharp test file itself, past the
      # plugin's loader. The fixture's bootstrap, sharp/composer/require-engine.php, stops the run before it does.
      - name: Stop sharp/phpunit's tests on plain PHP before a .sharp test file's source prints
        working-directory: sharp/phpunit
        run: |
          composer install --no-interaction --no-progress
          if output=$(vendor/bin/phpunit 2>&1); then
            echo "$output"
            echo "::error::PHPUnit passed on plain PHP."
            exit 1
          fi
          echo "$output"
          if ! grep -q 'This project needs the PHP# engine' <<<"$output"; then
            echo "::error::PHPUnit stopped on plain PHP without the engine's error."
            exit 1
          fi
          if grep -q 'singleton Mailer = LogMailer' <<<"$output"; then
            echo "::error::PHPUnit printed tests/Shop/CheckoutTest.sharp's source."
            exit 1
          fi

  # Fails unless a test runs every line the pull request adds to Mago's analyzer, semantics and sharp-bridge crates.
  # sharp/bin/coverage measures that, with the dated nightly it installs and the cargo-llvm-cov this job installs. A
  # builder runs sharp/bin/coverage only to reproduce a failure of this job, after merging the latest origin/master,
  # because this job measures the branch merged into master. The push to master runs it again on the merge, and saves
  # its instrumented target, which every pull request's run restores.
  patch-coverage:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      # The merge commit and its first parent, the base it merges into.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # sharp/bin/coverage builds in the Mago target folder, in llvm-cov-target.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_COVERAGE
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ github.event_name == 'push' }}

      # sharp/bin/coverage reads this version, and fails on a builder's Mac when its cargo-llvm-cov is another.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      # The root crate's external analyzer tests run a PHP SDK worker, which needs PHP.
      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Every line the pull request adds is covered
        working-directory: .
        run: sharp/bin/coverage HEAD^1

  # The one required check of this workflow: it passes only when every job above passed, or skipped a change that
  # leaves Mago alone, so a job added later blocks merges without a change to the repository's rules. It runs always,
  # so it reports on every pull request, even one whose every other job skipped. On a pull request the macOS jobs skip,
  # and on a push whose Linux tests passed on its pull request, tests skips, as CHANGES explains.
  ci-passed:
    if: always()
    needs: [CHANGES, checks, tests, tests-macos, release-build, plain-php, patch-coverage]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      # Only for the actions below.
      - name: checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Every job passed, or skipped a change that leaves Mago alone
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, tests, tests-macos, release-build, plain-php, patch-coverage
          jobs: ${{ toJSON(needs) }}

      # As .github/actions/red-master-issue explains.
      - name: Open an issue for the failed run on master
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/red-master-issue
        with:
          title: A push to master failed Mago CI
          range: ${{ needs.CHANGES.outputs.base && format('{0}..{1}', needs.CHANGES.outputs.base, github.sha) || '' }}

      # checks and patch-coverage saved their targets when they ended, so this job, which needs them all, deletes the
      # ones the new targets replaced.
      - name: Delete the Mago target caches this run replaced
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/mago-cache-prune
