name: Mago

on:
  push:
    branches: [master]
  # Only a pull request into master, as sharp.yml runs, so a run .github/actions/passed-tree finds passed against master.
  pull_request:
    branches: [master]
  # The full run: every job, and the workspace's tests and clippy on nightly Rust as well. It runs weekly on master's
  # tip, on a dispatch, and on a release's bump pull request, as sharp.yml's full run does.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sharp/mago

jobs:
  # ci-passed is this workflow's one required check, so the workflow always runs, and every other job skips a change
  # that leaves Mago alone: one outside sharp/mago/, sharp/composer/, the sharp/harness/Psr/ interfaces sharp/composer's
  # mago.toml includes, sharp/phpunit/, this workflow, sharp/bin/coverage and the actions it runs, as sharp.yml's
  # CHANGES skips a change to documentation alone. The full run runs every job, and its `full` output tells each job so.
  # Its rule is sharp.yml's CHANGES's, so a release's bump pull request, whose title starts with "chore: release", runs
  # in full in both workflows.
  # A pull request's run that isn't the full run skips the macOS jobs, so a merge never waits for the Mac, and the push
  # to master runs every job after the merge. So a defect only macOS finds, such as one in the watch mode's FSEvents
  # code, lands on master first, and its red push opens an issue, as ci-passed does, for a pull request that fixes it
  # forward. The bump's run runs every job, so once it passes, release.yml's ci gate accepts it for the tag on its
  # merge commit.
  CHANGES:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    env:
      FULL: >-
        ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        && startsWith(github.event.pull_request.title, 'chore: release')) && 'true' || '' }}
    outputs:
      full: ${{ env.FULL }}
      mago: ${{ steps.diff.outputs.mago }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The root package's rust-version, which release.yml builds the binaries with, so every job tests that toolchain.
      - name: Read the toolchain sharp/mago/Cargo.toml's rust-version names
        id: rust
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' sharp/mago/Cargo.toml)
          if [[ -z $version ]]; then
            echo "::error::sharp/mago/Cargo.toml's [package] names no rust-version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find changes to Mago
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ $FULL ]]; then
            echo mago=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- sharp/mago sharp/composer sharp/harness/Psr sharp/phpunit .github/workflows/mago.yml \
            sharp/bin/coverage .github/actions/setup-lean .github/actions/clean-kept-build .github/actions/mago-cache \
            .github/actions/mago-cache-prune; then
            echo mago=false >> "$GITHUB_OUTPUT"
          else
            echo mago=true >> "$GITHUB_OUTPUT"
          fi

  # The gates on Linux with CHANGES's rust toolchain, the one sharp/mago/Cargo.toml's rust-version names and
  # release.yml builds the binaries with, and the Linux binary plain-php runs. They run beside tests, which takes as
  # long. The full run adds clippy on nightly Rust.
  checks:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    strategy:
      fail-fast: false
      matrix:
        rust: ${{ fromJSON(needs.CHANGES.outputs.full == 'true' && format('["{0}", "nightly"]', needs.CHANGES.outputs.rust) || format('["{0}"]', needs.CHANGES.outputs.rust)) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: show the Rust toolchain on PATH
        run: |
          type -a rustc cargo
          rustc --version
          cargo --version

      # Next week's nightly is another compiler, which rebuilds every crate, so only the pinned toolchain saves.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_CHECKS_${{ matrix.rust }}
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ needs.CHANGES.outputs.full == 'true' && matrix.rust != 'nightly' }}
          target-dir-env: true

      - name: Install PHP
        if: matrix.rust != 'nightly'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        if: matrix.rust != 'nightly'
        run: composer install

      - name: Install just
        if: matrix.rust != 'nightly'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just

      - name: Test PHP SDK
        if: matrix.rust != 'nightly'
        run: just test-sdk

      - name: cargo check
        if: matrix.rust != 'nightly'
        run: cargo check --workspace --locked

      # Workspace builds merge features, so only a build of the bridge alone shows what php links.
      - name: cargo check the PHP# bridge alone
        if: matrix.rust != 'nightly'
        run: cargo check -p mago-sharp-bridge --locked

      # The fuzz crate is a workspace of its own, which fuzz.yml builds only when it changes, so a version bump that
      # leaves its lock behind fails here, on the pull request that makes it.
      - name: The fuzz crate's Cargo.lock is current
        if: matrix.rust != 'nightly'
        run: cargo metadata --locked --format-version 1 --manifest-path crates/syntax/fuzz/Cargo.toml > /dev/null

      - name: keep the file watcher out of the PHP# bridge
        if: matrix.rust != 'nightly'
        run: |
          if output=$(cargo tree -p mago-sharp-bridge -e normal -i notify --locked 2>&1); then
            echo "$output"
            echo "::error::mago-sharp-bridge depends on notify, so php would link a file watcher"
            exit 1
          fi
          echo "$output" | grep -q "did not match any packages"

      - name: Verify the PHP SDK's NodeKind is generated from the syntax tree
        if: matrix.rust != 'nightly'
        run: |
          php scripts/regen-sdk-node-kinds.php
          git diff --exit-code composer/src/Sdk/Syntax/NodeKind.php

      - name: cargo fmt
        if: matrix.rust != 'nightly'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The test-run binary, which behaves as release's without its fat LTO, as release-build builds macOS's.
      # sharp/bin/build-mago builds the dev mago, which logs at DEBUG and reports a missing code that release never
      # prints, so this builds the profile itself, as sharp/mago/Cargo.toml explains.
      - name: Build mago in the test-run profile
        id: build
        if: matrix.rust != 'nightly'
        run: |
          cargo build --locked --profile test-run --bin mago
          echo "binary=$CARGO_TARGET_DIR/test-run/mago" >> "$GITHUB_OUTPUT"

      # The PHP# standard library, with the sharp/harness interfaces its mago.toml includes, analyzes with no note.
      - name: Check the standard library
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" --colors never --workspace "$GITHUB_WORKSPACE/sharp/composer" analyze --minimum-fail-level note'

      - name: Upload the binary for plain-php
        if: matrix.rust != 'nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

      - name: Validate composer code format
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" format --dry-run'

      - name: Lint composer code
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" lint --reporting-format=github'

      - name: Analyze composer code
        if: matrix.rust != 'nightly'
        env:
          MAGO: ${{ steps.build.outputs.binary }}
        run: '"$MAGO" analyze --reporting-format=github'

  # The workspace's tests, on Linux and on macOS, which covers the few lines of Mago that differ there, such as the
  # watch mode's FSEvents. The full run adds them on nightly Rust on Linux. A pull request's run that isn't the full run
  # has no macOS leg, as CHANGES explains.
  tests:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || needs.CHANGES.outputs.full == 'true') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        rust: ${{ fromJSON(needs.CHANGES.outputs.full == 'true' && format('["{0}", "nightly"]', needs.CHANGES.outputs.rust) || format('["{0}"]', needs.CHANGES.outputs.rust)) }}
        exclude:
          - { os: macos-latest, rust: nightly }

    # The macOS leg runs on the self-hosted Mac runners, except for a bump's pull request from another repository, as
    # sharp.yml's MACOS explains.
    runs-on: ${{ matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-local' || matrix.os }}

    permissions:
      contents: read

    # The self-hosted Macs cap each job's parallelism, as sharp.yml's MACOS explains. On the Linux leg the caps are
    # the defaults of ubuntu-latest's 4 cores, Lean's too. Lean reads an empty LEAN_NUM_THREADS as 0 threads, and then
    # panics on its first promise, so the Linux leg names its 4.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      LEAN_NUM_THREADS: ${{ matrix.os == 'macos-latest' && 2 || 4 }}

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}

      # Only the pinned toolchain saves, as in checks.
      - name: Rust and Mago caches
        uses: ./.github/actions/mago-cache
        with:
          name: MAGO_TESTS_${{ matrix.rust }}
          rust: MAGO
          rust-paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          save: ${{ needs.CHANGES.outputs.full == 'true' && matrix.rust != 'nightly' }}
          target-dir-env: true

      # setup-php brew-installs PHP on macOS, so the self-hosted runners use their Homebrew PHP and Composer instead.
      - name: Install PHP
        if: runner.environment == 'github-hosted'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Install composer dependencies
        run: composer install

      # The workspace's tests run lake.
      - name: Install elan and Lean
        uses: ./.github/actions/setup-lean

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo test (property)
        if: matrix.os == 'ubuntu-latest' && matrix.rust != 'nightly'
        run: cargo test -p mago-codex --features property-tests --locked

  # The macOS binary plain-php runs, in the test-run profile sharp/mago/Cargo.toml explains, since plain-php needs a
  # binary that behaves as release's, not release's fat LTO. It builds in the target folder the self-hosted Macs keep,
  # beside the dev build sharp/bin/test makes there, so it rebuilds only what changed since that runner's last build.
  # A pull request's run skips it unless it is the full run, as CHANGES explains, and a bump's pull request from another
  # repository runs it on macos-latest, as tests does.
  release-build:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true' && (github.event_name != 'pull_request' || needs.CHANGES.outputs.full == 'true')
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-local' || 'macos-latest' }}

    permissions:
      contents: read

    # With incremental state, which the test-run profile builds with in the folder the runner keeps.
    # dtolnay/rust-toolchain turns it off only when CARGO_INCREMENTAL is unset. The self-hosted Macs cap each job's
    # parallelism, as sharp.yml's MACOS explains.
    env:
      CARGO_INCREMENTAL: 1
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      LEAN_NUM_THREADS: 2

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      - name: Build mago in the test-run profile
        id: build
        run: |
          target="$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago"
          cargo build --locked --profile test-run --target-dir "$target" --bin mago
          echo "binary=$target/test-run/mago" >> "$GITHUB_OUTPUT"

      - name: Upload the binary for plain-php
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  # Installs heyjordanparker/mago-sharp from what git archive ships, the way Packagist ships it, and
  # heyjordanparker/php-sharp-composer from sharp/composer, on the runner's own PHP. A package that requires
  # upstream's carthage-software/mago at the release this checker left from, as an extension host does,
  # installs no second checker, and one that requires a later release installs nothing. Then runs mago on
  # a one-class .sharp project with the binary the job before built, and sharp/phpunit's tests, which stop.
  # A pull request's run that isn't the full run has no macOS leg, as CHANGES explains, so it needs only checks' binary.
  plain-php:
    needs: [CHANGES, checks, release-build]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name == 'pull_request' && needs.CHANGES.outputs.full != 'true' || needs.release-build.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || needs.CHANGES.outputs.full == 'true') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}

    # The macOS leg runs where tests' does.
    runs-on: ${{ matrix.os == 'macos-latest' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'macos-arm64-local' || matrix.os }}

    permissions:
      contents: read

    # The self-hosted Macs cap each job's parallelism, as sharp.yml's MACOS explains.
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 4
      RAYON_NUM_THREADS: 4
      LEAN_NUM_THREADS: 2

    steps:
      # The self-hosted Macs keep sharp/build between jobs, as sharp.yml's MACOS explains.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false

      - name: Remove what an earlier job left, except the builds
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/clean-kept-build

      # The self-hosted runners already have Homebrew's PHP and Composer, and a job never installs on them.
      - name: brew
        if: runner.os == 'macOS' && runner.environment == 'github-hosted'
        run: brew install php composer

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ needs.CHANGES.outputs.rust }}

      - name: Download the binary the job before built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mago-${{ runner.os }}
          path: ${{ runner.temp }}/mago

      - name: Run mago from Composer on plain PHP
        run: |
          php -v
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mago") | .version')
          package="$RUNNER_TEMP/mago-sharp-package"
          project="$RUNNER_TEMP/project"
          mkdir -p "$package" "$project/src/App"
          git archive HEAD | tar -x -C "$package"
          cd "$project"
          cat > composer.json <<JSON
          {
              "repositories": [
                  { "type": "path", "url": "$GITHUB_WORKSPACE/sharp/composer" },
                  {
                      "type": "path",
                      "url": "$package",
                      "options": {"symlink": false, "versions": {"heyjordanparker/mago-sharp": "$version"}}
                  }
              ],
              "autoload": { "psr-4": { "App\\\\": "src/App/" } },
              "config": { "allow-plugins": { "heyjordanparker/php-sharp-composer": true } }
          }
          JSON
          cat > mago.toml <<'TOML'
          [source]
          paths = ["src"]
          extensions = ["sharp"]
          TOML
          cat > src/App/Counter.sharp <<'SHARP'
          namespace App;

          class Counter
          {
              private int count = 0;

              public int add(int amount)
              {
                  this.count += amount;
                  return this.count;
              }
          }
          SHARP
          composer require --no-interaction heyjordanparker/php-sharp-composer:@dev
          composer require --no-interaction --dev "heyjordanparker/mago-sharp:$version"
          mkdir -p "$RUNNER_TEMP/upstream-host"
          cat > "$RUNNER_TEMP/upstream-host/composer.json" <<'JSON'
          {
              "name": "probe/upstream-host",
              "version": "0.1.0",
              "require": { "carthage-software/mago": "^1.50" }
          }
          JSON
          composer config repositories.upstream-host path "$RUNNER_TEMP/upstream-host"
          composer require --no-interaction --dev probe/upstream-host:0.1.0
          test ! -e vendor/carthage-software/mago
          # A host that needs a later upstream release than the one this checker left from gets no install.
          mkdir -p "$RUNNER_TEMP/later-host"
          cat > "$RUNNER_TEMP/later-host/composer.json" <<'JSON'
          {
              "name": "probe/later-host",
              "version": "0.1.0",
              "require": { "carthage-software/mago": "^1.57" }
          }
          JSON
          composer config repositories.later-host path "$RUNNER_TEMP/later-host"
          if composer require --no-interaction --dev probe/later-host:0.1.0; then
            echo "A host that requires carthage-software/mago ^1.57 installed beside mago-sharp." >&2
            exit 1
          fi
          binary_dir="vendor/heyjordanparker/mago-sharp/composer/bin/$version/mago-$version-$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p "$binary_dir"
          install -m 755 "$RUNNER_TEMP/mago/mago" "$binary_dir/mago"
          output=$(vendor/bin/mago --version 2>&1)
          echo "$output"
          test "$output" = "mago $version"
          vendor/bin/mago analyze
          vendor/bin/mago compile

      # Plain PHP prints a .sharp file's source, and PHPUnit includes the fixture's .sharp test file itself, past the
      # plugin's loader. The fixture's bootstrap, sharp/composer/require-engine.php, stops the run before it does.
      - name: Stop sharp/phpunit's tests on plain PHP before a .sharp test file's source prints
        working-directory: sharp/phpunit
        run: |
          composer install --no-interaction --no-progress
          if output=$(vendor/bin/phpunit 2>&1); then
            echo "$output"
            echo "::error::PHPUnit passed on plain PHP."
            exit 1
          fi
          echo "$output"
          if ! grep -q 'This project needs the PHP# engine' <<<"$output"; then
            echo "::error::PHPUnit stopped on plain PHP without the engine's error."
            exit 1
          fi
          if grep -q 'singleton Mailer = LogMailer' <<<"$output"; then
            echo "::error::PHPUnit printed tests/Shop/CheckoutTest.sharp's source."
            exit 1
          fi

  typos-check:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install typos
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos

      - name: Search for misspellings
        run: typos

  # Fails unless a test runs every line the pull request adds to Mago's analyzer, semantics and sharp-bridge crates.
  # sharp/bin/coverage measures that, with the dated nightly it installs and the cargo-llvm-cov this job installs. A
  # builder runs sharp/bin/coverage only to reproduce a failure of this job, after merging the latest origin/master,
  # because this job measures the branch merged into master.
  patch-coverage:
    needs: CHANGES
    if: needs.CHANGES.outputs.mago == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # The pull request's merge commit and its first parent, the base it merges into.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # sharp/bin/coverage reads this version, and fails on a builder's Mac when its cargo-llvm-cov is another.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1

      # The root crate's external analyzer tests run a PHP SDK worker, which needs PHP.
      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: "composer:v2"

      - name: Every line the pull request adds is covered
        working-directory: .
        run: sharp/bin/coverage HEAD^1

  # The one required check of this workflow: it passes only when every job above passed, or skipped a change that
  # leaves Mago alone, so a job added later blocks merges without a change to the repository's rules. It runs always,
  # so it reports on every pull request, even one whose every other job skipped. On a pull request that isn't the full
  # run, release-build skips and tests and plain-php run without their macOS legs, as CHANGES explains.
  ci-passed:
    if: always()
    needs: [CHANGES, checks, tests, release-build, plain-php, typos-check, patch-coverage]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed, or skipped a change that leaves Mago alone
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: checks, tests, release-build, plain-php, typos-check, patch-coverage
          jobs: ${{ toJSON(needs) }}

      # A red weekly run or push to master fails no pull request, so it opens one issue, or comments on the one still
      # open, and a pull request fixes it forward, as sharp.yml's CI_PASSED explains.
      - name: Open an issue for the failed run on master
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ github.event_name == 'schedule' && 'The weekly Mago CI run failed' || 'A push to master failed Mago CI' }}
        run: |
          body="The $GITHUB_EVENT_NAME run on master's $GITHUB_SHA failed: $RUN"
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [[ -n $issue ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

      # Master's full run's jobs saved their targets when they ended, so this job, which needs them all, deletes the
      # ones the new targets replaced. No other run saves one.
      - name: checkout
        if: always() && needs.CHANGES.outputs.full == 'true' && github.ref == 'refs/heads/master'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Delete the Mago target caches this run replaced
        if: always() && needs.CHANGES.outputs.full == 'true' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/mago-cache-prune
