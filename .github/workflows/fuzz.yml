name: Fuzz
# sharp/mago/crates/syntax/fuzz holds libFuzzer targets for the lexer, and for the parser in the PHP and PHP#
# dialects. PHP and PHP# source is user input, so every day each target runs for 10 minutes, seeded from the
# fixtures the Justfile's fuzz recipes use, and sharp_parser also from the engine's PHP# tests, the .sharp files
# under Zend/tests/sharp. Each target's corpus is kept between runs, so a run starts from every input the runs
# before it found. A panic, an abort, a stack overflow, or an input that runs for more than 10 seconds fails the job,
# and the input that caused it is uploaded as an artifact.
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/fuzz.yml
      - sharp/mago/crates/syntax/fuzz/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.url || github.run_id }}
  cancel-in-progress: true
jobs:
  FUZZ:
    name: FUZZ (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lexer
            seeds: ../tests/fixtures ../../analyzer/tests/cases ../../formatter/tests/cases
          - target: parser
            seeds: ../tests/fixtures ../../analyzer/tests/cases ../../formatter/tests/cases
          - target: sharp_parser
            seeds: ../../semantics/tests/fixtures ../../../tests/fixtures/sharp
            sharp-seeds: Zend/tests/sharp
    # libFuzzer's instrumentation needs nightly. A dated nightly builds the same way every day, so a failure is a crash
    # the fuzzer found, not a new compiler.
    env:
      NIGHTLY: nightly-2026-10-13
    defaults:
      run:
        working-directory: sharp/mago/crates/syntax/fuzz
    steps:
      - name: git checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ${{ env.NIGHTLY }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: The fuzz crate's Cargo.lock is current
        run: cargo +"$NIGHTLY" metadata --locked --format-version 1 > /dev/null
      - name: Cache cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}
      - name: Install cargo-fuzz
        run: |
          if ! command -v cargo-fuzz > /dev/null; then
            cargo +"$NIGHTLY" install cargo-fuzz --version 0.13.2 --locked
          fi
      # Each run saves its corpus under a key of its own, and the next run restores the newest one.
      - name: Restore ${{ matrix.target }}'s corpus from the runs before
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: sharp/mago/crates/syntax/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz ${{ matrix.target }} for 10 minutes
        env:
          TARGET: ${{ matrix.target }}
          SEEDS: ${{ matrix.seeds }}
          SHARP_SEEDS: ${{ matrix.sharp-seeds }}
        run: |
          options=(-max_total_time=600 -timeout=10)
          if [[ -n $SHARP_SEEDS ]]; then
            find "$GITHUB_WORKSPACE/$SHARP_SEEDS" -name '*.sharp' | paste -sd , - > "$RUNNER_TEMP/sharp-seeds"
            options+=("-seed_inputs=@$RUNNER_TEMP/sharp-seeds")
          fi
          # shellcheck disable=SC2086 # SEEDS is a list of directories.
          cargo +"$NIGHTLY" fuzz run "$TARGET" "corpus/$TARGET" $SEEDS -- "${options[@]}"
      - name: Upload the input that crashed ${{ matrix.target }}
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-crash
          path: sharp/mago/crates/syntax/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
