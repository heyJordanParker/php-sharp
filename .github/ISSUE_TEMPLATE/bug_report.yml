name: Bug report
description: Report a PHP# program that compiles, runs or checks wrongly
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: "The smallest `.sharp` file that shows the problem, what happened, and what you expected."
      value: |
        This `.sharp` file:

        ```csharp
        ```

        Resulted in this output:
        ```
        ```

        But I expected this output instead:
        ```
        ```
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versions
      description: "The full output of `php -v`, `php --ri sharp` and `mago --version`."
      render: plain
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: "The operating system, or the runtime image tag, if relevant."
      placeholder: "ghcr.io/heyjordanparker/php-sharp:0.1.0"
