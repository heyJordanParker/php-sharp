name: Open an issue for the failed run on master
description: >-
  A red scheduled run or push to master fails no pull request, so the workflow's required check opens one issue under
  the title, or comments on the one still open, and the next tag can't wait on a failure nobody saw. A pull request
  fixes it forward. Nobody reverts first: a merge commit can't land again cleanly once reverted, a revert hides what
  merged on top of it, and it would revert a healthy merge that failed on the Mac's load.

inputs:
  title:
    description: The issue's title, one per workflow and event, such as "A push to master failed PHP# CI".
    required: true

runs:
  using: composite
  steps:
    - name: Open an issue for the failed run on master
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TITLE: ${{ inputs.title }}
      run: |
        body="The $GITHUB_EVENT_NAME run on master's $GITHUB_SHA failed: $RUN"
        issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
        if [[ -n $issue ]]; then
          gh issue comment "$issue" --body "$body"
        else
          gh issue create --title "$TITLE" --body "$body"
        fi
