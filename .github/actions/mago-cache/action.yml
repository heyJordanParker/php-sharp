name: Restore the Rust and Mago caches
description: >-
  Restores a job's Rust toolchain and registry, and the Mago target folder sharp/build/<os>-<arch>/mago, where
  sharp/bin/build-mago builds and CARGO_TARGET_DIR points. As Deno's ci.ts keeps its target folder, master's full run
  saves that folder under its commit, and every other run restores the newest one it saved and saves nothing, so the
  caches hold one target per job for master's recent full runs. Only master saves the Rust cache too: a cache another
  ref saves only that ref's runs restore, so a bump's full run or a branch's dispatch restores and never saves. A
  checkout gives every file a newer time than any
  cached build, so cargo would rebuild every Mago crate. As Deno's mtime_cache action does, each file the cached build
  was built from, by its blob, and each folder whose entries are the same, goes back to a time before that build. A
  file that changed keeps the checkout's time, and so does a folder that gained or lost an entry, which a build script
  that watches a folder reads, such as build-id's, so cargo rebuilds what they reach. A self-hosted runner keeps
  sharp/build and its checkout's times, as .github/actions/clean-kept-build explains, so there it restores nothing and
  moves no time: its folder may hold a later build of another branch, which an old time would hide from cargo.

inputs:
  name:
    description: The target cache's name, one per job that builds Mago a way of its own, such as SHARP_LINUX.
    required: true
  rust:
    description: The Rust cache's name, shared by the jobs that fetch the same toolchain and crates.
    required: true
  rust-paths:
    description: The folders that hold the job's Rust toolchain and crates, one per line.
    required: true
  save:
    description: true on a full run, which on master saves the target folder under its commit.
    required: false
    default: ''
  target-dir-env:
    description: true to point CARGO_TARGET_DIR at the target folder for the job's later steps.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # rustup's toolchains are binaries for the runner's architecture, so each architecture keeps its own.
    - name: Rust cache, saved on master
      if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.rust-paths }}
        key: ${{ inputs.rust }}_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
    - name: Rust cache, restored only
      if: runner.environment == 'github-hosted' && github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.rust-paths }}
        key: ${{ inputs.rust }}_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
    # The trailing dash matches only a commit's folder: a restore key that matches a key exactly restores that cache
    # before any newer one.
    - name: Mago cache, saved at the end of master's full run
      if: runner.environment == 'github-hosted' && inputs.save == 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sharp/build/*/mago
        key: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}-${{ github.sha }}
        restore-keys: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}-
    - name: Mago cache, restored only
      if: runner.environment == 'github-hosted' && (inputs.save != 'true' || github.ref != 'refs/heads/master')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sharp/build/*/mago
        key: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}-${{ github.sha }}
        restore-keys: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}-
    - name: Give what the cached mago was built from a time before that build
      if: runner.environment == 'github-hosted'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        export LC_ALL=C
        target="sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago"
        sources="$target/sources"
        git -c core.quotePath=false ls-files -s sharp/mago | sort > "$RUNNER_TEMP/sources"
        if [[ -f $sources ]]; then
          # Each folder under sharp/mago, with each entry in it.
          entries() { cut -f2 "$1" | awk -F/ '{ folder = $1 "/" $2; for (i = 3; i <= NF; i++) { print folder "\t" $i; folder = folder "/" $i } }' | sort -u; }
          comm -3 <(entries "$sources") <(entries "$RUNNER_TEMP/sources") | sed 's/^\t//' | cut -f1 | sort -u > "$RUNNER_TEMP/changed-folders"
          {
            comm -12 "$sources" "$RUNNER_TEMP/sources" | cut -f2
            entries "$RUNNER_TEMP/sources" | cut -f1 | sort -u | comm -23 - "$RUNNER_TEMP/changed-folders"
          } | xargs -r -d '\n' touch -d @946684800 --
          echo "$(comm -13 "$sources" "$RUNNER_TEMP/sources" | wc -l) files and $(wc -l < "$RUNNER_TEMP/changed-folders") folders changed since the cached build."
        else
          echo "No cached build, so cargo builds every Mago crate."
        fi
        mkdir -p "$target"
        mv "$RUNNER_TEMP/sources" "$sources"
    - name: Point CARGO_TARGET_DIR at the target folder
      if: inputs.target-dir-env == 'true'
      shell: bash
      run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago" >> "$GITHUB_ENV"
