name: Restore the Rust and Mago caches
description: >-
  Restores a job's Rust toolchain and registry, and the Mago target folder sharp/build/<os>-<arch>/mago, where
  sharp/bin/build-mago builds and CARGO_TARGET_DIR points. As Deno's ci.ts keeps its target folder, the job of a master
  push run that saves it, such as sharp.yml's HOSTS, saves that folder under its commit, and every other run restores
  the newest one it saved and saves nothing, so the caches hold one target per job for master's recent pushes. Only
  master saves the Rust cache too: a cache another ref saves only that ref's runs restore, so a pull request's run
  restores and never saves. A checkout gives every file a newer time than any
  cached build, so cargo would rebuild every Mago crate. As Deno's mtime_cache action does, each file the cached build
  was built from, by its blob, and each folder whose entries are the same, goes back to a time before that build. A
  file that changed keeps the checkout's time, and so does a folder that gained or lost an entry, which a build script
  that watches a folder reads, such as build-id's, so cargo rebuilds what they reach.

inputs:
  name:
    description: >-
      The target cache's name, one per job that builds Mago a way of its own, such as SHARP_LINUX. Without it, only the
      Rust cache is restored.
    required: false
    default: ''
  rust:
    description: >-
      The Rust cache's name, shared by the jobs that fetch the same toolchain and crates. Without it, only the target
      cache is restored.
    required: false
    default: ''
  rust-paths:
    description: The folders that hold the job's Rust toolchain and crates, one per line.
    required: false
    default: ''
  save:
    description: true in the job that saves the target folder under its commit, on master.
    required: false
    default: ''
  target-dir-env:
    description: true to point CARGO_TARGET_DIR at the target folder for the job's later steps.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # rustup's toolchains are binaries for the runner's architecture, so each architecture keeps its own. A change to
    # the hashed files, as every release's version bump makes, restores the newest Rust cache of any hash, so rustup
    # and cargo fetch only what changed, where the exact key alone left every job to fetch the toolchain and crates.
    - name: Rust cache, saved on master
      if: inputs.rust != '' && github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.rust-paths }}
        key: ${{ inputs.rust }}_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
        restore-keys: ${{ inputs.rust }}_RUST-${{ runner.arch }}-
    - name: Rust cache, restored only
      if: inputs.rust != '' && github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.rust-paths }}
        key: ${{ inputs.rust }}_RUST-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'ext/sharp/Cargo.lock', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock') }}
        restore-keys: ${{ inputs.rust }}_RUST-${{ runner.arch }}-
    # sharp/build/cargo is the CARGO_HOME of cargo in the sharp/docker image, so its config holds for every build of the
    # target in the image. Without debug info a Mago test binary holds 142 MB where it held 235, so the target restores
    # and links faster, and a panic still names its file and line. The jobs that share the target write the same
    # config, so each reuses the others' builds.
    - name: Build without debug info in the sharp/docker image
      if: contains(inputs.rust-paths, 'sharp/build/cargo')
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        mkdir -p sharp/build/cargo
        printf '[profile.dev]\ndebug = false\n' > sharp/build/cargo/config.toml
    # The trailing dash matches only a commit's folder: a restore key that matches a key exactly restores that cache
    # before any newer one. A change to the hashed files misses the first restore key, as every Cargo.toml change
    # did, so the second restores the newest target of any hash, and cargo rebuilds only what the change reaches.
    # Cargo keeps every copy of a crate it no longer uses, so the job that saves restores only a target of the same
    # hash, and builds from nothing after a change: SHARP_LINUX's target grew from 3.9 to 4.5 to 5.1 GB over the two
    # hash changes of 0.6.15's batch and bump, on its way to 3 minutes of restore in every job. The hash covers the
    # cargo config the step before writes too, since a profile setting names every crate's copy anew: the switch to
    # debug = false left SHARP_LINUX's target with both copies, 5.7 GB.
    - name: Mago cache, saved at the end of the job on master
      if: inputs.name != '' && inputs.save == 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sharp/build/*/mago
        key: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock', 'sharp/build/cargo/config.toml') }}-${{ github.sha }}
        restore-keys: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock', 'sharp/build/cargo/config.toml') }}-
    - name: Mago cache, restored only
      if: inputs.name != '' && (inputs.save != 'true' || github.ref != 'refs/heads/master')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: sharp/build/*/mago
        key: ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock', 'sharp/build/cargo/config.toml') }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.name }}_MAGO-${{ runner.arch }}-${{ hashFiles('ext/sharp/rust-toolchain.toml', 'sharp/mago/Cargo.toml', 'sharp/mago/Cargo.lock', 'sharp/build/cargo/config.toml') }}-
          ${{ inputs.name }}_MAGO-${{ runner.arch }}-
    - name: Give what the cached mago was built from a time before that build
      if: inputs.name != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        export LC_ALL=C
        target="sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago"
        sources="$target/sources"
        git -c core.quotePath=false ls-files -s sharp/mago | sort > "$RUNNER_TEMP/sources"
        if [[ -f $sources ]]; then
          # Each folder under sharp/mago, with each entry in it.
          entries() { cut -f2 "$1" | awk -F/ '{ folder = $1 "/" $2; for (i = 3; i <= NF; i++) { print folder "\t" $i; folder = folder "/" $i } }' | sort -u; }
          comm -3 <(entries "$sources") <(entries "$RUNNER_TEMP/sources") | sed 's/^\t//' | cut -f1 | sort -u > "$RUNNER_TEMP/changed-folders"
          {
            comm -12 "$sources" "$RUNNER_TEMP/sources" | cut -f2
            entries "$RUNNER_TEMP/sources" | cut -f1 | sort -u | comm -23 - "$RUNNER_TEMP/changed-folders"
          } | xargs -r -d '\n' touch -d @946684800 --
          echo "$(comm -13 "$sources" "$RUNNER_TEMP/sources" | wc -l) files and $(wc -l < "$RUNNER_TEMP/changed-folders") folders changed since the cached build."
        else
          echo "No cached build, so cargo builds every Mago crate."
        fi
        mkdir -p "$target"
        # sharp/bin/build-mago reads this file to leave the folder alone, so its 10 GiB bound never deletes this cache.
        mv "$RUNNER_TEMP/sources" "$sources"
    - name: Point CARGO_TARGET_DIR at the target folder
      if: inputs.target-dir-env == 'true'
      shell: bash
      run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)/mago" >> "$GITHUB_ENV"
