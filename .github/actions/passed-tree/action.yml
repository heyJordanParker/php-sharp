name: Find the run that passed this tree
description: >-
  Looks for a run of a workflow that passed on the tree of the commit the job runs on, as bors's "not rocket science"
  rule tests the exact tree that lands once. A push run tests its commit's tree. A pull request's run tests the pull
  request merged into master, the refs/pull/<number>/merge commit GitHub checks out, whose tree its CHANGES job names in
  a notice titled "Tested tree". A rerun of a run's failed jobs makes an attempt whose CHANGES is a copy of the earlier
  attempt's, which ran no step and carries no notice, so the tree is the notice of the newest attempt whose CHANGES ran:
  push run 44097336633's second attempt reran MACOS alone, and its CHANGES named no tree. Whether a run passed is what
  its newest attempt concluded. A push checks the commit's own runs, and the runs of the head of each pull request into
  master that names the commit. So a merge commit passes on its pull request's last run whenever master didn't move
  after that run started, even when the "master merge gate" ruleset merged the pull request behind master: pull request
  #334's run tested tree b5fa192, the tree of its merge commit, whose push run still ran every Linux suite again,
  because its head's tree differed. A pull request's run checks the runs of its head, so a pull request that lands a
  commit of next, whose own pull request's run passed the same merge, passes in a minute: #550's run of 2b19aa793ac ran
  every job again, the Mac's among them, on tree 0dffb6e, which #536's run 44791855760 had passed. GitHub empties a
  run's pull requests once they merge, so a run is tied to master through its pull request, and both workflows run only
  for a pull request into master. The calling job needs actions: read, checks: read and pull-requests: read.

inputs:
  workflow:
    description: The workflow file whose runs count, such as mago.yml.
    required: true
  events:
    description: The events whose successful runs count, separated by spaces, such as "pull_request push".
    required: true
  passed:
    description: >-
      A jq expression over a run's jobs, as GET /actions/runs/<id>/jobs returns them, that is true when the run passed
      what the caller needs.
    required: true
  commit:
    description: >-
      A commit of master whose tree to look for in place of the job's own, as a push that finishes an earlier release
      looks for the run that built that release's images.
    required: false
    default: ''

outputs:
  run:
    description: The URL of the first run that passed, or nothing.
    value: ${{ steps.find.outputs.run }}

runs:
  using: composite
  steps:
    - name: Find the run that passed this tree
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        EVENTS: ${{ inputs.events }}
        PASSED: ${{ inputs.passed }}
        HEAD: ${{ !inputs.commit && github.event.pull_request.head.sha || '' }}
        COMMIT: ${{ inputs.commit || github.sha }}
      run: |
        api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
        tree=$(api "git/commits/$COMMIT" .tree.sha)
        if [[ -n $HEAD ]]; then
          commits=$HEAD
        else
          commits=$COMMIT
          for head in $(api "commits/$COMMIT/pulls" '.[] | select(.base.ref == "master") | .head.sha'); do
            if [[ $head != "$COMMIT" ]]; then
              commits+=" $head"
            fi
          done
        fi
        runs=
        for commit in $commits; do
          for event in $EVENTS; do
            # The runs list's status filter finds a run minutes after it ends, after a tag pushed on its pass looked for
            # it, so a run counts by its own conclusion.
            for run in $(api "actions/workflows/$WORKFLOW/runs?head_sha=$commit&event=$event" '.workflow_runs[] | select(.conclusion == "success" and (.event != "push" or .head_branch == "master")) | .id'); do
              runs+=" $event:$commit:$run"
            done
          done
        done
        checked=
        for entry in $runs; do
          IFS=: read -r event commit run <<< "$entry"
          if [[ $(api "actions/runs/$run/jobs?per_page=100" "$PASSED") != true ]]; then
            checked+=" $run (it failed what the caller needs)"
            continue
          fi
          if [[ $event == push ]]; then
            tested=$(api "git/commits/$commit" .tree.sha)
          else
            tested=
            attempt=$(api "actions/runs/$run" .run_attempt)
            while [[ -z $tested ]] && ((attempt > 0)); do
              changes=$(api "actions/runs/$run/attempts/$attempt/jobs?per_page=100" '.jobs[] | select(.name == "CHANGES") | .id')
              tested=$(api "check-runs/$changes/annotations" '.[] | select(.title == "Tested tree") | .message')
              attempt=$((attempt - 1))
            done
          fi
          if [[ $tested == "$tree" ]]; then
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"
            echo "Tree $tree passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run."
            exit 0
          fi
          checked+=" $run (tree ${tested:-unnamed})"
        done
        echo "No $WORKFLOW run of $EVENTS passed on tree $tree. Runs checked:${checked:- none}."
