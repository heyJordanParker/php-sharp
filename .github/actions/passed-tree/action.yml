name: Find the run that passed this tree
description: >-
  Looks for a run of a workflow that passed on the tree of the commit the job runs on, as bors's "not rocket science"
  rule tests the exact tree that lands once. It checks the commit's own runs, and the runs of the head of each pull
  request into master that names the commit, when that head has the same tree: the "master merge gate" ruleset merges
  only a branch that holds the latest master, so a merge commit's tree is its pull request head's. GitHub empties a
  run's pull requests once they merge, so a run is tied to master through its pull request, and both workflows run
  only for a pull request into master.

inputs:
  workflow:
    description: The workflow file whose runs count, such as sharp.yml.
    required: true
  events:
    description: The events whose successful runs count, separated by spaces, such as "pull_request push".
    required: true
  passed:
    description: >-
      A jq expression over a run's jobs, as GET /actions/runs/<id>/jobs returns them, that is true when the run passed
      what the caller needs.
    required: true

outputs:
  run:
    description: The URL of the first run that passed, or nothing.
    value: ${{ steps.find.outputs.run }}

runs:
  using: composite
  steps:
    - name: Find the run that passed this tree
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        EVENTS: ${{ inputs.events }}
        PASSED: ${{ inputs.passed }}
      run: |
        api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
        tree=$(api "git/commits/$GITHUB_SHA" .tree.sha)
        commits=$GITHUB_SHA
        for head in $(api "commits/$GITHUB_SHA/pulls" '.[] | select(.base.ref == "master") | .head.sha'); do
          if [[ $head != "$GITHUB_SHA" && $(api "git/commits/$head" .tree.sha) == "$tree" ]]; then
            commits+=" $head"
          fi
        done
        runs=
        for commit in $commits; do
          for event in $EVENTS; do
            runs+=" $(api "actions/workflows/$WORKFLOW/runs?head_sha=$commit&event=$event&status=success" '.workflow_runs[] | select(.event != "push" or .head_branch == "master") | .id')"
          done
        done
        for run in $runs; do
          if [[ $(api "actions/runs/$run/jobs?per_page=100" "$PASSED") == true ]]; then
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"
            echo "Tree $tree passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run."
            exit 0
          fi
        done
        echo "No $WORKFLOW run of $EVENTS passed on tree $tree. Runs checked:${runs:- none}."
