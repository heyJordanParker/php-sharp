name: Find the run that passed this tree
description: >-
  Looks for a run of a workflow that passed on the tree of the commit the job runs on, as bors's "not rocket science"
  rule tests the exact tree that lands once. It checks the commit's own runs, and the runs of the head of each pull
  request into master that names the commit, when that head has the same tree, as a merge commit has when its pull
  request held the latest master. The "master merge gate" ruleset also merges a pull request behind master, whose
  merge commit's tree no run tested, so nothing passed on it. GitHub empties a
  run's pull requests once they merge, so a run is tied to master through its pull request, and both workflows run
  only for a pull request into master.

inputs:
  workflow:
    description: The workflow file whose runs count, such as mago.yml. A full check reads sharp.yml's.
    required: false
    default: ''
  events:
    description: The events whose successful runs count, separated by spaces, such as "pull_request push".
    required: true
  passed:
    description: >-
      A jq expression over a run's jobs, as GET /actions/runs/<id>/jobs returns them, that is true when the run passed
      what the caller needs. A full check needs none.
    required: false
    default: ''
  full:
    description: >-
      true to look for sharp.yml's full run, whose 9 test jobs passed. A pull request's run counts only when its
      RELEASE_BUMP passed too, because only a bump's title makes a pull request's run the full one. Every gate that
      needs a full run asks for it here, so the check is written once.
    required: false
    default: ''
  on-master:
    description: >-
      true to fail unless the commit is on master, as a tag's gates do. A tag on a bump's head that master has moved
      past would pass with a run that tested that head merged with master, another tree.
    required: false
    default: ''

outputs:
  run:
    description: The URL of the first run that passed, or nothing.
    value: ${{ steps.find.outputs.run }}

runs:
  using: composite
  steps:
    - name: Find the run that passed this tree
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.full == 'true' && 'sharp.yml' || inputs.workflow }}
        EVENTS: ${{ inputs.events }}
        PASSED: ${{ inputs.passed }}
        FULL: ${{ inputs.full }}
        ON_MASTER: ${{ inputs.on-master }}
      run: |
        api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
        if [[ $ON_MASTER == true ]]; then
          status=$(api "compare/$GITHUB_SHA...master" .status)
          if [[ $status != ahead && $status != identical ]]; then
            echo "::error::Commit $GITHUB_SHA isn't on master: GitHub compares master to it as $status. Tag the bump's merge commit."
            exit 1
          fi
        fi
        tests='[.jobs[] | select(.conclusion == "success" and (.name == "LINUX" or .name == "LINUX_PASSES"
          or .name == "LINUX_ZTS" or .name == "HOSTS" or .name == "MACOS" or (.name | startswith("PHP_EXTENSIONS"))))]
          | length == 9'
        # The expression a run of the event must make true.
        passed() {
          if [[ $FULL != true ]]; then
            echo "$PASSED"
          elif [[ $1 == pull_request ]]; then
            echo "any(.jobs[]; .name == \"RELEASE_BUMP\" and .conclusion == \"success\") and ($tests)"
          else
            echo "$tests"
          fi
        }
        tree=$(api "git/commits/$GITHUB_SHA" .tree.sha)
        commits=$GITHUB_SHA
        for head in $(api "commits/$GITHUB_SHA/pulls" '.[] | select(.base.ref == "master") | .head.sha'); do
          if [[ $head != "$GITHUB_SHA" && $(api "git/commits/$head" .tree.sha) == "$tree" ]]; then
            commits+=" $head"
          fi
        done
        runs=
        for commit in $commits; do
          for event in $EVENTS; do
            for run in $(api "actions/workflows/$WORKFLOW/runs?head_sha=$commit&event=$event&status=success" '.workflow_runs[] | select(.event != "push" or .head_branch == "master") | .id'); do
              runs+=" $run:$event"
            done
          done
        done
        for entry in $runs; do
          run=${entry%%:*}
          if [[ $(api "actions/runs/$run/jobs?per_page=100" "$(passed "${entry#*:}")") == true ]]; then
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"
            echo "Tree $tree passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run."
            exit 0
          fi
        done
        echo "No $WORKFLOW run of $EVENTS passed on tree $tree. Runs checked:${runs:- none}."
