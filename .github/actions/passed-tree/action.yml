name: Find the run that passed this tree
description: >-
  Looks for a run of a workflow that passed on the tree of the commit the job runs on, as bors's "not rocket science"
  rule tests the exact tree that lands once. Each run's CHANGES job names the tree it tests in a notice titled "Tested
  tree": a push run tests its commit's tree, and a pull request's run tests the pull request merged into master, the
  refs/pull/<number>/merge commit GitHub checks out. It checks the commit's own runs, and the runs of the head of each
  pull request into master that names the commit. So a merge commit passes on its pull request's last run whenever
  master didn't move after that run started, even when the "master merge gate" ruleset merged the pull request behind
  master: pull request #334's run tested tree b5fa192, the tree of its merge commit, whose push run still ran every
  Linux suite again, because its head's tree differed. GitHub empties a run's pull requests once they merge, so a run is
  tied to master through its pull request, and both workflows run only for a pull request into master. The calling job
  needs actions: read, checks: read and pull-requests: read.

inputs:
  workflow:
    description: The workflow file whose runs count, such as mago.yml.
    required: true
  events:
    description: The events whose successful runs count, separated by spaces, such as "pull_request push".
    required: true
  passed:
    description: >-
      A jq expression over a run's jobs, as GET /actions/runs/<id>/jobs returns them, that is true when the run passed
      what the caller needs.
    required: true

outputs:
  run:
    description: The URL of the first run that passed, or nothing.
    value: ${{ steps.find.outputs.run }}

runs:
  using: composite
  steps:
    - name: Find the run that passed this tree
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WORKFLOW: ${{ inputs.workflow }}
        EVENTS: ${{ inputs.events }}
        PASSED: ${{ inputs.passed }}
      run: |
        api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2"; }
        tree=$(api "git/commits/$GITHUB_SHA" .tree.sha)
        commits=$GITHUB_SHA
        for head in $(api "commits/$GITHUB_SHA/pulls" '.[] | select(.base.ref == "master") | .head.sha'); do
          if [[ $head != "$GITHUB_SHA" ]]; then
            commits+=" $head"
          fi
        done
        runs=
        for commit in $commits; do
          for event in $EVENTS; do
            # The runs list's status filter finds a run minutes after it ends, after a tag pushed on its pass looked for
            # it, so a run counts by its own conclusion.
            for run in $(api "actions/workflows/$WORKFLOW/runs?head_sha=$commit&event=$event" '.workflow_runs[] | select(.conclusion == "success" and (.event != "push" or .head_branch == "master")) | .id'); do
              runs+=" $run"
            done
          done
        done
        checked=
        for run in $runs; do
          # The CHANGES job of a run that passed, whose notice names the tree the run tested.
          changes=$(api "actions/runs/$run/jobs?per_page=100" "if ($PASSED) then .jobs[] | select(.name == \"CHANGES\") | .id else empty end")
          if [[ -z $changes ]]; then
            checked+=" $run (it failed what the caller needs)"
            continue
          fi
          tested=$(api "check-runs/$changes/annotations" '.[] | select(.title == "Tested tree") | .message')
          if [[ $tested == "$tree" ]]; then
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "$GITHUB_OUTPUT"
            echo "Tree $tree passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run."
            exit 0
          fi
          checked+=" $run (tree ${tested:-unnamed})"
        done
        echo "No $WORKFLOW run of $EVENTS passed on tree $tree. Runs checked:${checked:- none}."
