name: Start an image and request a page
description: >-
  Starts the runtime image on its own default command, as an app's container does, with a page where the app's code
  goes, and requests that page from FrankenPHP, whose default Caddyfile serves /app/public on https://localhost with its
  own certificate. A wrong entrypoint, or a server that serves no page in 30 seconds, fails the step and prints the
  container's log. sharp.yml's IMAGE runs it on each digest it pushes, before a tag can publish it.

inputs:
  image:
    description: The image to start, such as php-sharp or ghcr.io/heyjordanparker/php-sharp@sha256:<digest>.
    required: true

runs:
  using: composite
  steps:
    - name: Start the image on its default command and request a page from FrankenPHP
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        public="$RUNNER_TEMP/public"
        mkdir -p "$public"
        echo '<?php echo "Served by ", PHP_SAPI, PHP_EOL;' > "$public/index.php"
        docker run --detach --name server --publish 8443:443 --volume "$public:/app/public:ro" "$IMAGE"
        for ((second = 1; ; second++)); do
          if response="$(curl --silent --show-error --fail --insecure https://localhost:8443/ 2>&1)" \
            && grep -qx "Served by frankenphp" <<< "$response"; then
            echo "$response"
            break
          fi
          if [[ "$(docker inspect --format '{{.State.Running}}' server)" != true || $second == 30 ]]; then
            docker logs server
            echo "::error::The image's default command stopped, or served no page in 30 seconds. Its log is above, and the last request printed: $response"
            exit 1
          fi
          sleep 1
        done
        docker rm --force server
