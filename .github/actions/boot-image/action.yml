name: Start an image and request a page
description: >-
  Starts a runtime image on its own default command, as an app's container does, with a page where the app's code
  goes, and requests that page from the image's server. php-fpm answers FastCGI on port 9000 for the app in
  /var/www/html, and FrankenPHP's default Caddyfile serves /app/public on https://localhost with its own certificate.
  A wrong entrypoint, or a server that serves no page in 30 seconds, fails the step and prints the container's log.
  sharp.yml's PHP_EXTENSIONS runs it on the image it builds, and IMAGE on each digest it pushes, before a tag can
  publish it.

inputs:
  image:
    description: The image to start, such as php-sharp or ghcr.io/heyjordanparker/php-sharp@sha256:<digest>.
    required: true
  sapi:
    description: The server the image runs, as PHP_SAPI names it, fpm-fcgi or frankenphp.
    required: true

runs:
  using: composite
  steps:
    - name: Install cgi-fcgi
      if: inputs.sapi == 'fpm-fcgi'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfcgi-bin
    - name: Start the image on its default command and request a page from ${{ inputs.sapi }}
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SAPI: ${{ inputs.sapi }}
      run: |
        public="$RUNNER_TEMP/public"
        mkdir -p "$public"
        echo '<?php echo "Served by ", PHP_SAPI, PHP_EOL;' > "$public/index.php"
        case $SAPI in
          fpm-fcgi)
            docker run --detach --name server --publish 9000:9000 --volume "$public:/var/www/html:ro" "$IMAGE"
            request() { SCRIPT_FILENAME=/var/www/html/index.php REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000; }
            ;;
          frankenphp)
            docker run --detach --name server --publish 8443:443 --volume "$public:/app/public:ro" "$IMAGE"
            request() { curl --silent --show-error --fail --insecure https://localhost:8443/; }
            ;;
          *)
            echo "::error::No server $SAPI is known here. Name fpm-fcgi or frankenphp."
            exit 1
            ;;
        esac
        for ((second = 1; ; second++)); do
          if response="$(request 2>&1)" && grep -qx "Served by $SAPI" <<< "$response"; then
            echo "$response"
            break
          fi
          if [[ "$(docker inspect --format '{{.State.Running}}' server)" != true || $second == 30 ]]; then
            docker logs server
            echo "::error::The image's default command stopped, or served no page in 30 seconds. Its log is above, and the last request printed: $response"
            exit 1
          fi
          sleep 1
        done
        docker rm --force server
