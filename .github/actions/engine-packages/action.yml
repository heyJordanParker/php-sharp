name: Install what the PHP# engine builds with
description: >-
  Installs on a GitHub-hosted Ubuntu runner the packages sharp/bin/build-mago builds the engine mago links with, as
  sharp/docker/Dockerfile installs them: cmake builds the libzip the engine links from its archive, the engine runs
  readline on libedit, and it links libxml2's archive, whose static flags name liblzma's. Each job that builds that
  engine installs this one list, since the ASAN job's own copy of it left out liblzma-dev and libedit-dev, and every
  link check of its configure failed from "checking for curl_easy_perform in -lcurl... no" on.

inputs:
  extra:
    description: The job's own packages besides the engine's, separated by spaces, such as ccache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: apt
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086 # EXTRA is a list of packages.
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          autoconf bison cmake pkg-config re2c libedit-dev libicu-dev liblzma-dev libsodium-dev libsqlite3-dev libssl-dev \
          libxml2-dev zlib1g-dev $EXTRA
