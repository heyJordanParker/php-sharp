name: Clean the kept build
description: >-
  Runs on the self-hosted Mac, whose jobs of every workflow share one work folder, after actions/checkout with clean:
  false and again as the job's last step, whatever its result. It removes every untracked file, and every ignored file
  under sharp/ but sharp/build, so a job starts from the tree it checked out. It keeps the parsers, scanners and
  configure that php-src's build writes into the source tree, because the kept build's dependency files name them and
  make has no rule that makes some of them again, such as Zend/zend_ini_scanner_defs.h (run 41504845687).

  Between jobs the runner keeps only what the next Mac job reuses, which is sharp.yml's MACOS on nearly every run: the
  engine builds and the dev Mago target's debug profile, so the engine and mago rebuild only what changed since the
  runner's last job. Everything else goes. The release target, mago-release, and the corpus's packages serve only
  release.yml's macOS build, once per release, whose crates compile from nothing in under 2 minutes: its optimized
  build, which always does, took 612 s on run 44997846679, 534 of them the fat-LTO link. They held 9.4 GB and 784 MB on the Mac's runner on 2026-11-22, beside a
  test-run profile in the dev target that no job builds there any more. Cargo never removes what an old build left, so
  the debug profile grows with every dependency and crate that changes: it held 8.7 GB on the runner that day, 7.7 GB
  of it in deps, mostly copies of crates earlier commits built. Above 8 GB it goes, and the next job builds it from
  nothing, which took 133 s against 41 to 52 s warm on job 137039415851 and the two after it. So the runner keeps at
  most about 9 GB in sharp/build, which the step's last line prints.

runs:
  using: composite
  steps:
    - name: Remove what an earlier job left, except the builds and php-src's generated sources
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        git clean -ffd
        git clean -ffdx --exclude=/sharp/build/ -- sharp
    - name: Remove every build the next Mac job doesn't reuse, and a dev Mago target above 8 GB
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        build="sharp/build/$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m)"
        rm -rf "$build/mago-release" sharp/build/corpus
        if [[ -d $build/mago ]]; then
          find "$build/mago" -mindepth 1 -maxdepth 1 -type d ! -name debug -exec rm -rf {} +
          size=$(du -sm "$build/mago" | cut -f1)
          if ((size > 8 * 1024)); then
            echo "::notice::$build/mago held $size MB, above the 8 GB bound, so it builds from nothing."
            rm -rf "$build/mago"
          fi
        fi
        if [[ -d sharp/build ]]; then
          echo "The runner keeps $(du -sm sharp/build | cut -f1) MB in sharp/build."
        fi
