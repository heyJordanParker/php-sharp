name: Cancel the run of a failed job
description: >-
  Each job of a pull request's run and of a merge queue's run calls it, as the step after its checks, when one of them
  failed, and it cancels the whole run, so the run ends the moment it can no longer pass, and the one Mac runner and
  the queue move on. A pull request runs one push at a time, so a failed run that went on held the newest push's run
  pending: run 45007969043 failed SPEC (2/4) at 09:59Z, then its Mac job ran 48 more minutes, and the next run waited
  36 minutes until it was cancelled by hand. A job that needs every other job starts only once they all ended, so the
  cancel is a step of each job. Steps that run always, as the usage notice, still run in a cancelled job. The calling
  job needs actions: write.

runs:
  using: composite
  steps:
    - name: Cancel this run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        echo "::error::A step of this job failed, so it cancels run $GITHUB_RUN_ID, which can no longer pass, and the newest push's run starts."
        gh run cancel "$GITHUB_RUN_ID"
