name: Cancel the run of a failed job
description: >-
  Each job of a pull request's run calls it, as the step after its checks, when one of them failed, and it cancels the
  whole run, so the run ends the moment it can no longer pass. A pull request runs one push at a time, so a failed run
  that went on held the newest push's run pending: run 45007969043 failed SPEC (2/4) at 09:59Z, then its Mac job ran
  48 more minutes, and the next run waited 36 minutes until it was cancelled by hand. A job that needs every other job
  starts only once they all ended, so the cancel is a step of each job. Steps that run always, as the usage notice and
  the Mac's cleanup, still run in a cancelled job. The calling job needs actions: write. next's own pull request skips
  it, so its run ends failed, naming the job that failed: a cancel ends the run cancelled, and the failed job with it.
  sharp/bin/land lands a commit of next only once its runs passed, and from 18:52 to 22:23 UTC on 2026-11-22 every run of
  next ended cancelled with no job failed, as run 45073478244, whose SPEC (2/4) failed, so nothing showed next was red.

runs:
  using: composite
  steps:
    - name: Cancel this run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        echo "::error::A step of this job failed, so it cancels run $GITHUB_RUN_ID, which can no longer pass, and the newest push's run starts."
        gh run cancel "$GITHUB_RUN_ID"
