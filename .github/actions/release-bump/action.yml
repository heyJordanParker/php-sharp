name: Check that a tree is another's with a release's bump
description: >-
  Makes a release's bump again on a base commit, in a worktree of its own: what php sharp/mago/scripts/set-version.php
  <version> writes, PHP_SHARP_VERSION in ext/sharp/php_sharp.h, the version Zend/tests/sharp/ri_sharp.phpt expects, and
  the commit's own sharp/CHANGELOG.md. It says whether that gives the commit's tree, and prints the difference when it
  doesn't. sharp.yml's RELEASE_BUMP fails a bump's pull request that changes more, and the CHANGES jobs of sharp.yml and
  mago.yml skip the Mac suites on a bump's push whose base push run passed them.

inputs:
  base:
    description: The commit the bump starts from.
    required: true

outputs:
  old:
    description: The version sharp/mago/Cargo.toml names at the base.
    value: ${{ steps.bump.outputs.old }}
  new:
    description: The version sharp/mago/Cargo.toml names at the commit.
    value: ${{ steps.bump.outputs.new }}
  only:
    description: true when the versions differ and the bump of the base gives the commit's tree.
    value: ${{ steps.bump.outputs.only }}

runs:
  using: composite
  steps:
    - name: Make the bump again on the base
      id: bump
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        version() { sed -n '/^version = /{s/^version = "\(.*\)"$/\1/p;q}' <(git show "$1:sharp/mago/Cargo.toml"); }
        git fetch --quiet --depth=1 origin "$BASE"
        old=$(version "$BASE")
        new=$(version "$GITHUB_SHA")
        echo "old=$old" >> "$GITHUB_OUTPUT"
        echo "new=$new" >> "$GITHUB_OUTPUT"
        if [[ $old == "$new" ]]; then
          echo "only=false" >> "$GITHUB_OUTPUT"
          echo "sharp/mago/Cargo.toml names $new at both commits, so this is no bump."
          exit 0
        fi
        worktree="$RUNNER_TEMP/release-bump"
        git worktree add --quiet --detach "$worktree" "$BASE"
        cd "$worktree"
        php sharp/mago/scripts/set-version.php "$new"
        sed -i "s/^#define PHP_SHARP_VERSION \"${old//./\\.}\"\$/#define PHP_SHARP_VERSION \"$new\"/" ext/sharp/php_sharp.h
        sed -i "s/^Version => ${old//./\\.}\$/Version => $new/" Zend/tests/sharp/ri_sharp.phpt
        git checkout "$GITHUB_SHA" -- sharp/CHANGELOG.md
        git add --all
        if git diff --cached --quiet "$GITHUB_SHA"; then
          echo "only=true" >> "$GITHUB_OUTPUT"
          echo "Commit $GITHUB_SHA's tree is $BASE's with the bump from $old to $new and sharp/CHANGELOG.md."
        else
          echo "only=false" >> "$GITHUB_OUTPUT"
          echo "Commit $GITHUB_SHA changes more than the bump from $old to $new and sharp/CHANGELOG.md. Beyond them it changes:"
          git diff --cached -R "$GITHUB_SHA"
        fi
        cd "$GITHUB_WORKSPACE"
        git worktree remove --force "$worktree"
