[package]
name = "mago-semantics"
description = "PHP Semantics Checker."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
# Every integration test is a module of tests/main.rs, so the crate links one test binary for them.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[lints]
workspace = true

[dependencies]
mago-bytes = { workspace = true }
mago-casing = { workspace = true }
mago-reporting = { workspace = true }
mago-syntax = { workspace = true }
mago-syntax-core = { workspace = true }
mago-php-version = { workspace = true }
mago-span = { workspace = true }
mago-names = { workspace = true }
mago-database = { workspace = true }

[dev-dependencies]
mago-allocator = { workspace = true }
regex = { workspace = true }
